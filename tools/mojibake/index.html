<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>乱码修复</title>
<meta name="theme-color" content="#f6f7f9" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    /* ===== 与「工具首页 / JSON 格式化 / 日期时间 / 字节与网速」共用的一套配色（浅色 · 靛蓝）=====
       改配色只动这里；下面所有 CSS 一律引用变量，不要写死颜色。 */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  /* ★ 必须是 height:100%（不能写 min-height）—— 写 min-height 会让 body 随内容长高、
     main 失去滚动容器身份，main 上的 overflow:auto 会静默失效。 */
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    overflow: hidden; flex: none;
  }
  .brand { font-weight: 700; letter-spacing: .5px; margin-right: 4px; white-space: nowrap; color: inherit; text-decoration: none }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; flex: none; }
  .stat b { color: var(--accent); font-weight: 600; }
  /* 隐私说明：任何宽度都必须可见，窄屏靠 flex 整体换行，绝不 hide、不裁切 */
  .stat.privacy-stat { display: inline-block; white-space: normal; flex: 0 1 auto; min-width: 0; }

  button, select, input, textarea {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; outline: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
    min-width: 0;
  }
  /* ★ 按钮 / 下拉绝不折行、也不许被压窄（窄屏下 flex 会把中文逐字竖排成一根条）。
     不要加给 input / textarea —— 它们要靠可收缩占满剩余宽度。 */
  button, select { white-space: nowrap; flex-shrink: 0; }
  button:hover, select:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.mini {
    padding: 3px 9px; font-size: 11px; line-height: 1.5;
    background: var(--panel-2); color: var(--text-2); border-color: var(--border);
  }
  button.mini:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  button[disabled]:hover { border-color: var(--border-2); background: var(--panel-2); color: var(--text-2); }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { cursor: text; resize: vertical; }

  main {
    flex: 1; min-height: 0; overflow: auto; padding: 14px;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  main::-webkit-scrollbar { width: 10px; height: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  main::-webkit-scrollbar-track { background: transparent; }

  /* ★ 内容型工具页不要铺满整屏：卡片收窄居中 */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; max-width: 900px; margin: 0 auto 12px; min-width: 0;
  }
  .card > h2 {
    margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .card > h2 .hint { font-size: 11px; font-weight: 400; color: var(--text-3); }
  .card > h2 .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  #src { display: block; width: 100%; min-height: 104px; font: 13px/1.6 var(--mono); padding: 9px 11px; }
  .meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 8px; font-size: 12px; color: var(--text-3);
  }
  .meta .right { margin-left: auto; display: flex; gap: 6px; }
  .meta b { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ===== 候选行 ===== */
  .cand {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; margin-bottom: 8px; background: var(--panel-2);
  }
  .cand:last-child { margin-bottom: 0; }
  .cand.best { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cand-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .cand-hd .enc { font-size: 12px; font-weight: 600; color: var(--text); }
  .cand-hd .score { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .cand-hd .right { margin-left: auto; display: flex; gap: 6px; }
  .tag-best {
    font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .tag-warn {
    font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
    background: rgba(209,36,47,.1); color: var(--err); font-weight: 600;
  }
  .cand-tx {
    font: 13px/1.65 var(--mono); color: var(--text);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.2em; overflow: hidden;
    padding: 6px 8px; background: var(--panel); border-radius: 6px; border: 1px solid var(--border);
    user-select: all;
  }
  .cand-note { margin-top: 6px; font-size: 11.5px; color: var(--text-3); }
  .cand-note.bad { color: var(--err); }

  .alert {
    border-radius: 8px; padding: 9px 11px; font-size: 12.5px; line-height: 1.65;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text-2);
  }
  .alert.warn { border-color: rgba(209,36,47,.28); background: rgba(209,36,47,.06); color: var(--err); }
  .alert.ok { border-color: rgba(13,122,82,.26); background: rgba(13,122,82,.06); color: var(--ok); }

  /* ===== 对照表 ===== */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--panel-2); font-weight: 600; color: var(--text-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.enc { white-space: nowrap; font-weight: 600; color: var(--text); width: 1%; }
  td.grp { white-space: nowrap; color: var(--text-3); width: 1%; font-size: 11px; }
  td.tx { font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; color: var(--text); }
  td.tx.no { color: var(--text-3); }
  td.sc { white-space: nowrap; color: var(--text-3); font-variant-numeric: tabular-nums; width: 1%; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px);
    background: var(--text); color: #fff; font-size: 12px; padding: 7px 14px;
    border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 50; max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 6px 8px; padding: 8px 10px; }
    header .brand { font-size: 14px; }
    main { padding: 10px; }
    .card { padding: 12px; margin-bottom: 10px; }
    #src { min-height: 88px; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href=".." title="返回工具首页">Mojibake<span>Fix</span></a>
  <span class="sep"></span>
  <span class="stat">编码探测 · <b id="encN">86</b> 种</span>
  <span class="sep hide-sm"></span>

</header>

    <div class="meta">
      <span id="stat">0 字</span>
      <span id="cap"></span>
      <span class="right">
        <button class="mini" id="btnSample" title="填入一个乱码示例">示例</button>
      </span>
    </div>
  </section>

  <section class="card">
    <h2>候选还原 <span class="hint" id="candHint">按可能性排序</span></h2>
    <div id="cands"></div>
  </section>

  <section class="card">
    <h2>各编码解码对照 <span class="hint" id="tblHint"></span></h2>
    <div id="tblBox"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

      if (s === 0){ if (c !== 9 && c !== 10 && c !== 13) ctrl++; continue; }
      if (s === 19){ fffd++; continue; }

      if (s === 13 || s === 14){ latinSym++; continue; }
      if (s === 15 || s === 16){ neutral++; continue; }
      if (s === 17){ pua++; continue; }
      if (s === 18){ other++; continue; }

      if (isUpper(c)) upper++;
      ch = t.charAt(i);
      /* ★ 两档字频：命中高频字表记 1 分，只命中 3500 常用字记 0.35 分。
         真中文 freq 落在 0.85 上下，猜错编码拼出的「汉字」只有 0.1 左右 —— 这才是能分开
         「真文本」和「乱码汉字」的信号；只用一张大表两者会挤在一起。 */
      if (s === 2 || s === 3){
        if (csHi[ch]){ common++; freqHits[2] += 1; }
        else if (cs[ch]){ common++; freqHits[2] += 0.35; }
      }
      else if (FS[s] && FS[s][ch]) freqHits[s]++;

       混用会让 freq 永远取到 freqHits[10]（=0），整个语言合理性信号失效。 */
    var letters = 0, best = 0, bestIdx = 0;
    for (i = 2; i <= 12; i++){ letters += hits[i]; if (hits[i] > best){ best = hits[i]; bestIdx = i; } }

       垃圾里 —— 实测「ÄãºÃ」被「Mac Roman → UTF-16LE」解成「讀첼」（汉字 + 谚文），

    var fam = idxFamily(bestIdx), famHits = 0;

       ★ 拉丁符号 €‚ƒ„… 必须**留在**分母里，否则「ÐŸÑ€Ð¸Ð²ÐµÑ‚」纯度仍有 0.63，压不下去。 */
    var denom = n - ascii - fffd - ctrl - neutral;

        这是唯一能分开「真俄文」和「乱码西里尔」的信号：真俄文 о/е/а/и 占一半，
        乱码西里尔均匀铺满整个字母表；汉字走 COMMON / COMMON_T。

         - 2.0 * (d.pua / n)

     本来就只有那几个高位字符在变：「Caf\x82 cr\x8Ame \x85 la carte」→「Café crème à la carte」

        }
        /* ★ 还原结果里出现控制字符（U+0000-001F，不含 \t \n \r）说明编码猜错了 ——
           文本里不会凭空冒出 U+001B。实测「UTF-16LE → Shift_JIS」把中文乱码解成
           「cmｲrｽ0\033怖\\…」还能拿 3.4 分：freq 只看「常用字占比」，而拉丁字母几乎
           个个都算常用，这个信号对纯 ASCII 垃圾毫无分辨力；靠调权重压不住，直接否决才干净。 */
        var det = scoreDetail(txt, tgt.script);
        if (det.ctrl) return;
        /* ★ 拉丁外观的输入 → 汉字 / 韩文目标：结果必须**真的以那种文字为主**。
           「ÄãºÃ」按 GBK 解得「你好」，汉字占全部字母的 100%；
           而「Pý¡liç §luou」按 GBK 只能拼出「P媒隆li莽 搂lu聹ou聼」、按 EUC-KR 拼出
           「P첵징li챌 짠lu혵ou혺」，目标文字只占三成 —— 这是「凑出来的」，
           真实文本不会长这样。实测 cp852（捷克）/ mac-ce / viscii 的乱码全被这类
           「半拉丁半汉字」的垃圾顶掉。 */
        if (inFam === 'latin' && (tf === 'han' || tf === 'korean')){
          var tIdx = SCRIPT_IDX[tgt.script];
          var tHit = tIdx ? det.hits[tIdx] : 0;
          if (tgt.script === 'japanese') tHit += det.hits[2];
          if (det.letters && tHit / det.letters < 0.5) return;
        }
        var sc = det.score - (lossy ? 0.15 : 0);
        /* ★ 严格解码成功是强证据：字节流在**结构型**编码（UTF-8 / GBK / Big5 / 日韩双字节）里
           严格合法，随机字节几乎做不到；而单字节编码对任何字节都合法，没有信息量，所以不加分。
           没有这条，泰文/阿拉伯文的乱码会被「用错编码但同样纯泰文/纯阿拉伯文」的结果顶掉。
           ★ 但这个加分要按输入的**非 ASCII 占比**缩放。ASCII 字节在任何 DBCS 编码里都合法，
           所以「一个 86% 是 ASCII 的串按 GBK 解码成功」几乎不携带信息。不缩放的话，
           27 种遗留编码的端到端还原会被「UTF-8 → GBK」白拿 0.8 分顶掉：
           「Café crème à la carte」3.81 分，输给「Caf聜 cr聤me 聟 la carte」4.12 分。 */
        if (!partial && (tgt.kind === 'utf8' || tgt.kind === 'dbcs' || tgt.kind === 'dbcs4')){
          sc += 0.8 * Math.min(1, sHiRatio / 0.75);
        }
        out.push({
          key: key,
          label: src.name + ' → ' + tgt.name,
          note: note,
          text: txt,
          score: sc,
          kind: 'conv',
          lossy: lossy,
          bytes: enc.bytes,
          srcName: src.name
        });
      });
    });
    return out;
  }

  function sortByScore(a, b){ return b.score - a.score; }

  function dedupe(list){
    var seen = Object.create(null), out = [];
    list.sort(sortByScore);
    list.forEach(function(c){
      var k = c.text;
      if (seen[k]) return;
      seen[k] = 1;
      out.push(c);
    });
    return out;
  }

  /* ★ 两阶段扫描：86 目标 × 85 源 ≈ 7310 组合，直接拿全文跑在 2 万字下要 900ms 以上。
     改成先在头 1500 字上跑全部组合（约 35ms），只把 Top 15 的 key 拿到全文精算（约 6ms）。
     排序在短样本和全文上是一致的 —— 乱码特征在 1500 字内早已稳定。 */
  function scanAny(s){
    if (s.length <= PRESCAN) return scanText(s);
    var rough = scanText(s.slice(0, PRESCAN)).sort(sortByScore).slice(0, 15);
    var keys = Object.create(null);
    rough.forEach(function(c){ keys[c.key] = 1; });
    return scanText(s, keys);
  }

  function candidatesFromText(s){
    var list = scanAny(s);

    /* 双重乱码：只在**第一层还没修好**时才做第二层。
       ★ 门槛是 looksNormal（不是分数）：第一层已经解出正常文本时再往下修，
       只会把正确结果糟蹋成更「像」的垃圾 —— 实测「你好，世�」会被二次修成「雿惩末嚗銝」。
       ★ 种子取前 5 名：短样本里第一层猜错是常事。实测「娴ｇ姴銈介敍灞肩瑯閻ｏ拷」的正确第一层
       「GBK → UTF-8」只排第 4（前面被 UTF-16LE / UTF-8 的假链路占着），只取前 3 会让
       正确链路永远拿不到第二层机会。 */
    var seeds = list.slice().sort(sortByScore).slice(0, 5);
    var globalBest = seeds.length ? seeds[0].score : -99;
    var needSecond = seeds.length && !looksNormal(seeds[0].text);
    if (needSecond){
      seeds.forEach(function(seed){
        /* ★ 按**每个种子**判，不是只判第一名：第一层已经解出正常文本的种子不该再修第二遍。
           实测「浣犲ソ锛屼笘鐣」里正确种子「GBK → UTF-8」已给出「你好，世�」，
           再修一轮会把它改成更「像」的垃圾（「你好，世」→「ｧAｦn｡A･@」），
           而且因为严格解码加分反而排到第一位。
           ★ 判之前先剥掉**尾部**的 �：那只是「末尾字节被截断」，原文已经还原出来了；
           中段的 � 才是真丢了字节、后续序列全被打断，那种才值得再修一轮。 */
        if (looksNormal(seed.text.replace(/\uFFFD+$/, ''))) return;
        scanAny(seed.text).forEach(function(c){
          /* ★ 第二层必须真的改动文本。否则「GBK → UTF-8 后再 GBK → GB18030」这种
             **原地往返**（GBK 的字节在 GB18030 里是同一批字）会得到与第一层完全相同的文本，
             却因为结构型编码的严格解码加分多拿 0.8，反过来把第一层顶下去。
             实测「浣犲ソ锛屼笘鐣�」的第一名因此变成了一串毫无意义的双重修复。 */
          if (c.text === seed.text || samey(c.text, s)) return;
          /* ★ 第二层的结果自己也得像正常文本，否则只是「猜得更花哨的垃圾」。
             实测韩文乱码 `ì•ˆë…•í•˜…` 的第一层已经正确解出韩文（2.72 分），
             却被「Windows-1252 → Latin-1 后再 UTF-8 → GBK」拼出的中文垃圾顶掉 ——
             因为韩文的字频表只有几十个音节，正确结果 freq 只有 0.25，
             looksNormal 判为「没修好」，于是白白多跑一轮。 */
          if (!looksNormal(c.text.replace(/\uFFFD+$/, ''))) return;
          if (c.score < globalBest + 0.2) return;
          c.key = seed.key + '>>' + c.key;
          c.label = seed.label + ' 后再 ' + c.label;
          c.note = '双重乱码：先按「' + seed.label + '」还原，再修一轮。';
          c.depth = 2;
          list.push(c);
        });
      });
    }

    /* 原样作为基线也放进来，用来判断「本来就没乱码」。
       ★ 给它 +0.5 的先验：**「不需要转换」是默认假设**，主张乱码的一方要拿出证据。
       没有这 0.5，纯 ASCII 的英文正文（freq 高但 coherence 分母为 0）会被
       「UTF-16 往返」这类产出伪西里尔的转换反超（实测 1.8 > 0.5）。 */
    list.push({
      key: '__id__', label: '原样（未转换）', text: s,
      score: scoreText(s, 'any') + 0.5, kind: 'id',
      note: '不做任何转换，仅作为对照。'
    });

    return dedupe(list).slice(0, 8);
  }

  /* ===== 十六进制字节输入 ===== */
  function parseHex(raw){
    var s = raw.replace(/0x/gi, '').replace(/[\s,:;\-_]/g, '');
    if (!s || /[^0-9a-fA-F]/.test(s)) return null;
    if (s.length % 2) return null;
    var out = new Uint8Array(s.length / 2);
    for (var i = 0; i < out.length; i++){
      out[i] = parseInt(s.substr(i * 2, 2), 16);
    }
    return out;
  }

  /* 十六进制模式下：直接用全部 86 种编码去解同一份字节（不需要反推） */
  function candidatesFromBytes(u8){
    var list = [];
    ENCS.forEach(function(e){
      var txt = decodeAs(u8, e.id, true);
      if (txt == null || !txt) return;
      list.push({
        key: 'bytes>' + e.id,
        label: '按 ' + e.name + ' 解码',
        note: e.kind === 'sbcs' || e.kind === 'latin1'
          ? '单字节编码对任何字节都能解出东西，只能用来确认字节内容，不代表编码正确。' : '',
        text: txt,
        score: scoreText(txt, e.script),
        kind: 'conv',
        bytes: u8,
        srcName: e.name
      });
    });
    return dedupe(list).slice(0, 8);
  }

  function tableFromBytes(u8){
    var rows = [];
    ENCS.forEach(function(e){
      var txt = decodeAs(u8, e.id, true);
      rows.push({
        name: e.name,
        group: e.group,
        text: txt,
        ok: txt != null,
        score: txt != null ? scoreText(txt, e.script) : null
      });
    });
    rows.sort(function(a, b){
      if (a.ok !== b.ok) return a.ok ? -1 : 1;
      return (b.score || -99) - (a.score || -99);
    });
    return rows;
  }

  /* ===== 渲染 ===== */
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600);
  }

  function preview(t){
    var max = 240;
    if (t.length <= max) return t;
    return t.slice(0, max) + ' …（共 ' + t.length + ' 字）';
  }

  function emptyBox(text, cls){
    var d = document.createElement('div');
    d.className = 'alert' + (cls ? ' ' + cls : '');
    d.textContent = text;
    return d;
  }

  function renderCands(list, fffdN, fffdMid){
    candsEl.textContent = '';

    if (fffdN){
      candsEl.appendChild(emptyBox('输入里有 ' + fffdN + ' 个替换符 �（U+FFFD）：这些位置的原始字节在之前的解码中已经丢失，还原结果可能缺字。想要完整结果，请改用「十六进制字节」模式粘贴原始字节。', 'warn'));
    }

    if (!list.length){
      candsEl.appendChild(emptyBox('粘贴乱码文本后，这里会列出能还原它的方案。'));
      candHintEl.textContent = '按可能性排序';
      return;
    }

    var top = list[0];
    var showList = list;

    if (top.kind === 'id' && looksNormal(top.text)){
      candsEl.appendChild(emptyBox('输入看起来已经是正常文本，没有检测到乱码特征。下面是其他编码尝试的结果，仅供对照。', 'ok'));
      candHintEl.textContent = '未检测到乱码';
      showList = list.filter(function(c){ return c.kind !== 'id'; });
    } else if (top.kind === 'id' && !looksNormal(top.text)){
      candsEl.appendChild(emptyBox('没找到可信的还原方案 —— 这段文本看着不像正常中文，但也反推不出原始字节。多半是原始字节在之前的某次转换里就已经丢失了。', 'warn'));
      candHintEl.textContent = '无可信结果';
      showList = list.filter(function(c){ return c.kind !== 'id'; });
    } else if (top.score < 1.0){
      candsEl.appendChild(emptyBox('没有找到可信的还原方案 —— 原始字节可能已经丢失，或者这段文本本来就不是乱码。', 'warn'));
      candHintEl.textContent = '无可信结果';
      showList = list.filter(function(c){ return c.kind !== 'id'; });
    } else if (fffdMid){
      /* ★ 输入里**中段**有 � 时不许说「最可能」 —— 那几个字节是真的没了，
         后面的 UTF-8 序列也全被打断，再叠一层猜测等于编数据。
         只在末尾有 � 属「奇数长度截断」的常见形态，仍可高置信。 */
      candHintEl.textContent = '字节已部分丢失，以下只是猜测';
    } else {
      candHintEl.textContent = '最可能是「' + top.label + '」';
    }

    showList.forEach(function(c, i){
      /* ★ 中段有 � 时不打「最接近」高亮：那时所有链路都只是猜，
         实测「UTF-8 日文被当 Shift_JIS 读」丢了 4 个字节后，得分最高的反而是
         「EUC-JP → Windows-874」这种纯泰文垃圾 —— 高亮它比不高亮更误导。 */
      var isBest = (!fffdMid && i === 0 && c === top && c.kind === 'conv');
      var row = document.createElement('div');
      row.className = 'cand' + (isBest ? ' best' : '');

      var hd = document.createElement('div');
      hd.className = 'cand-hd';

      var enc = document.createElement('span');
      enc.className = 'enc';
      enc.textContent = c.label;
      hd.appendChild(enc);

      if (isBest){
        var tag = document.createElement('span');
        tag.className = 'tag-best';
        tag.textContent = fffdMid ? '最接近' : '最可能';
        hd.appendChild(tag);
      }
      if (c.depth === 2){
        var t2 = document.createElement('span');
        t2.className = 'tag-best';
        t2.textContent = '双重修复';
        hd.appendChild(t2);
      }
      if (c.lossy){
        var t3 = document.createElement('span');
        t3.className = 'tag-warn';
        t3.textContent = '部分还原';
        hd.appendChild(t3);
      }

      var sc = document.createElement('span');
      sc.className = 'score';
      sc.textContent = '得分 ' + c.score.toFixed(1);
      hd.appendChild(sc);

      var right = document.createElement('span');
      right.className = 'right';

      if (c.kind !== 'id'){
        var apply = document.createElement('button');
        apply.type = 'button';
        apply.className = 'mini';
        apply.textContent = '用作输入';
        apply.title = '把这段结果填回输入框，方便继续修';
        apply.addEventListener('click', function(){
          srcEl.value = c.text;
          analyze();
          toast('已填回输入框');
        });
        right.appendChild(apply);
      }

      var copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'mini';
      copy.textContent = '复制';
      copy.addEventListener('click', function(){ copyText(c.text); });
      right.appendChild(copy);

      hd.appendChild(right);
      row.appendChild(hd);

      var tx = document.createElement('div');
      tx.className = 'cand-tx';
      tx.textContent = preview(c.text);
      row.appendChild(tx);

      if (c.note){
        var note = document.createElement('div');
        note.className = 'cand-note';
        note.textContent = c.note;
        row.appendChild(note);
      }

      candsEl.appendChild(row);
    });
  }

  /* 86 种编码全列出来太长（86 行 × 30px ≈ 2580px），默认只显示前 12 名，可展开全部 */
  var tblRows = [], tblHintTxt = '', tblLimit = 12;

  function renderTable(rows, hint){
    tblRows = rows;
    tblHintTxt = hint || '';
    tblLimit = 12;
    paintTable();
  }

  function paintTable(){
    tblBox.textContent = '';
    tblHintEl.textContent = tblHintTxt;
    if (!tblRows.length){
      tblBox.appendChild(emptyBox('没有可分析的字节序列。'));
      return;
    }
    var show = tblRows.slice(0, tblLimit);

    var wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    var tb = document.createElement('table');

    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    ['编码', '语言', '解码结果', '得分'].forEach(function(h){
      var th = document.createElement('th');
      th.textContent = h;
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    tb.appendChild(thead);

    var tbody = document.createElement('tbody');
    show.forEach(function(r){
      var tr = document.createElement('tr');

      var td1 = document.createElement('td');
      td1.className = 'enc';
      td1.textContent = r.name;
      tr.appendChild(td1);

      var tdg = document.createElement('td');
      tdg.className = 'grp';
      tdg.textContent = r.group || '';
      tr.appendChild(tdg);

      var td2 = document.createElement('td');
      td2.className = 'tx' + (r.ok ? '' : ' no');
      td2.textContent = r.ok ? preview(r.text || '（空）') : '不是合法的 ' + r.name + ' 字节序列';
      tr.appendChild(td2);

      var td3 = document.createElement('td');
      td3.className = 'sc';
      td3.textContent = r.ok ? r.score.toFixed(1) : '—';
      tr.appendChild(td3);

      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    wrap.appendChild(tb);
    tblBox.appendChild(wrap);

    if (tblRows.length > 12){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mini';
      btn.style.marginTop = '8px';
      btn.textContent = tblLimit >= tblRows.length
        ? '只看前 12 种'
        : '显示全部 ' + tblRows.length + ' 种';
      btn.addEventListener('click', function(){
        tblLimit = (tblLimit >= tblRows.length) ? 12 : tblRows.length;
        paintTable();
      });
      tblBox.appendChild(btn);
    }
  }

  /* ===== 复制 ===== */
  function copyText(t){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast('已复制'); }, function(){ fallbackCopy(t); });
    } else {
      fallbackCopy(t);
    }
  }
  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    toast(ok ? '已复制' : '复制失败，请手动选择');
  }

  /* ===== 主流程 ===== */
  function analyze(){
    var raw = srcEl.value;
    var mode = modeEl.value;
    var n = raw.length;

    if (!raw.trim()){
      statEl.textContent = '0 字';
      capEl.textContent = '';
      candsEl.textContent = '';
      candsEl.appendChild(emptyBox('粘贴乱码文本后，这里会列出能还原它的方案。'));
      candHintEl.textContent = '按可能性排序';
      renderTable([], '');
      return;
    }

    if (mode === 'hex'){
      var bytes = parseHex(raw);
      if (!bytes){
        statEl.textContent = n + ' 字符';
        capEl.textContent = '';
        candsEl.textContent = '';
        candsEl.appendChild(emptyBox('十六进制格式不对：需要偶数个十六进制字符，可以带空格、逗号、冒号或 0x 前缀。', 'warn'));
        candHintEl.textContent = '格式错误';
        renderTable([], '');
        return;
      }
      statEl.textContent = bytes.length + ' 字节';
      capEl.textContent = '';
      var cl = candidatesFromBytes(bytes);
      renderCands(cl, 0);
      renderTable(tableFromBytes(bytes), '同一份字节按各编码解码的结果');
      return;
    }

    /* 文本模式 */
    var truncated = n > MAX_CHARS;
    var work = truncated ? raw.slice(0, MAX_CHARS) : raw;
    statEl.textContent = n + ' 字';
    capEl.textContent = truncated ? '超过 ' + MAX_CHARS + ' 字，只分析前 ' + MAX_CHARS + ' 字' : '';

    /* 含替换符：少量且只在末尾属「末尾孤字节」的常见形态，仍可高置信部分还原；
       出现在**中段**说明字节是真的丢过（后续 UTF-8 序列全被打断），只能给猜测；
       大量（超过 40%）说明整段都丢过，再猜就是造数据了，直接明说。 */
    var fffdN = 0, fffdMid = 0, fi;
    for (fi = 0; fi < work.length; fi++){
      if (work.charCodeAt(fi) === 0xFFFD){
        fffdN++;
        if (fi < work.length - 2) fffdMid++;
      }
    }
    if (fffdN && fffdN / work.length > 0.4){
      candsEl.textContent = '';
      candsEl.appendChild(emptyBox('输入里有 ' + fffdN + ' 个替换符 �（U+FFFD），占全文 ' + Math.round(fffdN / work.length * 100) + '%：绝大部分原始字节已经在解码时丢失，任何算法都还原不了。请改用「十六进制字节」模式粘贴原始字节，或回到源头用正确编码重新导出。', 'warn'));
      candHintEl.textContent = '原始字节已丢失';
      renderTable([], '');
      return;
    }

    var list = candidatesFromText(work);
    renderCands(list, fffdN, fffdMid);

    var topConv = list.filter(function(c){ return c.kind === 'conv'; }).sort(sortByScore)[0];
    if (topConv && topConv.bytes){
      renderTable(tableFromBytes(topConv.bytes), '按「' + topConv.srcName + '」取回的字节，各编码解码对照');
    } else {
      renderTable([], '没有可用的字节序列');
    }
  }

  var timer = null;
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(analyze, 160);
  }

  /* ===== 示例样本 =====
     ★★ 这几条必须是**真乱码**：拿原文的真实字节按另一种编码解出来的结果，不能手敲。
     之前这里手敲成 `ä½ å¥½`（中间是普通空格 U+0020），而正确的字节是 0xA0（NBSP），
     于是 E4 BD 20 E5 A5 BD 根本不是合法 UTF-8 —— 示例自己就解不出来。
     以后要加样本，用 `new TextDecoder(enc).decode(new TextEncoder().encode(原文))` 现生成。
     这几条都选**字节长度能整除、无损**的，点下去就能看到干净的完整还原。 */
  var SAMPLE_TEXT = [
    '浣犲ソ锛屼笘鐣岋紒',                        /* 你好，世界！ UTF-8 被当 GBK 读 */
    'ä½\u00A0å¥½ï¼Œä¸–ç•Œ',                     /* 你好，世界  UTF-8 被当 Windows-1252 读 */
    'cafÃ© crÃ¨me'                               /* café crème 西文最常见的乱码形态 */
  ];
  var SAMPLE_HEX = [
    'E4BDA0E5A5BD EFBC8C E4B896E7958C',        /* 你好，世界（UTF-8） */
    'C4E3BAC3'                                   /* 你好（GBK） */
  ];
  var sampleIdx = 0;

  /* ===== 事件 ===== */
  srcEl.addEventListener('input', schedule);
  modeEl.addEventListener('change', function(){
    srcEl.placeholder = modeEl.value === 'hex'
      ? '粘贴十六进制字节，例如：E4BDA0E5A5BD 或 e4 bd a0 e5 a5 bd'
      : '粘贴乱码文本，例如：\n浣犲ソ锛屼笘鐣岋紒\nä½\u00A0å¥½ï¼Œä¸–ç•Œ';
    analyze();
    srcEl.focus();
  });

  $('btnClear').addEventListener('click', function(){
    srcEl.value = '';
    analyze();
    srcEl.focus();
  });

  $('btnSample').addEventListener('click', function(){
    var list = modeEl.value === 'hex' ? SAMPLE_HEX : SAMPLE_TEXT;
    srcEl.value = list[sampleIdx % list.length];
    sampleIdx++;
    analyze();
    toast('已填入示例，再点一次换一个');
  });

  /* ===== 能力探测：某些浏览器可能缺某个解码器，缺了就不该出现在结果里 ===== */
  (function(){
    var ok = ENCS.filter(function(e){ return decodeAs(new Uint8Array([0x41]), e.id, false) != null; });
    $('encN').textContent = String(ok.length);
    if (ok.length < ENCS.length){
      var miss = ENCS.filter(function(e){ return ok.indexOf(e) < 0; }).map(function(e){ return e.name; });
      capEl.textContent = '当前浏览器不支持：' + miss.join('、');
    }
  })();

  analyze();

  /* 调试钩子：/tmp/verify-*.js 回归脚本依赖（byId / enc / dec / cand）。
     不参与页面任何逻辑，删掉它只会让四套验证脚本跑不起来。 */
  window.__dbg = { byId: ENC_BY_ID, enc: encodeAs, dec: decodeAs, cand: candidatesFromText };
})();
</script>
