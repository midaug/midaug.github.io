<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文本对比工具</title>
<meta name="theme-color" content="#f6f7f9" />
<style>
  :root {
    /* ===== 与「工具首页」共用的一套配色（浅色 · 靛蓝）===== */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    --guide: rgba(15,23,42,.14);

    /* ===== 语义色（与 JSON 工具同一套）===== */
    --key: #2f52c9;
    --str: #0d7a52;
    --num: #b25e09;
    --bool: #7a3fd4;
    --null: #94a0b0;
    --err: #d1242f;
    --ok: #0d7a52;

    /* ===== diff 语义色 =====
       删除 = 红、新增 = 绿。这是 git / diff 的通行约定，表示「这段文字被移除 /
       被加入」，与股市的「红涨绿跌」无关，两套语义不要混。
       底纹一律用**实色**而不是半透明：高亮层与输入层是两层叠加，
       半透明色叠两次会偏深，而且行号列也跟着变色时会更明显。 */
    --del-line: #fbeced;   /* 整行被删 */
    --ins-line: #e8f2ef;   /* 整行新增 */
    --del-mark: #f6c9cc;   /* 行内被删的字符 / 词（比整行底色深一档才看得出边界） */
    --ins-mark: #bfdccf;   /* 行内新增的字符 / 词 */
    --del-fg: #b31d29;
    --ins-fg: #0a6644;

    /* 行高。刻意与 JSON 工具取同一个值（--row = 18px）：
       13px 等宽字体墨迹高约 12.3px，上下各留约 3px、相邻行墨迹间隙 4px；
       比 24px 每屏多约 34% 内容。
       **输入框与高亮层必须共用这一个值**，否则两层的行位置会逐行累积错位。 */
    --row: 18px;
    /* 行号列宽，JS 会按最大行号的位数覆写 */
    --ln-w: 26px;
    /* 文本区内边距，输入层与高亮层共用 */
    --pad-y: 8px;
    --pad-x: 12px;
    /* textarea 滚动条占用的宽度，JS 实测覆写（macOS 覆盖式滚动条为 0）。
       高亮层要按它缩窄，否则两层的可用文本宽度不同、折行位置对不上。 */
    --sb-w: 0px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ===== 顶栏 ===== */
  /* 空间不够时**换行**，不隐藏任何控件 —— 早期是 hide-lg / hide-md / hide-sm
     三级断点直接 display:none，页面一放大（zoom 会缩窄 CSS 像素视口）或窗口
     一窄，按钮就凭空消失（用户反馈的 bug）。
     不能留 overflow: hidden：折叠面板是 header 内的绝对定位浮层，会被裁掉。 */
  header {
    display: flex; align-items: center; gap: 10px; row-gap: 6px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--text); margin-right: 4px; flex: none; }
  .brand span { color: var(--accent); }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
    transition: background .15s, border-color .15s, color .15s;
    /* 顶栏在窄屏会被压：flex 默认允许收缩，按钮一旦变窄，中文标签就折成
       两行、行高从 30px 涨到 50px+。nowrap + flex:none 让它保持固有宽度，
       空间不够时由 header 换行或隐藏次要控件来让位。 */
    white-space: nowrap; flex: none;
  }
  button:hover, select:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 2px 10px -2px rgba(79,107,237,.45);
  }
  button.primary:hover { background: var(--accent); border-color: transparent; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border-2); background: var(--panel); color: var(--text); }
  button.mini { padding: 3px 8px; font-size: 12px; }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  /* 顶栏里的常驻小控件：不换行、不被压窄 */
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; flex: none; display: flex; align-items: center; gap: 6px; }
  select { padding: 4px 6px; }
  /* 性能统计：贴在顶栏行尾，单行，空间不足时省略号截断 */
  .stat.perf {
    margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums;
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    display: block; color: var(--text-3);
  }
  /* 差异统计 + 导航（原来在结果区标题栏里，现在结果区没了，挪到顶栏） */
  .diffstat { display: flex; align-items: center; gap: 10px; flex: none; font-variant-numeric: tabular-nums; }
  .diffstat i { font-style: normal; font-weight: 600; }
  .diffstat .s-ins { color: var(--ins-fg); }
  .diffstat .s-del { color: var(--del-fg); }
  .diffstat .s-mod { color: var(--num); }
  .diffstat .s-sim { color: var(--text-3); font-weight: 400; }
  .navpos { font-variant-numeric: tabular-nums; color: var(--text-3); min-width: 40px; text-align: center; }
  .navbtn { padding: 2px 7px; font-size: 12px; line-height: 1.2; }

  /* ---- 折叠面板：把低频控件收进 summary + 浮层，任何宽度都能展开 ----
     用它替代了早期「窄屏直接 display:none 藏掉」的做法。原生 <details>
     自带开合语义与键盘支持（Enter / Space），这里只补「点面板外收起」。 */
  .pop { position: relative; flex: none; }
  .pop > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 5px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .pop > summary::-webkit-details-marker { display: none; }   /* Safari 的小三角 */
  .pop > summary::after { content: "▾"; font-size: 9px; opacity: .5; }
  .pop > summary:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  .pop[open] > summary { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  /* 已经生效的忽略项数量：不展开也知道有没有勾上 */
  .pop-n {
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* 必须显式写：上面那条 display: inline-flex 会盖掉 [hidden] 的 display: none */
  .pop-n[hidden] { display: none; }
  /* 浮层：绝对定位、脱离流，展开时不会把顶栏撑高 */
  .pop-body {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    min-width: 172px; max-width: calc(100vw - 16px); padding: 6px;
    display: flex; flex-direction: column; gap: 1px;
    background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px;
    box-shadow: 0 10px 28px -10px rgba(15,23,42,.35);
    animation: popIn .12s ease-out;
  }
  /* ★ 按钮与浮层之间那 6px 是「悬停死区」：鼠标穿过去时既不在按钮上、也不在
     浮层上，悬停判定会瞬间断掉、面板一闪就没了 —— 就是「收得太快、点不到」。
     用伪元素把这段桥接成浮层自己的一部分：鼠标走在桥上时算在 .pop-body 上。
     （JS 侧另有一道 POP_GRACE 延迟兜底，两层保险。） */
  .pop-body::before {
    content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 8px;
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px); } }
  .pop-body label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 8px; border-radius: 6px; font-size: 12px; color: var(--text-2);
    white-space: nowrap;
  }
  .pop-body label:hover { background: var(--hover); color: var(--text); }
  .pop-body input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
  .pop-body .pop-row { justify-content: space-between; gap: 14px; }
  .pop-body .pop-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .pop-body button { width: 100%; text-align: left; }

  /* 顶栏已改成「放不下就换行」，这里只在更窄时把性能统计整行让出去。
     不再有 hide-lg / hide-md / hide-sm 的 display:none —— 控件永远不会消失。 */
  @media (max-width: 1060px) {
    .stat.perf { flex: 1 1 100%; margin-left: 0; padding-left: 0; }
  }
  @media (max-width: 900px) {
    header { gap: 8px; row-gap: 6px; }
  }

  /* ===== 主体：左右两块，就是原始文本 / 修改文本本身 =====
     没有独立的「对比结果」板块 —— 差异直接高亮在文本里。
     中间那根窄列 #gut 是「接缝」，每一处差异在上面各挂一对同步按钮。 */
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  main > .pane {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--panel);
  }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-2); flex: none; overflow: hidden;
  }
  .pane-head b { color: var(--text); font-weight: 600; flex: none; white-space: nowrap; }
  .pane-head .meta { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pane-head .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }

  /* ===== 编辑区：高亮层在下、透明 textarea 在上 =====
     两层必须逐像素对齐，所以下面这一组属性两边完全一致：
       font-size / line-height / font-family / tab-size
       padding（上下）、可用文本宽度
       white-space: pre-wrap + overflow-wrap: break-word（折行位置一致）
     任何一条两边不同，行位置就会从某一行开始整体错位 —— 这是这个方案唯一的
     命门，改样式时必须两边一起改。 */
  .ed { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .ed-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; user-select: none; }
  .ed-hl-in {
    position: absolute; left: 0; top: 0;
    /* 缩掉滚动条占的宽度，可用文本宽度才与 textarea 的 clientWidth 对齐 */
    width: calc(100% - var(--sb-w));
    padding: var(--pad-y) 0;
    font-size: 13px; line-height: var(--row); font-family: var(--mono);
    tab-size: 4;
    white-space: pre-wrap; overflow-wrap: break-word;
    /* 提升为合成层：滚动时只做合成器平移，不必重绘整层文字 */
    will-change: transform;
  }
  /* 一层里的「一行」。文字透明 —— 真正显示的是上层 textarea 里的文字，
     这一层只负责铺背景色，所以它必须**占位但不显字**。 */
  .bl {
    position: relative;
    min-height: var(--row); line-height: var(--row);
    padding-left: calc(var(--pad-x) + var(--ln-w));
    padding-right: var(--pad-x);
    white-space: pre-wrap; overflow-wrap: break-word;
    color: transparent;
    border-radius: 3px;
  }
  /* 虚拟窗口：只把视口附近的行留在渲染树里。
     实测 5 万个 .bl 全在树里时滚动 40 ms/帧（每帧一个 65 ms 的长任务），
     只留几百个就回到 14 ms。开关用 data-on 属性而不是 .on 类 ——
     .bl 的 class 是有语义的（c-del / c-ins / c-mod / cur），
     再往里塞一个纯布局用的标记，外面按 className 判断差异类型的代码就得跟着改。 */
  .ed-hl-in.win .bl { display: none; }
  .ed-hl-in.win .bl[data-on] { display: block; }
  /* 被移走的行腾出的高度由 #hlL 自己的上下 padding 补回来，滚动条长度才不变。
     早先试过「真元素 spacer」和「::before/::after + CSS 变量」两种写法，后者
     反而慢一倍（32 ms/帧）：自定义属性默认会继承，改一次值就把整棵 5 万节点的
     子树标成 style dirty。用 padding 就没这个问题 —— 它是元素自己的属性，
     而且顺带保住了「#hlL.children 一个孩子一行」这个口径。
     行号绝对定位，不参与排版；top:0 / bottom:0 让它的底色铺满整个逻辑行
     （含折出来的续行），但行号数字只落在第一视觉行 —— 与编辑器一致。
     列宽刻意贴着实测的字符宽度给（见 layout()），不留大段空白：
     2 位数行号只需 26px，早期写成 46px 时左侧一整条都是空的。 */
  .bl > .ln {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: calc(var(--pad-x) + var(--ln-w));
    padding-right: 8px;
    text-align: right; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .bl.c-del { background: var(--del-line); }
  .bl.c-ins { background: var(--ins-line); }
  .bl.c-del > .ln { color: var(--del-fg); }
  .bl.c-ins > .ln { color: var(--ins-fg); }
  /* 行内高亮：只给底色，不设文字色 —— 文字由上层 textarea 渲染，
     这一层设了 color 也看不见，反而容易让人误以为「高亮没生效」。 */
  .bl i { font-style: normal; border-radius: 2px; }
  .bl i.dm { background: var(--del-mark); }
  .bl i.im { background: var(--ins-mark); }
  /* 当前导航到的差异行 */
  .bl.cur { outline: 2px solid var(--accent); outline-offset: -2px; }

  .ed textarea {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%; margin: 0; resize: none; border: 0; outline: 0;
    padding: var(--pad-y) var(--pad-x);
    /* 左侧空出行号列。高亮层的 .bl 用的是同一个量，两边文字起点因此一致。 */
    padding-left: calc(var(--pad-x) + var(--ln-w));
    background: transparent; color: var(--text); caret-color: var(--text);
    font-size: 13px; line-height: var(--row); font-family: var(--mono);
    tab-size: 4;
    white-space: pre-wrap; overflow-wrap: break-word;
    overflow: auto;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  .ed textarea::placeholder { color: var(--text-3); }
  .ed textarea::-webkit-scrollbar { width: 10px; height: 10px; }
  .ed textarea::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel); }
  .ed textarea::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  .ed textarea::-webkit-scrollbar-track { background: transparent; }
  .ed textarea::-webkit-scrollbar-corner { background: transparent; }
  /* 拖入文件时整块高亮 */
  main > .pane.drop { background: var(--accent-soft); }
  main > .pane.drop textarea { background: var(--accent-soft); }

  /* ===== 接缝：每一处差异各挂一对同步按钮 =====
     #gut 是一根真实的窄列，不是浮层 —— 按钮要落在两块中间且不遮正文。
     #gutIn 与高亮层用同一套办法跟随滚动：只做 translateY，所以 .hk 的
     top 写的是「内容坐标」（高亮层里那一行的 offsetTop），滚动时不必重算。 */
  #gut {
    flex: 0 0 42px; position: relative; overflow: hidden;
    background: var(--panel-2);
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  #gutIn {
    position: absolute; left: 0; right: 0; top: var(--head-h, 31px);
    will-change: transform;
  }
  /* 一处差异 = 一条「连接带」：左边缘贴着左侧那几行、右边缘贴着右侧那几行，
     中间用两条三次曲线接起来（path 的 d 由 JS 按实测行高算）。
     两侧行数不等时带子自然收成楔形 —— 滚动时一眼就能看出左右两段差异
     是怎么对应的，光靠两条各画各的矩形是看不出来的。 */
  #gutDefs { position: absolute; width: 0; height: 0; }
  .gut-g0 { stop-color: var(--del-mark); }
  .gut-g1 { stop-color: var(--ins-mark); }
  /* top 固定为 0，纵向位置一律走 transform：改 top 属于布局属性，
     滚动时每帧写 200 个元素的 top 会让主线程一直在重排；
     transform 只影响绘制，而且同一帧内多次写不会互相打断。
     height 仍要写（带子的高度 = 这处差异覆盖的行范围），但 .hk 是绝对定位、
     不参与父级布局，改它不会波及兄弟节点。 */
  .hk { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
  .hk-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .hk-svg path { fill: url(#gutGrad); }
  /* 按钮贴顶、左右各一个（不是居中）：长块居中后按钮会飘到离视线很远的地方。 */
  .hk-btn {
    position: absolute; top: 0; width: 17px; height: 16px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    background: transparent; border: 0; border-radius: 4px; box-shadow: none;
  }
  .hk-btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor;
                stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 左边 ◀ 把右侧的差异搬到左侧（红），右边 ▶ 反之（绿）——
     箭头方向与它作用的「去向」一致，颜色也跟两侧的差异底色对上。 */
  .hk-l { left: 2px; color: var(--del-fg); }
  .hk-r { right: 2px; color: var(--ins-fg); }
  .hk-l:hover { background: var(--del-mark); color: var(--del-fg); border: 0; }
  .hk-r:hover { background: var(--ins-mark); color: var(--ins-fg); border: 0; }
  /* 撤回按钮：有东西可撤时才亮起来 */
  #btnUndo:not(:disabled) { color: var(--accent); border-color: var(--accent-soft); }

  /* ===== toast ===== */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px);
    background: rgba(15,23,42,.9); color: #fff; padding: 7px 14px; border-radius: 8px;
    font-size: 12.5px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; z-index: 99;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 窄屏 ===== */
  @media (max-width: 760px) {
    /* 两块并排时每块只剩 180px，正文一行放不下几个字；改成上下叠。
       上下叠了就没有「接缝」可用，同步按钮改成浮在底部中间的一颗胶囊，
       一次只显示当前那一处（.hk.on，由 JS 标记）。 */
    main { flex-direction: column; }
    #paneR { border-top: 1px solid var(--border); }
    .brand { margin-right: 0; }
    #gut {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      flex: none; width: auto; height: auto; overflow: visible;
      padding: 4px; border: 1px solid var(--border-2); border-radius: 999px;
      background: var(--panel); box-shadow: 0 2px 12px -3px rgba(15,23,42,.35);
      z-index: 7;
    }
    /* 没有差异时整颗胶囊收掉（这里是浮层，不会引起布局跳动） */
    #gut.off { display: none; }
    #gutIn { position: static; top: auto; transform: none !important; }
    .hk { position: static; left: auto; right: auto; top: auto !important;
          height: auto !important; display: none; }
    .hk.on { display: flex; gap: 2px; }
    .hk-svg { display: none; }   /* 上下叠了就没有「连接」可言 */
    .hk-btn { position: static; width: 28px; height: 28px; }
    .hk-l { left: auto; }
    .hk-r { right: auto; }
    .hk-btn svg { width: 14px; height: 14px; }
  }
  /* 触屏下输入控件字号提到 16px：低于 16px 时 iOS 聚焦会把整页放大。
     ★ 正文 textarea 由 `.ed textarea`（0,1,1）定 13px，所以这里必须用同等
     特异性的选择器，只写裸 `textarea` 会被它盖掉。 */
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    .ed textarea, select, input[type="text"], input[type="search"] { font-size: 16px; }
  }

  /* 隐私说明：任何宽度都可见。窄屏放不下时 flex 会把它整体挪到下一行并换行显示，
     绝不 hide、绝不裁切（不用 hide-sm，那会在手机上把说明藏掉）。 */
  .stat.privacy-stat { display: inline-block; white-space: normal; flex: 0 1 auto; min-width: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">文本<span>对比</span></span>
    <span class="sep"></span>
    <button id="btnSample" title="填入一段示例文本">示例</button>
    <button id="btnSwap" title="交换左右两侧">⇄ 交换</button>
    <button id="btnClear" title="清空两侧">清空</button>

    <span class="sep"></span>

    <!-- 对比选项：行内粒度 + 四个忽略规则。都是低频设置，收进折叠面板后
         顶栏少 5 个控件、约 400px，任何窗口宽度都能展开（不再被断点藏掉）。 -->
    <details class="pop" id="popOpts">
      <summary title="对比选项：行内粒度与忽略规则">选项<span class="pop-n" id="optN" hidden>0</span></summary>
      <div class="pop-body">
        <label title="比较前把两侧都转成小写"><input type="checkbox" id="optCase">忽略大小写</label>
        <label title="把连续空格 / 制表符压成一个空格，并去掉首尾空白"><input type="checkbox" id="optWs">忽略空白</label>
        <label title="只忽略行尾的空格与制表符"><input type="checkbox" id="optTrail">忽略行尾</label>
        <label title="空白行互相视为相同，不计入差异"><input type="checkbox" id="optBlank">忽略空行</label>
        <div class="pop-sep"></div>
        <label class="pop-row" title="行内差异按什么粒度切分">
          <span>行内</span>

    <button class="primary" id="btnDiff" title="立即对比（Ctrl / ⌘ + Enter）">对比</button>
    <span class="sep"></span>

    <span class="diffstat" id="stat">
      <i class="s-ins" id="nIns">+0</i>
      <i class="s-del" id="nDel">−0</i>
      <i class="s-mod" id="nMod">~0</i>
      <i class="s-sim" id="nSim">100.0% 相同</i>
    </span>
    <span class="stat">
      <button class="mini navbtn" id="btnPrev" title="上一个差异（Alt + ↑）">↑</button>
      <button class="mini navbtn" id="btnNext" title="下一个差异（Alt + ↓）">↓</button>
      <span class="navpos" id="navPos">0 / 0</span>
    </span>

    <!-- 导出：两个低频动作，同样收进折叠面板 -->

      <summary title="导出对比结果">导出</summary>
      <div class="pop-body">
        <button class="mini" id="btnCopy" title="复制统一 diff 格式的文本">复制 diff</button>
        <button class="mini" id="btnDl" title="下载 .diff 文件">下载 .diff</button>
      </div>
    </details>

    <span class="stat perf" id="perf"></span>
      <span class="sep hide-sm"></span>
    <span class="stat privacy-stat">对比全部在本地完成，文本不会上传</span>
  </header>

  <!-- 接缝栏连接带的渐变：每处差异的 path 都引用它。
       颜色写在 CSS 里（stop-color 支持 var()），这样改配色不用动 JS。 -->
  <svg id="gutDefs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gutGrad" x1="0" y1="0" x2="1" y2="0">
        <stop class="gut-g0" offset="0" />
        <stop class="gut-g1" offset="1" />

  </svg>

  <main>
    <section class="pane" id="paneL">

    <!-- 接缝：每一处差异各挂一对同步按钮，由 JS 按差异的行范围生成。
         ◀ 把右侧这处差异搬到左侧，▶ 反之；按住 Shift 点击 = 整份覆盖。 -->
    <div id="gut"><div id="gutIn"></div></div>

    <section class="pane" id="paneR">
      <div class="pane-head">
        <b>修改文本</b>
        <span class="meta" id="metaR">0 行</span>
        <span class="acts">
          <button class="mini" id="btnUpR" title="从本地读取一个文本文件">打开文件</button>
          <button class="mini" id="btnClrR">清空</button>
        </span>
      </div>
      <div class="ed">
        <div class="ed-hl"><div class="ed-hl-in" id="hlR"></div></div>
        <textarea id="taR" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder="在此粘贴「修改后」文本，或把文件拖进来…"></textarea>
      </div>

  </main>
