<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>代码压缩美化</title>
<meta name="theme-color" content="#f6f7f9" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    /* ===== 与「工具首页 / JSON 格式化 / 日期时间 / 字节与网速」共用的一套配色（浅色 · 靛蓝）=====
       改配色只动这里；下面所有 CSS 一律引用变量，不要写死颜色。 */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;
    /* 语法高亮（输出区）token 配色：改色只动这五行 */
    --tk-k: #8250df;   /* 关键字 / 标签 / 指令 / at-rule */
    --tk-s: #0a7a3e;   /* 字符串 / 字符 / 属性值 */
    --tk-n: #b25e09;   /* 数字 / 单位 / 颜色 */
    --tk-c: #8a97a8;   /* 注释 */
    --tk-a: #0550ae;   /* 属性名 / 声明属性 / 字面量 */

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  /* ★ 必须是 height:100%（不能写 min-height）—— 写 min-height 会让 body 随内容长高、
     左右两栏失去「各占一屏」的高度来源，textarea 上的 flex:1 就撑不起来了。 */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    overflow: hidden; flex: none;
  }
  .brand { font-weight: 700; letter-spacing: .5px; margin-right: 4px; white-space: nowrap; color: inherit; text-decoration: none }
  .brand span { color: var(--accent); }

  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; outline: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
    min-width: 0;
  }
  /* ★ 按钮 / 下拉绝不折行、也不许被压窄（顶栏是 flex 容器，窄屏下不设这两条时
     flex 会把按钮挤到比文字还窄，中文被逐字竖排成一根条）。空间不够请让它换行。 */
  button, select { white-space: nowrap; flex-shrink: 0; }
  button:hover, select:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 2px 10px -2px rgba(79,107,237,.45);
  }
  button.primary:hover { background: var(--accent); border-color: transparent; color: #fff; }
  button.mini {
    padding: 3px 9px; font-size: 11px; line-height: 1.5;
    background: var(--panel-2); color: var(--text-2); border-color: var(--border);
  }
  button.mini:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  button[disabled]:hover { border-color: var(--border-2); background: var(--panel); color: var(--text); }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; flex: none; display: flex; align-items: center; gap: 5px; }
  .stat input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

  /* 分段控件（模式 / CSS 布局都用它，替代下拉选择，少一次点开） */
  .seg {
    display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px;
    overflow: hidden; flex: none;
  }
  /* ★ .seg 是 inline-flex，UA 的 [hidden]{display:none} 权重不够，必须自己补一条 */
  .seg[hidden] { display: none; }
  .seg button {
    border: 0; border-radius: 0; padding: 5px 10px; font-size: 12px;
    background: var(--panel-2); color: var(--text-2);
  }
  .seg button + button { border-left: 1px solid var(--border-2); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  /* ===== 主体：左右双栏（左输入 / 右输出），各占一屏高度 ===== */
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; }
  .pane.left { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-2); flex: none; overflow: hidden;
  }
  .pane-head b { color: var(--text); font-weight: 600; flex: none; white-space: nowrap; }
  /* 会被裁掉的信息统一用省略号，绝不把标题栏撑破（窄屏 390px 实测过） */
  .pane-head .ell { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .ell b { color: var(--accent); font-weight: 600; }

  /* 输入框与输出区共用同一套排版；#out 是 pre（只读高亮视图），其余行为一致 */
  textarea, #out {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: 10px 12px; margin: 0;
    background: var(--panel); color: var(--text); font: inherit; tab-size: 2;
    white-space: pre; overflow: auto;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  textarea::placeholder { color: var(--text-3); }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  #out:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  /* 输出为空时用占位提示（pre 没有 placeholder 属性） */
  #out:empty::before { content: attr(data-ph); color: var(--text-3); }
  /* 语法高亮 token */
  #out .t-k { color: var(--tk-k); }
  #out .t-s { color: var(--tk-s); }
  #out .t-n { color: var(--tk-n); }
  #out .t-c { color: var(--tk-c); }
  #out .t-a, #out .t-l { color: var(--tk-a); }
  textarea::-webkit-scrollbar, #out::-webkit-scrollbar { width: 10px; height: 10px; }
  textarea::-webkit-scrollbar-thumb, #out::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel); }
  textarea::-webkit-scrollbar-thumb:hover, #out::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  textarea::-webkit-scrollbar-track, #out::-webkit-scrollbar-track { background: transparent; }

  /* ===== 底部状态条：体积对比 + 提示 + 结果操作 ===== */
  #status {
    padding: 5px 12px; border-top: 1px solid var(--border); background: var(--panel-2);
    color: var(--text-2); font-size: 12px;
    display: flex; align-items: center; gap: 10px; min-height: 30px; flex: none;
  }
  #sizes { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #sizes b { color: var(--accent); font-weight: 600; }
  #sizes .cut { color: var(--ok); font-weight: 600; }
  #sizes .grow { color: var(--num); font-weight: 600; }
  #statusText { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #statusText.warn { color: var(--err); }

  .toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%) translateY(6px);
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
    box-shadow: 0 12px 30px -14px rgba(79,107,237,.7);
    padding: 7px 16px; border-radius: 20px; opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 手机适配（≤640px）=====
     左右双栏在 390px 下每栏只剩 ~180px，占位文字逐字换行，整页不可用 ——
     改成上下堆叠、各占一半高度。★ 不隐藏任何控件（分册约定：hide-* 断点藏控件已废弃）。 */
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    header { padding: 8px 10px; gap: 6px 8px; }
    header .brand { font-size: 14px; }
    button, select { padding: 5px 9px; font-size: 12px; }
    .seg button { font-size: 12px; }

    main { flex-direction: column; }
    .pane { flex: 1 1 0%; }
    .pane.left { border-right: 0; border-bottom: 1px solid var(--border); }
    textarea, #out { min-height: 0; }

    /* 状态条换行：提示独占一行，按钮落到第二行，390px 下也读得全 */
    #status { flex-wrap: wrap; gap: 6px 8px; padding: 6px 10px; }
    #statusText { flex: 1 1 100%; white-space: normal; }
  }

  /* 隐私说明：任何宽度都可见。窄屏放不下时 flex 会把它整体挪到下一行并换行显示，
     绝不 hide、绝不裁切（不用 hide-sm，那会在手机上把说明藏掉）。 */
  .stat.privacy-stat { display: inline-block; white-space: normal; flex: 0 1 auto; min-width: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="brand" href=".." title="返回工具首页">Code<span>Minify</span></a>
    <!-- ★ 压缩 / 美化 是两个动作按钮：点一下直接出结果，
         不再让用户先在下拉里选模式再点运行（那是两次交互） -->
    <button class="primary" id="btnMin">压缩</button>
    <button id="btnPretty">美化</button>
    <span class="sep"></span>
    <button id="btnSample">示例</button>
    <button id="btnUpload">导入文件</button>
    <input type="file" id="file" hidden />
    <button id="btnClear">清空</button>
    <span class="sep"></span>
    <label class="stat">语言
      <select id="lang">
        <option value="auto" selected>自动识别</option>
        <option value="js">JavaScript</option>
        <option value="ts">TypeScript</option>
        <option value="json">JSON</option>
        <option value="html">HTML</option>
        <option value="xml">XML (SVG)</option>
        <option value="css">CSS</option>
        <option value="scss">SCSS (Sass)</option>
        <option value="less">LESS</option>
        <option value="sql">SQL</option>
        <option value="java">Java</option>
        <option value="c">C / C++</option>
        <option value="cs">C#</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
      </select>
    </label>
    <label class="stat">缩进
      <select id="indent">
        <option value="2" selected>2 空格</option>
        <option value="4">4 空格</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <label class="stat"><input type="checkbox" id="keepCmt" /> 保留注释</label>
    <!-- CSS 布局只在样式表语言下出现：这是「格式」选项，不是「操作」，所以仍用分段按钮 -->
    <span class="seg" id="cssLayoutWrap" hidden>
      <button data-layout="multi" class="on">多行缩进</button>
      <button data-layout="one">每规则一行</button>
    </span>
  <span class="sep hide-sm"></span>
  <span class="stat privacy-stat">压缩与美化全部在本地完成，代码不会上传</span>
  </header>

  <main>
    <section class="pane left">
      <div class="pane-head">
        <b>输入</b>
        <span class="ell" id="inInfo">粘贴代码，或导入文件</span>
      </div>
      <textarea id="in" spellcheck="false"
        placeholder="在此粘贴 HTML / CSS / JS / TS / JSON / XML / SQL / Java / C / C++ / C# / Go / Rust…&#10;点顶部「压缩」或「美化」即可，语言可以留在「自动识别」"></textarea>
    </section>

    <section class="pane right">
      <div class="pane-head">
        <b>输出</b>
        <span class="ell" id="outHint">点顶部「压缩」或「美化」生成结果</span>
      </div>
      <pre id="out" tabindex="0" spellcheck="false" data-ph="结果会写在这里"></pre>
    </section>
  </main>

  <div id="status">
    <span id="sizes"></span>
    <span id="statusText">等待输入…</span>
    <button class="mini" id="btnCopy">复制</button>
    <button class="mini" id="btnDownload">下载</button>
    <button class="mini" id="btnUseAsInput" title="把结果放回输入框，方便再处理一次">回填</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const LANGS = {
    js:   { name: "JavaScript", ext: "js" },
    ts:   { name: "TypeScript", ext: "ts" },
    json: { name: "JSON", ext: "json" },
    html: { name: "HTML", ext: "html" },
    xml:  { name: "XML", ext: "xml" },
    css:  { name: "CSS", ext: "css" },
    scss: { name: "SCSS", ext: "scss" },
    less: { name: "LESS", ext: "less" },
    sql:  { name: "SQL", ext: "sql" },
    java: { name: "Java", ext: "java" },
    c:    { name: "C / C++", ext: "c" },
    cs:   { name: "C#", ext: "cs" },
    go:   { name: "Go", ext: "go" },
    rust: { name: "Rust", ext: "rs" }
  };

  /* ==== PURE-CORE-START：以下到 PURE-CORE-END 之间为纯函数（不碰 DOM），
         /tmp 脚本会整段抽取做 node 对拍 ==== */

  /* ============================================================
     JavaScript / TypeScript
     -- 先扫描成 token，再按模式重组。只有扫描阶段需要「懂」语法
        （识别字符串 / 模板 / 正则 / 注释），重组阶段只做空白决策，
        这样绝不会把字面量内容改坏。TypeScript 走同一套词法 ——
        它的类型标注、装饰器、泛型在 token 层面与 JS 无异。
     ============================================================ */
  const KW_REGEX = /^(return|typeof|instanceof|in|of|new|delete|void|do|else|case|yield|await|throw)$/;
  const PUNCTS = ["===", "!==", "**=", ">>>", "<<=", ">>=", "&&=", "||=", "??=", "...",
                  "==", "!=", "<=", ">=", "&&", "||", "??", "?.", "++", "--", "+=", "-=",
                  "*=", "/=", "%=", "&=", "|=", "^=", "**", "<<", ">>", "=>"];

  const isWordChar = ch => /[A-Za-z0-9_$\u00a0-\uffff]/.test(ch);
  const isSpaceChar = ch => ch === " " || ch === "\t" || ch === "\n" || ch === "\r" ||
                            ch === "\f" || ch === "\v" || ch === "\u00a0" || ch === "\ufeff";

  /* ---- 模板字面量整块扫描（必须配平 ${...}）----
     ★ 旧实现「扫到下一个反引号就收」：一旦 ${} 里再嵌一个模板字面量
     （`<ul>${list.map(i => `<li> ${i.name} </li>`)}` 这类真实代码极常见），
     就会在内层模板的「开引号」处提前结束 —— 内层模板内容被当成普通代码折空白，
     实测 `- ${x}` 变 `-${x}`、`<li> ${i.name} </li>` 里的空格被删，直接改内容。
     现在改为：${...} 内的表达式按 JS 词法配平（字符串 / 注释 / 正则 / 嵌套模板
     都跳过），整个模板字面量扫描成一个 token、原样保留。 */
  const EXPR_DIV_AFTER = /[)\]\w$"']/;    /* 这些字符之后的 / 是除号，其余按正则字面量扫 */
  function skipJSStr(src, i) {            /* i 在引号上 → 返回闭合引号之后 */
    const q = src[i];
    let j = i + 1;
    while (j < src.length && src[j] !== q) { if (src[j] === "\\") j++; j++; }
    return Math.min(j + 1, src.length);
  }
  function skipTpl(src, i) {              /* i 在反引号上 → 返回闭合反引号之后 */
    const n = src.length;
    let j = i + 1;
    while (j < n) {
      const c = src[j];
      if (c === "\\") { j += 2; continue; }
      if (c === "`") return j + 1;
      if (c === "$" && src[j + 1] === "{") { j = skipTplExpr(src, j + 2); continue; }
      j++;
    }
    return n;
  }
  function skipTplExpr(src, j) {          /* j 在 ${ 之后 → 返回配平的 } 之后 */
    const n = src.length;
    let depth = 1, last = "";
    while (j < n) {
      const c = src[j];
      if (c === '"' || c === "'") { j = skipJSStr(src, j); last = '"'; continue; }
      if (c === "`") { j = skipTpl(src, j); last = '"'; continue; }
      if (c === "/" && src[j + 1] === "/") { while (j < n && src[j] !== "\n") j++; continue; }
      if (c === "/" && src[j + 1] === "*") { const k = src.indexOf("*/", j + 2); j = k < 0 ? n : k + 2; continue; }
      if (c === "/" && !EXPR_DIV_AFTER.test(last)) {
        let k = j + 1, inClass = false, closed = false;
        while (k < n) {
          const d = src[k];
          if (d === "\\") { k += 2; continue; }
          if (d === "\n") break;
          if (d === "[") inClass = true;
          else if (d === "]") inClass = false;
          else if (d === "/" && !inClass) { closed = true; k++; break; }
          k++;
        }
        if (closed) { while (k < n && /[a-z]/i.test(src[k])) k++; j = k; last = '"'; continue; }
        /* 没闭合 → 当除号，落到下面的通用处理 */
      }
      if (c === "{") depth++;
      else if (c === "}") { depth--; if (!depth) return j + 1; }
      if (!/\s/.test(c)) last = c;
      j++;
    }
    return n;
  }

  function scanJS(src) {
    const T = [];
    const n = src.length;
    let i = 0;

    const prevSig = () => {
      for (let k = T.length - 1; k >= 0; k--) {
        if (T[k].t !== "ws" && T[k].t !== "cmt") return T[k];
      }
      return null;
    };
    /* 此处能否出现正则字面量：由上一个有意义 token 决定 */
    const regexOk = () => {
      const p = prevSig();
      if (!p) return true;
      if (p.t === "word") return KW_REGEX.test(p.v);
      if (p.t === "punct") return !(p.v === ")" || p.v === "]" || p.v === "++" || p.v === "--");
      return false;
    };

    while (i < n) {
      const c = src[i];

      if (isSpaceChar(c)) {
        let j = i; while (j < n && isSpaceChar(src[j])) j++;
        T.push({ t: "ws", v: src.slice(i, j) }); i = j; continue;
      }
      if (c === "/" && src[i + 1] === "/") {
        let j = i; while (j < n && src[j] !== "\n") j++;
        T.push({ t: "cmt", v: src.slice(i, j), line: true }); i = j; continue;
      }
      if (c === "/" && src[i + 1] === "*") {
        let j = src.indexOf("*/", i + 2); j = j < 0 ? n : j + 2;
        T.push({ t: "cmt", v: src.slice(i, j), line: false }); i = j; continue;
      }
      if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === "\\") j++; j++; }
        j = Math.min(j + 1, n);
        T.push({ t: "str", v: src.slice(i, j) }); i = j; continue;
      }
      if (c === "`") {
        const j = skipTpl(src, i);          /* 配平 ${...}，见上面的 skipTpl 注释 */
        T.push({ t: "tpl", v: src.slice(i, j) }); i = j; continue;
      }
      if (c === "/" && regexOk()) {
        let j = i + 1, inClass = false, closed = false;
        while (j < n) {
          const ch = src[j];
          if (ch === "\\") { j += 2; continue; }
          if (ch === "\n") break;
          if (ch === "[") inClass = true;
          else if (ch === "]") inClass = false;
          else if (ch === "/" && !inClass) { closed = true; j++; break; }
          j++;
        }
        if (closed) {
          while (j < n && /[a-z]/i.test(src[j])) j++;   /* flags */
          T.push({ t: "re", v: src.slice(i, j) }); i = j; continue;
        }
        /* 没闭合 → 当除号，落到下面的 punct */
      }
      if (isWordChar(c)) {
        let j = i; while (j < n && isWordChar(src[j])) j++;
        T.push({ t: "word", v: src.slice(i, j) }); i = j; continue;
      }
      let p = null;
      for (const x of PUNCTS) { if (src.startsWith(x, i)) { p = x; break; } }
      if (!p) p = c;
      T.push({ t: "punct", v: p }); i += p.length;
    }
    return T;
  }

  /* 两个 token 直接贴在一起会不会粘连成别的词 / 变成别的语义。
     c = b 之后的下一个有效 token（可选）—— 判断「数字后点号」要用到它。 */
  function needSpace(a, b, c) {
    if (!a) return false;
    if (a.t === "word" && b.t === "word") return true;
    /* 词语/字符串相邻必须留空：`return"s"` 只有少数关键字后面才合法，标识符后跟字符串本来就非法；
       实测踩过：SQL 片段落进 JS 管线时输出 `select"@timestamp"` `order by"x"desc`，非常难看。
       压缩侧也只多 1 字节，安全模式不抠这个。 */
    if (a.t === "word" && b.t === "str") return true;
    if (a.t === "str" && (b.t === "word" || b.t === "str")) return true;
    const ae = a.v.slice(-1), bs = b.v[0];
    if (ae === "+" && bs === "+") return true;
    if (ae === "-" && bs === "-") return true;
    if (ae === "/" && (bs === "/" || bs === "*")) return true;
    if (ae === "<" && bs === "!") return true;   /* `a<!--b`：经典脚本里 <!-- 会变成行注释 */
    if (a.t === "word" && b.t === "re") return true;
    if (a.t === "re" && b.t === "word") return true;
    /* 数字后面的 `.`：`1 .toString()` 删掉空格会变成 `1.toString()`（语法错误）。
       但 `1.5`（点后是数字）与 `1..toString()`（点后还是点）本来就合法，不能补空格。 */
    if (a.t === "word" && /^\d+$/.test(a.v) && bs === "." && c && !/^[.\d]/.test(c.v)) return true;
    return false;
  }

  /* ---- 换行策略：只在「语句必然结束」的位置合并行，其余换行一律保留 ----
     token 级的压缩器没有语法树，没法真正判断 ASI（自动分号插入）。经验规则：
     上一 token 是 ; { } 且下一 token 不以 ( [ ` + - / 开头 → 合并安全；
     其余换行（`return\n1`、`a\n++b`、`const a=1\nconst b=2`）必须保留，否则语义会变。 */
  const MERGE_AFTER = new Set([";", "{", "}"]);
  const ASI_START = /^[([`+\-\/]/;

  function minifyJS(src, keepCmt) {
    /* 先丢掉空白 token，把「前面有没有换行」记到每个 token 上。
       用数组 + 下标遍历（不是 for..of）—— needSpace 需要看下一个有效 token。 */
    const S = [];
    let sawNL = false;
    for (const tk of scanJS(src)) {
      if (tk.t === "ws") { if (tk.v.indexOf("\n") >= 0) sawNL = true; continue; }
      tk.nlBefore = sawNL; sawNL = false;
      S.push(tk);
    }
    let out = "", prev = null;
    const emitNL = () => {
      out = out.replace(/[ \t]+$/, "");
      if (out) out += "\n";
      prev = null;
    };
    for (let k = 0; k < S.length; k++) {
      const tk = S[k];
      const next = S[k + 1] || null;
      if (tk.t === "cmt") {
        if (keepCmt) {
          if (tk.nlBefore) emitNL();
          else if (out && !/\s$/.test(out)) out += " ";
          out += tk.v;
          prev = tk.line ? null : tk;
        } else if (!tk.line && !tk.nlBefore && out && !/\s$/.test(out)) {
          out += " ";                             /* 行内块注释删掉后留一个空格，避免两侧的 token 粘到一起 */
        }
        continue;
      }
      if (tk.nlBefore) {
        const safe = prev && prev.t === "punct" && MERGE_AFTER.has(prev.v) && !ASI_START.test(tk.v);
        if (!safe) emitNL();
      }
      if (prev && needSpace(prev, tk, next)) out += " ";
      out += tk.v;
      prev = tk;
    }
    return out.replace(/[ \t]+$/gm, "").replace(/\n{2,}/g, "\n").replace(/^\s+|\s+$/g, "");
  }

  /* 美化：只在 { } ; 处断行，括号内保持同行（长参数列表不做换行，避免行数爆炸） */
  const ASI_TAIL = new Set([";", ",", ")", "]", ".", "("]);
  const GLUE_NEXT = new Set(["else", "catch", "finally", "while"]);
  /* 这些运算符两侧补空格（一元 + / - 会被多补一个空格，仍是合法 JS，可接受） */
  const SPACED = new Set(["=", "+", "-", "*", "/", "%", "==", "===", "!=", "!==", "<", ">",
    "<=", ">=", "&&", "||", "??", "=>", "+=", "-=", "*=", "/=", "%=", "&", "|", "^", "&=",
    "|=", "^=", "**"]);
  /* ★ : 只在「后面」补空格，前面绝不补 —— {a:1} 要写成 { a: 1 }，
     TS 的可选参数 qty?: string 更不能被拆成 qty ? : string。 */
  const TIGHT_BEFORE = /^[;,)\].:]$/;         /* 这些符号前面不留空格 */
  /* TS 可选标记：? 后面紧跟 : , ) ; } = 时是「可选」，不是三元运算符 */
  const OPT_NEXT = new Set([":", ",", ")", ";", "}", "="]);
  const isOptMark = (tk, next) => tk.t === "punct" && tk.v === "?" && !!next && OPT_NEXT.has(next.v);
  /* 逗号后面也补空格（`f(a, b)` 比 `f(a,b)` 好读）；紧跟收尾符时不补（`f(a, )` 很丑） */
  const CLOSER = new Set([")", "]", "}", ";"]);
  function spaceAfter(tk, next) {
    if (tk.t !== "punct") return false;
    if (tk.v === ":") return true;
    if (tk.v === "?") return !isOptMark(tk, next);
    if (tk.v === ",") return !(next && CLOSER.has(next.v));
    return false;
  }

  /* ---- 源码里本来就有换行、且换行处是「语句边界」时必须保留 ----
     否则 `return\n1` 会被拼成 `return 1`、`foo()\nbar()` 会被拼成 `foo()bar()`，语义全变。 */
  const VALUE_END = /^(word|str|tpl|re)$/;
  const END_PUNCT = /^(\)|\]|\}|\+\+|--)$/;
  const CONTINUE_START = /^[.?:,)\]}]/;       /* 以这些开头的行是上一行的延续，可以拼回一行 */
  const CONTINUE_WORD = new Set(["of", "in", "instanceof"]);
  function isStmtBreak(a, b) {
    if (!a || !b) return false;
    if (b.t === "word" && GLUE_NEXT.has(b.v)) return a.v !== "}";   /* `} else` 是同一句，其余要断 */
    if (b.t === "word" && CONTINUE_WORD.has(b.v)) return false;
    if (CONTINUE_START.test(b.v)) return false;
    return VALUE_END.test(a.t) || (a.t === "punct" && END_PUNCT.test(a.v));
  }

  /* 这些关键字后面跟 ( 时要留一个空格（`for (` 而不是 `for(`），
     普通标识符后面不留（函数调用 `f(`）。 */
  const KW_PAREN = new Set(["if", "for", "while", "switch", "catch", "with", "return", "typeof",
    "delete", "void", "do", "else", "yield", "await", "in", "of", "new", "instanceof", "case"]);

  function prettyJS(src, unit) {
    const T = scanJS(src);
    /* 记下「源码里这个 token 前面有没有换行」—— 断行决策要用 */
    const sig = [];
    let sawNL = false;
    for (const t of T) {
      if (t.t === "ws") { if (t.v.indexOf("\n") >= 0) sawNL = true; continue; }
      t.nl = sawNL; sawNL = false;
      sig.push(t);
    }
    /* ★ 输出用「分段数组 + 末字符缓存」，绝不拿整串做 replace / endsWith。
       446KB 的 JS 有近 20 万个 token，旧实现每写一行都 `out.replace(/[ \t]+$/, "")`
       全量扫一遍（`nl()` 与 TIGHT_BEFORE 分支各一处）→ O(n²)，实测美化要 31 秒。
       现在末尾清理只回看最后一段、均摊 O(1)，末字符也从缓存读，整段仍是线性。 */
    const parts = [];
    let last = "";                                  /* parts 里最后一个非空段的末字符 */
    const put = (s) => { if (s) { parts.push(s); last = s[s.length - 1]; } };
    /* 去掉末尾的空格 / Tab（只回看最后几段；整段都是空白的段直接丢掉） */
    const trimEnd = () => {
      while (parts.length) {
        const i = parts.length - 1, s = parts[i];
        const t = s.replace(/[ \t]+$/, "");
        if (t) { if (t !== s) parts[i] = t; last = t[t.length - 1]; return; }
        parts.pop();
      }
      last = "";
    };
    let depth = 0, paren = 0, prevOpt = false;
    /* 三元运算符计数，按花括号层级分开 —— 否则 `a ? {x:1} : 2` 里的对象冒号会被当三元冒号 */
    const ternStack = [0];
    /* 幂等：out 已经以换行结尾时只补缩进，不再叠加换行（否则会多出空行） */
    const nl = () => {
      trimEnd();
      if (!parts.length) return;
      if (last === "\n") { put(unit.repeat(Math.max(0, depth))); return; }
      put("\n" + unit.repeat(Math.max(0, depth)));
    };
    let prev = null;

    for (let k = 0; k < sig.length; k++) {
      const tk = sig[k];
      const next = sig[k + 1] || null;

      if (tk.t === "cmt") {
        if (tk.line) { if (parts.length && !/\s/.test(last)) put(" "); put(tk.v); nl(); }
        else { nl(); put(tk.v); nl(); }        /* 块注释独占一行 */
        continue;
      }

      /* ★ 源码里本来就在这里的换行，遇到「语句边界」必须保留 */
      if (tk.nl && isStmtBreak(prev, tk)) nl();

      const optMark = isOptMark(tk, next);
      const ternary = tk.v === "?" && !optMark;
      const ternaryColon = tk.v === ":" && ternStack[ternStack.length - 1] > 0;
      const spaced = (tk.t === "punct" && SPACED.has(tk.v)) || ternary || ternaryColon;
      /* for(;;) 头里的分号后面补一个空格（for (let i = 0; i < n; i++)） */
      const after = spaceAfter(tk, next) || (tk.v === ";" && paren > 0);
      /* 语句块的左花括号前面补一个空格（`) {`、`else {`、`try {`） */
      const braceGap = tk.v === "{" && !!prev && (prev.t === "word" || prev.v === ")" || prev.v === "]");
      /* 关键字后面跟 ( 时补一个空格（`for (`），函数调用不留（`f(`） */
      const parenGap = tk.v === "(" && !!prev && prev.t === "word" && KW_PAREN.has(prev.v);
      /* `)` / `]` 后面跟标识符是两条语句（`if (x) continue;`），必须留一个空格 */
      const wordGap = tk.t === "word" && !!prev && (prev.v === ")" || prev.v === "]");
      /* `} else` / `} catch` / `} finally` / `} while`（do-while）：} 后面跟续接关键字
         必须有空格 —— 漏了会输出 `}else`（能跑但很难看，实测踩过） */
      const glueGap = tk.t === "word" && !!prev && prev.v === "}" && GLUE_NEXT.has(tk.v);
      if (tk.v === "}") { depth--; nl(); }
      if (TIGHT_BEFORE.test(tk.v) && !ternaryColon) trimEnd();

      if (parts.length && last !== "(" && !/\s/.test(last) &&
          (spaced || braceGap || parenGap || wordGap || glueGap || (prev && needSpace(prev, tk, next)))) put(" ");
      put(tk.v);
      if (spaced || after) put(" ");

      if (ternary) ternStack[ternStack.length - 1]++;
      else if (ternaryColon) ternStack[ternStack.length - 1]--;

      if (tk.v === "(" || tk.v === "[") paren++;
      if (tk.v === ")" || tk.v === "]") paren = Math.max(0, paren - 1);
      if (tk.v === "{") { ternStack.push(0); depth++; nl(); }
      else if (tk.v === "}") {
        if (ternStack.length > 1) ternStack.pop();
        if (next && !ASI_TAIL.has(next.v) && !(next.t === "word" && GLUE_NEXT.has(next.v))) nl();
      } else if (tk.v === ";") {
        if (!paren) nl();                        /* for(;;) 里的分号不能断行 */
      }
      prevOpt = optMark;
      prev = tk;
    }
    return parts.join("").replace(/[ \t]+$/gm, "").replace(/\n{3,}/g, "\n\n").replace(/^\s+|\s+$/g, "") + "\n";
  }

  /* ============================================================
     JSON
     -- 直接交给 JSON.parse：手写正则解析 JSON 一定会漏 case。
        解析失败时做一次「宽容重试」：去掉行注释与块注释、去掉尾随逗号
        （JSONC / 配置文件里最常见的两种写法），并如实告诉用户动过手脚。
     ============================================================ */
  function stripJsonLoose(src) {
    let out = "", i = 0, inStr = false;
    const n = src.length;
    while (i < n) {
      const c = src[i];
      if (inStr) {
        if (c === "\\") { out += src.slice(i, i + 2); i += 2; continue; }
        if (c === '"') inStr = false;
        out += c; i++; continue;
      }
      if (c === '"') { inStr = true; out += c; i++; continue; }
      if (c === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") i++; continue; }
      if (c === "/" && src[i + 1] === "*") { const j = src.indexOf("*/", i + 2); i = j < 0 ? n : j + 2; continue; }
      /* 尾随逗号：向前看（跳过空白与注释），下一个实义字符是 ] 或 } 才删。
         ★ 必须在这里按「非字符串状态」判断 —— 旧实现是全文正则 `,(\s*[\]}])`，
         会把字符串内容里的 `", ]"` 也改掉（实测 `"x, ]"` 变 `"x ]"`，数据被改）。 */
      if (c === ",") {
        let j = i + 1;
        while (j < n) {
          const d = src[j];
          if (d === " " || d === "\t" || d === "\n" || d === "\r") { j++; continue; }
          if (d === "/" && src[j + 1] === "/") { while (j < n && src[j] !== "\n") j++; continue; }
          if (d === "/" && src[j + 1] === "*") { const k = src.indexOf("*/", j + 2); j = k < 0 ? n : k + 2; continue; }
          break;
        }
        if (j < n && (src[j] === "]" || src[j] === "}")) { i++; continue; }   /* 删掉这个逗号 */
      }
      out += c; i++;
    }
    return out;
  }

  function jsonProcess(src, mode, unit) {
    let v, loose = false;
    try { v = JSON.parse(src); }
    catch (e1) {
      try { v = JSON.parse(stripJsonLoose(src)); loose = true; }
      catch (e2) {
        const msg = String(e1 && e1.message || e1).replace(/^JSON\.parse:\s*/, "");
        throw new Error("JSON 解析失败：" + msg);
      }
    }
    return {
      text: mode === "min" ? JSON.stringify(v) : JSON.stringify(v, null, unit),
      note: loose ? "输入不是严格 JSON，已按 JSONC 处理（去掉注释与尾随逗号）后重新序列化。" : ""
    };
  }

  /* ============================================================
     CSS / SCSS / LESS
     -- 三种输出（压缩 / 多行缩进 / 每规则一行）走同一个花括号解析器。
        不用正则硬替换的原因：正则既搞不定嵌套 @media 的层级，
        也一定会把 url(data:image/png;base64,…) 里的分号当成声明分隔符。
     ============================================================ */
  const PH = "\u0000";

  /* 保护字符串、注释、url(...)：换成占位符，最后原样还原。
     keepCmt=false 时注释直接丢掉 —— 不留占位符，免得删完留下一串多余空格。 */
  function protectCss(src, lineComment, keepCmt) {
    const store = [];
    let out = "", i = 0;
    const n = src.length;
    const push = (v, kind) => { store.push({ v: v, kind: kind }); out += PH + (store.length - 1) + PH; };
    while (i < n) {
      const c = src[i];
      if (c === "/" && src[i + 1] === "*") {
        let j = src.indexOf("*/", i + 2); j = j < 0 ? n : j + 2;
        if (keepCmt) push(src.slice(i, j), "cmt");
        i = j; continue;
      }
      /* SCSS / LESS 的 // 行注释。★ 前面紧跟冒号的一律不算注释 ——
         http:// 与 @import 里的协议相对地址不能被吃掉。 */
      if (lineComment && c === "/" && src[i + 1] === "/" && src[i - 1] !== ":") {
        let j = i; while (j < n && src[j] !== "\n") j++;
        if (keepCmt) push(src.slice(i, j), "cmt");
        i = j; continue;
      }
      /* SCSS 插值 #{…}：里面可能有 { } : ; —— 整块保护，
         否则 `#{$level * 4}` 会被花括号解析器拆成「声明 + 块」（实测拆坏过） */
      if (lineComment && c === "#" && src[i + 1] === "{") {
        let j = i + 2, depth = 1;
        while (j < n && depth > 0) {
          const ch = src[j];
          if (ch === '"' || ch === "'") {
            let k = j + 1;
            while (k < n && src[k] !== ch) { if (src[k] === "\\") k++; k++; }
            j = k + 1; continue;
          }
          if (ch === "{") depth++;
          else if (ch === "}") depth--;
          j++;
        }
        push(src.slice(i, j), "str"); i = j; continue;
      }
      if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === "\\") j++; j++; }
        j = Math.min(j + 1, n);
        push(src.slice(i, j), "str"); i = j; continue;
      }
      /* url(...) 里可能有分号、逗号、括号、斜杠，必须整块保护 */
      if ((c === "u" || c === "U") && /^url\(/i.test(src.slice(i, i + 4))) {
        let j = i + 4, depth = 1;
        while (j < n && depth > 0) {
          const ch = src[j];
          if (ch === '"' || ch === "'") {
            let k = j + 1;
            while (k < n && src[k] !== ch) { if (src[k] === "\\") k++; k++; }
            j = k + 1; continue;
          }
          if (ch === "(") depth++;
          else if (ch === ")") depth--;
          j++;
        }
        push(src.slice(i, j), "url"); i = j; continue;
      }
      out += c; i++;
    }
    return { text: out, store: store };
  }

  const restoreCss = (s, store) => s.replace(new RegExp(PH + "(\\d+)" + PH, "g"),
    (m, k) => store[+k].v);

  /* 声明体归一：折叠空白、第一个冒号两侧不留空格、逗号与 > ~ 两侧不留空格。
     ★ 刻意不动 + 与 - 两侧的空白 —— calc(100% - 2px + 1px) 少了空格就非法了。
     pretty=true 时冒号后面补一个空格，输出更像手写的 CSS。 */
  function normDecl(s, pretty) {
    let t = s.replace(/\s+/g, " ");
    t = t.replace(/\s*:\s*/, pretty ? ": " : ":");
    t = t.replace(/\s*,\s*/g, pretty ? ", " : ",");
    t = t.replace(/\s*([>~])\s*/g, "$1");
    return t.trim();
  }
  /* 前奏（选择器 / @media 条件）归一。
     ★ 只压缩「圆括号内」的冒号空白（@media (max-width: 640px)）——
       选择器里的 `div :first-child` 是后代选择器，删掉空格就变成 `div:first-child`，语义不同。 */
  function normPrelude(s, pretty) {
    let t = s.replace(/\s+/g, " ").trim();
    /* ★ calc()/min()/max()/clamp() 里的 `+`/`-` 两侧空格是 CSS 语法要求，先整块摘出来，
       否则下面的组合符归一化会把 `+` 的空格删掉 —— @media (min-width: calc(100% + 2px))
       会变成非法的 calc(100%+2px)。前奏串很短，逐次 indexOf 扫描足够。 */
    const math = [];
    let out = "", i = 0;
    while (i < t.length) {
      const m = /\b(?:calc|min|max|clamp)\(/i.exec(t.slice(i));
      if (!m) { out += t.slice(i); break; }
      out += t.slice(i, i + m.index);
      let j = i + m.index + m[0].length, depth = 1;   // 配平括号，取整个函数调用
      while (j < t.length && depth > 0) { const c = t[j++]; if (c === "(") depth++; else if (c === ")") depth--; }
      math.push(t.slice(i + m.index, j));
      out += "\u0002" + (math.length - 1) + "\u0002";
      i = j;
    }
    t = out;
    t = t.replace(/\(([^()]*)\)/g, (m, inner) =>
      "(" + inner.replace(/\s*:\s*/g, pretty ? ": " : ":") + ")");
    t = t.replace(/\s*,\s*/g, pretty ? ", " : ",");
    t = t.replace(/\s*([>~+])\s*/g, pretty ? " $1 " : "$1");
    t = t.replace(/\u0002(\d+)\u0002/g, (m, k) => math[+k]);
    return t;
  }

  const PH_ONE = new RegExp("^" + PH + "\\d+" + PH + "$");

  /* 花括号解析：返回 {type:"decl"|"cmt"|"raw"|"block"} 的节点树 */
  function parseCss(text, pretty) {
    let i = 0;
    const n = text.length;
    const phRe = new RegExp("^" + PH + "(\\d+)" + PH);

    function list() {
      const items = [];
      let buf = "";
      const flush = () => {
        const t = buf.replace(/[ \t\r\n]+/g, " ").trim();
        buf = "";
        if (!t) return;
        if (PH_ONE.test(t)) items.push({ type: "cmt", text: t });
        else items.push({ type: "decl", text: normDecl(t, pretty) });
      };
      while (i < n) {
        const m = text.slice(i).match(phRe);
        if (m) {
          if (!buf.trim()) items.push({ type: "raw", text: m[0] });
          else buf += m[0];
          i += m[0].length;
          continue;
        }
        const c = text[i];
        if (c === "{") {
          i++;
          const children = list();
          items.push({ type: "block", prelude: normPrelude(buf, pretty), children: children });
          buf = "";
          continue;
        }
        if (c === "}") { i++; flush(); return items; }
        if (c === ";") { i++; flush(); continue; }
        buf += c; i++;
      }
      flush();
      return items;
    }
    return list();
  }

  /* ① 压缩：全部挤在一行 */
  function renderCssMin(nodes, keepCmt, store) {
    const part = list => list.map(nd => {
      if (nd.type === "decl") return nd.text + ";";
      if (nd.type === "raw" || nd.type === "cmt") return keepCmt ? nd.text : "";
      const body = part(nd.children);
      return (nd.prelude ? nd.prelude + "{" : "{") + body + "}";
    }).join("");
    let out = part(nodes);
    out = out.replace(/;}/g, "}").replace(/\{;/g, "{");
    return restoreCss(out, store).replace(/^\s+|\s+$/g, "");
  }

  /* ② 多行缩进：选择器一行，每条声明一行（常规写法） */
  function renderCssMulti(nodes, unit, keepCmt, store) {
    const out = [];
    const walk = (list, depth) => {
      const ind = unit.repeat(depth);
      for (const nd of list) {
        if (nd.type === "decl") { out.push(ind + nd.text + ";"); continue; }
        if (nd.type === "raw" || nd.type === "cmt") { if (keepCmt) out.push(ind + nd.text); continue; }
        out.push(ind + nd.prelude + " {");
        const inner = unit.repeat(depth + 1);
        for (const c of nd.children) {
          if (c.type === "decl") out.push(inner + c.text + ";");
          else if (c.type === "raw" || c.type === "cmt") { if (keepCmt) out.push(inner + c.text); }
          else walk([c], depth + 1);
        }
        out.push(ind + "}");
      }
    };
    walk(nodes, 0);
    return restoreCss(out.join("\n"), store).replace(/^\s+|\s+$/g, "") + "\n";
  }

  /* ③ 每规则一行：一个选择器的全部声明挤在同一行，规则之间换行 */
  function renderCssOneLine(nodes, unit, keepCmt, store) {
    const out = [];
    const walk = (list, depth) => {
      const ind = unit.repeat(depth);
      for (const nd of list) {
        if (nd.type === "decl") { out.push(ind + nd.text + ";"); continue; }
        if (nd.type === "raw" || nd.type === "cmt") { if (keepCmt) out.push(ind + nd.text); continue; }
        const hasBlock = nd.children.some(c => c.type === "block");
        if (!hasBlock) {
          const body = nd.children
            .map(c => (c.type === "decl" ? c.text + ";" : (keepCmt ? c.text : "")))
            .filter(Boolean).join(" ");
          out.push(ind + nd.prelude + (body ? " { " + body + " }" : " {}"));
        } else {
          out.push(ind + nd.prelude + " {");
          walk(nd.children, depth + 1);
          out.push(ind + "}");
        }
      }
    };
    walk(nodes, 0);
    return restoreCss(out.join("\n"), store).replace(/^\s+|\s+$/g, "") + "\n";
  }

  let cssLayout = "multi";      /* multi | one */

  function cssProcess(src, mode, keep, unit, lineComment) {
    const pretty = mode !== "min";
    const p = protectCss(src, lineComment, keep);
    const nodes = parseCss(p.text, pretty);
    if (!pretty) return { text: renderCssMin(nodes, keep, p.store) };
    const text = cssLayout === "one"
      ? renderCssOneLine(nodes, unit, keep, p.store)
      : renderCssMulti(nodes, unit, keep, p.store);
    return { text: text };
  }

  /* 供 HTML 里的内联 <style> 复用：按默认布局压缩 */
  function minifyCSS(src, keepCmt) {
    return cssProcess(src, "min", keepCmt, "  ", false).text;
  }

  /* ============================================================
     HTML / XML
     -- <pre> / <textarea> 内容必须原样保留（空白有语义）；
        HTML 的 <script> / <style> 交给对应压缩器，XML 里一律原样保留
        （SVG 内联脚本里的 // 不该被当成 CSS 注释）；
        条件注释（<!--[if …]>）不能删。
     ============================================================ */
  /* 行内级 / 被替换元素的完整清单：这些标签两侧的空白有语义。
     ★ canvas / iframe / video / audio / embed / svg 默认是 inline 级，
     不在表里的话 `</canvas> <canvas>` 之间的空格会被删掉（视觉上两图贴住）。 */
  const INLINE = new Set(("a,abbr,acronym,audio,b,bdi,bdo,big,br,button,canvas,cite,code,data,del,dfn,em,embed,i,iframe,img," +
    "input,ins,kbd,label,map,mark,meter,nobr,object,output,picture,q,ruby,s,samp,select,small,span," +
    "strike,strong,sub,sup,svg,time,tt,u,var,video,wbr").split(","));

  function protectMarkup(src, store, keepCmt, rawInner) {
    let out = "", i = 0;
    const n = src.length;
    const tagRe = /^<(script|style|pre|textarea)\b[^>]*>/i;
    let inTag = false;                       /* 在标签内部时，引号里的属性值必须整块保护 ——
                                                属性值里的空白有语义（value="a   b"），
                                                折叠空白不能碰它；顺带挡住属性值里的 `>` `<` */
    const push = v => { store.push({ v: v }); return PH + (store.length - 1) + PH; };
    while (i < n) {
      const m = src.slice(i).match(tagRe);
      if (m) {
        const name = m[1].toLowerCase();
        const openTag = m[0];
        const openEnd = i + openTag.length;
        const ci = src.toLowerCase().indexOf("</" + name, openEnd);
        const inner = ci < 0 ? src.slice(openEnd) : src.slice(openEnd, ci);
        const closeEnd = ci < 0 ? n : Math.min(n, src.indexOf(">", ci) + 1 || n);
        const closeStr = ci < 0 ? "" : src.slice(ci, closeEnd);
        /* ★ pre / textarea / XML 里的一切 raw 标签：内容原样保留 */
        let body = inner;
        if (name === "script" && !rawInner) body = minifyJS(inner, keepCmt);
        else if (name === "style" && !rawInner) body = minifyCSS(inner, keepCmt);
        store.push({ v: openTag + body + closeStr });
        out += PH + (store.length - 1) + PH;
        i = closeEnd;                       /* ★ 继续扫后面的内容，不能把剩余全文当 tail 吞掉 */
        inTag = false;
        continue;
      }
      /* ★ CDATA 整块原样保护：里面是代码/标记，空白有语义，
         XML/HTML 压缩与美化都绝不能改写（否则 `a >\n < b` 会被折掉或插换行）。 */
      if (src.startsWith("<![CDATA[", i)) {
        const j = src.indexOf("]]>", i + 9);
        const end = j < 0 ? n : j + 3;
        out += push(src.slice(i, end));
        i = end; continue;
      }
      if (src.startsWith("<!--", i)) {
        const j = src.indexOf("-->", i + 4);
        const end = j < 0 ? n : j + 3;
        const v = src.slice(i, end);
        /* 条件注释（<!--[if …]>）是给旧 IE 的指令，不能删 */
        if (/^<!--\[if/i.test(v)) out += v;
        /* ★ 不要注释时直接丢掉，不留占位符 —— 否则删完会留下一串多余空白 */
        else if (keepCmt) out += push(v);
        i = end; continue;
      }
      const c = src[i];
      if (c === "<") {
        /* 只有 `<` 后面紧跟 字母 / `/` / `!` / `?` 才当作标签起点；
           `5 < 3`、`a <b` 这类比较运算不进入「标签内」状态 */
        if (/[A-Za-z\/!?]/.test(src[i + 1] || "")) inTag = true;
        out += c; i++; continue;
      }
      if (c === ">") { inTag = false; out += c; i++; continue; }
      if (inTag && (c === '"' || c === "'")) {
        /* HTML 属性值不支持反斜杠转义，扫到下一个同名引号即结束 */
        let j = i + 1;
        while (j < n && src[j] !== c) j++;
        j = Math.min(j + 1, n);
        out += push(src.slice(i, j));
        i = j; continue;
      }
      out += c; i++;
    }
    return out;
  }

  function minifyHTML(src, keepCmt) {
    const store = [];
    let s = protectMarkup(src, store, keepCmt, false);
    s = s.replace(/[ \t\r\n\f]+/g, " ");
    /* 标签之间的空白：两侧都是块级元素才删，否则留一个空格（inline 之间空格有语义）。
       ★ 绝不能对每个匹配做整串 slice（`s.slice(0, off)` / `s.slice(off+m.length)`）——
         那会让这段变成 O(n²)（实测 ~870KB HTML 要 44 秒）。只切「上一个标签」这一小段，
         后一标签名只看 `<` 之后 64 字符的窗口。
       ★ after 必须从「匹配末尾的那个 `<`」之后切起 —— 用 off+1 会切到空白上，
         导致下一个标签名永远匹配不到。 */
    s = s.replace(/\s+(<)/g, (m, lt, off, str) => {
      const ltPos = off + m.length - 1;              // 匹配末尾那个 `<` 的位置
      const p = str.lastIndexOf("<", off - 1);       // 前一个 `<`（只回退到最近标签，不复制整串）
      let bName = "";
      if (p >= 0) {
        const seg = str.slice(p, off);
        /* ★ 关闭标签的匹配必须包含结尾的 `>`：旧写法 `<\/([a-z0-9:-]+)\s*$` 永远
           匹配不上（`>` 卡在那里），于是「</div> <div> 之间的空白」从来没删过。 */
        const bm = seg.match(/^<\/([a-z0-9:-]+)\s*>\s*$/) || seg.match(/^<([a-z0-9:-]+)[^>]*>\s*$/);
        if (bm) bName = bm[1].toLowerCase();
      }
      const am = str.slice(ltPos + 1, ltPos + 64).match(/^\/?([a-z0-9:-]+)/i);
      const aName = am ? am[1].toLowerCase() : "";
      if (INLINE.has(bName) || INLINE.has(aName)) return " <";
      /* 占位符 = <pre>/<script>/<style> 这类原样保留的块，按块级处理 */
      const bPH = str.charAt(off - 1) === PH;
      const aPH = str.charAt(ltPos + 1) === PH;
      if ((!bName && !bPH) || (!aName && !aPH)) return " <";
      return "<";
    });
    s = s.replace(/^\s+|\s+$/g, "");
    return restore(s, store, false);
  }

  /* void 元素（没有闭合标签）：美化时绝不能让它们加深缩进层级，
     否则 `<hr>` 之后整个文档的缩进全部漂移（实测 `<div><hr><p>` → p 缩进多一层）。 */
  const VOID = new Set("area,base,br,col,embed,hr,img,input,link,meta,param,source,track,wbr".split(","));

  function prettyHTML(src, unit) {
    const store = [];
    let s = protectMarkup(src, store, true, false);
    /* ★ 只用「本来就有空白」的位置断行（\s+ 而不是 \s*）：
       用 \s* 会给 <b>a</b><b>b</b> 这种紧贴的 inline 标签插进换行，
       等于凭空多出一个空格，渲染结果就变了。 */
    s = s.replace(/>\s+</g, ">\n<");
    s = s.replace(/[ \t]+/g, " ");
    let depth = 0, out = "";
    for (const raw of s.split("\n")) {
      const t = raw.trim();
      if (!t) continue;
      const cm = t.match(/^<\/([a-z0-9:-]+)/i);
      const isClose = !!cm;
      const closeInline = isClose && INLINE.has(cm[1].toLowerCase());
      if (isClose && !closeInline) depth = Math.max(0, depth - 1);
      out += unit.repeat(depth) + t + "\n";
      const om = t.match(/^<([a-z0-9:-]+)/i);
      const name = om ? om[1].toLowerCase() : "";
      const selfClose = /\/>$/.test(t);
      const closesSameLine = name ? new RegExp("</" + name + "\\s*>$", "i").test(t) : false;
      const isSpecial = /^<[!?%]/.test(t);
      if (!isClose && om && !selfClose && !closesSameLine && !INLINE.has(name) && !VOID.has(name) && !isSpecial) depth++;
    }
    return restore(out.trim(), store) + "\n";
  }

  /* XML：只做「去注释 + 去行首缩进 + 去空行 + 折叠跨行标签间空白」。
     ★ 不做 HTML 那种「标签之间空白一律删掉」—— XML 的混排内容
       （<p>文字<b>x</b></p>）里空白有语义，删了就改内容。
       跨行空白（>\n  <）几乎必然是排版，删掉是安全的，也是通行做法。 */
  /* ★ `>\s*\n\s*<` 折叠必须避开 CDATA —— 还原之后再过这一遍时会踩到里面的 `>\n<`，
     把它压成 `><`（实测）。先整块保护 CDATA，替换完再放回。 */
  function collapseTagNL(s) {
    const cd = [];
    s = s.replace(/<!\[CDATA\[[\s\S]*?\]\]>/g, m => { cd.push(m); return "\u0003" + (cd.length - 1) + "\u0003"; });
    s = s.replace(/>\s*\n\s*</g, "><");
    return cd.length ? s.replace(/\u0003(\d+)\u0003/g, (m, k) => cd[+k]) : s;
  }

  function minifyXML(src, keepCmt) {
    const store = [];
    let s = protectMarkup(src, store, keepCmt, true);
    s = collapseTagNL(s);
    s = s.replace(/^[ \t]+/gm, "").replace(/[ \t]+$/gm, "");
    s = s.replace(/\n{2,}/g, "\n");
    s = s.replace(/^\s+|\s+$/g, "");
    /* 注释被整块删掉后可能空出一行，还原之后再过一遍 */
    return collapseTagNL(restore(s, store, false))
      .replace(/\n{2,}/g, "\n").replace(/^\s+|\s+$/g, "");
  }

  function prettyXML(src, unit) {
    const store = [];
    let s = protectMarkup(src, store, true, true);
    /* ★ 这里用 \s* 而不是 \s+：单行 XML（<a><b/></a>）本来一个空白都没有，
       用 \s+ 的话等于完全不排版，「美化」就没意义了。 */
    s = s.replace(/>\s*</g, ">\n<");
    s = s.replace(/[ \t]+/g, " ");
    let depth = 0, out = "";
    for (const raw of s.split("\n")) {
      const t = raw.trim();
      if (!t) continue;
      const cm = t.match(/^<\/([A-Za-z_][\w:.-]*)/);
      if (cm) depth = Math.max(0, depth - 1);
      out += unit.repeat(depth) + t + "\n";
      const om = t.match(/^<([A-Za-z_][\w:.-]*)/);
      const selfClose = /\/>$/.test(t);
      const closesSameLine = om ? new RegExp("</" + om[1].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*>$").test(t) : false;
      const isSpecial = /^<[!?%]/.test(t);
      if (om && !selfClose && !closesSameLine && !isSpecial && !cm) depth++;
    }
    return restore(out.trim(), store) + "\n";
  }

  /* keepCmt 的取舍已经在上面的 protect* 里做完了，这里只管还原 */
  const restore = (s, store) => s.replace(new RegExp(PH + "(\\d+)" + PH, "g"),
    (m, k) => store[+k].v);

  /* ============================================================
     SQL
     -- 先扫成 token（字符串 / 引号标识符 / 美元引用 / 嵌套块注释），再重组。
        压缩 = 去注释 + 空白折叠成单行（SQL 无 ASI，换行无语法意义；
        字符串与美元引用是整块 token，折叠不会碰它们的内容）。
        美化 = 子句级断行（SELECT / FROM / WHERE … 各占一行，AND / OR / ON 缩进一级）
        + 结构关键字统一大写（行业惯例；引号标识符与字符串是 str token，一字不动）。
     ============================================================ */
  const SQL_CLAUSE = new Set(["select", "from", "where", "group", "order", "having", "limit",
    "offset", "union", "except", "intersect", "values", "set", "insert", "update", "delete",
    "create", "alter", "drop", "truncate", "explain", "with", "returning"]);
  const SQL_JOIN = new Set(["join", "left", "right", "full", "inner", "cross", "outer"]);
  const SQL_BOOL = new Set(["and", "or", "on"]);
  /* 这些词后面紧跟 ( 时留一个空格（`in (1,2)`、`values (…)`），其余按函数调用贴紧（count(*)） */
  const SQL_PAREN_SPACE = new Set(["in", "exists", "not", "and", "or", "values", "on", "when",
    "then", "else", "like", "between", "returning", "using", "from", "join", "as"]);
  /* ★ 美化折行：选择列表平铺超过 SQL_WRAP 列宽时，SELECT 后与每个顶层逗号后断行。
     80 是各 SQL 格式化器的常用默认宽度；只影响美化，压缩不动。 */
  const SQL_WRAP = 80;
  /* 选择列表的结束词：顶层遇到它们就停（后面属于下一个子句/结构） */
  const SQL_LIST_END = new Set(["from", "where", "group", "order", "having", "limit", "offset",
    "union", "except", "intersect", "returning", "into", "window", "fetch", "for"]);
  /* ★ 美化时统一大写的「结构关键字」——压缩不动大小写，只有美化动。
     不收函数名（count/max 保持原样）；引号里的标识符/字符串是 str token，天然不受影响。
     未加引号的标识符大小写在不敏感数据库里等价（PG 会折叠到小写），把 `BY` 这类
     极少数与列重名的关键字大写，语义不变。 */
  const SQL_UP = new Set(["select", "from", "where", "group", "order", "by", "having", "limit",
    "offset", "union", "except", "intersect", "values", "set", "insert", "into", "update",
    "delete", "create", "alter", "drop", "truncate", "explain", "with", "returning",
    "join", "left", "right", "full", "inner", "cross", "outer", "on", "and", "or", "not",
    "as", "asc", "desc", "distinct", "all", "case", "when", "then", "else", "end", "in",
    "is", "null", "like", "ilike", "between", "exists", "over", "partition", "using", "natural"]);

  const SQL_DOLLAR = /\$(?:[A-Za-z_]\w*)?\$/y;
  const SQL_NUM = /(?:0[xX][0-9a-fA-F]+|\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)/y;

  function scanSQL(src) {
    const T = [];
    const n = src.length;
    let i = 0;
    const push = (t, v) => T.push({ t: t, v: v });
    const PUNCT = ["<=", ">=", "<>", "!=", "||", "::", "->", ":=", "=>"];
    while (i < n) {
      const c = src[i];
      if (/\s/.test(c)) {
        let j = i; while (j < n && /\s/.test(src[j])) j++;
        push("ws", src.slice(i, j)); i = j; continue;
      }
      if (c === "-" && src[i + 1] === "-") {
        let j = i; while (j < n && src[j] !== "\n") j++;
        push("cmt", src.slice(i, j)); i = j; continue;
      }
      if (c === "/" && src[i + 1] === "*") {
        let d = 1, j = i + 2;                       /* 标准 SQL / Postgres 的块注释可以嵌套 */
        while (j < n && d > 0) {
          if (src[j] === "/" && src[j + 1] === "*") { d++; j += 2; continue; }
          if (src[j] === "*" && src[j + 1] === "/") { d--; j += 2; continue; }
          j++;
        }
        push("cmt", src.slice(i, j)); i = j; continue;
      }
      if (c === "'" || c === '"' || c === "`") {
        let j = i + 1;
        while (j < n) {
          const d = src[j];
          if (d === "\\") { j += 2; continue; }                 /* MySQL 反斜杠转义 */
          if (d === c) {
            if (src[j + 1] === c) { j += 2; continue; }         /* '' "" `` 双写转义 */
            j++; break;
          }
          j++;
        }
        push("str", src.slice(i, j)); i = j; continue;
      }
      if (c === "$") {
        SQL_DOLLAR.lastIndex = i;
        const m = SQL_DOLLAR.exec(src);                          /* Postgres 美元引用 $tag$…$tag$ */
        if (m) {
          const k = src.indexOf(m[0], i + m[0].length);
          const end = k < 0 ? n : k + m[0].length;
          push("str", src.slice(i, end)); i = end; continue;
        }
      }
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
        SQL_NUM.lastIndex = i;
        const m = SQL_NUM.exec(src);
        push("num", m[0]); i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i; while (j < n && /[\w$]/.test(src[j])) j++;
        push("word", src.slice(i, j)); i = j; continue;
      }
      let p = null;
      for (const x of PUNCT) if (src.startsWith(x, i)) { p = x; break; }
      p = p || c;
      push("punct", p); i += p.length;
    }
    return T;
  }

  /* 两个 token 之间的间距（压缩 / 美化共用；默认单空格，标点按规则收紧） */
  function sqlGap(prev, cur, pretty) {
    if (!prev) return "";
    const a = prev.v, b = cur.v;
    const ae = a[a.length - 1];
    if (a === "(" || a === "." || a === "::" || a === "->") return "";
    if (b === ")" || b === ";" || b === "," || b === "." || b === "::" || b === "->") return "";
    if (a === "," || a === ";") return pretty ? " " : "";
    if (b === "(") {
      if (prev.t === "word" && SQL_PAREN_SPACE.has(a.toLowerCase())) return " ";
      if (prev.t === "word" || ae === ")" || ae === "]") return "";
      return " ";
    }
    return " ";
  }

  /* 找出「选择列表过长」的断行点：返回需要在其后插入换行的 token 下标集合。
     从 SELECT 到下一个顶层子句词（或 ) ;）之间，顶层逗号 + SELECT（有 DISTINCT/ALL
     时改在其后）参与折行；括号内的逗号（coalesce(a, b, c)）不算顶层，不会被拆开。 */
  function sqlWrapBreaks(T) {
    const marks = new Set();
    for (let i = 0; i < T.length; i++) {
      if (T[i].t !== "word" || T[i].v.toLowerCase() !== "select") continue;
      let d = 0, len = T[i].v.length, prev = T[i];
      const commas = [];
      for (let j = i + 1; j < T.length; j++) {
        const u = T[j];
        const w = u.t === "word" ? u.v.toLowerCase() : "";
        if (u.v === "(" || u.v === "[") d++;
        else if (u.v === ")" || u.v === "]") { if (d === 0) break; d--; }
        else if (d === 0 && (u.v === ";" || SQL_LIST_END.has(w))) break;
        if (d === 0 && u.v === ",") commas.push(j);
        len += sqlGap(prev, u, true).length + u.v.length;
        prev = u;
      }
      if (!commas.length || len <= SQL_WRAP) continue;
      let s = i;
      const nxt = T[i + 1];
      if (nxt && nxt.t === "word" && /^(distinct|all)$/i.test(nxt.v)) s = i + 1;
      marks.add(s);
      for (const c of commas) marks.add(c);
    }
    return marks;
  }

  function sqlProcess(src, mode, keep, unit) {
    const T = scanSQL(src).filter(t => t.t !== "ws" && (keep || t.t !== "cmt"));
    if (mode === "min") {
      /* ★ 末字符用变量跟着走，不要 `out.endsWith("\n")` —— 那会让 V8 每次把整串压平，
         10 万个 token 累计扫几十 GB（实测 669KB SQL 压缩 13.4 秒）。 */
      let out = "", prev = null, last = "";
      for (const tk of T) {
        if (tk.t === "cmt") {
          if (out && !/[\s(]/.test(last)) { out += " "; last = " "; }
          out += tk.v; last = tk.v[tk.v.length - 1];
          if (tk.v.slice(0, 2) !== "/*") { out += "\n"; last = "\n"; prev = null; }   /* 行注释后必须断行 */
          continue;
        }
        if (out && last !== "\n") {
          const g = sqlGap(prev, tk, false);
          if (g) { out += g; last = g[g.length - 1]; }
        }
        out += tk.v; last = tk.v[tk.v.length - 1]; prev = tk;
      }
      return { text: out.trim() };
    }
    /* ---- 美化：子句级断行 + 一级缩进 + 长列表折行 ---- */
    const wrapMarks = sqlWrapBreaks(T);        /* SELECT 列表过长的断行点 */
    let out = "", prev = null, paren = 0, lineStart = true, between = false, wrapIndent = false;
    let last = "";                             /* 同压缩：末字符跟着走，避免整串正则 */
    const put = (s) => { if (s) { out += s; last = s[s.length - 1]; } };
    for (let k = 0; k < T.length; k++) {
      const tk = T[k], next = T[k + 1];
      if (tk.t === "cmt") {
        if (tk.v.slice(0, 2) === "/*") {
          if (!lineStart && out && !/\s/.test(last)) put(" ");
          put(tk.v); continue;                            /* 块注释随行 */
        }
        if (!lineStart && out && !/\s/.test(last)) put(" ");
        put(tk.v + "\n"); lineStart = true; prev = null; continue;
      }
      const w = tk.t === "word" ? tk.v.toLowerCase() : "";
      if (w === "between") between = true;
      let brk = 0;
      if (!lineStart) {
        const isJoin = SQL_JOIN.has(w) && !(prev && prev.t === "word" && SQL_JOIN.has(prev.v.toLowerCase()));
        const fnGuard = (w === "left" || w === "right" || w === "cross") && next && next.v === "(";
        if ((SQL_CLAUSE.has(w) || isJoin) && !fnGuard) brk = 1;
        else if (SQL_BOOL.has(w) && !(w === "and" && between)) brk = 2;
      }
      if (w === "and" && between) between = false;           /* `between x and y` 不断行 */
      if (brk) { put("\n"); lineStart = true; }
      if (lineStart) {
        /* 折行缩进只给「列/表达式」；折行点后若恰好是子句词（异常输入），按子句处理 */
        if (wrapIndent && tk.t === "word" && SQL_CLAUSE.has(w)) wrapIndent = false;
        put(unit.repeat(Math.max(0, paren + (brk === 2 || wrapIndent ? 1 : 0))));
        lineStart = false; wrapIndent = false; prev = null;
      } else {
        put(sqlGap(prev, tk, true));
      }
      put((tk.t === "word" && SQL_UP.has(w)) ? tk.v.toUpperCase() : tk.v);
      prev = tk;
      if (tk.v === "(" || tk.v === "[") paren++;
      else if (tk.v === ")" || tk.v === "]") paren = Math.max(0, paren - 1);
      if (tk.v === ";") { put("\n"); lineStart = true; prev = null; }
      else if (wrapMarks.has(k) && k + 1 < T.length) { put("\n"); lineStart = true; wrapIndent = true; }
    }
    return { text: out.trim() + "\n" };
  }

  /* ============================================================
     C 语言族（C / C++ / C# / Go / Java / Rust）
     -- 与 JS 同样的「先扫描 token、再重组」。语言差异全部收进 conf：
        Go 的反引号原始串、C# 的 @"…" 逐字串、Rust 的 r#"…"# 原始串、
        C/C++/C# 的行首 # 预处理行（连同 \ 续行整块保护）。
        压缩 = 删注释 + 去缩进 + 折叠行内空白 + 标点收紧，保留换行；
        美化 = 按花括号重排缩进与断行。两者都只动空白，token 文本一字不改。
        ★ Rust 的 `'a` 生命周期不在严格字符字面量之列，必须按标点处理，
          否则会被误扫描或误拆开（`' a` 不是合法生命周期）。
     ============================================================ */
  const C_CONF = {
    c:    { hash: true, cpp: true },                     /* C / C++：R"()" 原始串 + 行首 # */
    cs:   { hash: true, verbatim: true, tblock: true, autoProp: true },  /* C#：逐字串 / 文本块 / 自动属性 */
    go:   { backtick: true, goStyle: true },             /* Go：反引号原始串 + 切片/复合字面量贴紧 */
    java: { tblock: true },                              /* Java：""" 文本块（15+） */
    rust: { rawRust: true, arrowSpace: true }            /* Rust：r#"…"# + `->` 两侧留空格 */
  };
  /* 这些关键字后面跟 ( 时留一个空格（if (x)），普通标识符是调用，贴紧（f(x)） */
  const C_KW_PAREN = new Set(["if", "for", "while", "switch", "catch", "return", "sizeof", "new",
    "do", "try", "using", "lock", "foreach", "fixed", "checked", "unchecked", "synchronized",
    "assert", "throw", "import"]);
  const C_GLUE = new Set(["else", "catch", "finally", "while"]);
  const C_PRIM = new Set(["int", "char", "short", "long", "float", "double", "bool", "void",
    "unsigned", "signed", "byte", "size_t", "usize", "isize", "str", "string", "object", "var",
    "auto", "decimal", "i8", "i16", "i32", "i64", "i128", "u8", "u16", "u32", "u64", "u128",
    "f32", "f64", "boolean"]);
  const C_PUNCT = ["<<=", ">>=", "...", "->", "::", ":=", "<<", ">>", "<=", ">=", "==", "!=", "&&",
    "||", "++", "--", "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "=>", "??=", "??", "?."];
  /* 字符串字面量的「编码前缀」：这些字母 + 引号必须贴紧（u8"…" / L"…" / b"…"），
     拆开会把前缀变成标识符；其余 word 与字符串之间照常留空格（import "fmt" / return "s"） */
  const C_STR_PREFIX = new Set(["L", "u", "U", "u8", "R", "LR", "uR", "UR", "u8R",
    "b", "c", "r", "br", "rb", "f", "F", "B"]);

  const C_RAW_R = /(?:br|rb|r)(#*)"/y;
  const C_RAW_CPP = /(?:u8|u|U|L)?R"([^ ()\\\t\r\n]{0,16})\(/y;
  const C_VERB = /(?:\$?@|\@\$?)"/y;
  const C_CHAR = /'(?:\\u[0-9a-fA-F]{4}|\\x[0-9a-fA-F]{1,2}|\\.|[^'\\\n]){1,3}'/y;
  const C_CHAR_RUST = /'(?:\\u\{[0-9a-fA-F]{1,6}\}|\\x[0-9a-fA-F]{2}|\\[nrt0'"\\]|[^'\\\n])'/y;
  const C_NUM = /(?:0[xX][0-9a-fA-F_]+(?:\.[0-9a-fA-F_]*)?(?:[pP][+-]?\d+)?|0[bB][01_]+|\d[\d_']*(?:\.[\d_']*)?(?:[eE][+-]?\d+)?[fFlLuU]*)/y;

  function scanC(src, conf) {
    conf = conf || {};
    const T = [];
    const n = src.length;
    let i = 0, wsOnly = true;
    const push = (t, v) => T.push({ t: t, v: v });

    /* 字面量扫描：返回闭合之后的下标；不是字面量返回 -1。
       ★ 全程 sticky 正则（lastIndex 定位），不用 src.slice(i) —— 后者在大文件上是 O(n²)。 */
    const scanLit = at => {
      const c = src[at];
      if (conf.backtick && c === "`") {
        const j = src.indexOf("`", at + 1);
        return j < 0 ? n : j + 1;
      }
      if (conf.rawRust) {
        C_RAW_R.lastIndex = at;
        const m = C_RAW_R.exec(src);
        if (m) {
          const close = '"' + m[1];
          const j = src.indexOf(close, at + m[0].length);
          return j < 0 ? n : j + close.length;
        }
      }
      if (conf.cpp) {
        C_RAW_CPP.lastIndex = at;
        const m = C_RAW_CPP.exec(src);
        if (m) {
          const close = ")" + m[1] + '"';
          const j = src.indexOf(close, at + m[0].length);
          return j < 0 ? n : j + close.length;
        }
      }
      if (conf.verbatim) {
        C_VERB.lastIndex = at;
        const m = C_VERB.exec(src);
        if (m) {
          let j = at + m[0].length;
          while (j < n) {
            if (src[j] === '"') {
              if (src[j + 1] === '"') { j += 2; continue; }     /* "" = 一个引号 */
              return j + 1;
            }
            j++;
          }
          return n;
        }
      }
      /* 三引号文本块（Java 15+ / C# 11+）：整体吞，避免被拆成 "" "…" ""。
         只认「开分隔符后到行尾全是空白」的合法开头（Java 规范），
         找不到闭合就退回普通引号逻辑 —— 不扩大对错误源码的破坏面。 */
      if (conf.tblock && src.startsWith('"""', at)) {
        const e = src.indexOf("\n", at + 3);
        if (e > 0 && /^[ \t\r]*$/.test(src.slice(at + 3, e))) {   /* 有行终止符才可能是文本块 */
          let j = at + 3;
          while (j < n) {
            if (src[j] === "\\") { j += 2; continue; }
            if (src[j] === '"' && src[j + 1] === '"' && src[j + 2] === '"') return j + 3;
            j++;
          }
          return -1;                                          /* 未闭合：退回普通引号逻辑 */
        }
      }
      if (c === '"') {
        let j = at + 1, ok = false;
        while (j < n) {
          const d = src[j];
          if (d === "\\") { j += 2; continue; }
          if (d === '"') { ok = true; j++; break; }
          if (d === "\n") break;                                /* 换行 = 未闭合：当普通标点兜底 */
          j++;
        }
        return ok ? j : -1;
      }
      if (c === "'") {
        C_CHAR.lastIndex = at;
        const m = (conf.rawRust ? C_CHAR_RUST : C_CHAR).exec(src);
        return m ? at + m[0].length : -1;
      }
      return -1;
    };

    while (i < n) {
      const c = src[i];

      if (/\s/.test(c)) {
        let j = i; while (j < n && /\s/.test(src[j])) j++;
        const seg = src.slice(i, j);
        if (seg.indexOf("\n") >= 0) wsOnly = true;
        push("ws", seg); i = j; continue;
      }
      /* 行首 # 预处理行（C / C++ / C#）：连同 \ 续行整块吞成一个 token */
      if (conf.hash && c === "#" && wsOnly) {
        let j = i;
        for (;;) {
          let e = j;
          while (e < n && src[e] !== "\n") e++;
          let last = e - 1;
          while (last >= j && (src[last] === " " || src[last] === "\t" || src[last] === "\r")) last--;
          if (last >= j && src[last] === "\\" && e < n) { j = e + 1; continue; }
          j = e; break;
        }
        push("hash", src.slice(i, j)); i = j; continue;
      }
      if (c === "/" && src[i + 1] === "/") {
        let j = i; while (j < n && src[j] !== "\n") j++;
        push("cmt", src.slice(i, j)); i = j; wsOnly = false; continue;
      }
      if (c === "/" && src[i + 1] === "*") {
        let j = src.indexOf("*/", i + 2); j = j < 0 ? n : j + 2;
        push("cmt", src.slice(i, j)); i = j; wsOnly = false; continue;
      }
      if (c === '"' || c === "'" || c === "`" || c === "@" || c === "$" ||
          (conf.rawRust && (c === "r" || c === "b")) || (conf.cpp && c === "R")) {
        const lit = scanLit(i);
        if (lit >= 0) {
          push(c === "'" ? "char" : "str", src.slice(i, lit));
          i = lit; wsOnly = false; continue;
        }
      }
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
        C_NUM.lastIndex = i;
        const m = C_NUM.exec(src);
        if (m) { push("num", m[0]); i += m[0].length; wsOnly = false; continue; }
      }
      if (/[A-Za-z_$]/.test(c)) {
        let j = i; while (j < n && /[\w$]/.test(src[j])) j++;
        push("word", src.slice(i, j)); i = j; wsOnly = false; continue;
      }
      let p = null;
      for (const x of C_PUNCT) if (src.startsWith(x, i)) { p = x; break; }
      p = p || c;
      push("punct", p); i += p.length; wsOnly = false;
    }
    return T;
  }

  /* token 间距（美化用；默认单空格，标点与常见习惯按规则收紧）。
     conf 只影响语言特例：Go 的切片 / 复合字面量、Rust 的返回箭头（C++ 的 p->x 必须贴紧）。 */
  function cGap(prev, tk, next, prev2, conf) {
    if (!prev) return "";
    conf = conf || {};
    const av = prev.v, bv = tk.v;
    const ae = av[av.length - 1], bs = bv[0];
    /* ① 绝不粘连：粘起来会变成别的 token / 注释 / 原始串前缀 */
    if ((ae === "+" && bs === "+") || (ae === "-" && bs === "-")) return " ";
    if ((ae === "&" && bs === "&") || (ae === "|" && bs === "|")) return " ";
    if ((ae === "<" && bs === "<") || (ae === ">" && bs === ">")) return " ";
    if (ae === "/" && (bs === "/" || bs === "*")) return " ";
    if (ae === "*" && bs === "/") return " ";
    /* Go 的 for 头以 i++ { 收尾：`++` 后面必须是空格，不能按 C 的 x++ 贴紧 */
    if (bv === "{" && conf.goStyle && (av === "++" || av === "--")) return " ";
    /* ② 左侧贴紧（宏 ! 也不例外）
       ★ Rust 的 `->` 是返回类型箭头，两侧都要空格；C/C++ 的 `p->x` 必须贴紧。 */
    if (av === "(" || av === "[" || av === "." || av === "::" ||
        av === "#" || av === "@" || av === "$" || av === "'" || av === "\\" ||
        av === "!" || av === "~" || av === "++" || av === "--" ||
        (av === "->" && !conf.arrowSpace)) return "";
    /* ③ 右侧贴紧 */
    if (bv === ")" || bv === "]" || bv === ";" || bv === "," ||
        bv === "." || bv === "::" || bv === ":" ||
        bv === "++" || bv === "--" ||
        (bv === "->" && !conf.arrowSpace)) return "";
    /* ③b Rust 生命周期：`&'a` / `<'a` 贴紧；`, 'b` 的逗号后照常留空格 */
    if (bv === "'" && tk.t === "punct") {
      return (av === "&" || av === "<" || av === "(" || av === "[") ? "" : " ";
    }
    /* ③c 一元 * / &：`char *s`、`*s`、`&mut`、`&self` 贴紧后面的标识符；
           二元乘 / 与（`a * b`）前面是普通标识符或 ) ]，照常留空格。
           Go 的指针类型 `*Order` 按「大写开头 = 类型名」判（导出类型惯例）。 */
    if ((av === "*" || av === "&") && tk.t === "word") {
      const unary = !prev2 ||
        (prev2.t === "punct" && prev2.v !== ")" && prev2.v !== "]") ||
        (prev2.t === "word" && C_PRIM.has(prev2.v)) ||
        (av === "*" && conf.goStyle && /^[A-Z]/.test(tk.v));
      if (unary) return "";
    }
    /* ③d Rust 宏：`format!(` / `println!(` 整体是一个标识符，`!` 两侧都贴紧 */
    if (bv === "!" && prev.t === "word" && next && next.v === "(") return "";
    /* ④ 泛型：< 判定为泛型后在 token 上打 _gen，闭合侧（> / >> / ( / ) ）都跟着贴紧，
          这样 List<String> / HashMap<>() / Vec<&'a T> / Result<(), E> 一套规则全覆盖，
          比较运算不受影响 */
    if (bv === "<") {
      if (next && ((next.t === "word" && (/^[A-Z]/.test(next.v) || C_PRIM.has(next.v))) ||
                   next.v === "?" || next.v === "'" || next.v === "&" ||
                   next.v === "(" || next.v === ">" || next.v === ">>")) {
        tk._gen = true;
        return "";
      }
      return " ";
    }
    if (bv === ">" || bv === ">>") {
      if (prev._gen ||
          (prev.t === "word" && (/^[A-Z]/.test(av) || C_PRIM.has(av))) ||
          av === ">" || av === ">>" || av === "]" ||
          (prev2 && prev2.v === "'")) {
        tk._gen = true;
        return "";
      }
      return " ";
    }
    if (av === "<" && prev._gen) return "";
    /* ⑤ ( 前：关键字留空格，调用贴紧；泛型闭括号后贴紧（<>()、<T>()）；
          Go 的 `func (`（方法接收者）要空格，`func()`（匿名函数）贴紧。 */
    if (bv === "(") {
      if (prev._gen) { tk._gen = true; return ""; }     /* 泛型里的 ( 带标记，供 ) / > 判断 */
      if (av === "!" && prev2 && prev2.t === "word") return "";
      if (av === "func" && conf.goStyle) return (next && next.v === ")") ? "" : " ";
      /* 关键字大小写敏感：`errors.New(` 的 New 是标识符，不能按 C# 的 new 处理（实测多过空格） */
      if (prev.t === "word") return C_KW_PAREN.has(av) ? " " : "";
      if (ae === ")" || ae === "]") return "";
      return " ";
    }
    if (bv === "[") {
      if (prev.t === "word" || ae === ")" || ae === "]" || ae === ">" || ae === "?") return "";
      return " ";
    }
    /* ⑤b 泛型括号闭合：把 _gen 传下去，`Result<()>` 的 > 才认得出来 */
    if (bv === ")" && prev._gen) tk._gen = true;
    /* ⑤c Go 切片 / 复合字面量：`[]Order`、`map[string]int{`、`Order{…}` 贴紧；
           `if x {` / `for … {` 的块花括号前是表达式，仍然留空格 */
    if (conf.goStyle) {
      if (av === "]" && tk.t === "word") return "";
      if (bv === "{" && prev.t === "word" && !(prev2 && prev2.v === ".") &&
          !/^(struct|interface|class|enum|union)$/i.test(av) &&
          (/^[A-Z]/.test(av) || C_PRIM.has(av))) return "";
    }
    /* ⑥ 字符串 / 字符前面的「编码前缀字母」不许被拆开（u8"…" L"…" b"…"）；
          其余 word 与字符串之间留空格（import "fmt" / return "s"，可读且 token 等价） */
    if (prev.t === "word" && (tk.t === "str" || tk.t === "char")) {
      return C_STR_PREFIX.has(av) ? "" : " ";
    }
    /* ⑦ 一元 +/- 紧贴数字（= -1 / (-1)），二元照常留空格（a - 1） */
    if ((av === "-" || av === "+") && tk.t === "num") {
      if (!prev2 || !(prev2.t === "word" || prev2.t === "num" || /[)\]]$/.test(prev2.v))) return "";
    }
    return " ";
  }

  /* 预处理行清理：保留行内空白与续行反斜杠，只处理注释（字符串按语言词法保护） */
  function hashClean(v, keep, conf) {
    const T = scanC(v, Object.assign({}, conf, { hash: false }));
    let out = "";
    for (const tk of T) {
      if (tk.t === "cmt") { out += keep ? tk.v : " "; continue; }
      out += tk.v;

  /* 压缩：保留行结构（预处理行 / 宏续行 / Rust 属性都不会被拼坏），
     只做「去缩进 + 折叠行内空白 + 标点收紧」 */
  function cMinify(T, keep, conf) {
    /* ★ 末字符缓存（同 sqlProcess 2026-10-20）：hash 分支的 endsWith 会让 V8 压平整串，
       大 C 文件几千个 # 指令就是几千次全量扫描。out 只在最后 trim 一次。 */
    let out = "", last = "", prev = null, prev2 = null, sp = false, nl = false;
    const put = (s) => { if (s) { out += s; last = s[s.length - 1]; } };
    for (const tk of T) {
      if (tk.t === "ws") {
        if (tk.v.indexOf("\n") >= 0) nl = true; else sp = true;
        continue;
      }
      if (tk.t === "cmt") {
        if (!keep) { sp = true; continue; }              /* 注释 ≈ 一个空格，防两侧词粘连 */
        if (nl) { if (out) put("\n"); nl = false; sp = false; }
        else if (out && sp) put(" ");
        put(tk.v); prev2 = prev; prev = tk;
        if (tk.v.slice(0, 2) === "//") nl = true;        /* 行注释后必须断行 */
        sp = false;
        continue;
      }
      if (tk.t === "hash") {
        if (out && last !== "\n") put("\n");
        put(hashClean(tk.v, keep, conf) + "\n");
        prev = null; prev2 = null; sp = false; nl = false;
        continue;
      }
      if (nl) { if (out) put("\n"); nl = false; sp = false; }
      else if (out && sp) {
        const g = cGap(prev, tk, null, prev2, conf);
        if (g) put(g);

      put(tk.v); prev2 = prev; prev = tk; sp = false;

     否则 `public string Name { get; set; } = "x";` 会被拆成多行、初始化表达式还会单独成行。 */
  const CS_ACCESSOR = new Set(["get", "set", "init", "add", "remove"]);
  function accessorEnd(T, k) {
    let j = k + 1, seen = false;
    for (; j < T.length; j++) {
      const v = T[j].v;

      if (v === ";") continue;

      return -1;

  /* 美化：按花括号重排缩进与断行。
     case / default 标签与其后语句：标签在花括号层，语句再缩一级（caseExtra）。
     ★ 源码里的换行在「值 → 词」处保留：Go 靠换行分语句（自动分号），
       Rust 的属性行与结构体字段也靠换行；不保留会把整段挤成一行。 */
  function cPretty(T, keep, unit, conf) {
    /* ★ 输出用「分段数组 + 末字符缓存」（同 prettyJS 2026-10-20）：旧实现里
       「源码换行保留」分支每行 `out.replace(/[ \t]+$/,"")`、注释分支 `/[\s(]$/.test(out)`
       都要压平整串 —— O(n) 次 × O(n) = O(n²)，实测 1MB Go 美化 6.1s。
       现在 trimEnd 只回看最后几段（均摊 O(1)），末字符从缓存读，整段保持线性。 */
    const parts = [];
    let last = "";                                 /* parts 里最后一段的末字符 */
    const put = (s) => { if (s) { parts.push(s); last = s[s.length - 1]; } };
    const trimEnd = () => {
      while (parts.length) {
        const i = parts.length - 1, s = parts[i];
        const t = s.replace(/[ \t]+$/, "");
        if (t) { if (t !== s) parts[i] = t; last = t[t.length - 1]; return; }
        parts.pop();

      last = "";
    };
    let prev = null, prev2 = null, depth = 0, paren = 0;
    let lineStart = true, pendingCase = false, pendingLabel = false;
    let caseExtra = 0, caseDepth = -1;
    const ind = () => unit.repeat(Math.max(0, depth + caseExtra));
    for (let k = 0; k < T.length; k++) {
      const tk = T[k], next = T[k + 1];
      if (tk.t === "hash") {
        if (!lineStart) put("\n");
        put(hashClean(tk.v, keep, conf) + "\n");
        lineStart = true; prev = null; prev2 = null; continue;

      if (tk.t === "cmt") {
        if (!lineStart && parts.length && !/[\s(]/.test(last)) put(" ");
        put(tk.v);
        if (tk.v.slice(0, 2) === "//") { put("\n"); lineStart = true; prev = null; prev2 = null; }
        else { lineStart = false; prev = tk; }
        continue;
      }
      /* 保留「值 → 词」处的源码换行（见函数头注释）。句尾/大括号后的断行各分支已处理，
         所以这里只补「行内还有内容」的情况。 */
      if (tk.nl && !lineStart && prev &&

         不特殊处理会挤成 `import ("errors" "fmt")`（实测）。 */
      if (conf.goStyle && w === "import" && next && next.v === "(") {
        put((lineStart ? ind() : "") + "import (\n");
        let j = k + 2;
        for (; j < T.length && T[j].v !== ")"; j++) {
          if (T[j].t === "cmt") {
            if (keep) put(unit.repeat(depth + 1) + T[j].v + "\n");
            continue;

          put(unit.repeat(depth + 1) + T[j].v + "\n");

        put(unit.repeat(depth) + ")");

        if (conf.autoProp) {

          if (end > k) {

            lineStart = false;

            continue;
          }

        if (lineStart) { put(ind()); lineStart = false; }
        else put(cGap(prev, tk, next, prev2, conf));
        put("{");
        depth++;
        prev2 = prev; prev = tk;
        if (next && next.v === "}") continue;                    /* `{}` 贴在一起输出 */
        put("\n"); lineStart = true; prev = null; prev2 = null;
        continue;
      }
      if (tk.v === "}") {
        const inline = prev && prev.v === "{";
        if (!inline) {
          if (!lineStart) put("\n");
          depth = Math.max(0, depth - 1);
          if (caseDepth >= 0 && depth < caseDepth) { caseDepth = -1; caseExtra = 0; }
          put(ind());                                            /* 换行后必须补缩进（旧代码这里漏过） */
        } else {
          depth = Math.max(0, depth - 1);
          put(cGap(prev, tk, next, prev2, conf));
        }
        put("}");
        lineStart = false;
        prev2 = prev; prev = tk;
        const glue = next && next.t === "word" && C_GLUE.has(next.v);
        if (next && (next.v === ";" || next.v === "," || next.v === ")" || next.v === "]" ||
                     next.v === "." || next.v === "->" || next.v === "(" || glue)) continue;
        put("\n"); lineStart = true; prev = null; prev2 = null;
        continue;
      }
      if (tk.v === ";") {
        if (lineStart) { put(ind()); lineStart = false; }
        else put(cGap(prev, tk, next, prev2, conf));
        put(";");
        prev2 = prev; prev = tk;
        pendingCase = false; pendingLabel = false;
        /* Go 没有「用分号结束语句」的写法，分号只出现在 for / if 头里，
           断行靠源码换行 —— 这里绝不能断（实测 `for i := 0;` 被拆成三行） */
        if (paren === 0 && !conf.goStyle) { put("\n"); lineStart = true; prev = null; prev2 = null; }
        continue;
      }
      if (tk.v === ":" && (pendingCase || pendingLabel)) {
        if (lineStart) { put(ind()); lineStart = false; }
        else put(cGap(prev, tk, next, prev2, conf));
        put(":");
        prev2 = prev; prev = tk;
        pendingCase = false; pendingLabel = false;
        put("\n"); lineStart = true; prev = null; prev2 = null;
        continue;
      }
      /* 普通 token */
      if (lineStart) {
        const ded = isLabel ? 1 : 0;
        const extra = isCase ? 0 : caseExtra;
        put(unit.repeat(Math.max(0, depth + extra - ded)));
        lineStart = false;
        prev = null;
      } else {
        put(cGap(prev, tk, next, prev2, conf));
      }
      put(tk.v);
      if (isCase) { pendingCase = true; caseDepth = depth; caseExtra = 1; }
      if (isLabel) pendingLabel = true;
      if (tk.v === "(") paren++;
      else if (tk.v === ")") paren = Math.max(0, paren - 1);
      prev2 = prev; prev = tk;
    }
    return parts.join("").trim() + "\n";
  }

    const P = [];

      if (t.t === "cmt" && !keep) {
        if (t.v.slice(0, 2) === "//") nl = true;             /* 行注释后本来就换行了 */
        continue;

      if (t.t === "word") {
        if (/^[0-9]/.test(t.v)) {
          let v = t.v, j = k;
          while (j + 2 < T.length && T[j + 1].t === "punct" && T[j + 1].v === "." &&
                 T[j + 2].t === "word" && /^[0-9]/.test(T[j + 2].v)) {
