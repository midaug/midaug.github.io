  const C_KWS = {
    c: "auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while bool true false nullptr class namespace template try catch throw new delete this using public private protected virtual override final constexpr operator friend typename explicit export mutable noexcept static_cast dynamic_cast const_cast reinterpret_cast typeid wchar_t char8_t char16_t char32_t concept requires".split(" "),
    java: "abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield true false null".split(" "),
    cs: "abstract as base bool break byte case catch char checked class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly ref return sbyte sealed short sizeof stackalloc static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while async await yield record init get set value nameof dynamic where when".split(" "),
    go: "break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var true false nil iota".split(" "),
    rust: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self static struct super trait true type unsafe use where while yield box".split(" ")
  };
  const C_LIT = new Set(["true", "false", "null", "nullptr", "nil", "undefined"]);
  const C_KWSET = {};

  function hlC(src, lang) {
    const kw = C_KWSET[lang] || (C_KWSET[lang] = new Set(C_KWS[lang] || []));
    const T = scanC(src, C_CONF[lang] || {});
    let out = "";
    for (const t of T) {
      if (t.t === "cmt") out += span("t-c", t.v);
      else if (t.t === "str" || t.t === "char") out += span("t-s", t.v);
      else if (t.t === "num") out += span("t-n", t.v);
      else if (t.t === "hash") out += hlHash(t.v);
      else if (t.t === "word") {
        if (C_LIT.has(t.v)) out += span("t-l", t.v);
        else if (kw.has(t.v)) out += span("t-k", t.v);
        else out += escHtml(t.v);
      } else out += escHtml(t.v);
    }
    return out;
  }

  function hlHash(v) {
    const dm = v.match(/^\s*#\s*[A-Za-z_]\w*/);
    let out = "", rest = v;
    if (dm) { out += span("t-k", dm[0]); rest = v.slice(dm[0].length); }
    const re = /"([^"\\]*)"|(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|(<[^>\n]*>)/g;
    let m, last = 0;
    while ((m = re.exec(rest))) {
      out += escHtml(rest.slice(last, m.index));
      out += span(m[2] || m[3] ? "t-c" : "t-s", m[0]);
      last = m.index + m[0].length;
    }
    out += escHtml(rest.slice(last));
    return out;
  }

  function highlight(src, lang) {
    switch (lang) {
      case "js": case "ts": return hlCode(src, lang);
      case "json": return hlJSON(src);
      case "html": case "xml": return hlMarkup(src);
      case "css": case "scss": case "less": return hlCssHl(src, lang !== "css");
      case "sql": return hlSQL(src);
      case "java": case "c": case "cs": case "go": case "rust": return hlC(src, lang);
      default: return null;
    }
  }

  /* ============================================================
     语言自动识别
     -- 省掉「先选语言」这一步；识别结果会写在输出标题上，随时能改。
     ============================================================ */
  function detectLang(src) {
    const t = src.replace(/^\uFEFF/, "").trim();
    if (!t) return "js";
    if (/^[[{]/.test(t)) { try { JSON.parse(t); return "json"; } catch (e) { /* 不是 JSON，继续猜 */ } }
    if (/^<\?xml/i.test(t)) return "xml";
    if (/^<!DOCTYPE\s+html/i.test(t)) return "html";
    if (/^</.test(t)) {
      return /<\/?(html|head|body|div|span|p|a|img|script|style|meta|link|title|table|ul|ol|li|h[1-6]|input|form|button|header|footer|section|nav|pre|code|br|hr|svg)\b/i.test(t)
        ? "html" : "xml";
    }
    /* ---- 新语言：先看「JS 里几乎不会出现」的强信号，避免被下面的 JS 启发式截走 ---- */
    if (/\bimport\s+java\.|\bSystem\.(out|err)\.|\bpublic\s+static\s+void\s+main\b|\@Override\b/.test(t)) return "java";
    if (/\busing\s+System\b|\bnamespace\s+[\w.]+\s*[;{]|\bConsole\.(WriteLine|Write|ReadLine)\b/.test(t)) return "cs";
    if (/^\s*package\s+\w+\s*$/m.test(t) || /\bfunc\s+(\([^)\n]*\)\s*)?\w+\s*\(/.test(t)) return "go";
    if (/\bfn\s+\w+\s*\(|\blet\s+mut\b|\bimpl\s+\w+|\bprintln!\s*\(|\buse\s+std::/.test(t)) return "rust";
    if (/^\s*#\s*(include|define|pragma|ifndef)\b/m.test(t) || /\bint\s+main\s*\(|\bprintf\s*\(|\bstd::/.test(t)) return "c";
    /* SQL：① 经典形态（select…from、insert into…）；② 语句头 + 子句碎片 ——
       只有 select / where / order by、没有 FROM 的粘贴片段很常见（2026-10-15 实测漏检出 js）。
       碎片判据要求子句词后面是空白：`.from(`、`.where(` 这类 JS 方法链不会被算进去。 */
    const sqlWords = (t.match(/\b(?:from|where|having|limit|offset|join|union|returning)\s|\b(?:group|order)\s+by\b/gi) || []).length;
    /* 语句头允许前置空白 / 头部注释（从文件里复制常带 `-- 说明` 开头）/ 左括号 */
    const sqlHead = /^\s*(?:--[^\n]*\n|\/\*[\s\S]*?\*\/|\s)*\(?\s*(select|with|insert|update|delete|create|alter|drop|truncate|explain)\b/i.test(t);
    if (/\bselect\b[\s\S]{0,4000}?\bfrom\b/i.test(t) || /\b(create|alter|drop)\s+table\b/i.test(t) ||
        /\binsert\s+into\b/i.test(t) || /\bupdate\s+\w+\s+set\b/i.test(t) || /\bdelete\s+from\b/i.test(t) ||
        (sqlHead && sqlWords >= 2)) {
      if (!/\b(function|=>|const|let|var|import|export|class|return|typeof|async|await)\b/.test(t)) return "sql";
    }
    /* ★ `var` 要排除 CSS 的 var(--x)：否则带自定义属性的样式表会被判成 JS（2026-10-19 实测） */
    if (/\b(function|=>|const|let|import|export|class|return|typeof|async|await|interface|enum)\b/.test(t) ||
        /\bvar\b(?!\s*\()/.test(t)) return "js";
    if (/\{[^{}]*:[^{}]*\}/.test(t)) {
      if (/@(mixin|include|extend|use|forward)\b|\$[A-Za-z_-][\w-]*\s*:/.test(t)) return "scss";
      if (/@[\w-]+\s*:/.test(t)) return "less";
      return "css";
    }
    return "js";
  }

  /* ==== PURE-CORE-END ==== */

  /* ============================================================
     运行
     ============================================================ */
  const byteLen = s => new Blob([s]).size;
  const bytes = n => n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";

  /* 输出区渲染：≤ 阈值走语法高亮，超过就退化成纯文本（span 太多反而卡）。
     实测（本机 Chromium）：10 万字符 ≈ 147ms、25 万 ≈ 0.8s、38 万 ≈ 1.9s —— 25 万是「仍流畅」的边界。
     raw 文本始终留在 lastOut —— 复制 / 下载 / 回填都读它，与高亮无关。 */
  const HL_MAX = 250000;
  let lastOut = "", lastLang = "js";
  function renderOut(text) {
    const el = $("out");
    lastOut = text;
    if (!text) { el.textContent = ""; return; }
    let html = null;
    if (text.length <= HL_MAX) {
      try { html = highlight(text, lastLang); } catch (e) { html = null; }
    }
    if (html == null) el.textContent = text;
    else el.innerHTML = html;
  }

  function process(src, lang, mode, keep, unit) {
    switch (lang) {
      case "json": return jsonProcess(src, mode, unit);
      case "html": return { text: mode === "min" ? minifyHTML(src, keep) : prettyHTML(src, unit) };
      case "xml":  return { text: mode === "min" ? minifyXML(src, keep) : prettyXML(src, unit) };
      case "css":  return cssProcess(src, mode, keep, unit, false);
      case "scss": case "less": return cssProcess(src, mode, keep, unit, true);
      case "sql":  return sqlProcess(src, mode, keep, unit);
      case "java": case "c": case "cs": case "go": case "rust":
        return cProcess(src, mode, keep, unit, lang);
      default:     return { text: mode === "min" ? minifyJS(src, keep) : prettyJS(src, unit) };
    }
  }

  function setStatus(msg, warn) {
    const el = $("statusText");
    el.textContent = msg;
    el.classList.toggle("warn", !!warn);
  }

  let lastMode = "min";

  function run(mode) {
    lastMode = mode;
    const src = $("in").value;
    if (!src.trim()) {
      renderOut("");
      $("sizes").textContent = "";
      $("outHint").textContent = "点顶部「压缩」或「美化」生成结果";
      setStatus("先粘贴要处理的代码。", true);
      return;
    }
    const picked = $("lang").value;
    const lang = picked === "auto" ? detectLang(src) : picked;
    const keep = $("keepCmt").checked;
    const unit = $("indent").value === "tab" ? "\t" : " ".repeat(+$("indent").value);

    let res, note = "";
    try {
      const r = process(src, lang, mode, keep, unit);
      res = r.text; note = r.note || "";
    } catch (e) {
      renderOut("");
      $("sizes").textContent = "";
      $("outHint").textContent = "—";
      setStatus("处理失败：" + String(e && e.message || e), true);
      return;
    }

    lastLang = lang;
    renderOut(res);
    const a = byteLen(src), b = byteLen(res);
    const diff = a ? Math.round((1 - b / a) * 100) : 0;
    $("sizes").innerHTML = "原始 <b>" + bytes(a) + "</b> → 结果 <b>" + bytes(b) + "</b> " +
      (b <= a ? '<span class="cut">省 ' + diff + "%</span>" : '<span class="grow">增 ' + Math.abs(diff) + "%</span>");
    /* 美化结果以 \n 结尾，直接 split 会多算一行（实测：3 行内容显示成「4 行」） */
    const lineCount = res.replace(/\n+$/, "").split("\n").length;
    $("outHint").textContent = (mode === "min" ? "已压缩" : "已美化") + " · " + LANGS[lang].name +
      (picked === "auto" ? "（自动识别）" : "") + " · " + lineCount + " 行";

    /* JS 压缩后做一次「能不能重新解析」的自检 —— 语法坏了要立刻说出来。
       TypeScript 不能这样验（类型标注不是合法 JS），所以只验 JS。 */
    if (lang === "js" && mode === "min") {
      try { new Function(res); }
      catch (e) {
        /* ★ 含 import/export 的是 ES Module，new Function 只接受脚本，必然报错 —— 不算坏 */
        if (!/(?:^|[;{}\n])\s*(?:import|export)\b/.test(res))
          note = "压缩结果无法通过语法解析（" + (e && e.message) + "），请检查输入是否本身就不完整。";
      }
    }
    const fam = (lang === "sql") ? "sql" : (C_CONF[lang] ? "c" : "");
    let msg;
    if (mode === "min") {
      msg = fam === "sql" ? "完成。SQL 安全模式：删注释、折叠空白；字符串、引号标识符与美元引用原样。"

          : fam === "c" ? "完成。按花括号重排缩进；预处理指令、case 标签与宏内容保持原样。"
          : "完成。缩进用顶部「缩进」选择；源码里的语句换行会保留，大小写与字面量一律原样。";

type Status = "draft" | "paid" | "shipped" | "done";

interface OrderItem {
  sku: string;
  price: number;
  qty: number;
}

interface Order {
  id: string;
  status: Status;
  items: OrderItem[];
  note?: string;
  createdAt: Date;
}

interface Store {
  find(id: string): Order | null;
  save(row: Order): void;
}

export function amount(order: Order): number {
  return order.items.reduce((s, it) => s + it.price * it.qty, 0);
}

  const order = store.find(id);
  if (!order) throw new Error("order not found: " + id);
  if (order.status !== "paid") {
    throw new Error(\`bad status \${order.status}\`);
  }
  order.status = "shipped";   // 收窄后只允许这两个字面量
  store.save(order);
  return order;
}`,

         o.amount,
         o.created_at,

import java.util.List;

/** 购物车：泛型 + 增强 for + 异常 */
public class Cart {
    private final List<Item> items = new ArrayList<>();
    private double discount;

    public void add(Item item) {
        if (item == null) {
            throw new IllegalArgumentException("item is null");
        }
        items.add(item);   // 添加时不去重
    }

    public double total() {
        double sum = 0;
        for (Item it : items) {
            if (!it.inStock()) continue;
            sum += it.price() * it.qty();
        }
        if (discount > 0) {
            sum *= (1 - discount);
        }
        return sum;
    }

    public static void main(String[] args) {
        Cart cart = new Cart();
        cart.add(new Item("键盘", 499, 1));
        System.out.printf("合计 %.2f 元%n", cart.total());
    }
}`,

  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
  }
  function copyText(text, msg) {
    const s = String(text);
    const done = () => toast(msg || "已复制");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(s).then(done, () => fallbackCopy(s, done));
    } else {
      fallbackCopy(s, done);
    }
  }
  function fallbackCopy(s, done) {
    const ta = document.createElement("textarea");
    ta.value = s;
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done(); else toast("复制失败，请手动选择");
  }
