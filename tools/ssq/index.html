<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奕彩 SSQ</title>
<meta name="theme-color" content="#f6f7f9" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    /* ===== 与「工具首页 / JSON 格式化 / 日期时间 / 字节换算」共用的一套配色（浅色 · 靛蓝）===== */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    /* 数值强调色，与 JSON 工具的语法高亮同一批 */
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;

    /* 双色球领域色：红球 / 蓝球。**只在这里定义**，其余一律引用，不要写死 */
    --ball-red: #d1242f;
    --ball-blue: #4f6bed;

    /* 内容列最大宽度。整宽会让「识别结果」里的投注行只有约 300px 内容、
       右侧空出上千像素，观感很差；收窄成居中窄列（参照 child-growth 的 .wrap）。 */
    --wrap: 720px;

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    /* height（不是 min-height）：让 main 成为唯一滚动容器，
       与其余工具页一致；否则文档整体滚动，$('main').scroll 触底加载永不触发 */
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; }

  /* ===== 顶栏 ===== */
  /* 内容收窄成居中窄列（用户要求，参照 child-growth 的 .wrap）。
     顶栏本身仍整宽（底边线要通到底），只把左右内边距撑到与内容列对齐。 */
  header {
    flex: none; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
    padding: 8px max(14px, calc((100% - var(--wrap)) / 2));
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: inherit; text-decoration: none }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .stat b { color: var(--accent); font-weight: 600; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ===== 控件 ===== */
  button {
    font: inherit; cursor: pointer; outline: 0;
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 6px 12px; min-height: 34px;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 2px 10px -2px rgba(79,107,237,.45);
  }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: transparent; color: #fff; }
  button.mini { padding: 4px 10px; min-height: 28px; font-size: 11px; background: var(--panel-2); color: var(--text-2); border-color: var(--border); }
  button.mini:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 主操作按钮。文案走属性选择器，JS 只需增删 disabled / init（零逻辑改动）：
     init 规则写在 disabled 之后 → 两者同时在时显示「初始化中…」。 */
  #up-btn::after { content: "图片识别"; }
  #up-btn[disabled]::after { content: "正在处理…"; }
  #up-btn[init]::after { content: "初始化中…"; }
  #up-btn:disabled { box-shadow: none; }

  /* ===== 主体 ===== */
  main {
    flex: 1; min-height: 0; overflow: auto;
    padding: 14px; display: grid; gap: 12px; align-content: start;
    grid-template-columns: 1fr;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  main::-webkit-scrollbar { width: 10px; height: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  main::-webkit-scrollbar-track { background: transparent; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; min-width: 0;
    /* 居中窄列：卡片不铺满整屏（见 :root 的 --wrap） */
    width: 100%; max-width: var(--wrap); margin-inline: auto;
  }
  .card > h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .card > h2 .hint { font-size: 11px; font-weight: 400; color: var(--text-3); }
  .card > h2 .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  /* ===== 号码球 =====
     类名沿用原 JS 的 num/red/blue/redf/bluef/err（零逻辑改动），只重写样式。
     redf/bluef 表示「该号命中开奖号」，必须写在 red/blue 之后才能覆盖颜色。 */
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 26px; padding: 0 5px; line-height: 1;
    border-radius: 50%; border: 1px solid currentColor; background: transparent;
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .num.red { color: var(--ball-red); }
  .num.blue { color: var(--ball-blue); }
  .num.redf { background: var(--ball-red); color: #fff; }
  .num.bluef { background: var(--ball-blue); color: #fff; }
  .num.err { background: var(--err); color: #fff; border-color: var(--err); }

  .balls { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

  /* ===== 历史开奖卡片网格 ===== */
  .ssq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .ssq-item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .ssq-item .ssq-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ssq-item .code { font-weight: 700; color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ssq-item .draw { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .ssq-item .ssq-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-2); }
  .ssq-item .ssq-foot b { color: var(--num); font-weight: 600; }

  .more { margin-top: 12px; text-align: center; }

  /* ===== 识别 / 核对结果 =====
     一行一注（不要改成多列铺排：号码条内容只有约 300px，
     横排会把「号码」和「奖金」拉得过开，观感反而更差）。
     整宽问题由「卡片收窄成居中窄列」解决，不靠拆列。 */
  .result-bets { display: block; }
  /* 开奖号码 + 一二等奖奖金的信息块（识别结果顶部 / 手工查期号结果共用，见 drawBlockHtml） */
  .draw-info {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--accent-soft); padding: 10px 12px; margin-bottom: 10px;
  }
  .draw-info .draw-title { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .draw-info .draw-title b { color: var(--accent); font-family: var(--mono); }
  .draw-info .draw-prize {
    margin-top: 8px; font-size: 12px; color: var(--text-2);
    display: flex; flex-wrap: wrap; gap: 4px 16px;
  }
  .draw-info .draw-prize b { color: var(--num); font-weight: 600; }

  /* 手工查期号：输入框 + 查询按钮（放在「历史开奖信息」标题右侧） */
  #searchCode {
    width: 120px; min-height: 28px; padding: 4px 8px;
    border: 1px solid var(--border-2); border-radius: 6px;
    background: var(--panel); color: var(--text); font: inherit; font-size: 12px;
  }
  #searchCode:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #searchResult:empty { display: none; }
  .bet {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .bet:first-of-type { border-top: 0; }
  .bet .zm { font-family: var(--mono); font-weight: 700; color: var(--text-2); }
  .bet .prize { font-size: 12px; color: var(--text-2); }
  .bet .reward { font-size: 12px; font-weight: 700; color: var(--ok); }
  .bet-type { width: 100%; font-size: 12px; color: var(--text-2); }
  .compound-details, .drag-details { margin-top: 4px; width: 100%; }
  .combination { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 5px 0 5px 10px; border-left: 2px solid var(--border-2); }
  .combination .label { font-size: 11px; color: var(--text-3); }
  .total { margin-top: 8px; font-size: 12px; color: var(--text-2); }
  .total b { color: var(--ok); }
  .fileinfo {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3);
  }
  .ocr-spec-note {
    margin-top: 12px; padding: 8px 12px; border-left: 3px solid var(--ok);
    background: color-mix(in srgb, var(--ok) 8%, transparent);
    font-size: 12px; line-height: 1.7; color: var(--text-2); border-radius: 0 6px 6px 0;
  }
  .ocr-spec-note b { color: var(--text-2); letter-spacing: 1px; }

  /* 隐私说明：图片识别全在本机完成。常驻在识别卡底部，任何状态都可见 */
  .privacy {
    display: flex; align-items: center; gap: 6px;
    margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; line-height: 1.5; color: var(--text-3);
  }
  .privacy .lock { width: 13px; height: 13px; flex: none; color: var(--ok); }

  /* ===== 空态：铺满卡片的拖拽上传区 =====
     早期空态只是一行左对齐的短文案，宽屏下右侧会空出一大片、像没渲染完。
     改成整宽的虚线投放区，内容居中，空间被「有意图地留白」占满。 */
  .dropzone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; min-height: 148px; padding: 18px;
    border: 1.5px dashed var(--border-2); border-radius: 10px;
    background: var(--panel-2); color: var(--text-2); text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .dropzone:hover, .dropzone:focus-visible, .dropzone.dragover {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent); outline: none;
  }
  /* 子元素不接收指针事件：既让 click 直接落在投放区上，也避免拖拽时
     dragleave 在子元素间反复触发导致高亮闪烁 */
  .dropzone > * { pointer-events: none; }
  .dropzone .dz-icon { width: 28px; height: 28px; }
  .dropzone .dz-title { font-size: 13px; font-weight: 600; }
  .dropzone .dz-sub { font-size: 11.5px; color: var(--text-3); }
  .dropzone:hover .dz-sub, .dropzone.dragover .dz-sub { color: inherit; opacity: .75; }

  /* ===== 提示条 ===== */
  .alert { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text-2); }
  .alert.err { border-color: rgba(209,36,47,.35); background: rgba(209,36,47,.07); color: var(--err); }
  .alert.warn { border-color: rgba(178,94,9,.35); background: rgba(178,94,9,.08); color: var(--num); }
  .alert.ok { border-color: rgba(13,122,82,.35); background: rgba(13,122,82,.08); color: var(--ok); }

  /* ===== 加载指示（替代原来的 loading.gif，去掉 gh 浮动 CDN 依赖）===== */
  .spinner {
    width: 26px; height: 26px; margin: 20px auto;
    border: 3px solid var(--surface-2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  /* ===== 窄屏 ===== */
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 6px 8px; }
    .brand { font-size: 14px; }
    .stat { font-size: 11px; }
    header button { min-height: 38px; padding: 8px 14px; }
    main { padding: 10px; gap: 10px; }
    .card { padding: 12px; }
    .ssq-grid { gap: 8px; }
    .ssq-item { padding: 9px 10px; }
    .dropzone { min-height: 116px; padding: 14px; gap: 4px; }
    /* 触屏下输入框字号提到 16px（低于 16px 时 iOS 聚焦会放大整页） */
    #searchCode { min-height: 34px; }
  }
</style>
</head>

<body>

<header>
  <a class="brand" href=".." title="返回工具首页">奕彩<span>SSQ</span></a>
  <span class="sep"></span>
  <span class="stat" id="data-update-time">数据加载中…</span>
  <span class="right">
    <button class="primary" id="up-btn" disabled init aria-label="上传投注票截图识别号码"></button>
    <input type="file" id="input-img" accept="image/*" hidden />
  </span>
</header>

<main>
  <section class="card">
    <h2>识别结果 <span class="hint">上传投注票截图后，自动识别期号与号码并核对中奖情况</span>
      <span class="right"><button class="mini" id="btnClearResult" hidden>清除</button></span>
    </h2>
    <div id="dataBody"></div>
    <p class="privacy">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
      </svg>
      <span>图片识别全部在本机浏览器内完成，图片不会上传、保存或发送到任何服务器。</span>
    </p>
  </section>

  <section class="card">
    <h2>历史开奖信息
      <span class="hint" id="ssq-total"></span>
      <span class="right">
        <input type="text" id="searchCode" inputmode="numeric" autocomplete="off"
               maxlength="7" placeholder="查期号，如 2026119" aria-label="按期号查询开奖结果" />
        <button class="mini" id="btnSearch">查询</button>
      </span>
    </h2>
    <div id="searchResult"></div>
    <div id="ssq-el" class="ssq-grid"></div>
    <div class="more"><button class="mini" id="btnMore">加载更多</button></div>
  </section>
</main>

<!-- 前端库已本地化到 vendor/（jquery 3.6.4 / tesseract.js 7.0.0 / Compressor.js 1.2.1）。
     策略：本地优先，文件缺失或损坏时才回退 CDN（同样锁版本）—— 两个方向都保住。
     OCR 的 worker / core / 语言包同样是本地文件（本目录 vendor/），在 initTesseractWorker() 里指定。
     开奖数据仍走线上接口（由爬虫定期重新生成，本地化会让数据冻结在打包那一刻）。 -->
<script src="vendor/jquery-3.6.4.min.js"></script>
<script>window.jQuery || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"><\/script>');</script>
<script>window.jQuery || document.write('<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"><\/script>');</script>
<script src='vendor/tesseract-7.0.0.min.js'></script>
<script>window.Tesseract || document.write('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"><\/script>');</script>
<!-- 图片不再预压缩：压缩（800px/JPEG）会让票据小字粘连、小图更糊，是识别准确率的最大杀手。
     改为 canvas 自适应预处理：小图放大到目标长边、大图原样保留，并抑制红色印章/红框干扰。 -->
<!-- <script src="https://fastly.jsdelivr.net/gh/midaug/dream-lottery/spider_data/ssq.js"></script> -->
<script src="https://100180.xyz/ssq/data/ssq.js"></script>
<script>
    var dataList = [];
    var dataMap = {};
    var currentPage = 0;
    var pageSize = 5;
    var lang = 'chi_sim+eng';
    var dataContainer = $('#dataBody');
    /* 加载指示用内联 CSS spinner，不再引 gh/<repo> 浮动地址上的 loading.gif
       （MEMORY.md：CDN 资源一律锁版本，禁 gh/master 浮动路径） */
    var loadingHtml = '<div class="spinner" role="status" aria-label="加载中"></div>';
    /* 空态 = 铺满卡片的投放区（可点击、可拖放）。不要退回成一行短文案：
       整宽卡片里左对齐的一行字会让右侧空一大片。 */
    var idleHtml = '<div class="dropzone" id="dropzone" role="button" tabindex="0"'
        + ' aria-label="上传投注票截图">'
        + '<svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
        + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'
        + '</svg>'
        + '<div class="dz-title">上传投注票截图</div>'
        + '<div class="dz-sub">点击选择图片，或把截图拖到这里</div>'
        + '</div>';

    function renderHistoryList(data, lastPage) {
        var container = $('#ssq-el');
        for (let i = 0; i < data.length; i++) {
            var item = data[i];
            var html = '<article class="ssq-item">';
            html += '<div class="ssq-head">';
            html += '<span class="code">' + esc(item.code) + '</span>';
            html += '<span class="draw">' + esc(item.drawDate) + '</span>';
            html += '</div>';
            html += '<div class="balls">';

            // 渲染红球
            for (var j = 1; j <= 6; j++) {
                var className = item['red' + j + 'f'] ? 'num red redf' : 'num red';
                html += '<span class="' + className + '">' + esc(item['red' + j]) + '</span>';
            }
            // 渲染蓝球
            var blueClass = item.blue1f ? 'num blue bluef' : 'num blue';
            html += '<span class="' + blueClass + '">' + esc(item.blue1) + '</span>';
            html += '</div>';
            html += '<div class="ssq-foot">';
            html += '<span>奖金 <b>' + esc(item.bonus) + '</b></span>';
            html += '<span>第 ' + (lastPage - data.length + i + 1) + ' 期</span>';
            html += '</div>';
            html += '</article>';
            container.append(html);
        }
        currentPage = lastPage;
    }

    function formatDate(timestamp) {
        var date = new Date(timestamp);
        var year = date.getFullYear();
        var month = date.getMonth() + 1;
        var day = date.getDate();
        var hours = date.getHours();
        var minutes = date.getMinutes();
        var seconds = date.getSeconds();

        month = month < 10 ? '0' + month : month;
        day = day < 10 ? '0' + day : day;
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
    }

    function loadMore(page) {
        if (currentPage >= dataList.length) { syncMoreBtn(); return; }
        var start = currentPage;
        var end = Math.min(currentPage + page, dataList.length);
        var slice = dataList.slice(start, end);
        renderHistoryList(slice, end);
        syncMoreBtn();
    }

    /* 「加载更多」按钮与「共 N 期」提示的同步（滚动触底与点按钮共用同一条路径） */
    function syncMoreBtn() {
        var more = document.getElementById('btnMore');
        if (more) more.disabled = currentPage >= dataList.length;
        var total = document.getElementById('ssq-total');
        if (total) total.textContent = '共 ' + dataList.length + ' 期 · 已显示 ' + currentPage + ' 期';
    }

    // 全局Tesseract worker变量
    let ocrWorker = null;

    /* OCR 运行时资源（本地文件，见 ssq/vendor/ —— 约 18MB，只有本页在用）：
       - workerPath：worker 脚本本身
       - corePath  ：传「目录」，tesseract 会按设备能力自动挑
                     tesseract-core-relaxedsimd-lstm / -simd-lstm / -lstm 三个变体之一（都已下载）
       - langPath  ：传「目录」，tesseract 会取 <lang>.traineddata.gz
                     lang = 'chi_sim+eng' → 需要 chi_sim 与 eng 两个语言包（都已下载）
       本地文件缺失时回退到 tesseract 内置的 CDN 默认值，保证不至于整块功能失效。 */
    const OCR_LOCAL_PATHS = {
        workerPath: 'vendor/tesseract-worker-7.0.0.min.js',
        corePath: 'vendor/tesseract-core-7.0.0',
        langPath: 'vendor/tessdata-4.0.0_best_int'
    };
    const ocrLogger = (m) => {
        // 简单的日志记录，避免复杂对象
        console.log('OCR进度:', m.status, Math.round(m.progress * 100) + '%');
    };

    // 初始化Tesseract worker
    async function initTesseractWorker() {
        if (ocrWorker) return ocrWorker;
        try {
            ocrWorker = await Tesseract.createWorker(lang, undefined,
                Object.assign({ logger: ocrLogger }, OCR_LOCAL_PATHS));
        } catch (error) {
            console.warn('本地 OCR 资源不可用，回退 CDN：', error);
            ocrWorker = await Tesseract.createWorker(lang, undefined, { logger: ocrLogger });
        }
        return ocrWorker;
    }

    // 等待ssq.js加载完成并处理数据
    var initAppRetries = 0;
    async function initApp() {
        // 检查数据是否已加载

            if (!fields[0]) continue;

            var code = '20' + fields[0];
            var obj = {
                code: code,
                red1: fields[1],

                red3: fields[3],
                red4: fields[4],
                red5: fields[5],
                red6: fields[6],
                blue1: fields[7],
                bonus: fields[8],
                reward: fields[9],
                drawDate: fields[10],
                zm: fields[0].substring(0, 1),
                red1f: false,
                red2f: false,
                red3f: false,
                red4f: false,
                red5f: false,
                red6f: false,
                blue1f: false,
                bonusText: '无',
                rewardValue: '0'
            };

            dataList.push(obj);  // 修复：应该存储对象而不是code
            dataMap[code] = obj;
        }

        loadMore(30);

        /* ★ 不再在页面加载时 await initTesseractWorker()。
           那样等于每次打开这个页面（哪怕只是看开奖结果）都要先下完
           语言包 chi_sim+eng ≈4.5MB 再加 core/worker 引擎才放开按钮，
           而这个页面的主要用途是查号码，多数访问根本用不到票据识别。
           改为「首次上传时按需加载」——#up-btn 的 click 流程里已有
           await initTesseractWorker()，并且失败时会给出可见的 .alert.err，

        $('#up-btn').removeAttr('disabled');
