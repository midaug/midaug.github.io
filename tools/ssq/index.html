<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奕彩 SSQ</title>
<meta name="theme-color" content="#f6f7f9" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    /* ===== 与「工具首页 / JSON 格式化 / 日期时间 / 字节换算」共用的一套配色（浅色 · 靛蓝）===== */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    /* 数值强调色，与 JSON 工具的语法高亮同一批 */
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;

    /* 双色球领域色：红球 / 蓝球。**只在这里定义**，其余一律引用，不要写死 */
    --ball-red: #d1242f;
    --ball-blue: #4f6bed;

    /* 内容列最大宽度。整宽会让「识别结果」里的投注行只有约 300px 内容、
       右侧空出上千像素，观感很差；收窄成居中窄列（参照 child-growth 的 .wrap）。 */
    --wrap: 720px;

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    /* height（不是 min-height）：让 main 成为唯一滚动容器，
       与其余工具页一致；否则文档整体滚动，$('main').scroll 触底加载永不触发 */
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; }

  /* ===== 顶栏 ===== */
  /* 内容收窄成居中窄列（用户要求，参照 child-growth 的 .wrap）。
     顶栏本身仍整宽（底边线要通到底），只把左右内边距撑到与内容列对齐。 */
  header {
    flex: none; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
    padding: 8px max(14px, calc((100% - var(--wrap)) / 2));
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .stat b { color: var(--accent); font-weight: 600; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ===== 控件 ===== */
  button {
    font: inherit; cursor: pointer; outline: 0;
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 6px 12px; min-height: 34px;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 2px 10px -2px rgba(79,107,237,.45);
  }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: transparent; color: #fff; }
  button.mini { padding: 4px 10px; min-height: 28px; font-size: 11px; background: var(--panel-2); color: var(--text-2); border-color: var(--border); }
  button.mini:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 主操作按钮。文案走属性选择器，JS 只需增删 disabled / init（零逻辑改动）：
     init 规则写在 disabled 之后 → 两者同时在时显示「初始化中…」。 */
  #up-btn::after { content: "图片识别"; }
  #up-btn[disabled]::after { content: "正在处理…"; }
  #up-btn[init]::after { content: "初始化中…"; }
  #up-btn:disabled { box-shadow: none; }

  /* ===== 主体 ===== */
  main {
    flex: 1; min-height: 0; overflow: auto;
    padding: 14px; display: grid; gap: 12px; align-content: start;
    grid-template-columns: 1fr;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  main::-webkit-scrollbar { width: 10px; height: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  main::-webkit-scrollbar-track { background: transparent; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; min-width: 0;
    /* 居中窄列：卡片不铺满整屏（见 :root 的 --wrap） */
    width: 100%; max-width: var(--wrap); margin-inline: auto;
  }
  .card > h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .card > h2 .hint { font-size: 11px; font-weight: 400; color: var(--text-3); }
  .card > h2 .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  /* ===== 号码球 =====
     类名沿用原 JS 的 num/red/blue/redf/bluef/err（零逻辑改动），只重写样式。
     redf/bluef 表示「该号命中开奖号」，必须写在 red/blue 之后才能覆盖颜色。 */
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 26px; padding: 0 5px; line-height: 1;
    border-radius: 50%; border: 1px solid currentColor; background: transparent;
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .num.red { color: var(--ball-red); }
  .num.blue { color: var(--ball-blue); }
  .num.redf { background: var(--ball-red); color: #fff; }
  .num.bluef { background: var(--ball-blue); color: #fff; }
  .num.err { background: var(--err); color: #fff; border-color: var(--err); }

  .balls { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

  /* ===== 历史开奖卡片网格 ===== */
  .ssq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .ssq-item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .ssq-item .ssq-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ssq-item .code { font-weight: 700; color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ssq-item .draw { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .ssq-item .ssq-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-2); }
  .ssq-item .ssq-foot b { color: var(--num); font-weight: 600; }

  .more { margin-top: 12px; text-align: center; }

  /* ===== 识别 / 核对结果 =====
     一行一注（不要改成多列铺排：号码条内容只有约 300px，
     横排会把「号码」和「奖金」拉得过开，观感反而更差）。
     整宽问题由「卡片收窄成居中窄列」解决，不靠拆列。 */
  .result-bets { display: block; }
  .result-head { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .result-head b { color: var(--accent); font-family: var(--mono); }
  .bet {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .bet:first-of-type { border-top: 0; }
  .bet .zm { font-family: var(--mono); font-weight: 700; color: var(--text-2); }
  .bet .prize { font-size: 12px; color: var(--text-2); }
  .bet .reward { font-size: 12px; font-weight: 700; color: var(--ok); }
  .bet-type { width: 100%; font-size: 12px; color: var(--text-2); }
  .compound-details, .drag-details { margin-top: 4px; width: 100%; }
  .combination { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 5px 0 5px 10px; border-left: 2px solid var(--border-2); }
  .combination .label { font-size: 11px; color: var(--text-3); }
  .total { margin-top: 8px; font-size: 12px; color: var(--text-2); }
  .total b { color: var(--ok); }
  .fileinfo {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3);
  }

  /* ===== 空态：铺满卡片的拖拽上传区 =====
     早期空态只是一行左对齐的短文案，宽屏下右侧会空出一大片、像没渲染完。
     改成整宽的虚线投放区，内容居中，空间被「有意图地留白」占满。 */
  .dropzone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; min-height: 148px; padding: 18px;
    border: 1.5px dashed var(--border-2); border-radius: 10px;
    background: var(--panel-2); color: var(--text-2); text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .dropzone:hover, .dropzone:focus-visible, .dropzone.dragover {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent); outline: none;
  }
  /* 子元素不接收指针事件：既让 click 直接落在投放区上，也避免拖拽时
     dragleave 在子元素间反复触发导致高亮闪烁 */
  .dropzone > * { pointer-events: none; }
  .dropzone .dz-icon { width: 28px; height: 28px; }
  .dropzone .dz-title { font-size: 13px; font-weight: 600; }
  .dropzone .dz-sub { font-size: 11.5px; color: var(--text-3); }
  .dropzone:hover .dz-sub, .dropzone.dragover .dz-sub { color: inherit; opacity: .75; }

  /* ===== 提示条 ===== */
  .alert { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text-2); }
  .alert.err { border-color: rgba(209,36,47,.35); background: rgba(209,36,47,.07); color: var(--err); }
  .alert.warn { border-color: rgba(178,94,9,.35); background: rgba(178,94,9,.08); color: var(--num); }
  .alert.ok { border-color: rgba(13,122,82,.35); background: rgba(13,122,82,.08); color: var(--ok); }

  /* ===== 加载指示（替代原来的 loading.gif，去掉 gh 浮动 CDN 依赖）===== */
  .spinner {
    width: 26px; height: 26px; margin: 20px auto;
    border: 3px solid var(--surface-2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  /* ===== 窄屏 ===== */
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 6px 8px; }
    .brand { font-size: 14px; }
    .stat { font-size: 11px; }
    header button { min-height: 38px; padding: 8px 14px; }
    main { padding: 10px; gap: 10px; }
    .card { padding: 12px; }
    .ssq-grid { gap: 8px; }
    .ssq-item { padding: 9px 10px; }
    .dropzone { min-height: 116px; padding: 14px; gap: 4px; }
  }
</style>
</head>

<body>

<header>
  <div class="brand">奕彩<span>SSQ</span></div>
  <span class="sep"></span>
  <span class="stat" id="data-update-time">数据加载中…</span>
  <span class="right">
    <button class="primary" id="up-btn" disabled init aria-label="上传投注票截图识别号码"></button>
    <input type="file" id="input-img" accept="image/*" hidden />
  </span>
</header>

<main>
  <section class="card">
    <h2>识别结果 <span class="hint">上传投注票截图后，自动识别期号与号码并核对中奖情况</span></h2>
    <div id="dataBody"></div>
  </section>

  <section class="card">
    <h2>历史开奖信息
      <span class="hint" id="ssq-total"></span>
    </h2>
    <div id="ssq-el" class="ssq-grid"></div>
    <div class="more"><button class="mini" id="btnMore">加载更多</button></div>
  </section>
</main>

<!-- 前端库已本地化到 vendor/（jquery 3.6.4 / tesseract.js 7.0.0 / Compressor.js 1.2.1）。
     策略：本地优先，文件缺失或损坏时才回退 CDN（同样锁版本）—— 两个方向都保住。
     OCR 的 worker / core / 语言包同样是本地文件（本目录 vendor/），在 initTesseractWorker() 里指定。
     开奖数据仍走线上接口（由爬虫定期重新生成，本地化会让数据冻结在打包那一刻）。 -->
<script src="vendor/jquery-3.6.4.min.js"></script>
<script>window.jQuery || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"><\/script>');</script>
<script>window.jQuery || document.write('<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"><\/script>');</script>
<script src='vendor/tesseract-7.0.0.min.js'></script>
<script>window.Tesseract || document.write('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"><\/script>');</script>
<script src='vendor/compressorjs-1.2.1.min.js' async="async"></script>
<script>
    /* Compressor 是 async 加载的，本地缺失时在 load 之后补一个 CDN 版本（上传前必然已就绪）。 */
    window.addEventListener('load', function () {
        if (window.Compressor) return;
        var s = document.createElement('script');
        s.src = 'https://cdn.bootcdn.net/ajax/libs/compressorjs/1.2.1/compressor.min.js';
        document.head.appendChild(s);
    });
</script>
<!-- <script src="https://fastly.jsdelivr.net/gh/midaug/dream-lottery/spider_data/ssq.js"></script> -->
<script src="https://100180.xyz/ssq/data/ssq.js"></script>
<script>
    var dataList = [];
    var dataMap = {};
    var currentPage = 0;
    var pageSize = 5;
    var lang = 'chi_sim+eng';
    var dataContainer = $('#dataBody');
    /* 加载指示用内联 CSS spinner，不再引 gh/<repo> 浮动地址上的 loading.gif
       （MEMORY.md：CDN 资源一律锁版本，禁 gh/master 浮动路径） */
    var loadingHtml = '<div class="spinner" role="status" aria-label="加载中"></div>';
    /* 空态 = 铺满卡片的投放区（可点击、可拖放）。不要退回成一行短文案：
       整宽卡片里左对齐的一行字会让右侧空一大片。 */
    var idleHtml = '<div class="dropzone" id="dropzone" role="button" tabindex="0"'
        + ' aria-label="上传投注票截图">'
        + '<svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
        + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'
        + '</svg>'
        + '<div class="dz-title">上传投注票截图</div>'
        + '<div class="dz-sub">点击选择图片，或把截图拖到这里</div>'
        + '</div>';

    function renderHistoryList(data, lastPage) {
        var container = $('#ssq-el');
        for (let i = 0; i < data.length; i++) {
            var item = data[i];
            var html = '<article class="ssq-item">';
            html += '<div class="ssq-head">';
            html += '<span class="code">' + esc(item.code) + '</span>';
            html += '<span class="draw">' + esc(item.drawDate) + '</span>';
            html += '</div>';
            html += '<div class="balls">';

            // 渲染红球
            for (var j = 1; j <= 6; j++) {
                var className = item['red' + j + 'f'] ? 'num red redf' : 'num red';
                html += '<span class="' + className + '">' + esc(item['red' + j]) + '</span>';
            }
            // 渲染蓝球
            var blueClass = item.blue1f ? 'num blue bluef' : 'num blue';
            html += '<span class="' + blueClass + '">' + esc(item.blue1) + '</span>';
            html += '</div>';
            html += '<div class="ssq-foot">';
            html += '<span>奖金 <b>' + esc(item.bonus) + '</b></span>';
            html += '<span>第 ' + (lastPage - data.length + i + 1) + ' 期</span>';
            html += '</div>';
            html += '</article>';
            container.append(html);
        }
        currentPage = lastPage;
    }

    function formatDate(timestamp) {
        var date = new Date(timestamp);
        var year = date.getFullYear();
        var month = date.getMonth() + 1;
        var day = date.getDate();
        var hours = date.getHours();
        var minutes = date.getMinutes();
        var seconds = date.getSeconds();

        month = month < 10 ? '0' + month : month;
        day = day < 10 ? '0' + day : day;
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
    }

    function loadMore(page) {
        if (currentPage >= dataList.length) { syncMoreBtn(); return; }
        var start = currentPage;
        var end = Math.min(currentPage + page, dataList.length);
        var slice = dataList.slice(start, end);
        renderHistoryList(slice, end);
        syncMoreBtn();
    }

    /* 「加载更多」按钮与「共 N 期」提示的同步（滚动触底与点按钮共用同一条路径） */
    function syncMoreBtn() {
        var more = document.getElementById('btnMore');
        if (more) more.disabled = currentPage >= dataList.length;
        var total = document.getElementById('ssq-total');
        if (total) total.textContent = '共 ' + dataList.length + ' 期 · 已显示 ' + currentPage + ' 期';
    }

    // 全局Tesseract worker变量
    let ocrWorker = null;

    /* OCR 运行时资源（本地文件，见 ssq/vendor/ —— 约 18MB，只有本页在用）：
       - workerPath：worker 脚本本身
       - corePath  ：传「目录」，tesseract 会按设备能力自动挑
                     tesseract-core-relaxedsimd-lstm / -simd-lstm / -lstm 三个变体之一（都已下载）
       - langPath  ：传「目录」，tesseract 会取 <lang>.traineddata.gz
                     lang = 'chi_sim+eng' → 需要 chi_sim 与 eng 两个语言包（都已下载）
       本地文件缺失时回退到 tesseract 内置的 CDN 默认值，保证不至于整块功能失效。 */
    const OCR_LOCAL_PATHS = {
        workerPath: 'vendor/tesseract-worker-7.0.0.min.js',
        corePath: 'vendor/tesseract-core-7.0.0',
        langPath: 'vendor/tessdata-4.0.0_best_int'
    };
    const ocrLogger = (m) => {
        // 简单的日志记录，避免复杂对象
        console.log('OCR进度:', m.status, Math.round(m.progress * 100) + '%');
    };

    // 初始化Tesseract worker
    async function initTesseractWorker() {
        if (ocrWorker) return ocrWorker;
        try {
            ocrWorker = await Tesseract.createWorker(lang, undefined,
                Object.assign({ logger: ocrLogger }, OCR_LOCAL_PATHS));
        } catch (error) {
            console.warn('本地 OCR 资源不可用，回退 CDN：', error);
            ocrWorker = await Tesseract.createWorker(lang, undefined, { logger: ocrLogger });
        }
        return ocrWorker;
    }

    // 等待ssq.js加载完成并处理数据
    var initAppRetries = 0;
    async function initApp() {
        // 检查数据是否已加载
        if (typeof window.ssqData === 'undefined') {
            if (++initAppRetries > 100) { // 最多等待10秒
                console.error('开奖数据加载超时');
                dataContainer.html('<div class="alert warn">开奖数据加载失败，请刷新重试</div>');
                $('#up-btn').removeAttr('disabled');
                $('#up-btn').removeAttr('init');   /* 一并摘掉 init，否则按钮显示「初始化中…」 */
                return;
            }
            setTimeout(initApp, 100); // 如果还没加载完成，等待100ms后再次检查
            return;
        }

        dataContainer.html(loadingHtml);

        // 处理从ssq.js获取的数据
        var lines = window.ssqData.split('\n');

    function validateNumber(num, min, max) {
        if (isNaN(num)) return false;
        // 严格校验：必须是纯数字（防止 parseInt 把 "12abc" 解析成 12）
        var s = String(num);
        if (!/^\d{1,2}$/.test(s)) return false;
        var intNum = parseInt(s);
        return intNum >= min && intNum <= max;
    }

    // HTML 转义：OCR 原文等不可信内容进入 innerHTML 前必须转义
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 补齐两位号码格式（用于比较时统一两侧格式）
    function pad2(v) {
        var s = String(parseInt(v, 10));
        return s.length < 2 ? ('0' + s) : s;
    }

    // 计算组合数 C(n, k)
    function combCount(n, k) {
        if (k < 0 || k > n) return 0;
        var r = 1;
        for (var i = 0; i < k; i++) r = r * (n - i) / (i + 1);
        return Math.round(r);
    }

    // 组合数安全上限，防止 OCR 误识别导致的组合爆炸（假死/OOM）
    var MAX_COMBINATIONS = 20000;

    function renderResult(ssqData, fileInfo) {

        dataContainer.html(html);

    function findPattern(text, patterns) {
        for (var i = 0; i < patterns.length; i++) {
            var pattern = patterns[i];
            var match = text.match(pattern);
            if (match && match.length > 0) {
                return match[0];
            }
        }
    }

    function parseCode(text) {
        var match = findPattern(text, [/20[012]\d{4}-\d{3}/g]);
        if (match) {
            return match.split('-')[0];
        }
        return findPattern(text, [/20[012]\d{4}/g]);
    }

    // 解析号码字符串为数组
    function parseNumberString(str, length) {
        var numbers = [];
        for (let i = 0; i < str.length; i += length) {
            if (i + length <= str.length) {
                var num = str.substring(i, i + length);
                numbers.push(num);
            }
        }
        return numbers;
    }

    // 安全添加号码到数组（避免重复）
    function safeAddNumbers(targetArray, numbersToAdd) {
        for (let i = 0; i < numbersToAdd.length; i++) {
            var num = numbersToAdd[i];
            if (!targetArray.includes(num)) {
                targetArray.push(num);
            }
        }
        return targetArray;
    }

    // 解析复式投注号码
    function parseCompoundBet(code) {
        // 复式投注格式示例: A123456789012345*060708$0102
        // A: 投注标识
        // 123456789012345: 基本投注号码(15位)
        // *: 复式分隔符
        // 060708: 额外红球(每两位一个号码)
        // $: 红蓝球分隔符
        // 0102: 额外蓝球(每两位一个号码)

        var zm = code.substring(0, 1);
        var basicCode = code.substring(1, 16); // 基本15位号码

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            basicRedBalls: [], // 基本红球
            basicBlueBall: '' // 基本蓝球
        };

        // 提取基本投注号码
        result.basicRedBalls = parseNumberString(basicCode.substring(0, 12), 2);
        result.redBalls = result.basicRedBalls.slice(); // 复制数组
        result.basicBlueBall = basicCode.substring(12, 14);
        result.blueBalls.push(result.basicBlueBall);

        // 检查是否有复式部分
        if (code.includes('*')) {
            var compoundPart = code.substring(16); // 复式部分

            // 分离红球和蓝球复式部分
            if (compoundPart.includes('$')) {
                var parts = compoundPart.split('$');
                var redCompound = parts[0]; // 红球复式部分
                var blueCompound = parts[1]; // 蓝球复式部分

                // 解析额外红球
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                var extraRedBalls = parseNumberString(redCompound, 2);
                safeAddNumbers(result.redBalls, extraRedBalls);

                // 解析额外蓝球
                var extraBlueBalls = parseNumberString(blueCompound, 2);
                safeAddNumbers(result.blueBalls, extraBlueBalls);
            } else {
                // 只有红球复式部分
                var redCompound = compoundPart;
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                var extraRedBalls = parseNumberString(redCompound, 2);
                safeAddNumbers(result.redBalls, extraRedBalls);
            }
        }

        return result;
    }

    // 解析胆拖投注号码
    function parseDragBet(code) {
        // 胆拖投注格式示例: A#0102$030405060708&01
        // #: 胆拖标识
        // 0102: 胆码红球
        // $: 胆拖分隔符
        // 030405060708: 拖码红球
        // &: 红蓝球分隔符
        // 01: 蓝球

        var zm = code.substring(0, 1);
        var dragPart = code.substring(1); // 胆拖部分

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            danRedBalls: [], // 胆码红球
            tuoRedBalls: [] // 拖码红球
        };

        if (dragPart.startsWith('#')) {
            dragPart = dragPart.substring(1);

            // 分离各部分
            var parts = dragPart.split('&');
            var blueBall = parts[1]; // 蓝球

            var redParts = parts[0].split('$');
            var danRed = redParts[0]; // 胆码红球
            var tuoRed = redParts[1]; // 拖码红球

            // 格式不完整时直接返回空结果，避免 parseNumberString(undefined) 抛 TypeError
            // ★ 蓝球（& 之后）也必须存在，否则 undefined 会被 push 进 blueBalls 并参与算奖
            if (!danRed || !tuoRed || !blueBall) {
                console.warn('胆拖投注格式不完整:', code);
                return result;
            }

            // 解析胆码红球
            result.danRedBalls = parseNumberString(danRed, 2);
            result.redBalls = result.danRedBalls.slice(); // 复制数组

            // 解析拖码红球
            result.tuoRedBalls = parseNumberString(tuoRed, 2);
            result.redBalls = result.redBalls.concat(result.tuoRedBalls);

            // 解析蓝球
            result.blueBalls.push(blueBall);
        }

        return result;
    }

    // 生成投注组合的通用函数
    function generateBetCombinations(redBalls, blueBalls, options) {
        var combinations = [];

        // 处理胆拖特殊情况
        if (options && options.danRedBalls) {
            // 胆拖投注处理
            var needFromTuo = 6 - options.danRedBalls.length;
            var tuoCombinations = getCombinations(options.tuoRedBalls, needFromTuo);

            // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸
            var estTotal = tuoCombinations.length * blueBalls.length;
            if (estTotal > MAX_COMBINATIONS) {
                throw new Error('投注组合数过多(' + estTotal + ')，请检查投注码是否正确');
            }

            // 组合胆码和拖码组合
            for (let i = 0; i < tuoCombinations.length; i++) {
                var combinedRed = options.danRedBalls.concat(tuoCombinations[i]);
                for (let j = 0; j < blueBalls.length; j++) {
                    combinations.push({
                        redBalls: combinedRed,
                        blueBall: blueBalls[j]
                    });
                }
            }
        } else {
            // 普通复式投注处理
            var redCombinations = getCombinations(redBalls, 6);

            // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸
            var estTotal = redCombinations.length * blueBalls.length;
            if (estTotal > MAX_COMBINATIONS) {
                throw new Error('投注组合数过多(' + estTotal + ')，请检查投注码是否正确');
            }

            // 为每个红球组合配对所有蓝球
            for (let i = 0; i < redCombinations.length; i++) {
                for (let j = 0; j < blueBalls.length; j++) {
                    combinations.push({
                        redBalls: redCombinations[i],
                        blueBall: blueBalls[j]
                    });
                }
            }
        }

        return combinations;
    }

    // 生成复式投注的所有组合
    function generateCompoundCombinations(redBalls, blueBalls) {
        return generateBetCombinations(redBalls, blueBalls);
    }

    // 生成胆拖投注的所有组合
    function generateDragCombinations(danRedBalls, tuoRedBalls, blueBalls) {
        return generateBetCombinations(null, blueBalls, {
            danRedBalls: danRedBalls,
            tuoRedBalls: tuoRedBalls
        });
    }

    // 计算组合数
    function getCombinations(arr, size) {
        var result = [];

        // 防止组合爆炸：C(30,6)≈59万，OCR误识别可导致页面假死/OOM
        var est = combCount(arr.length, size);
        if (est > MAX_COMBINATIONS) {
            throw new Error('投注组合数过多(' + est + ')，请检查识别结果是否正确');
        }
        // k>n 或 k<0 时组合恒为空，直接返回（否则递归会枚举全部 2^n 个子集）
        if (size > arr.length || size < 0) {
            return result;
        }

        function combine(subset, start) {
            if (subset.length === size) {
                result.push(subset.slice());
                return;
            }

            for (let i = start; i < arr.length; i++) {
                subset.push(arr[i]);
                combine(subset, i + 1);
                subset.pop();
            }
        }

        combine([], 0);
        return result;
    }

    // 判断单注中奖情况
    function determinePrize(redMatchCount, blueMatch, ssqData) {
        var bonusText = '无';
        var rewardValue = '0';

        if (redMatchCount === 6 && blueMatch) {
            bonusText = '一等奖';
            rewardValue = ssqData.bonus;
        } else if (redMatchCount === 6) {
            bonusText = '二等奖';
            rewardValue = ssqData.reward;
        } else if (redMatchCount === 5 && blueMatch) {
            bonusText = '三等奖';
            rewardValue = '3000';
        } else if (redMatchCount === 5 || (redMatchCount === 4 && blueMatch)) {
            bonusText = '四等奖';
            rewardValue = '200';
        } else if (redMatchCount === 4 || (redMatchCount === 3 && blueMatch)) {
            bonusText = '五等奖';
            rewardValue = '10';
        } else if (blueMatch) {
            bonusText = '六等奖';
            rewardValue = '5';
        }

        return {
            bonusText: bonusText,
            rewardValue: rewardValue
        };
    }

    // 检查单注是否中奖并更新结果对象
    function checkSingleBetPrize(betResult, redBalls, winningBlue, ssqData) {
        var redMatchCount = 0;

        // 中奖号码统一为两位补零格式后比较，避免 "7" 与 "07" 格式不一致导致漏判
        var winRed = {};
        for (var r = 0; r < redBalls.length; r++) {
            winRed[pad2(redBalls[r])] = true;
        }

        // 检查红球匹配数量
        // ★ 按「不同号码」计数：输入若含重复红球（如 A01010101010107），
        //   逐位计数会把一个号算六次 → 假一等奖。命中标记仍打在每一个匹配位上。
        var matchedRed = {};
        for (let i = 1; i <= 6; i++) {
            var nr = pad2(betResult['red' + i]);
            if (winRed[nr]) {
                betResult['red' + i + 'f'] = true;
                matchedRed[nr] = true;
            }
        }
        redMatchCount = Object.keys(matchedRed).length;

        // 检查蓝球是否匹配
        if (pad2(betResult.blue1) === pad2(winningBlue)) {
            betResult.blue1f = true;
        }

        // 根据匹配结果确定奖项
        var prize = determinePrize(redMatchCount, betResult.blue1f, ssqData);
        betResult.bonusText = prize.bonusText;
        betResult.rewardValue = prize.rewardValue;

        return redMatchCount;
    }

    // 检查组合是否中奖并更新结果对象
    function checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData) {
        var redMatchCount = 0;

        // 中奖号码统一为两位补零格式后比较，避免 "7" 与 "07" 格式不一致导致漏判
        var winRed = {};
        for (var r = 0; r < redBalls.length; r++) {
            winRed[pad2(redBalls[r])] = true;
        }

        // 检查红球匹配数量（★ 按不同号码计数 —— 胆拖胆拖码重叠时同一号码会重复出现）
        var matchedRed2 = {};
        for (let j = 0; j < comboResult.redBalls.length; j++) {
            var nr2 = pad2(comboResult.redBalls[j]);
            if (winRed[nr2]) {
                comboResult['red' + (j + 1) + 'f'] = true;
                matchedRed2[nr2] = true;
            }
        }
        redMatchCount = Object.keys(matchedRed2).length;

        // 检查蓝球是否匹配
        if (pad2(comboResult.blueBall) === pad2(winningBlue)) {
            comboResult.blue1f = true;
        }

        // 根据匹配结果确定奖项
        var prize = determinePrize(redMatchCount, comboResult.blue1f, ssqData);
        comboResult.bonusText = prize.bonusText;
        comboResult.rewardValue = prize.rewardValue;

        return {
            redMatchCount: redMatchCount,
            prize: prize
        };
    }

    // 解析复式投注号码（增强版）
    function parseCompoundBetEnhanced(code) {
        // 支持更多复式格式
        // 格式1: A123456789012345*060708$0102
        // 格式2: A123456789012345*06070809
        // 格式3: A123456789012345$0102
        // 格式4: A123456789012345*060708$010203 (多个蓝球)
        // 格式5: A123456789012345*0607080910$0102 (多个红球和蓝球)

        var zm = code.substring(0, 1);
        var basicCode = code.substring(1, 16); // 基本15位号码

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            basicRedBalls: [], // 基本红球
            basicBlueBall: '' // 基本蓝球
        };

        // 提取基本投注号码
        for (let i = 0; i < 6; i++) {
            var redBall = basicCode.substring(i * 2, i * 2 + 2);
            result.basicRedBalls.push(redBall);
            result.redBalls.push(redBall);
        }
        result.basicBlueBall = basicCode.substring(12, 14);
        result.blueBalls.push(result.basicBlueBall);

        // 检查是否有复式部分
        if (code.includes('*') || code.includes('$')) {
            var compoundPart = code.substring(16); // 复式部分

            // 处理不同格式
            if (compoundPart.includes('*') && compoundPart.includes('$')) {
                // 格式1,4,5: *红球$蓝球
                var parts = compoundPart.split('$');
                var redCompound = parts[0]; // 红球复式部分
                var blueCompound = parts[1]; // 蓝球复式部分

                // 解析额外红球
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                for (let i = 0; i < redCompound.length; i += 2) {
                    if (i + 2 <= redCompound.length) {
                        var redBall = redCompound.substring(i, i + 2);
                        if (!result.redBalls.includes(redBall)) {
                            result.redBalls.push(redBall);
                        }
                    }
                }

                // 解析额外蓝球
                for (let i = 0; i < blueCompound.length; i += 2) {
                    if (i + 2 <= blueCompound.length) {
                        var blueBall = blueCompound.substring(i, i + 2);
                        if (!result.blueBalls.includes(blueBall)) {
                            result.blueBalls.push(blueBall);
                        }
                    }
                }
            } else if (compoundPart.includes('*')) {
                // 格式2: *红球
                var redCompound = compoundPart;
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                for (let i = 0; i < redCompound.length; i += 2) {
                    if (i + 2 <= redCompound.length) {
                        var redBall = redCompound.substring(i, i + 2);
                        if (!result.redBalls.includes(redBall)) {
                            result.redBalls.push(redBall);
                        }
                    }
                }
            } else if (compoundPart.includes('$')) {
                // 格式3: $蓝球
                var blueCompound = compoundPart;
                if (blueCompound.startsWith('$')) {
                    blueCompound = blueCompound.substring(1);
                }

                // 解析额外蓝球
                for (let i = 0; i < blueCompound.length; i += 2) {
                    if (i + 2 <= blueCompound.length) {
                        var blueBall = blueCompound.substring(i, i + 2);
                        if (!result.blueBalls.includes(blueBall)) {
                            result.blueBalls.push(blueBall);
                        }
                    }
                }
            }
        }

        // 值域与数量校验：红球 01-33 且 ≤33 个，蓝球 01-16 且 ≤16 个
        // （复式部分逐 2 位切片解析，OCR 误识别可产生越界值或超量蓝球）
        if (result.redBalls.length > 33) {
            throw new Error('红球数量异常(' + result.redBalls.length + '个)，请检查投注码');
        }
        if (result.blueBalls.length > 16) {
            throw new Error('蓝球数量异常(' + result.blueBalls.length + '个)，请检查投注码');
        }
        for (let i = 0; i < result.redBalls.length; i++) {
            var rv = parseInt(result.redBalls[i], 10);
            if (!(rv >= 1 && rv <= 33)) {
                throw new Error('红球号码越界(' + result.redBalls[i] + ')，请检查投注码');
            }
        }
        for (let i = 0; i < result.blueBalls.length; i++) {
            var bv = parseInt(result.blueBalls[i], 10);
            if (!(bv >= 1 && bv <= 16)) {
                throw new Error('蓝球号码越界(' + result.blueBalls[i] + ')，请检查投注码');
            }
        }

        return result;
    }

    // 更新checkWinning函数以使用增强版解析
    function checkWinning(ssqData, code) {
        var redBalls = [ssqData.red1, ssqData.red2, ssqData.red3, ssqData.red4, ssqData.red5, ssqData.red6];
        var winningBlue = ssqData.blue1;

        // 判断投注类型
        var betType = 'single'; // 默认单式

        // 检查是否为标准格式的投注代码（包含特殊符号）
        // 注意：胆拖格式(A#0102$0304...&01)同时包含 # 和 $，必须先判断 # 否则胆拖会被误判为复式
        if (code.includes('#')) {
            betType = 'drag'; // 胆拖
        } else if (code.includes('*') || code.includes('$')) {
            betType = 'compound'; // 复式
        } else if (typeof code === 'string' && code.length > 50) {
            // 如果是长字符串，可能是OCR文本
            betType = 'ocr_text';
        }

        var result = {
            code: ssqData.code,
            drawDate: ssqData.drawDate,
            betType: betType,
            bonusText: '无',
            rewardValue: '0',
            details: []
        };

        if (betType === 'ocr_text') {
            // 对于OCR文本，使用备用解析方法
            var fallbackResult = tryFallbackParsing(code, ssqData);
            if (fallbackResult && fallbackResult.details && fallbackResult.details.length > 0) {
                return fallbackResult;
            }
            // 如果备用解析也失败，则尝试增强型解析
            var enhancedResult = tryEnhancedFallbackParsing(code, ssqData);
            if (enhancedResult && enhancedResult.details && enhancedResult.details.length > 0) {
                return enhancedResult;
            }
            // ★ 解析全失败时不能伪造一个默认号码去算奖 —— 那会给用户一个假的中奖结果，
            //   比直接报错更危险。如实标记为无法识别，交给 renderResult 提示。
            result.bonusText = '无法识别';
            return result;
        } else if (betType === 'single') {
            // 单式投注处理
            var zm = code.substring(0, 1);
            var red1 = code.substring(1, 3);
            var red2 = code.substring(3, 5);
            var red3 = code.substring(5, 7);
            var red4 = code.substring(7, 9);
            var red5 = code.substring(9, 11);
            var red6 = code.substring(11, 13);
            var blue1 = code.substring(13, 15);

            var singleResult = {
                zm: zm,
                red1: red1,
                red2: red2,
                red3: red3,
                red4: red4,
                red5: red5,
                red6: red6,
                blue1: blue1,
                red1f: false,
                red2f: false,
                red3f: false,
                red4f: false,
                red5f: false,
                red6f: false,
                blue1f: false,
                bonusText: '无',
                rewardValue: '0'
            };

            // 检查中奖情况
            checkSingleBetPrize(singleResult, redBalls, winningBlue, ssqData);

            result.details.push(singleResult);
            result.bonusText = singleResult.bonusText;
            result.rewardValue = singleResult.rewardValue;
        } else if (betType === 'compound') {
            // 复式投注处理
            var compoundData = parseCompoundBetEnhanced(code);
            var combinations = generateCompoundCombinations(compoundData.redBalls, compoundData.blueBalls);

            var totalReward = 0;
            var hasPrize = false;

            for (let i = 0; i < combinations.length; i++) {
                var combo = combinations[i];
                var comboResult = {
                    redBalls: combo.redBalls,
                    blueBall: combo.blueBall,
                    red1f: false,
                    red2f: false,
                    red3f: false,
                    red4f: false,
                    red5f: false,
                    red6f: false,
                    blue1f: false,
                    bonusText: '无',
                    rewardValue: '0'
                };

                // 检查组合中奖情况
                var checkResult = checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData);
                if (checkResult.prize.rewardValue && parseInt(checkResult.prize.rewardValue) > 0) {
                    totalReward += parseInt(checkResult.prize.rewardValue);
                    hasPrize = true;
                }

                result.details.push(comboResult);
            }

            if (hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = totalReward.toString();
            }
        } else if (betType === 'drag') {
            // 胆拖投注处理
            var dragData = parseDragBet(code);
            var combinations = generateDragCombinations(dragData.danRedBalls, dragData.tuoRedBalls, dragData.blueBalls);

            var totalReward = 0;
            var hasPrize = false;

            for (let i = 0; i < combinations.length; i++) {
                var combo = combinations[i];
                var comboResult = {
                    redBalls: combo.redBalls,
                    blueBall: combo.blueBall,
                    red1f: false,
                    red2f: false,
                    red3f: false,
                    red4f: false,
                    red5f: false,
                    red6f: false,
                    blue1f: false,
                    bonusText: '无',
                    rewardValue: '0'
                };

                // 检查组合中奖情况
                var checkResult = checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData);
                if (checkResult.prize.rewardValue && parseInt(checkResult.prize.rewardValue) > 0) {
                    totalReward += parseInt(checkResult.prize.rewardValue);
                    hasPrize = true;
                }

                result.details.push(comboResult);
            }

            if (hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = totalReward.toString();
            }
        }

        return result;
    }

    // 解析OCR格式的复式投注（增强版）
    function parseOCRSpec(text) {
        console.log("解析OCR格式复式投注:", text);

        // 查找红球号码（支持多种格式：zw:, ax:, 红球, red等）
        var redMatch = text.match(/(?:zw|ax|红\s*球|red)[:\s]*([\d\s]+)/i);
        // 如果上面的模式没找到，尝试查找连续的红球号码模式
        if (!redMatch) {
            // 查找至少6个连续的两位数字（红球号码）
            redMatch = text.match(/(\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}(?:\s+\d{1,2})*)/);
        }

        // 查找蓝球号码（支持多种格式：wm:, 蓝单:, 蓝球, blue等）
        var blueMatch = text.match(/(?:wm|蓝\s*单|蓝\s*球|blue)[:\s]*([\d\s]+)/i);

        if (!redMatch || !blueMatch) {
            return null;
        }

        // 提取红球和蓝球号码
        var redNumbers = redMatch[1].match(/\d{1,2}/g) || [];
        var blueNumbers = blueMatch[1].match(/\d{1,2}/g) || [];

        // 转换为两位数格式，并过滤掉不合法的号码（红球01-33、蓝球01-16，同时过滤OCR噪声）
        redNumbers = redNumbers.map(num => String(parseInt(num)).padStart(2, '0'))
            .filter(num => parseInt(num) >= 1 && parseInt(num) <= 33);
        blueNumbers = blueNumbers.map(num => String(parseInt(num)).padStart(2, '0'))
            .filter(num => parseInt(num) >= 1 && parseInt(num) <= 16);

        console.log("提取的红球:", redNumbers);
        console.log("提取的蓝球:", blueNumbers);

        // 防止OCR误识别导致组合爆炸：数量超过正常复式票范围时放弃此解析路径。
        // 红球上限 18 与 MAX_COMBINATIONS=20000 对齐（C(19,6)=27132 必撞闸门，提前拦截）；
        // 蓝球上限 16 为双色球全部取值，红×蓝总量闸门在 generateOCRSpecCombinations 里兜底。
        if (redNumbers.length > 18 || blueNumbers.length > 16) {
            console.warn("红球/蓝球数量异常，放弃OCR复式解析:", redNumbers.length, blueNumbers.length);
            return null;
        }

        // 判断是否为复式投注（红球超过6个或蓝球超过1个）
        if (redNumbers.length > 6 || blueNumbers.length > 1) {
            return {
                redBalls: redNumbers,
                blueBalls: blueNumbers,
                isCompound: true
            };
        }

        // 如果是标准单注
        if (redNumbers.length >= 6 && blueNumbers.length >= 1) {
            return {
                redBalls: redNumbers.slice(0, 6),
                blueBalls: [blueNumbers[0]],
                isCompound: false
            };
        }

        return null;
    }

    // 生成OCR复式投注的所有组合
    function generateOCRSpecCombinations(ocrSpec) {
        var combinations = [];

        if (!ocrSpec.isCompound) {
            // 单注直接返回
            combinations.push({
                redBalls: ocrSpec.redBalls,
                blueBall: ocrSpec.blueBalls[0]
            });
            return combinations;
        }

        // 生成红球组合
        var redCombinations = [];
        if (ocrSpec.redBalls.length >= 6) {
            redCombinations = getCombinations(ocrSpec.redBalls, 6);
        } else {
            // 如果红球不足6个，这可能是个错误
            redCombinations = [ocrSpec.redBalls];
        }

        // 为每个红球组合配对所有蓝球
        // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸（OCR误识别 18红×16蓝=29.7万组合可穿透单层闸门）
        var estTotal = redCombinations.length * ocrSpec.blueBalls.length;
        if (estTotal > MAX_COMBINATIONS) {
            throw new Error('投注组合数过多(' + estTotal + ')，请检查识别结果是否正确');
        }
        for (let i = 0; i < redCombinations.length; i++) {
            for (let j = 0; j < ocrSpec.blueBalls.length; j++) {
                combinations.push({
                    redBalls: redCombinations[i],
                    blueBall: ocrSpec.blueBalls[j]
                });
            }
        }

        return combinations;
    }

    // 解析新的单注OCR格式（增强版）
    function parseSingleOCRSpec(text) {
        console.log("解析单注OCR格式:", text);

        // 查找所有符合格式的投注行，例如: A.06 14 15 19 22 30-03
        var lines = text.match(/[A-E]\.[\d\s\-]+\(?\d*\)?/g);
        if (!lines || lines.length === 0) {
            return null;
        }

        var bets = [];

        for (let i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            console.log("处理行:", line);

            // 提取字母前缀（A-E）
            var letterMatch = line.match(/^([A-E])\./);
            if (!letterMatch) continue;

            // 提取号码部分（去除字母和倍数）
            var numbersPart = line.substring(2); // 去掉"A."
            numbersPart = numbersPart.replace(/\(\d*\)$/, ''); // 去掉倍数部分(2)

            // 分离红球和蓝球
            var parts = numbersPart.split('-');
            if (parts.length !== 2) continue;

            var redPart = parts[0].trim();
            var bluePart = parts[1].trim();

            // 解析红球号码
            var redNumbers = redPart.match(/\d+/g) || [];
            // 确保红球号码是两位数格式
            redNumbers = redNumbers.map(num => String(parseInt(num)).padStart(2, '0'));

            // 解析蓝球号码
            var blueNumber = String(parseInt(bluePart)).padStart(2, '0');

            // 验证号码数量
            if (redNumbers.length >= 6) {
                bets.push({
                    letter: letterMatch[1],
                    redBalls: redNumbers.slice(0, 6), // 只取前6个
                    blueBall: blueNumber
                });
            }
        }

        return bets.length > 0 ? bets : null;
    }

    // 检查投注组合的中奖情况
    function checkBetCombinations(combinations, ssqData) {
        var noteDtos = [];
        var totalReward = 0;
        var hasPrize = false;

        for (let i = 0; i < combinations.length; i++) {
            var combo = combinations[i];

            // 构造一个虚拟的投注代码用于checkWinning函数
            var fakeCode = "A";
            for (let j = 0; j < 6 && j < combo.redBalls.length; j++) {
                fakeCode += combo.redBalls[j];
            }
            fakeCode += combo.blueBall;

            // 检查这个组合是否中奖
            var comboResult = checkWinning(ssqData, fakeCode);
            if (comboResult.details && comboResult.details.length > 0) {
                var detail = comboResult.details[0];
                if (detail.rewardValue && parseInt(detail.rewardValue) > 0) {
                    totalReward += parseInt(detail.rewardValue);
                    hasPrize = true;
                }
                noteDtos.push(comboResult);
            }
        }

        return {
            noteDtos: noteDtos,
            totalReward: totalReward,
            hasPrize: hasPrize
        };
    }

    function processOCRResult(text, fileInfo) {
        console.log("原始OCR文本:", text);
        var code = parseCode(text);

        if (!code) {
            dataContainer.html('<div class="alert err">无法识别期号: ' + esc(text) + '</div>');
            $('#up-btn').removeAttr('disabled');
            return;
        }

        var ssqData = dataMap[code];

        if (!ssqData) {
            dataContainer.html('<div class="alert err">未找到期号 ' + esc(code) + ' 的开奖数据</div>');
            $('#up-btn').removeAttr('disabled');
            return;
        }

        console.log(code, ssqData);

        var result = {
            code: code,
            drawDate: ssqData.drawDate
        };

        // 首先尝试解析OCR格式的复式投注 (zw: 和 wm: 格式)
        var ocrSpec = parseOCRSpec(text);
        if (ocrSpec) {
            console.log("OCR复式规格解析结果:", ocrSpec);

            // 生成所有组合
            var combinations = generateOCRSpecCombinations(ocrSpec);
            console.log("生成的组合:", combinations);

            // 检查每个组合的中奖情况
            var checkResult = checkBetCombinations(combinations, ssqData);

            // 构造最终结果
            result.noteDtos = checkResult.noteDtos;
            if (checkResult.hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = checkResult.totalReward.toString();
            } else {
                result.bonusText = '无';
                result.rewardValue = '0';
            }

            renderResult(result, fileInfo);
            return;
        }

        // 然后尝试解析新的单注OCR格式 (A.06 14 15 19 22 30-03 格式)
        var singleBets = parseSingleOCRSpec(text);
        if (singleBets) {
            console.log("单注OCR解析结果:", singleBets);

            // 检查每个投注的中奖情况
            var checkResult = checkBetCombinations(singleBets, ssqData);

            // 构造最终结果
            result.noteDtos = checkResult.noteDtos;
            if (checkResult.hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = checkResult.totalReward.toString();
            } else {
                result.bonusText = '无';
                result.rewardValue = '0';
            }

            renderResult(result, fileInfo);
            return;
        }

        // 如果以上解析都失败，使用原有的处理逻辑
        // 更智能的文本清理，保留更多有用字符
        var cleanText = text.replace(/[^\w\d\s\-\:\#\*\$\.\,\;]/gi, ' ');
        console.log("清理后的文本:", cleanText);

        // 查找可能的投注号码（更灵活的模式）
        var codes = findAllPatterns(cleanText, /[A-E][\d\#\*\$]+/g);
        console.log("找到的投注号码:", codes);

        var noteDtos = [];

        for (var i = 0; i < codes.length; i++) {
            // 进一步清理每个投注号码
            var cleanedCode = codes[i].replace(/\s+/g, '');
            console.log("清理后的投注号码:", cleanedCode);

            if (cleanedCode.length >= 15) { // 至少要有基本长度
                noteDtos.push(checkWinning(ssqData, cleanedCode));
            }
        }

        // 如果没找到标准格式，尝试从文本中提取红球和蓝球号码
        if (noteDtos.length === 0) {
            var fallbackResult = tryFallbackParsing(text, ssqData);
            if (fallbackResult) {
                noteDtos.push(fallbackResult);
            }
        }

        // 如果仍然没有结果，尝试另一种解析方式
        if (noteDtos.length === 0) {
            var enhancedResult = tryEnhancedFallbackParsing(text, ssqData);
            if (enhancedResult) {
                noteDtos.push(enhancedResult);
            }
        }

        // 如果仍然没有结果，将整个OCR文本作为特殊处理
        if (noteDtos.length === 0) {
            // 直接将OCR文本传递给checkWinning函数进行特殊处理
            noteDtos.push(checkWinning(ssqData, text));
        }

        result.noteDtos = noteDtos;
        renderResult(result, fileInfo);
    }

    // 查找所有匹配的模式
    function findAllPatterns(text, pattern) {
        var matches = [];
        var match;
        while ((match = pattern.exec(text)) !== null) {
            matches.push(match[0]);
        }
        return matches;
    }

    // 增强型备用解析方法：处理更复杂的OCR文本格式（增强版）
    function tryEnhancedFallbackParsing(text, ssqData) {
        console.log("使用增强型备用解析方法");
        console.log("完整OCR文本:", text);

        // 移除多余的空格和换行符
        var cleanText = text.replace(/\s+/g, ' ').trim();
        console.log("清理后的文本:", cleanText);

        // 尝试提取红球号码（寻找包含6个或更多数字的序列，支持一位数和两位数）
        var redBallMatches = cleanText.match(/(\d{1,2}\s+){5}\d{1,2}/);
        var redBalls = [];
        if (redBallMatches) {
            redBalls = redBallMatches[0].match(/\d{1,2}/g);
            // 转换为两位数格式
            redBalls = redBalls.map(num => String(parseInt(num)).padStart(2, '0'));
            console.log("提取到的红球号码:", redBalls);
        }

        // 尝试提取蓝球号码（通常在文本末尾，是1-16之间的数字）
        var blueBall = null;
        var blueMatches = cleanText.match(/\b([1-9]|1[0-6])\b/g);
        if (blueMatches) {
            // 取最后一个有效的蓝球号码
            for (var i = blueMatches.length - 1; i >= 0; i--) {
                var num = parseInt(blueMatches[i]);
                if (num >= 1 && num <= 16) {
                    blueBall = String(num).padStart(2, '0');
                    break;
                }
            }
            console.log("提取到的蓝球号码:", blueBall);
        }

        // 如果通过上述方法找到了足够的信息
        if (redBalls && redBalls.length >= 6 && blueBall) {
            // 构造投注代码
            var fakeCode = "A";
            for (var i = 0; i < 6 && i < redBalls.length; i++) {
                fakeCode += redBalls[i];
            }
            fakeCode += blueBall;

            console.log("增强型解析构造的代码:", fakeCode);
            return checkWinning(ssqData, fakeCode);
        }

        return null;
    }

    // 备用解析方法：直接从文本中提取红球和蓝球号码（增强版）
    function tryFallbackParsing(text, ssqData) {
        console.log("使用备用解析方法");
        console.log("完整OCR文本:", text);

        // 查找类似 "zw:05 07 08 12 14 20 31" 或 "ax: 5 10 14 17 19 23 28" 的红球号码（支持多种格式）
        var redMatch = text.match(/(?:zw|ax|红\s*球|red)[:\s]*([\d\s]+)/i);
        // 如果上面的模式没找到，尝试查找连续的红球号码模式
        if (!redMatch) {
            // 查找至少6个连续的两位数字（红球号码）
            redMatch = text.match(/(\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}(?:\s+\d{1,2})*)/);
        }

        // 查找类似 "wm: 07" 或 "蓝 单 : 10" 的蓝球号码
        var blueMatch = text.match(/(?:wm|蓝\s*单|蓝\s*球|blue)[:\s]*([\d\s]+)/i);
        // 如果上面的模式没找到，尝试在文本中查找单独的蓝球号码
        if (!blueMatch) {
            // 查找文本中的蓝球号码（1-16范围内的数字）
            var allNumbers = text.match(/\b(\d{1,2})\b/g) || [];
            // 蓝球通常是1-16之间的数字，查找最后一个符合条件的
            for (var i = allNumbers.length - 1; i >= 0; i--) {
                var num = parseInt(allNumbers[i]);
                if (num >= 1 && num <= 16) {
                    blueMatch = ["", allNumbers[i]];
                    break;
                }
            }
        }

        // 特殊处理示例中的格式
        if (!redMatch) {
            // 处理 "zw:05 07 08 12 14 20 31" 这样的格式
            var zwMatch = text.match(/zw\s*:?\s*(\d{2}(?:\s+\d{2})+)/i);
            if (zwMatch) {
                redMatch = [zwMatch[0], zwMatch[1]];
            }

            // 处理 "ax: 5 10 14 17 19 23 28" 这样的格式
            var axMatch = text.match(/ax\s*:?\s*(\d{1,2}(?:\s+\d{1,2})+)/i);
            if (axMatch) {
                redMatch = [axMatch[0], axMatch[1]];
            }

            // 处理 "红 球 : 5 10 14 17 19 23 28" 这样的格式
            var redBallMatch = text.match(/红\s*球\s*:?\s*(\d{1,2}(?:\s+\d{1,2})+)/i);
            if (redBallMatch) {
                redMatch = [redBallMatch[0], redBallMatch[1]];
            }
        }

        if (!blueMatch) {
            // 处理 "wm: 07" 这样的格式
            var wmMatch = text.match(/wm\s*:?\s*(\d{1,2})/i);
            if (wmMatch) {
                blueMatch = [wmMatch[0], wmMatch[1]];
            }

            // 处理 "蓝 单 : 10" 这样的格式
            var lanDanMatch = text.match(/蓝\s*单\s*:?\s*(\d{1,2})/i);
            if (lanDanMatch) {
                blueMatch = [lanDanMatch[0], lanDanMatch[1]];
            }

            // 处理 "蓝 球 : 10" 这样的格式
            var blueBallMatch = text.match(/蓝\s*球\s*:?\s*(\d{1,2})/i);
            if (blueBallMatch) {
                blueMatch = [blueBallMatch[0], blueBallMatch[1]];
            }
        }

        console.log("红球匹配结果:", redMatch);
        console.log("蓝球匹配结果:", blueMatch);

        if (redMatch) {
            var redNumbers = redMatch[1].match(/\d{1,2}/g) || [];
            console.log("提取到的红球号码:", redNumbers);

            var blueNumbers = [];
            if (blueMatch) {
                // 蓝球可能是1位或2位数���
                var blueText = blueMatch[1];
                blueNumbers = blueText.match(/\d{1,2}/g) || [];
                console.log("提取到的蓝球号码:", blueNumbers);
            }

            // 如果没有找到蓝球，尝试从文本末尾查找
            if (blueNumbers.length === 0) {
                var allNumbers = text.match(/\d{1,2}/g) || [];
                // 蓝球通常是最后出现的1-16之间的数字
                for (var i = allNumbers.length - 1; i >= 0; i--) {
                    var num = parseInt(allNumbers[i]);
                    if (num >= 1 && num <= 16) {
                        blueNumbers = [String(num)]; // 不需要补零，后面会处理
                        break;
                    }
                }
            }

            if (redNumbers.length >= 6 && blueNumbers.length >= 1) {
                // 构造一个虚拟的投注代码
                var fakeCode = "A";
                // 添加前6个红球
                for (var i = 0; i < 6 && i < redNumbers.length; i++) {
                    fakeCode += String(parseInt(redNumbers[i])).padStart(2, '0');
                }
                // 添加第一个蓝球（确保是两位数格式）
                var blueBall = String(parseInt(blueNumbers[0])).padStart(2, '0');
                fakeCode += blueBall;

                console.log("备用解析构造的代码:", fakeCode);

                // 直接返回checkWinning的结果
                return checkWinning(ssqData, fakeCode);
            }
        }

        return null;
    }

    $('#up-btn').click(function () {
        $('#input-img').click();
    });

    function formatFileSize(bytes, decimals = 2, k = 1024) {
        if (bytes === 0) return '0 Bytes';
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(Math.max(0, dm))) + ' ' + sizes[i];
    }

    async function handleImage(file) {
        $('#up-btn').attr('disabled', 'disabled');
        const t1 = window.performance.now();
        dataContainer.html(loadingHtml);

        /* Compressor 是 async 加载的，可能还没就绪或本地文件缺失；此前不在 try 内，抛错会让按钮永久灰死 */
        if (typeof Compressor === 'undefined') {
            dataContainer.html('<div class="alert err">图片压缩库（Compressor.js）加载失败，请刷新页面重试。</div>');
            $('#up-btn').removeAttr('disabled');
            return;
        }

        new Compressor(file, {
            quality: 0.9,
            maxWidth: 800,
            success: async function (compressedFile) {
                const t2 = window.performance.now();
                var fileInfo = {
                    compressionTime: ((t2 - t1) / 1000).toFixed(3) + '秒',
                    originalSize: formatFileSize(file.size),
                    compressedSize: formatFileSize(compressedFile.size),
                    compressionRatio: (compressedFile.size / file.size * 100).toFixed(2) + '%'
                };

                const t3 = window.performance.now();

                try {
                    // 使用Tesseract.js 7.0的新API
                    const worker = await initTesseractWorker();
                    const result = await worker.recognize(compressedFile);

                    fileInfo.recognitionTime = ((window.performance.now() - t3) / 1000).toFixed(3) + '秒';
                    console.log(fileInfo);
                    processOCRResult(result.data.text, fileInfo);
                } catch (error) {
                    console.error('OCR识别失败:', error);
                    dataContainer.html('<div class="alert err">OCR识别失败: ' + esc(error && error.message ? error.message : error) + '</div>');
                    $('#up-btn').removeAttr('disabled');
                }
            },
            error(err) {
                console.error(err);
                /* 压缩失败也要清掉加载态，否则按钮永久灰死、转圈永远不停 */
                dataContainer.html('<div class="alert err">图片压缩失败: ' + esc(err && err.message ? err.message : String(err)) + '</div>');
                $('#up-btn').removeAttr('disabled');
            }
        });
    }

    $('#input-img').change(function (e) {
        if (!this.files || !this.files[0]) return; // 用户取消选择时不处理
        handleImage(this.files[0]);
        this.value = ''; // 立即重置，否则同一张图二次选择不触发 change
    });

    /* ===== 投放区（#dropzone 由 idleHtml 动态生成，故用委托绑定）===== */
    $(document)
        .on('click', '#dropzone', function () {
            $('#input-img').click();
        })
        .on('keydown', '#dropzone', function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                $('#input-img').click();
            }
        })
        .on('dragenter dragover', '#dropzone', function (e) {
            e.preventDefault();
            $(this).addClass('dragover');
        })
        .on('dragleave drop', '#dropzone', function (e) {
            e.preventDefault();
            $(this).removeClass('dragover');
        })
        .on('drop', '#dropzone', function (e) {
            var dt = e.originalEvent && e.originalEvent.dataTransfer;
            if (dt && dt.files && dt.files[0]) handleImage(dt.files[0]);
        });

    /* 拖到投放区以外时阻止浏览器直接打开图片（否则整页被替换成那张图） */
    $(document).on('dragover drop', function (e) { e.preventDefault(); });
</script>
