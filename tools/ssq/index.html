    function validateNumber(num, min, max) {
        if (isNaN(num)) return false;
        // 严格校验：必须是纯数字（防止 parseInt 把 "12abc" 解析成 12）
        var s = String(num);
        if (!/^\d{1,2}$/.test(s)) return false;
        var intNum = parseInt(s);
        return intNum >= min && intNum <= max;
    }

    // HTML 转义：OCR 原文等不可信内容进入 innerHTML 前必须转义
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 补齐两位号码格式（用于比较时统一两侧格式）
    function pad2(v) {
        var s = String(parseInt(v, 10));
        return s.length < 2 ? ('0' + s) : s;
    }

    // 奖金千分位（数据里是纯数字，单位「元」）。空值/0 原样返回。
    function fmtMoney(v) {
        if (v === undefined || v === null || v === '') return '—';
        var n = Number(v);
        if (!isFinite(n) || n === 0) return String(v);
        return n.toLocaleString('zh-CN');
    }

    /* 开奖号码 + 一二等奖奖金的信息块。识别结果顶部与「手工查期号」结果共用，
       保证「识别到期号就能看到开奖结果」这条一致。 */
    function drawBlockHtml(item, cls) {
        var h = '<div class="' + (cls || 'draw-info') + '">';
        h += '<div class="draw-title">第 <b>' + esc(item.code) + '</b> 期 · ' + esc(item.drawDate) + ' 开奖</div>';
        h += '<div class="balls">';
        for (var j = 1; j <= 6; j++) h += '<span class="num red">' + esc(item['red' + j]) + '</span>';
        h += '<span class="num blue">' + esc(item.blue1) + '</span>';
        h += '</div>';
        h += '<div class="draw-prize">'
           + '<span>一等奖 <b>' + esc(fmtMoney(item.bonus)) + '</b> 元</span>'
           + '<span>二等奖 <b>' + esc(fmtMoney(item.reward)) + '</b> 元</span>'
           + '</div>';
        return h + '</div>';
    }

    /* #dataBody 的两个状态：结果态（显示「清除」）与空态（隐藏「清除」） */
    function showData(html) {
        dataContainer.html(html);
        $('#btnClearResult').removeAttr('hidden');
    }
    function showIdle() {
        dataContainer.html(idleHtml);
        $('#btnClearResult').attr('hidden', '');
    }

    /* 手工按期号查询：识别不一定能读出期号，这里让用户直接查任意一期。
       只读已有开奖数据（dataMap 的键是 7 位「20 + 5 位期号」）。 */
    function searchByPeriod() {
        var box = document.getElementById('searchResult');
        if (!box) return;
        var digits = String($('#searchCode').val() || '').replace(/\D/g, '');
        if (!digits) { box.innerHTML = ''; return; }
        var code = digits.length === 5 ? '20' + digits : digits;
        var item = dataMap[code];
        if (item) {
            box.innerHTML = drawBlockHtml(item, 'draw-info search-hit');
        } else {
            box.innerHTML = '<div class="alert warn">未找到期号 <b>' + esc(code) + '</b> 的开奖数据（仅收录已开奖的期号）。</div>';
        }
        box.scrollIntoView({ block: 'nearest' });
    }

    // 计算组合数 C(n, k)
    function combCount(n, k) {
        if (k < 0 || k > n) return 0;
        var r = 1;
        for (var i = 0; i < k; i++) r = r * (n - i) / (i + 1);
        return Math.round(r);
    }

    // 组合数安全上限，防止 OCR 误识别导致的组合爆炸（假死/OOM）
    var MAX_COMBINATIONS = 20000;

    function renderResult(ssqData, fileInfo) {
        /* 兜底：fileInfo 缺失时不让整个渲染抛错——否则下面的「解除按钮禁用」执行不到，
           按钮会永久灰死、用户无法重试 */
        fileInfo = fileInfo || {};
        /* 识别到期号就把该期开奖结果（号码 + 一二等奖奖金）贴在顶部 —— 不用再去历史列表里翻 */
        var draw = dataMap[ssqData.code];
        var html = draw
            ? drawBlockHtml(draw)
            : '<div class="draw-info"><div class="draw-title">第 <b>' + esc(ssqData.code) + '</b> 期 · ' + esc(ssqData.drawDate) + '</div></div>';
        /* OCR 复式票：组合展开后每注以 single 形态渲染，必须有这行说明「这是复式展开」，
           否则 N 行 single 会被误读成解析成了单注（cp.jpg 实测反馈） */
        if (ssqData.ocrSpec && ssqData.ocrSpec.isCompound) {
            html += '<div class="ocr-spec-note">识别为复式投注：红球 <b>' + esc(ssqData.ocrSpec.redBalls.join(' ')
                ) + '</b>（' + ssqData.ocrSpec.redBalls.length + ' 个）· 蓝球 <b>' + esc(ssqData.ocrSpec.blueBalls.join(' ')
                ) + '</b>（' + ssqData.ocrSpec.blueBalls.length + ' 个）→ 展开 ' + ssqData.noteDtos.length + ' 注</div>';
        }
        /* 每一注之间是「并列」关系，宽屏下横向多列铺排（见 .result-bets）。
           不要改成一条条整宽的行：单行内容只占约 300px，右侧会空出一大片。 */
        html += '<div class="result-bets">';

        for (var i in ssqData.noteDtos) {
            var bet = ssqData.noteDtos[i];

            // 显示投注类型
            if (bet.betType === 'single') {
                html += '<div class="bet">';
                html += '<span class="zm">' + esc(bet.details[0].zm) + '</span>';

                // 渲染红球
                for (var j = 1; j <= 6; j++) {
                    var className = validateNumber(bet.details[0]['red' + j], 1, 33) ?
                        (bet.details[0]['red' + j + 'f'] ? 'num red redf' : 'num red') : 'num err';
                    html += '<span class="' + className + '">' + esc(bet.details[0]['red' + j]) + '</span>';
                }

                // 渲染蓝球
                var blueClass = validateNumber(bet.details[0].blue1, 1, 16) ?
                    (bet.details[0].blue1f ? 'num blue bluef' : 'num blue') : 'num err';
                html += '<span class="' + blueClass + '">' + esc(bet.details[0].blue1) + '</span>';
                html += '<span class="prize">' + esc(bet.bonusText) + '</span>';
                html += '<span class="reward">' + esc(fmtMoney(bet.rewardValue)) + '</span>';
                html += '</div>';
            } else if (bet.betType === 'compound' || bet.betType === 'drag') {
                /* 复式与胆拖的展示逻辑逐字相同，只有标题与容器类名不同 —— 合并成一条分支 */
                var isDrag = bet.betType === 'drag';
                html += '<div class="bet">';
                html += '<div class="bet-type">' + (isDrag ? '胆拖投注' : '复式投注') + '</div>';
                html += '<div class="' + (isDrag ? 'drag-details' : 'compound-details') + '">';

                // 显示中奖详情
                var hasPrize = false;
                for (var k = 0; k < bet.details.length; k++) {
                    var detail = bet.details[k];
                    var redMatchCount = 0;
                    for (var l = 1; l <= 6; l++) {
                        if (detail['red' + l + 'f']) {
                            redMatchCount++;
                        }
                    }

                    // 只显示中奖的组合
                    if (redMatchCount > 0 || detail.blue1f) {
                        hasPrize = true;
                        html += '<div class="combination">';
                        html += '<span class="label">组合</span>';

                        // 渲染红球
                        for (var m = 0; m < detail.redBalls.length; m++) {
                            var className = detail['red' + (m + 1) + 'f'] ? 'num red redf' : 'num red';
                            html += '<span class="' + className + '">' + esc(detail.redBalls[m]) + '</span>';
                        }

                        // 渲染蓝球
                        var blueClass = detail.blue1f ? 'num blue bluef' : 'num blue';
                        html += '<span class="' + blueClass + '">' + esc(detail.blueBall) + '</span>';
                        html += '<span class="prize">' + esc(detail.bonusText) + '</span>';
                        html += '<span class="reward">' + esc(fmtMoney(detail.rewardValue)) + '</span>';
                        html += '</div>';
                    }
                }

                if (!hasPrize) {
                    html += '<div class="total">未中奖</div>';
                } else {
                    html += '<div class="total">总奖金 <b>' + esc(fmtMoney(bet.rewardValue)) + '</b></div>';
                }

                html += '</div></div>';
            } else {
                /* 未能识别出投注号码（OCR 文本解析全失败）—— 不要静默留空、更不要伪造号码 */
                html += '<div class="bet"><div class="bet-type">无法识别</div>'
                      + '<div class="total">没能从这段文本里识别出投注号码，请手动核对票面。</div></div>';
            }
        }

        html += '</div>';   /* /.result-bets */

        /* 缺值的字段显示「—」，避免出现 "undefined" 字样 */
        var fv = function (v) { return (v === undefined || v === null || v === '') ? '—' : v; };
        html += '<div class="fileinfo">';
        html += '<span>原图 ' + esc(fv(fileInfo.originalDims)) + ' ' + esc(fv(fileInfo.originalSize)) + '</span>';
        html += '<span>预处理 ' + esc(fv(fileInfo.prepDims)) + ' ' + esc(fv(fileInfo.prepScale)) + '</span>';
        html += '<span>预处理耗时 ' + esc(fv(fileInfo.prepTime)) + '</span>';
        if (fileInfo.ocrPsm) html += '<span>稀疏模式重试(PSM ' + esc(fileInfo.ocrPsm) + ')</span>';
        html += '<span>识别耗时 ' + esc(fv(fileInfo.recognitionTime)) + '</span>';
        html += '</div>';

        showData(html);
        $('#up-btn').removeAttr('disabled');
    }

    function findPattern(text, patterns) {
        for (var i = 0; i < patterns.length; i++) {
            var pattern = patterns[i];
            var match = text.match(pattern);
            if (match && match.length > 0) {
                return match[0];
            }
        }
    }

    function parseCode(text) {
        var match = findPattern(text, [/20[012]\d{4}-\d{3}/g]);
        if (match) {
            var c1 = match.split('-')[0];
            if (dataMap[c1]) return c1;
        }
        /* 印章/噪点会让「开奖期」行局部乱码：逐个候选期号，优先取本地开奖数据里真实存在的 */
        var all = findAllPatterns(text, /20[012]\d{4}/g);
        for (var i = 0; i < all.length; i++) {
            if (dataMap[all[i]]) return all[i];
        }
        return findPattern(text, [/20[012]\d{4}/g]);
    }

    // 解析号码字符串为数组
    function parseNumberString(str, length) {
        var numbers = [];
        for (let i = 0; i < str.length; i += length) {
            if (i + length <= str.length) {
                var num = str.substring(i, i + length);
                numbers.push(num);
            }
        }
        return numbers;
    }

    // 安全添加号码到数组（避免重复）
    function safeAddNumbers(targetArray, numbersToAdd) {
        for (let i = 0; i < numbersToAdd.length; i++) {
            var num = numbersToAdd[i];
            if (!targetArray.includes(num)) {
                targetArray.push(num);
            }
        }
        return targetArray;
    }

    // 解析复式投注号码
    function parseCompoundBet(code) {
        // 复式投注格式示例: A123456789012345*060708$0102
        // A: 投注标识
        // 123456789012345: 基本投注号码(15位)
        // *: 复式分隔符
        // 060708: 额外红球(每两位一个号码)
        // $: 红蓝球分隔符
        // 0102: 额外蓝球(每两位一个号码)

        var zm = code.substring(0, 1);
        var basicCode = code.substring(1, 16); // 基本15位号码

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            basicRedBalls: [], // 基本红球
            basicBlueBall: '' // 基本蓝球
        };

        // 提取基本投注号码
        result.basicRedBalls = parseNumberString(basicCode.substring(0, 12), 2);
        result.redBalls = result.basicRedBalls.slice(); // 复制数组
        result.basicBlueBall = basicCode.substring(12, 14);
        result.blueBalls.push(result.basicBlueBall);

        // 检查是否有复式部分
        if (code.includes('*')) {
            var compoundPart = code.substring(16); // 复式部分

            // 分离红球和蓝球复式部分
            if (compoundPart.includes('$')) {
                var parts = compoundPart.split('$');
                var redCompound = parts[0]; // 红球复式部分
                var blueCompound = parts[1]; // 蓝球复式部分

                // 解析额外红球
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                var extraRedBalls = parseNumberString(redCompound, 2);
                safeAddNumbers(result.redBalls, extraRedBalls);

                // 解析额外蓝球
                var extraBlueBalls = parseNumberString(blueCompound, 2);
                safeAddNumbers(result.blueBalls, extraBlueBalls);
            } else {
                // 只有红球复式部分
                var redCompound = compoundPart;
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                var extraRedBalls = parseNumberString(redCompound, 2);
                safeAddNumbers(result.redBalls, extraRedBalls);
            }
        }

        return result;
    }

    // 解析胆拖投注号码
    function parseDragBet(code) {
        // 胆拖投注格式示例: A#0102$030405060708&01
        // #: 胆拖标识
        // 0102: 胆码红球
        // $: 胆拖分隔符
        // 030405060708: 拖码红球
        // &: 红蓝球分隔符
        // 01: 蓝球

        var zm = code.substring(0, 1);
        var dragPart = code.substring(1); // 胆拖部分

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            danRedBalls: [], // 胆码红球
            tuoRedBalls: [] // 拖码红球
        };

        if (dragPart.startsWith('#')) {
            dragPart = dragPart.substring(1);

            // 分离各部分
            var parts = dragPart.split('&');
            var blueBall = parts[1]; // 蓝球

            var redParts = parts[0].split('$');
            var danRed = redParts[0]; // 胆码红球
            var tuoRed = redParts[1]; // 拖码红球

            // 格式不完整时直接返回空结果，避免 parseNumberString(undefined) 抛 TypeError
            // ★ 蓝球（& 之后）也必须存在，否则 undefined 会被 push 进 blueBalls 并参与算奖
            if (!danRed || !tuoRed || !blueBall) {
                console.warn('胆拖投注格式不完整:', code);
                return result;
            }

            // 解析胆码红球
            result.danRedBalls = parseNumberString(danRed, 2);
            result.redBalls = result.danRedBalls.slice(); // 复制数组

            // 解析拖码红球
            result.tuoRedBalls = parseNumberString(tuoRed, 2);
            result.redBalls = result.redBalls.concat(result.tuoRedBalls);

            // 解析蓝球
            result.blueBalls.push(blueBall);
        }

        return result;
    }

    // 生成投注组合的通用函数
    function generateBetCombinations(redBalls, blueBalls, options) {
        var combinations = [];

        // 处理胆拖特殊情况
        if (options && options.danRedBalls) {
            // 胆拖投注处理
            var needFromTuo = 6 - options.danRedBalls.length;
            var tuoCombinations = getCombinations(options.tuoRedBalls, needFromTuo);

            // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸
            var estTotal = tuoCombinations.length * blueBalls.length;
            if (estTotal > MAX_COMBINATIONS) {
                throw new Error('投注组合数过多(' + estTotal + ')，请检查投注码是否正确');
            }

            // 组合胆码和拖码组合
            for (let i = 0; i < tuoCombinations.length; i++) {
                var combinedRed = options.danRedBalls.concat(tuoCombinations[i]);
                for (let j = 0; j < blueBalls.length; j++) {
                    combinations.push({
                        redBalls: combinedRed,
                        blueBall: blueBalls[j]
                    });
                }
            }
        } else {
            // 普通复式投注处理
            var redCombinations = getCombinations(redBalls, 6);

            // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸
            var estTotal = redCombinations.length * blueBalls.length;
            if (estTotal > MAX_COMBINATIONS) {
                throw new Error('投注组合数过多(' + estTotal + ')，请检查投注码是否正确');
            }

            // 为每个红球组合配对所有蓝球
            for (let i = 0; i < redCombinations.length; i++) {
                for (let j = 0; j < blueBalls.length; j++) {
                    combinations.push({
                        redBalls: redCombinations[i],
                        blueBall: blueBalls[j]
                    });
                }
            }
        }

        return combinations;
    }

    // 生成复式投注的所有组合
    function generateCompoundCombinations(redBalls, blueBalls) {
        return generateBetCombinations(redBalls, blueBalls);
    }

    // 生成胆拖投注的所有组合
    function generateDragCombinations(danRedBalls, tuoRedBalls, blueBalls) {
        return generateBetCombinations(null, blueBalls, {
            danRedBalls: danRedBalls,
            tuoRedBalls: tuoRedBalls
        });
    }

    // 计算组合数
    function getCombinations(arr, size) {
        var result = [];

        // 防止组合爆炸：C(30,6)≈59万，OCR误识别可导致页面假死/OOM
        var est = combCount(arr.length, size);
        if (est > MAX_COMBINATIONS) {
            throw new Error('投注组合数过多(' + est + ')，请检查识别结果是否正确');
        }
        // k>n 或 k<0 时组合恒为空，直接返回（否则递归会枚举全部 2^n 个子集）
        if (size > arr.length || size < 0) {
            return result;
        }

        function combine(subset, start) {
            if (subset.length === size) {
                result.push(subset.slice());
                return;
            }

            for (let i = start; i < arr.length; i++) {
                subset.push(arr[i]);
                combine(subset, i + 1);
                subset.pop();
            }
        }

        combine([], 0);
        return result;
    }

    // 判断单注中奖情况
    function determinePrize(redMatchCount, blueMatch, ssqData) {
        var bonusText = '无';
        var rewardValue = '0';

        if (redMatchCount === 6 && blueMatch) {
            bonusText = '一等奖';
            rewardValue = ssqData.bonus;
        } else if (redMatchCount === 6) {
            bonusText = '二等奖';
            rewardValue = ssqData.reward;
        } else if (redMatchCount === 5 && blueMatch) {
            bonusText = '三等奖';
            rewardValue = '3000';
        } else if (redMatchCount === 5 || (redMatchCount === 4 && blueMatch)) {
            bonusText = '四等奖';
            rewardValue = '200';
        } else if (redMatchCount === 4 || (redMatchCount === 3 && blueMatch)) {
            bonusText = '五等奖';
            rewardValue = '10';
        } else if (blueMatch) {
            bonusText = '六等奖';
            rewardValue = '5';
        }

        return {
            bonusText: bonusText,
            rewardValue: rewardValue
        };
    }

    // 检查单注是否中奖并更新结果对象
    function checkSingleBetPrize(betResult, redBalls, winningBlue, ssqData) {
        var redMatchCount = 0;

        // 中奖号码统一为两位补零格式后比较，避免 "7" 与 "07" 格式不一致导致漏判
        var winRed = {};
        for (var r = 0; r < redBalls.length; r++) {
            winRed[pad2(redBalls[r])] = true;
        }

        // 检查红球匹配数量
        // ★ 按「不同号码」计数：输入若含重复红球（如 A01010101010107），
        //   逐位计数会把一个号算六次 → 假一等奖。命中标记仍打在每一个匹配位上。
        var matchedRed = {};
        for (let i = 1; i <= 6; i++) {
            var nr = pad2(betResult['red' + i]);
            if (winRed[nr]) {
                betResult['red' + i + 'f'] = true;
                matchedRed[nr] = true;
            }
        }
        redMatchCount = Object.keys(matchedRed).length;

        // 检查蓝球是否匹配
        if (pad2(betResult.blue1) === pad2(winningBlue)) {
            betResult.blue1f = true;
        }

        // 根据匹配结果确定奖项
        var prize = determinePrize(redMatchCount, betResult.blue1f, ssqData);
        betResult.bonusText = prize.bonusText;
        betResult.rewardValue = prize.rewardValue;

        return redMatchCount;
    }

    // 检查组合是否中奖并更新结果对象
    function checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData) {
        var redMatchCount = 0;

        // 中奖号码统一为两位补零格式后比较，避免 "7" 与 "07" 格式不一致导致漏判
        var winRed = {};
        for (var r = 0; r < redBalls.length; r++) {
            winRed[pad2(redBalls[r])] = true;
        }

        // 检查红球匹配数量（★ 按不同号码计数 —— 胆拖胆拖码重叠时同一号码会重复出现）
        var matchedRed2 = {};
        for (let j = 0; j < comboResult.redBalls.length; j++) {
            var nr2 = pad2(comboResult.redBalls[j]);
            if (winRed[nr2]) {
                comboResult['red' + (j + 1) + 'f'] = true;
                matchedRed2[nr2] = true;
            }
        }
        redMatchCount = Object.keys(matchedRed2).length;

        // 检查蓝球是否匹配
        if (pad2(comboResult.blueBall) === pad2(winningBlue)) {
            comboResult.blue1f = true;
        }

        // 根据匹配结果确定奖项
        var prize = determinePrize(redMatchCount, comboResult.blue1f, ssqData);
        comboResult.bonusText = prize.bonusText;
        comboResult.rewardValue = prize.rewardValue;

        return {
            redMatchCount: redMatchCount,
            prize: prize
        };
    }

    // 解析复式投注号码（增强版）
    function parseCompoundBetEnhanced(code) {
        // 支持更多复式格式
        // 格式1: A123456789012345*060708$0102
        // 格式2: A123456789012345*06070809
        // 格式3: A123456789012345$0102
        // 格式4: A123456789012345*060708$010203 (多个蓝球)
        // 格式5: A123456789012345*0607080910$0102 (多个红球和蓝球)

        var zm = code.substring(0, 1);
        var basicCode = code.substring(1, 16); // 基本15位号码

        var result = {
            zm: zm,
            redBalls: [], // 所有红球
            blueBalls: [], // 所有蓝球
            basicRedBalls: [], // 基本红球
            basicBlueBall: '' // 基本蓝球
        };

        // 提取基本投注号码
        for (let i = 0; i < 6; i++) {
            var redBall = basicCode.substring(i * 2, i * 2 + 2);
            result.basicRedBalls.push(redBall);
            result.redBalls.push(redBall);
        }
        result.basicBlueBall = basicCode.substring(12, 14);
        result.blueBalls.push(result.basicBlueBall);

        // 检查是否有复式部分
        if (code.includes('*') || code.includes('$')) {
            var compoundPart = code.substring(16); // 复式部分

            // 处理不同格式
            if (compoundPart.includes('*') && compoundPart.includes('$')) {
                // 格式1,4,5: *红球$蓝球
                var parts = compoundPart.split('$');
                var redCompound = parts[0]; // 红球复式部分
                var blueCompound = parts[1]; // 蓝球复式部分

                // 解析额外红球
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                for (let i = 0; i < redCompound.length; i += 2) {
                    if (i + 2 <= redCompound.length) {
                        var redBall = redCompound.substring(i, i + 2);
                        if (!result.redBalls.includes(redBall)) {
                            result.redBalls.push(redBall);
                        }
                    }
                }

                // 解析额外蓝球
                for (let i = 0; i < blueCompound.length; i += 2) {
                    if (i + 2 <= blueCompound.length) {
                        var blueBall = blueCompound.substring(i, i + 2);
                        if (!result.blueBalls.includes(blueBall)) {
                            result.blueBalls.push(blueBall);
                        }
                    }
                }
            } else if (compoundPart.includes('*')) {
                // 格式2: *红球
                var redCompound = compoundPart;
                if (redCompound.startsWith('*')) {
                    redCompound = redCompound.substring(1);
                }

                for (let i = 0; i < redCompound.length; i += 2) {
                    if (i + 2 <= redCompound.length) {
                        var redBall = redCompound.substring(i, i + 2);
                        if (!result.redBalls.includes(redBall)) {
                            result.redBalls.push(redBall);
                        }
                    }
                }
            } else if (compoundPart.includes('$')) {
                // 格式3: $蓝球
                var blueCompound = compoundPart;
                if (blueCompound.startsWith('$')) {
                    blueCompound = blueCompound.substring(1);
                }

                // 解析额外蓝球
                for (let i = 0; i < blueCompound.length; i += 2) {
                    if (i + 2 <= blueCompound.length) {
                        var blueBall = blueCompound.substring(i, i + 2);
                        if (!result.blueBalls.includes(blueBall)) {
                            result.blueBalls.push(blueBall);
                        }
                    }
                }
            }
        }

        // 值域与数量校验：红球 01-33 且 ≤33 个，蓝球 01-16 且 ≤16 个
        // （复式部分逐 2 位切片解析，OCR 误识别可产生越界值或超量蓝球）
        if (result.redBalls.length > 33) {
            throw new Error('红球数量异常(' + result.redBalls.length + '个)，请检查投注码');
        }
        if (result.blueBalls.length > 16) {
            throw new Error('蓝球数量异常(' + result.blueBalls.length + '个)，请检查投注码');
        }
        for (let i = 0; i < result.redBalls.length; i++) {
            var rv = parseInt(result.redBalls[i], 10);
            if (!(rv >= 1 && rv <= 33)) {
                throw new Error('红球号码越界(' + result.redBalls[i] + ')，请检查投注码');
            }
        }
        for (let i = 0; i < result.blueBalls.length; i++) {
            var bv = parseInt(result.blueBalls[i], 10);
            if (!(bv >= 1 && bv <= 16)) {
                throw new Error('蓝球号码越界(' + result.blueBalls[i] + ')，请检查投注码');
            }
        }

        return result;
    }

    // 更新checkWinning函数以使用增强版解析
    function checkWinning(ssqData, code) {
        var redBalls = [ssqData.red1, ssqData.red2, ssqData.red3, ssqData.red4, ssqData.red5, ssqData.red6];
        var winningBlue = ssqData.blue1;

        // 判断投注类型
        var betType = 'single'; // 默认单式

        // 检查是否为标准格式的投注代码（包含特殊符号）
        // 注意：胆拖格式(A#0102$0304...&01)同时包含 # 和 $，必须先判断 # 否则胆拖会被误判为复式
        if (code.includes('#')) {
            betType = 'drag'; // 胆拖
        } else if (code.includes('*') || code.includes('$')) {
            betType = 'compound'; // 复式
        } else if (typeof code === 'string' && code.length > 50) {
            // 如果是长字符串，可能是OCR文本
            betType = 'ocr_text';
        }

        var result = {
            code: ssqData.code,
            drawDate: ssqData.drawDate,
            betType: betType,
            bonusText: '无',
            rewardValue: '0',
            details: []
        };

        if (betType === 'ocr_text') {
            // 对于OCR文本，使用备用解析方法
            var fallbackResult = tryFallbackParsing(code, ssqData);
            if (fallbackResult && fallbackResult.details && fallbackResult.details.length > 0) {
                return fallbackResult;
            }
            // 如果备用解析也失败，则尝试增强型解析
            var enhancedResult = tryEnhancedFallbackParsing(code, ssqData);
            if (enhancedResult && enhancedResult.details && enhancedResult.details.length > 0) {
                return enhancedResult;
            }
            // ★ 解析全失败时不能伪造一个默认号码去算奖 —— 那会给用户一个假的中奖结果，
            //   比直接报错更危险。如实标记为无法识别，交给 renderResult 提示。
            result.bonusText = '无法识别';
            return result;
        } else if (betType === 'single') {
            // 单式投注处理
            var zm = code.substring(0, 1);
            var red1 = code.substring(1, 3);
            var red2 = code.substring(3, 5);
            var red3 = code.substring(5, 7);
            var red4 = code.substring(7, 9);
            var red5 = code.substring(9, 11);
            var red6 = code.substring(11, 13);
            var blue1 = code.substring(13, 15);

            var singleResult = {
                zm: zm,
                red1: red1,
                red2: red2,
                red3: red3,
                red4: red4,
                red5: red5,
                red6: red6,
                blue1: blue1,
                red1f: false,
                red2f: false,
                red3f: false,
                red4f: false,
                red5f: false,
                red6f: false,
                blue1f: false,
                bonusText: '无',
                rewardValue: '0'
            };

            // 检查中奖情况
            checkSingleBetPrize(singleResult, redBalls, winningBlue, ssqData);

            result.details.push(singleResult);
            result.bonusText = singleResult.bonusText;
            result.rewardValue = singleResult.rewardValue;
        } else if (betType === 'compound') {
            // 复式投注处理
            var compoundData = parseCompoundBetEnhanced(code);
            var combinations = generateCompoundCombinations(compoundData.redBalls, compoundData.blueBalls);

            var totalReward = 0;
            var hasPrize = false;

            for (let i = 0; i < combinations.length; i++) {
                var combo = combinations[i];
                var comboResult = {
                    redBalls: combo.redBalls,
                    blueBall: combo.blueBall,
                    red1f: false,
                    red2f: false,
                    red3f: false,
                    red4f: false,
                    red5f: false,
                    red6f: false,
                    blue1f: false,
                    bonusText: '无',
                    rewardValue: '0'
                };

                // 检查组合中奖情况
                var checkResult = checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData);
                if (checkResult.prize.rewardValue && parseInt(checkResult.prize.rewardValue) > 0) {
                    totalReward += parseInt(checkResult.prize.rewardValue);
                    hasPrize = true;
                }

                result.details.push(comboResult);
            }

            if (hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = totalReward.toString();
            }
        } else if (betType === 'drag') {
            // 胆拖投注处理
            var dragData = parseDragBet(code);
            var combinations = generateDragCombinations(dragData.danRedBalls, dragData.tuoRedBalls, dragData.blueBalls);

            var totalReward = 0;
            var hasPrize = false;

            for (let i = 0; i < combinations.length; i++) {
                var combo = combinations[i];
                var comboResult = {
                    redBalls: combo.redBalls,
                    blueBall: combo.blueBall,
                    red1f: false,
                    red2f: false,
                    red3f: false,
                    red4f: false,
                    red5f: false,
                    red6f: false,
                    blue1f: false,
                    bonusText: '无',
                    rewardValue: '0'
                };

                // 检查组合中奖情况
                var checkResult = checkCombinationPrize(comboResult, redBalls, winningBlue, ssqData);
                if (checkResult.prize.rewardValue && parseInt(checkResult.prize.rewardValue) > 0) {
                    totalReward += parseInt(checkResult.prize.rewardValue);
                    hasPrize = true;
                }

                result.details.push(comboResult);
            }

            if (hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = totalReward.toString();
            }
        }

        return result;
    }

    // 解析OCR格式的复式投注（增强版）
    /* ===== OCR 字符混淆与粘连修复（2026-10-20 矩阵实验产物）=====
       票面号码粘连（"3 19 21"→"3192123"）与形近字符误读（7→T）是识别残留的主要形态。
       两件武器都只作用于「已判定为号码」的 token / 数字串，不碰中文文本：
       - normNumToken：行首单个形近字母→数字（"T1217"=7 12 17）；≥2 个行首字母视为乱掉的
         行标签直接剥掉（"ax:02"→02）；行尾字母是粘连噪点，剥掉（"6b"→6）。
       - splitDigitsAscending：把粘连数字串按「严格升序 + 号码值域」穷举拆分。
         双色球票面号码必升序（红 01-33 / 蓝 01-16），实测粘连串在该约束下几乎都唯一解。 */
    /* 带类别的号码 token 归一化（结构化解析专用）。返回 { t, v, lead }：
       t: 'num'=普通号码 / 'red'=红标签值 / 'blue'=蓝标签值 / 'break'=纯标签分段符 / ''=噪点；
       v: 归一后的数字串；lead: 原始 token 行首 ASCII 字母数——
       ≥2 视为乱标签行首（"sw:09"/"ax:02"），只能作为新段起点、不能并入已有段。
       实测要点（cp.jpg 上海票）：「红复:05」被误读成 "g52:05" —— 中文标签被搅成拉丁字母时
       冒号后的值段必须按号码救回（老逻辑把 g 映射成 9 得到 "952:05" 整个丢弃 → 红球 05 丢失，
       剩 6 个号被当成单注）；「倍数:1」「合计14元」「机号:31130370」这类中文标签+数字必须整体丢弃
       （老逻辑产出裸 "1"/"14" 幻影号码，"1" 会被蓝球扫描认成蓝球 01）。
       同一张票的两种 JPEG 编码会给出不同的误读形态（已实测）：208KB 剪贴板版读出 "g52:05"，
       738KB 原版读出 "45:05"（撞时间正则）和 "蓝单;07"（分号）——归一化必须按「标签可为任意
       1-3 字符垃圾 + 冒号/分号 + 值段」的形态兜底，不能只针对某一种固定误读。 */
    function normNumTokenC(raw) {
        raw = String(raw);
        const lead = (raw.match(/^[A-Za-z]*/) || [''])[0].length;
        let tok = raw.replace(/^[^\dA-Za-z\u4e00-\u9fa5]+|[^\dA-Za-z\u4e00-\u9fa5]+$/g, '');
        if (!/\d/.test(tok)) {
            /* 纯标签 token（"wg:"/"ax:"/"蓝复:"）= 分段符：其后的号码是新列表（红/蓝分界） */
            const isLabel = /^[A-Za-z\u4e00-\u9fa5]{1,8}[:：]$/.test(tok);
            return { t: isLabel ? 'break' : '', v: '', lead: lead };
        }
        /* 时间 "19:57:31"（带秒）整体丢弃；"19:57"（无秒）仅当时段 ≤23 才算时间丢弃——
           「红复:05」在原版高清票上会误读成 "45:05"，45 不可能是小时，必须落下去把 05 救回 */
        if (/^\d{1,2}[:：]\d{2}[:：]\d{2}$/.test(tok)) return { t: '', v: '', lead: lead };
        if (/^\d{1,2}[:：]\d{2}$/.test(tok) && parseInt(tok, 10) <= 23) return { t: '', v: '', lead: lead };
        const ci = tok.search(/[:：;；]/);
        if (ci >= 0) {
            const label = tok.slice(0, ci);
            if (/蓝/.test(label)) return { t: 'blue', v: coreNum(tok.slice(ci + 1)), lead: 0 };
            if (/红/.test(label)) return { t: 'red', v: coreNum(tok.slice(ci + 1)), lead: 0 };
            /* 中文标签（机号/开奖期/合计/倍数/销售期…）OCR 可读性高，其值全是噪音 → 丢弃；
               拉丁乱标签（"g52:"/"ax:"/"sw:"）→ 值段继续按号码处理 */
            if (/[\u4e00-\u9fa5]/.test(label)) return { t: '', v: '', lead: lead };
            tok = tok.slice(ci + 1).replace(/^[^\dA-Za-z]+/, '');
        } else if (/[\u4e00-\u9fa5]/.test(tok)) {
            /* 无冒号但带中文（"合计14元"/"余月略27号"）= 文字嵌数字 → 丢弃 */
            return { t: '', v: '', lead: lead };
        }
        if (/[A-Za-z]/.test(tok.charAt(0))) {
            if (lead >= 2) {
                tok = tok.replace(/^[A-Za-z]+/, '');      /* 行首 ≥2 字母 = 乱掉的行标签（ax: / uu:） */
            } else {
                const c = tok.charAt(0);
                const map = { T: '7', O: '0', o: '0', Q: '0', q: '0', D: '0', I: '1', i: '1', l: '1', S: '5', s: '5', Z: '2', z: '2', G: '9', g: '9', B: '8', b: '8' };
                tok = (map[c] || '') + tok.slice(1);      /* 行首 1 个字母 = 形近数字误读 */
            }
            tok = tok.replace(/^[^\dA-Za-z]+/, '');   /* 标签剥离后残留的 ":" 等（"sw:09"→09） */
        }
        tok = tok.replace(/[A-Za-z|]+$/, '');     /* 行尾字母 = 粘连噪点 */
        tok = tok.replace(/[OoQqD]/g, '0').replace(/[Iil|]/g, '1').replace(/[Ss]/g, '5')
                 .replace(/[Zz]/g, '2').replace(/[Gg]/g, '9').replace(/[Bb]/g, '8').replace(/T/g, '7');
        return /^\d+$/.test(tok) ? { t: 'num', v: tok, lead: lead } : { t: '', v: '', lead: lead };
    }

    /* 标签值段归一：形近字母映射后只留数字（"蓝单:O7"→"07"），不合法返回空串 */
    function coreNum(s) {
        s = String(s).replace(/^[^\dA-Za-z]+|[^\dA-Za-z]+$/g, '');
        s = s.replace(/[OoQqD]/g, '0').replace(/[Iil|]/g, '1').replace(/[Ss]/g, '5')
             .replace(/[Zz]/g, '2').replace(/[Gg]/g, '9').replace(/[Bb]/g, '8').replace(/T/g, '7')
             .replace(/[A-Za-z|]/g, '');
        return /^\d+$/.test(s) ? s : '';
    }

    /* 旧接口：只要数字串（单注行内 token 用，行内不含中文标签，行为与老版一致） */
    function normNumToken(tok) {
        return normNumTokenC(tok).v;
    }

    /* 把数字串拆成严格升序的号码序列；minCount/maxCount 限定号码个数，maxVal 限定值域。
       返回全部可行拆分（按号码数升序——优先拆得最少的解），无可行解返回 []。 */
    function splitDigitsAscending(digits, minCount, maxCount, maxVal) {
        const results = [];
        const n = digits.length;
        (function dfs(pos, prev, acc) {
            if (pos === n) {
                if (acc.length >= minCount && acc.length <= maxCount) results.push(acc.slice());
                return;
            }
            if (acc.length >= maxCount) return;
            for (let len = 1; len <= 2 && pos + len <= n; len++) {
                const v = parseInt(digits.substr(pos, len), 10);
                if (v < 1 || v > maxVal || v <= prev) continue;
                acc.push(v);
                dfs(pos + len, v, acc);
                acc.pop();
            }
        })(0, 0, []);
        results.sort(function (a, b) { return a.length - b.length; });
        return results;
    }

    function digitsToAscending(digits, minCount, maxCount, maxVal) {
        if (!digits) return null;
        const sols = splitDigitsAscending(digits, minCount, maxCount, maxVal);
        if (!sols.length) return null;
        return sols[0].map(function (v) { return String(v).padStart(2, '0'); });
    }

    function parseOCRSpec(text) {
        console.log("解析OCR格式复式投注:", text);

        /* 路径一：标签锚定（红复/红单/红球/蓝复/蓝单/蓝球/zw/ax/wm/blue…可读时） */
        var redMatch = text.match(/(?:zw|ax|red|红\s*[复单球])[:：;\s；]*([\d\s]+)/i);
        var blueMatch = text.match(/(?:wm|blue|蓝\s*[复单球])[:：;\s；]*([\d\s]+)/i);
        var redNumbers = null, blueNumbers = null;

        if (redMatch) {
            /* 不再按 \d{1,2} 硬切（会把 "11217" 切成 11/21/7 拼出假号码）；
               整段数字串交给升序拆分，拆不出合法序列就当没有这段 */
            redNumbers = digitsToAscending(redMatch[1].replace(/\D/g, ''), 6, 18, 33);
        }
        if (blueMatch) {
            blueNumbers = digitsToAscending(blueMatch[1].replace(/\D/g, ''), 1, 16, 16);
        }

        /* 路径二：结构化兜底 —— 标签经常被印章/红框搅成 "wg:"/"uu:"（实测），锚定失败时
           按 token 扫描：连续号码 token（含粘连长串）构成红球段，
           其后首个 1..3 个 01-16 号码的组 = 蓝球。期号/机号等长串靠升序拆分失败被自然排除。
           单式票（含 A. 行锚点）绝不走这条路径：粘连的长串会把多行连读、
           把 "(1)" 倍数符拼成幻影红球（实测 "27 3 (1)" → 多出红球 31）。 */
        if (!redNumbers && !/[A-E]\s*\./.test(text)) {
            var st = structuralParse(text);
            if (st) {
                redNumbers = st.reds;
                if (!blueNumbers) blueNumbers = st.blues;
            }
        }
        if (!redNumbers) {
            return null;
        }

        console.log("提取的红球:", redNumbers, "蓝球:", blueNumbers);

        /* 防止OCR误识别导致组合爆炸：数量超范围时放弃此解析路径（与 MAX_COMBINATIONS 闸门对齐） */
        if (redNumbers.length > 18 || blueNumbers.length > 16) {
            console.warn("红球/蓝球数量异常，放弃OCR复式解析:", redNumbers.length, blueNumbers.length);
            return null;
        }

        /* 判断是否为复式投注（红球超过6个或蓝球超过1个） */
        if (redNumbers.length > 6 || blueNumbers.length > 1) {
            return {
                redBalls: redNumbers,
                blueBalls: blueNumbers,
                isCompound: true
            };
        }

        /* 标准单注 */
        if (redNumbers.length >= 6 && blueNumbers.length >= 1) {
            return {
                redBalls: redNumbers.slice(0, 6),
                blueBalls: [blueNumbers[0]],
                isCompound: false
            };
        }

        return null;
    }

    /* 结构化兜底：无标签/标签被搅时按 token 扫号码段（详见 parseOCRSpec 路径二注释）。
       - 号码 token 长度不设上限：整行粘连（"112172225"=12 17 22 25）也参与，由升序拆分验收，
         期号/机号拆不出合法升序序列被自然排除（中文标签 token 已在归一化层丢弃）；
       - lead≥2 的 token（"sw:09" 蓝球行标签粘连）只能作为新段起点，不能并入已有段——
         否则蓝球 09 会混进红球串导致整段拆分失败；
       - 蓝/红标签值（"蓝单:07"）会终止红段并优先作为蓝球候选；
       - 蓝球 = 红段之后 15 token 窗口内首个可拆成 1..3 个 ≤16 升序号的连续 blue/num 组
         （"sw:09 14"→09,14；"2 612"→02,06,12——后者实测来自 "蓝复:2 6 12" 的粘连变体）。 */
    function structuralParse(text) {
        const ctoks = String(text).split(/\s+/).map(normNumTokenC);
        for (let i = 0; i < ctoks.length; i++) {
            const ti = ctoks[i];
            if ((ti.t !== 'num' && ti.t !== 'red') || !ti.v) continue;
            let j = i, digits = '';
            while (j < ctoks.length && (ctoks[j].t === 'num' || ctoks[j].t === 'red') && ctoks[j].v &&
                   (j === i || ctoks[j].lead < 2)) {
                digits += ctoks[j].v;
                j++;
            }
            /* ≥6 个 token 或 ≥12 位数字（整行粘连成一个长串）才可能是红球段 */
            if (j - i < 6 && digits.length < 12) { i = j - 1; continue; }
            const reds = digitsToAscending(digits, 6, 18, 33);
            if (!reds) { i = j - 1; continue; }
            let blues = null;
            for (let k = j; k < Math.min(ctoks.length, j + 15) && !blues; k++) {
                const tk = ctoks[k];
                if ((tk.t !== 'num' && tk.t !== 'blue') || !tk.v) continue;
                let m = k, bd = '', cnt = 0;
                while (m < ctoks.length && (ctoks[m].t === 'num' || ctoks[m].t === 'blue') && ctoks[m].v && cnt < 4) {
                    const vv = ctoks[m].v;
                    if (vv.length <= 2 && parseInt(vv, 10) > 16) break;
                    if (bd.length + vv.length > 6) break;
                    bd += vv; cnt++; m++;
                }
                if (cnt >= 1 && cnt <= 3) {
                    const cand = digitsToAscending(bd, 1, 3, 16);
                    if (cand) blues = cand;
                }
            }
            return { reds: reds, blues: blues || [] };
        }
        return null;
    }

    // 生成OCR复式投注的所有组合
    function generateOCRSpecCombinations(ocrSpec) {
        var combinations = [];

        if (!ocrSpec.isCompound) {
            // 单注直接返回
            combinations.push({
                redBalls: ocrSpec.redBalls,
                blueBall: ocrSpec.blueBalls[0]
            });
            return combinations;
        }

        // 生成红球组合
        var redCombinations = [];
        if (ocrSpec.redBalls.length >= 6) {
            redCombinations = getCombinations(ocrSpec.redBalls, 6);
        } else {
            // 如果红球不足6个，这可能是个错误
            redCombinations = [ocrSpec.redBalls];
        }

        // 为每个红球组合配对所有蓝球
        // 总量闸门：红组合数 × 蓝球数，防止笛卡尔积爆炸（OCR误识别 18红×16蓝=29.7万组合可穿透单层闸门）
        var estTotal = redCombinations.length * ocrSpec.blueBalls.length;
        if (estTotal > MAX_COMBINATIONS) {
            throw new Error('投注组合数过多(' + estTotal + ')，请检查识别结果是否正确');
        }
        for (let i = 0; i < redCombinations.length; i++) {
            for (let j = 0; j < ocrSpec.blueBalls.length; j++) {
                combinations.push({
                    redBalls: redCombinations[i],
                    blueBall: ocrSpec.blueBalls[j]
                });
            }
        }

        return combinations;
    }

    /* 6 个升序红球(01-33) + 末尾 1 个蓝球(01-16，不参与升序) 的联合拆分。
       用于 "-" 分隔符被粘连吃掉的行（实测 "C. 2 62223242813 (1)" = 2 6 22 23 24 28-13）。 */
    function splitDigitsRedsPlusBlue(digits) {
        const results = [];
        const n = digits.length;
        (function dfs(pos, prev, acc) {
            if (acc.length === 6) {
                const rest = digits.slice(pos);
                if (rest.length >= 1 && rest.length <= 2) {
                    const bv = parseInt(rest, 10);
                    if (bv >= 1 && bv <= 16) results.push({ reds: acc.slice(), blue: bv });
                }
                return;
            }
            if (pos >= n) return;
            for (let len = 1; len <= 2 && pos + len <= n; len++) {
                const v = parseInt(digits.substr(pos, len), 10);
                if (v < 1 || v > 33 || v <= prev) continue;
                acc.push(v);
                dfs(pos + len, v, acc);
                acc.pop();
            }
        })(0, 0, []);
        return results;
    }

    // 解析新的单注OCR格式（增强版）
    function parseSingleOCRSpec(text) {
        console.log("解析单注OCR格式:", text);

        /* 行格式（兼容实测的多种票面）:
           A.06 14 15 19 22 30-03        标准单注（- 连接）
           A.04 08 14 22 26 27+14 x2     深圳票（+ 连接，x2 倍数）
           A. 3192123 26 27- 3 (1)       粘连场景：号码挤在一个 token、倍数为 (1)
           D 1 2 91215 27-16 (1)         行锚点的 "." 被吃掉（点可选）
           C. 2 62223242813 (1)          "-" 被吃掉：整段 = 6红+1蓝联合拆分 */
        var lines = text.match(/[A-E](?:\s*\.)?\s*[\d][\d\s\-\+\.]*(?:[xX×]\s*\d+)?(?:\(\s*\d*\s*\))?/g);
        if (!lines || lines.length === 0) {
            return null;
        }

        var bets = [];

        for (let i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            console.log("处理行:", line);

            var letterMatch = line.match(/^([A-E])/);
            if (!letterMatch) continue;

            var numbersPart = line.replace(/^[A-E]\s*\.?\s*/, '');
            numbersPart = numbersPart.replace(/[xX×]\s*\d+\s*$/, '');      /* x2 倍数 */
            numbersPart = numbersPart.replace(/\(\s*\d*\s*\)\s*$/, '');    /* (1) 倍数 */
            if (!/\d/.test(numbersPart)) continue;

            var redNumbers = null, blueValue = NaN;
            var sep = numbersPart.match(/[-+]/);
            if (sep) {
                var redPart = numbersPart.slice(0, sep.index);
                var bluePart = numbersPart.slice(sep.index + 1);

                /* 红球：先按 token 直读；不足 6 个或有粘连 token 时走升序拆分 */
                var redTokens = redPart.split(/\s+/).filter(Boolean).map(normNumToken).filter(Boolean);
                redNumbers = redTokens.filter(function (t) {
                    return t.length <= 2 && parseInt(t, 10) >= 1 && parseInt(t, 10) <= 33;
                });
                if (redNumbers.length !== 6) {
                    redNumbers = digitsToAscending(redTokens.join(''), 6, 6, 33) || [];
                    if (!redNumbers.length) continue;
                } else {
                    redNumbers = redNumbers.map(function (t) { return String(parseInt(t, 10)).padStart(2, '0'); });
                }

                var blueDigits = bluePart.split(/\s+/).filter(Boolean).map(normNumToken).filter(Boolean).join('');
                if (!blueDigits) continue;
                blueValue = parseInt(blueDigits.slice(0, 2), 10);
                if (isNaN(blueValue) || blueValue < 1 || blueValue > 16) {
                    blueValue = parseInt(blueDigits.charAt(0), 10);
                }
                if (isNaN(blueValue) || blueValue < 1 || blueValue > 16) continue;
            } else {
                /* 分隔符丢失：整段数字串按「6红 + 末尾蓝」联合拆分 */
                const digits = numbersPart.split(/\s+/).filter(Boolean).map(normNumToken).filter(Boolean).join('');
                const sols = splitDigitsRedsPlusBlue(digits);
                if (!sols.length) continue;
                redNumbers = sols[0].reds.map(function (v) { return String(v).padStart(2, '0'); });
                blueValue = sols[0].blue;
            }

            bets.push({
                letter: letterMatch[1],
                redBalls: redNumbers.slice(0, 6),
                blueBall: String(blueValue).padStart(2, '0')
            });
        }

        return bets.length > 0 ? bets : null;
    }

    // 检查投注组合的中奖情况
    function checkBetCombinations(combinations, ssqData) {
        var noteDtos = [];
        var totalReward = 0;
        var hasPrize = false;

        for (let i = 0; i < combinations.length; i++) {
            var combo = combinations[i];

            // 构造一个虚拟的投注代码用于checkWinning函数
            var fakeCode = "A";
            for (let j = 0; j < 6 && j < combo.redBalls.length; j++) {
                fakeCode += combo.redBalls[j];
            }
            fakeCode += combo.blueBall;

            // 检查这个组合是否中奖
            var comboResult = checkWinning(ssqData, fakeCode);
            if (comboResult.details && comboResult.details.length > 0) {
                var detail = comboResult.details[0];
                if (detail.rewardValue && parseInt(detail.rewardValue) > 0) {
                    totalReward += parseInt(detail.rewardValue);
                    hasPrize = true;
                }
                noteDtos.push(comboResult);
            }
        }

        return {
            noteDtos: noteDtos,
            totalReward: totalReward,
            hasPrize: hasPrize
        };
    }

    function processOCRResult(text, fileInfo) {
        console.log("原始OCR文本:", text);
        var code = parseCode(text);

        if (!code) {
            showData('<div class="alert err">无法识别期号: ' + esc(text) + '</div>');
            $('#up-btn').removeAttr('disabled');
            return;
        }

        var ssqData = dataMap[code];

        if (!ssqData) {
            showData('<div class="alert err">未找到期号 ' + esc(code) + ' 的开奖数据</div>');
            $('#up-btn').removeAttr('disabled');
            return;
        }

        console.log(code, ssqData);

        var result = {
            code: code,
            drawDate: ssqData.drawDate
        };

        /* 解析顺序按「锚点精度」从高到低（2026-10-20 实测调整）：
           ① 单注行锚点 A./B./C.（结构最强，绝不能让后面的兜底抢跑——
              否则复式结构化兜底会把多行连读、把 "(1)" 倍数符拼成幻影红球）
           ② 复式标签锚定（红复/蓝复/zw/wm 可读时）
           ③ 复式结构化兜底（标签被印章/红框搅乱时）
           ④ 码串 / 红蓝分离等旧兜底 */
        var singleBets = parseSingleOCRSpec(text);
        if (singleBets) {
            console.log("单注OCR解析结果:", singleBets);

            // 检查每个投注的中奖情况
            var checkResultS = checkBetCombinations(singleBets, ssqData);

            // 构造最终结果
            result.noteDtos = checkResultS.noteDtos;
            if (checkResultS.hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = checkResultS.totalReward.toString();
            } else {
                result.bonusText = '无';
                result.rewardValue = '0';
            }

            renderResult(result, fileInfo);
            return;
        }

        // 然后尝试解析OCR格式的复式投注 (zw: 和 wm: 格式)
        var ocrSpec = parseOCRSpec(text);
        if (ocrSpec) {
            console.log("OCR复式规格解析结果:", ocrSpec);

            // 生成所有组合
            var combinations = generateOCRSpecCombinations(ocrSpec);
            console.log("生成的组合:", combinations);

            // 检查每个组合的中奖情况
            var checkResult = checkBetCombinations(combinations, ssqData);

            // 构造最终结果（ocrSpec 供渲染层标注「复式」身份——组合展开后每注是 single 形态，
            // 不标注的话用户会以为复式票被解析成了单注）
            result.noteDtos = checkResult.noteDtos;
            result.ocrSpec = ocrSpec;
            if (checkResult.hasPrize) {
                result.bonusText = '中奖';
                result.rewardValue = checkResult.totalReward.toString();
            } else {
                result.bonusText = '无';
                result.rewardValue = '0';
            }

            renderResult(result, fileInfo);
            return;
        }

        // 如果以上解析都失败，使用原有的处理逻辑
        // 更智能的文本清理，保留更多有用字符
        var cleanText = text.replace(/[^\w\d\s\-\:\#\*\$\.\,\;]/gi, ' ');
        console.log("清理后的文本:", cleanText);

        // 查找可能的投注号码（更灵活的模式）
        var codes = findAllPatterns(cleanText, /[A-E][\d\#\*\$]+/g);
        console.log("找到的投注号码:", codes);

        var noteDtos = [];

        for (var i = 0; i < codes.length; i++) {
            // 进一步清理每个投注号码
            var cleanedCode = codes[i].replace(/\s+/g, '');
            console.log("清理后的投注号码:", cleanedCode);

            if (cleanedCode.length >= 15) { // 至少要有基本长度
                noteDtos.push(checkWinning(ssqData, cleanedCode));
            }
        }

        // 如果没找到标准格式，尝试从文本中提取红球和蓝球号码
        if (noteDtos.length === 0) {
            var fallbackResult = tryFallbackParsing(text, ssqData);
            if (fallbackResult) {
                noteDtos.push(fallbackResult);
            }
        }

        // 如果仍然没有结果，尝试另一种解析方式
        if (noteDtos.length === 0) {
            var enhancedResult = tryEnhancedFallbackParsing(text, ssqData);
            if (enhancedResult) {
                noteDtos.push(enhancedResult);
            }
        }

        // 如果仍然没有结果，将整个OCR文本作为特殊处理
        if (noteDtos.length === 0) {
            // 直接将OCR文本传递给checkWinning函数进行特殊处理
            noteDtos.push(checkWinning(ssqData, text));
        }

        result.noteDtos = noteDtos;
        renderResult(result, fileInfo);
    }

    // 查找所有匹配的模式
    function findAllPatterns(text, pattern) {
        var matches = [];
        var match;
        while ((match = pattern.exec(text)) !== null) {
            matches.push(match[0]);
        }
        return matches;
    }

    // 增强型备用解析方法：处理更复杂的OCR文本格式（增强版）
    function tryEnhancedFallbackParsing(text, ssqData) {
        console.log("使用增强型备用解析方法");
        console.log("完整OCR文本:", text);

        // 移除多余的空格和换行符
        var cleanText = text.replace(/\s+/g, ' ').trim();
        console.log("清理后的文本:", cleanText);

        // 尝试提取红球号码（寻找包含6个或更多数字的序列，支持一位数和两位数）
        var redBallMatches = cleanText.match(/(\d{1,2}\s+){5}\d{1,2}/);
        var redBalls = [];
        if (redBallMatches) {
            redBalls = redBallMatches[0].match(/\d{1,2}/g);
            // 转换为两位数格式
            redBalls = redBalls.map(num => String(parseInt(num)).padStart(2, '0'));
            console.log("提取到的红球号码:", redBalls);
        }

        // 尝试提取蓝球号码（通常在文本末尾，是1-16之间的数字）
        var blueBall = null;
        var blueMatches = cleanText.match(/\b([1-9]|1[0-6])\b/g);
        if (blueMatches) {
            // 取最后一个有效的蓝球号码
            for (var i = blueMatches.length - 1; i >= 0; i--) {
                var num = parseInt(blueMatches[i]);
                if (num >= 1 && num <= 16) {
                    blueBall = String(num).padStart(2, '0');
                    break;
                }
            }
            console.log("提取到的蓝球号码:", blueBall);
        }

        // 如果通过上述方法找到了足够的信息
        if (redBalls && redBalls.length >= 6 && blueBall) {
            // 构造投注代码
            var fakeCode = "A";
            for (var i = 0; i < 6 && i < redBalls.length; i++) {
                fakeCode += redBalls[i];
            }
            fakeCode += blueBall;

            console.log("增强型解析构造的代码:", fakeCode);
            return checkWinning(ssqData, fakeCode);
        }

        return null;
    }

    // 备用解析方法：直接从文本中提取红球和蓝球号码（增强版）
    function tryFallbackParsing(text, ssqData) {
        console.log("使用备用解析方法");
        console.log("完整OCR文本:", text);

        // 查找类似 "zw:05 07 08 12 14 20 31" 或 "ax: 5 10 14 17 19 23 28" 的红球号码（支持多种格式）
        var redMatch = text.match(/(?:zw|ax|红\s*球|red)[:\s]*([\d\s]+)/i);
        // 如果上面的模式没找到，尝试查找连续的红球号码模式
        if (!redMatch) {
            // 查找至少6个连续的两位数字（红球号码）
            redMatch = text.match(/(\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}(?:\s+\d{1,2})*)/);
        }

        // 查找类似 "wm: 07" 或 "蓝 单 : 10" 的蓝球号码
        var blueMatch = text.match(/(?:wm|蓝\s*单|蓝\s*球|blue)[:\s]*([\d\s]+)/i);
        // 如果上面的模式没找到，尝试在文本中查找单独的蓝球号码
        if (!blueMatch) {
            // 查找文本中的蓝球号码（1-16范围内的数字）
            var allNumbers = text.match(/\b(\d{1,2})\b/g) || [];
            // 蓝球通常是1-16之间的数字，查找最后一个符合条件的
            for (var i = allNumbers.length - 1; i >= 0; i--) {
                var num = parseInt(allNumbers[i]);
                if (num >= 1 && num <= 16) {
                    blueMatch = ["", allNumbers[i]];
                    break;
                }
            }
        }

        // 特殊处理示例中的格式
        if (!redMatch) {
            // 处理 "zw:05 07 08 12 14 20 31" 这样的格式
            var zwMatch = text.match(/zw\s*:?\s*(\d{2}(?:\s+\d{2})+)/i);
            if (zwMatch) {
                redMatch = [zwMatch[0], zwMatch[1]];
            }

            // 处理 "ax: 5 10 14 17 19 23 28" 这样的格式
            var axMatch = text.match(/ax\s*:?\s*(\d{1,2}(?:\s+\d{1,2})+)/i);
            if (axMatch) {
                redMatch = [axMatch[0], axMatch[1]];
            }

            // 处理 "红 球 : 5 10 14 17 19 23 28" 这样的格式
            var redBallMatch = text.match(/红\s*球\s*:?\s*(\d{1,2}(?:\s+\d{1,2})+)/i);
            if (redBallMatch) {
                redMatch = [redBallMatch[0], redBallMatch[1]];
            }
        }

        if (!blueMatch) {
            // 处理 "wm: 07" 这样的格式
            var wmMatch = text.match(/wm\s*:?\s*(\d{1,2})/i);
            if (wmMatch) {
                blueMatch = [wmMatch[0], wmMatch[1]];
            }

            // 处理 "蓝 单 : 10" 这样的格式
            var lanDanMatch = text.match(/蓝\s*单\s*:?\s*(\d{1,2})/i);
            if (lanDanMatch) {
                blueMatch = [lanDanMatch[0], lanDanMatch[1]];
            }

            // 处理 "蓝 球 : 10" 这样的格式
            var blueBallMatch = text.match(/蓝\s*球\s*:?\s*(\d{1,2})/i);
            if (blueBallMatch) {
                blueMatch = [blueBallMatch[0], blueBallMatch[1]];
            }
        }

        console.log("红球匹配结果:", redMatch);
        console.log("蓝球匹配结果:", blueMatch);

        if (redMatch) {
            var redNumbers = redMatch[1].match(/\d{1,2}/g) || [];
            console.log("提取到的红球号码:", redNumbers);

            var blueNumbers = [];
            if (blueMatch) {
                // 蓝球可能是1位或2位数���
                var blueText = blueMatch[1];
                blueNumbers = blueText.match(/\d{1,2}/g) || [];
                console.log("提取到的蓝球号码:", blueNumbers);
            }

            // 如果没有找到蓝球，尝试从文本末尾查找
            if (blueNumbers.length === 0) {
                var allNumbers = text.match(/\d{1,2}/g) || [];
                // 蓝球通常是最后出现的1-16之间的数字
                for (var i = allNumbers.length - 1; i >= 0; i--) {
                    var num = parseInt(allNumbers[i]);
                    if (num >= 1 && num <= 16) {
                        blueNumbers = [String(num)]; // 不需要补零，后面会处理
                        break;
                    }
                }
            }

            if (redNumbers.length >= 6 && blueNumbers.length >= 1) {
                // 构造一个虚拟的投注代码
                var fakeCode = "A";
                // 添加前6个红球
                for (var i = 0; i < 6 && i < redNumbers.length; i++) {
                    fakeCode += String(parseInt(redNumbers[i])).padStart(2, '0');
                }
                // 添加第一个蓝球（确保是两位数格式）
                var blueBall = String(parseInt(blueNumbers[0])).padStart(2, '0');
                fakeCode += blueBall;

                console.log("备用解析构造的代码:", fakeCode);

                // 直接返回checkWinning的结果
                return checkWinning(ssqData, fakeCode);
            }
        }

        return null;
    }

    $('#up-btn').click(function () {
        $('#input-img').click();
    });

    function formatFileSize(bytes, decimals = 2, k = 1024) {
        if (bytes === 0) return '0 Bytes';
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(Math.max(0, dm))) + ' ' + sizes[i];
    }

    /* ===== 图片预处理（替代原先的 Compressor 800px 压缩）=====
       实测（2026-10-20，3 轮 × 4 张真实票面矩阵实验）：
       - 压到 800px 会让相邻号码粘连（"3 19"→"319"），是解析失败的头号原因；
       - 小图（长边 <900）放大到 ~1700 后识别质量大幅提升（232px 缩略图红球 7/7 全对）；
       - 红色印章/红框抑制（红主导像素→白）不影响黑色数字，能救回被红框粘连的蓝球；
       - 大图不缩不压，原样进引擎（长边 ≤1700 已在引擎舒适区）。 */
    async function loadBitmap(file) {
        if (window.createImageBitmap) {
            try { return await createImageBitmap(file); } catch (e) { /* 老浏览器兜底 */ }
        }
        return await new Promise(function (res, rej) {
            var im = new Image();
            var u = URL.createObjectURL(file);
            im.onload = function () { URL.revokeObjectURL(u); res(im); };
            im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('图片解码失败')); };
            im.src = u;
        });
    }

    const OCR_TARGET_LONG_SIDE = 1830;   /* 识别梯第一档目标长边：小图放大到此，大图保持原样。
                                            实测 700px 票 ×2.2、1080px 票 ×1.7 都在最佳区；
                                            每张票的最佳分辨率不同（×2.9 反而会让某行变糊），
                                            所以由 handleImage 的识别梯做多档尝试。 */
    const OCR_MAX_SCALE = 4;             /* 放大上限：232px 缩略图 ×4 足够，再大只添噪 */

    function ocrScaleFor(longSide, targetLong) {
        if (longSide >= targetLong) return 1;              /* 只放大、不缩小 */
        return Math.min(OCR_MAX_SCALE, targetLong / longSide);
    }

    async function prepareImageFromBitmap(bmp, targetLong) {
        const t0 = window.performance.now();
        const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
        const long = Math.max(w, h);
        const scale = ocrScaleFor(long, targetLong);
        const cw = Math.round(w * scale), ch = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        g.fillStyle = '#fff';
        g.fillRect(0, 0, cw, ch);
        g.drawImage(bmp, 0, 0, cw, ch);
        /* 红章/红框抑制 + 灰度化：r 明显压倒 g/b 的像素视为红系（印章、红框、红抬头）→ 置白；
           其余按亮度转灰度，给引擎稳定的单通道输入。 */
        const id = g.getImageData(0, 0, cw, ch), d = id.data;
        for (let i = 0; i < d.length; i += 4) {
            const r = d[i], gg = d[i + 1], b = d[i + 2];
            const v = (r > 90 && r > gg * 1.28 && r > b * 1.28) ? 255 : (r * 299 + gg * 587 + b * 114) / 1000;
            d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
        }
        g.putImageData(id, 0, 0);
        const blob = await new Promise(function (res) { c.toBlob(res, 'image/png'); });
        return {
            blob: blob,
            originalDims: w + '×' + h,
            prepDims: cw + '×' + ch,
            prepScale: scale > 1.05 ? ('×' + scale.toFixed(1)) : '原大',
            prepTime: ((window.performance.now() - t0) / 1000).toFixed(3) + '秒'
        };
    }

    /* 解析质量预判：0=不可解析 1=可解析但可能没读全 2=可解析且行数证据齐全。
       「行数证据」= 票面每注行尾的倍数标记 (1) / x2 —— 单注行数比它少说明还有行没读出来，
       识别梯应继续尝试（实测 1830 档会把 2026006 的 D/E 两行读丢）。 */
    function ocrParseQuality(text) {
        if (!text) return 0;
        const code = parseCode(text);
        if (!code || !dataMap[code]) return 0;
        const markers = (text.match(/\(\s*\d+\s*\)|[xX×]\s*\d+/g) || []).length;
        const single = parseSingleOCRSpec(text);
        if (single) {
            if (!markers || single.length >= markers) return 2;
            return 1;
        }
        if (parseOCRSpec(text)) return 2;
        const cleanText = text.replace(/[^\w\d\s\-\:\#\*\$\.\,\;]/gi, ' ');
        return findAllPatterns(cleanText, /[A-E][\d\#\*\$]+/g).length > 0 ? 1 : 0;
    }

    /* 识别梯：同一张图按「分辨率 × PSM」多档尝试，解析通过即停（2026-10-20 实测定档）。
       1830 档对多数票一次通过；3000 档专救红框票（1080px 票 ×2.2 才能把 "5 7" 读全）；
       psm11 稀疏模式专救被印章干扰的「开奖期」行。 */
    const OCR_LADDER = [
        { long: 1830, psm: '6' },
        { long: 1830, psm: '11' },
        { long: 3000, psm: '6' },
        { long: 3000, psm: '11' }
    ];

    async function handleImage(file) {
        $('#up-btn').attr('disabled', 'disabled');
        dataContainer.html(loadingHtml);

        try {
            const bmp = await loadBitmap(file);
            var fileInfo = { originalSize: formatFileSize(file.size) };

            const t3 = window.performance.now();
            const worker = await initTesseractWorker();
            await worker.setParameters({ user_defined_dpi: '300', preserve_interword_spaces: '1' });

            const prepCache = {};
            let bestText = null, bestPrep = null, bestQuality = 0;
            for (const step of OCR_LADDER) {
                if (!prepCache[step.long]) prepCache[step.long] = await prepareImageFromBitmap(bmp, step.long);
                const prep = prepCache[step.long];
                await worker.setParameters({ tessedit_pageseg_mode: step.psm });
                const t0 = window.performance.now();
                const t = (await worker.recognize(prep.blob)).data.text;
                const q = ocrParseQuality(t);
                console.log('识别梯档位:', step.long, 'psm' + step.psm,
                    '质量' + q, Math.round(window.performance.now() - t0) + 'ms');
                if (q > bestQuality) {
                    bestText = t; bestPrep = prep; bestQuality = q;
                    if (step.psm === '11') fileInfo.ocrPsm = '11'; else delete fileInfo.ocrPsm;
                    if (step.long !== OCR_LADDER[0].long) fileInfo.ocrLong = step.long; else delete fileInfo.ocrLong;
                }
                if (bestQuality >= 2) break;   /* 行数证据齐全，无需继续 */
            }
            fileInfo.originalDims = bestPrep.originalDims;
            fileInfo.prepDims = bestPrep.prepDims;
            fileInfo.prepScale = bestPrep.prepScale;
            fileInfo.prepTime = bestPrep.prepTime;
            fileInfo.recognitionTime = ((window.performance.now() - t3) / 1000).toFixed(3) + '秒';
            processOCRResult(bestText, fileInfo);
        } catch (error) {
            console.error('OCR识别失败:', error);
            showData('<div class="alert err">OCR识别失败: ' + esc(error && error.message ? error.message : error) + '</div>');
            $('#up-btn').removeAttr('disabled');
        }
    }

    $('#input-img').change(function (e) {
        if (!this.files || !this.files[0]) return; // 用户取消选择时不处理
        handleImage(this.files[0]);
        this.value = ''; // 立即重置，否则同一张图二次选择不触发 change
    });

    /* ===== 投放区（#dropzone 由 idleHtml 动态生成，故用委托绑定）===== */
    $(document)
        .on('click', '#dropzone', function () {
            $('#input-img').click();
        })
        .on('keydown', '#dropzone', function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                $('#input-img').click();
            }
        })
        .on('dragenter dragover', '#dropzone', function (e) {
            e.preventDefault();
            $(this).addClass('dragover');
        })
        .on('dragleave drop', '#dropzone', function (e) {
            e.preventDefault();
            $(this).removeClass('dragover');
        })
        .on('drop', '#dropzone', function (e) {
            var dt = e.originalEvent && e.originalEvent.dataTransfer;
            if (dt && dt.files && dt.files[0]) handleImage(dt.files[0]);
        });

    /* 拖到投放区以外时阻止浏览器直接打开图片（否则整页被替换成那张图） */
    $(document).on('dragover drop', function (e) { e.preventDefault(); });
</script>
