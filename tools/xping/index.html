<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>文件下载</title>
</head>
<body>
    <h1>下载 xping.sh 文件</h1>
    
    <button onclick="directDownload()">直接下载</button>
    <button onclick="openInNewTab()">新标签页打开</button>
    <button onclick="tryMultipleMirrors()">尝试多个镜像</button>
    <p id="mirrorTip" style="color:#666"></p>
    
    <script>
        function directDownload() {
            // jsdelivr 对 .sh 返回 text/plain，location.href 会"打开"而非"下载"；
            // 改为 fetch blob 后触发保存
            fetch("https://cdn.jsdelivr.net/gh/midaug/files/shell/xping.sh")
                .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "xping.sh";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                })
                .catch(() => { alert("下载失败，请检查网络后重试"); });
        }
        
        function openInNewTab() {
            window.open("https://cdn.jsdelivr.net/gh/midaug/files/shell/xping.sh", "_blank");
        }
        
        async function tryMultipleMirrors() {
            const tip = document.getElementById("mirrorTip");
            const mirrors = [
                "https://gitee.com/midaug/files/raw/master/shell/xping.sh",
                "https://cdn.jsdelivr.net/gh/midaug/files/shell/xping.sh",
                "https://fastly.jsdelivr.net/gh/midaug/files/shell/xping.sh",
                "https://gcore.jsdelivr.net/gh/midaug/files/shell/xping.sh"
            ];
            
            for (const url of mirrors) {
                try {
                    tip.textContent = "正在检测镜像: " + url;
                    // 加 3 秒超时，避免一个挂起的镜像阻塞整个探测循环
                    const response = await fetch(url, { method: 'HEAD', signal: AbortSignal.timeout(3000) });
                    if (response.ok) {
                        tip.textContent = "";
                        window.open(url, "_blank");
                        return;
                    }
                } catch (error) {
                    console.log(`镜像不可用: ${url}`);
                }
            }
            tip.textContent = "";
            alert('所有镜像都不可用，请检查网络设置或使用VPN');
        }

        // 注意：不能在页面加载时自动执行 —— 无用户手势时 window.open 会被
        // 浏览器静默拦截，页面表现为"什么都没发生"。只在用户点击按钮时运行。
    </script>
</body>
</html>
