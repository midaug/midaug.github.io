<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown 预览</title>
<meta name="theme-color" content="#f6f7f9" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="../../lib/katex/katex.min.css" />
<style>
  :root {
    /* ===== 与全站工具页共用的一套配色（浅色 · 靛蓝）===== 改配色只动这里 */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  /* ★ height:100%（不是 min-height）—— 顶栏才落在滚动容器外，只有 main 内部滚 */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none;
  }
  .brand { font-weight: 700; letter-spacing: .5px; margin-right: 4px; white-space: nowrap; color: inherit; text-decoration: none; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .stat b { color: var(--accent); font-weight: 600; }

  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; outline: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s; min-width: 0;
  }
  button, select { white-space: nowrap; flex-shrink: 0; }
  button:hover, select:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.mini { padding: 3px 9px; font-size: 11px; line-height: 1.5; background: var(--panel-2); color: var(--text-2); border-color: var(--border); }
  button.mini:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* 分段控件：主题切换 */
  .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; padding: 5px 11px; font-size: 12px; background: var(--panel); color: var(--text-2); }
  .seg button + button { border-left: 1px solid var(--border-2); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  #btnReset { margin-left: auto; }

  main { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; }
  .wrap {
    width: min(100%, max(1280px, 86.2vw)); margin: 0 auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .bar {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 8px; font-size: 11.5px; color: var(--text-2);
  }
  .bar .lbl { font-weight: 600; color: var(--text); }
  .bar .sp { margin-left: auto; }

  .duo { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .duo .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .colhead {
    flex: none; padding: 7px 11px; font-size: 11.5px; font-weight: 600; color: var(--text-2);
    background: var(--panel-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
  }
  .colhead .sp { margin-left: auto; font-weight: 400; color: var(--text-3); }
  #src {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: 0;
    padding: 12px 14px; background: var(--panel); color: var(--text);
    font: 13px/1.7 var(--mono); tab-size: 2; white-space: pre; overflow: auto;
  }
  #preview {
    flex: 1; min-height: 0; overflow: auto; padding: 18px 24px 40px; background: var(--panel);
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  #preview::-webkit-scrollbar, #src::-webkit-scrollbar { width: 10px; height: 10px; }
  #preview::-webkit-scrollbar-thumb, #src::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel); }
  #preview::-webkit-scrollbar-thumb:hover, #src::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

  /* ============ 主题一：博客风格（贴近 LoveIt 正文）============ */
  #preview.blog { font: 15px/1.85 var(--font); color: var(--text); }
  #preview.blog > :first-child { margin-top: 0 !important; }
  #preview.blog h1, #preview.blog h2, #preview.blog h3, #preview.blog h4, #preview.blog h5, #preview.blog h6 {
    font-weight: 700; line-height: 1.35; color: var(--text);
  }
  #preview.blog h1 { font-size: 2rem; margin: 3rem 0 1rem; }
  #preview.blog h2 { font-size: 1.75rem; margin: 2.75rem 0 1rem; }
  #preview.blog h3 { font-size: 1.5rem; margin: 2.25rem 0 1rem; }
  #preview.blog h4 { font-size: 1.25rem; margin: 1.75rem 0 .8rem; }
  #preview.blog h5 { font-size: 1.125rem; margin: 1.5rem 0 .8rem; }
  #preview.blog h6 { font-size: 1rem; margin: 1.25rem 0 .8rem; }
  #preview.blog h1+h2, #preview.blog h2+h3, #preview.blog h3+h4 { margin-top: 1rem; }
  #preview.blog p { margin: 0 0 1.1rem; }
  #preview.blog a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  #preview.blog a:hover { border-bottom-color: var(--accent); }
  #preview.blog strong { font-weight: 700; }
  #preview.blog del { color: var(--text-3); }
  #preview.blog blockquote {
    margin: 1.2rem 0; padding: .6rem 1.1rem; border-left: .35rem solid var(--accent-soft);
    background: var(--panel-2); border-radius: 0 6px 6px 0; color: var(--text-2);
  }
  #preview.blog blockquote > :last-child { margin-bottom: 0; }
  #preview.blog ul, #preview.blog ol { margin: 0 0 1.1rem; padding-left: 2.5rem; }
  #preview.blog li { margin: .25rem 0; }
  #preview.blog li > ul, #preview.blog li > ol { margin: .25rem 0; }
  #preview.blog .task-list-item { list-style: none; margin-left: -1.4rem; }
  #preview.blog .task-list-item input { accent-color: var(--accent); margin-right: .35rem; }
  #preview.blog hr { border: 0; border-top: 1px solid var(--border-2); margin: 2rem 0; }
  #preview.blog :not(pre) > code {
    font-family: var(--mono); font-size: .87em; background: var(--surface-1);
    padding: .12em .38em; border-radius: 3px; color: #e74c3c;
  }
  #preview.blog pre {
    margin: 0 0 1.3rem; padding: 14px 16px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;
    font-size: 12.5px; line-height: 1.6; scrollbar-width: thin;
  }
  #preview.blog pre code { font-family: var(--mono); background: none; padding: 0; color: var(--text); }
  /* 代码块 token 着色（对齐工具站 --tk-* 变量） */
  #preview.blog .tok-k { color: #8250df; }
  #preview.blog .tok-s { color: #0a7a3e; }
  #preview.blog .tok-n { color: #b25e09; }
  #preview.blog .tok-c { color: #8a97a8; }
  #preview.blog .tok-a { color: #0550ae; }
  #preview.blog .table-wrap { overflow-x: auto; margin: 0 0 1.3rem; scrollbar-width: thin; }
  #preview.blog table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0 0 1.3rem; display: block; overflow-x: auto; background: var(--panel); }
  #preview.blog thead { background: var(--panel-2); }
  #preview.blog th, #preview.blog td { border: 1px solid var(--border-2); padding: .3rem 1rem; }
  #preview.blog img { max-width: 100%; height: auto; min-height: 1em; border-radius: 4px; }
  /* 与主题 figure 一致：块内图片撑满、图注居中灰字 */
  #preview.blog figure { margin: .5rem; text-align: center; }
  #preview.blog figure img { display: block; width: 100%; margin: 0 auto; }
  #preview.blog figcaption { font-size: .875rem; color: #969696; padding: .5rem; }
  #preview.blog .footnotes { margin-top: 2rem; padding-top: .8rem; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
  #preview.blog .footnotes ol { padding-left: 1.4rem; }
  #preview.blog .footnote-ref { font-size: .75em; color: var(--accent); vertical-align: super; }
  /* KaTeX 块级公式：内部横滚，不撑破页面（与文章页 custom.css 同策略） */
  #preview.blog .katex-display {
    max-width: 100%; display: flex; justify-content: center; justify-content: safe center;
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding: .25rem 0 .5rem;
  }
  #preview.blog .katex-display::-webkit-scrollbar { height: 6px; }

  /* ============ 主题二：通用 GFM（GitHub 风格）============ */
  #preview.gfm { font: 14px/1.6 var(--font); color: var(--text); }
  #preview.gfm > :first-child { margin-top: 0 !important; }
  #preview.gfm h1, #preview.gfm h2, #preview.gfm h3, #preview.gfm h4, #preview.gfm h5, #preview.gfm h6 { font-weight: 600; line-height: 1.25; margin: 1.4rem 0 .8rem; }
  #preview.gfm h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border-2); }
  #preview.gfm h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  #preview.gfm h3 { font-size: 1.25em; }
  #preview.gfm h4 { font-size: 1em; }
  #preview.gfm h5 { font-size: .875em; }
  #preview.gfm h6 { font-size: .85em; color: var(--text-2); }
  #preview.gfm p, #preview.gfm blockquote, #preview.gfm ul, #preview.gfm ol, #preview.gfm table, #preview.gfm pre { margin: 0 0 1rem; }
  #preview.gfm a { color: var(--accent); text-decoration: none; }
  #preview.gfm a:hover { text-decoration: underline; }
  #preview.gfm blockquote { padding: 0 1em; color: var(--text-2); border-left: .25em solid var(--border-2); }
  #preview.gfm blockquote > :last-child { margin-bottom: 0; }
  #preview.gfm ul, #preview.gfm ol { padding-left: 2em; }
  #preview.gfm li > ul, #preview.gfm li > ol { margin: 0; }
  #preview.gfm .task-list-item { list-style: none; margin-left: -1.5em; }
  #preview.gfm .task-list-item input { accent-color: var(--accent); margin-right: .3em; }
  #preview.gfm hr { height: .25em; border: 0; background: var(--border); margin: 1.5rem 0; }
  #preview.gfm :not(pre) > code { font-family: var(--mono); font-size: 85%; background: var(--surface-2); padding: .2em .4em; border-radius: 5px; }
  #preview.gfm pre { padding: 16px; background: var(--panel-2); border-radius: 6px; overflow: auto; font-size: 12px; line-height: 1.5; }
  #preview.gfm pre code { font-family: var(--mono); background: none; padding: 0; }
  #preview.gfm table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow: auto; }
  #preview.gfm th, #preview.gfm td { padding: 6px 13px; border: 1px solid var(--border-2); }
  #preview.gfm tr:nth-child(2n) { background: var(--panel-2); }
  #preview.gfm img { max-width: 100%; }
  #preview.gfm .footnotes { margin-top: 1.5rem; padding-top: .6rem; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  #preview.gfm .footnotes ol { padding-left: 1.3rem; }
  #preview.gfm .footnote-ref { font-size: .72em; color: var(--accent); vertical-align: super; }
  #preview.gfm .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: .25rem 0 .5rem; }

  /* token 着色在 GFM 下用克制的强调色 */
  #preview.gfm .tok-k { color: #8250df; }
  #preview.gfm .tok-s { color: #0a7a3e; }
  #preview.gfm .tok-n { color: #b25e09; }
  #preview.gfm .tok-c { color: #8a97a8; }
  #preview.gfm .tok-a { color: #0550ae; }

  .empty { color: var(--text-3); font-size: 12px; padding: 20px 4px; }
  /* 隐私说明任何宽度可见 */
  .stat.privacy-stat { display: inline-block; white-space: normal; flex: 0 1 auto; min-width: 0; }
  /* 窄屏模拟：预览列限宽居中，用来核对手机上的排版（不改真实视口） */
  #preview.sim {
    max-width: var(--simw, 100%);
    margin-left: auto; margin-right: auto;
    box-shadow: 0 0 0 1px var(--border);
  }
  #preview .footnotes-title {
    font-weight: 700; font-size: 12px; letter-spacing: .5px;
    color: var(--text-2); margin-bottom: .3rem;
  }

  @media (max-width: 900px) {
    /* 堆叠后两栏各自定高、各自内滚；main 放开滚动，短屏（横屏手机）也不会被裁掉 */
    main { display: block; overflow: auto; }
    .wrap { display: block; }
    .duo { flex-direction: column; }
    .duo .col { flex: none; height: 60vh; min-height: 300px; }
    #preview { padding: 14px 16px 30px; }
  }
  @media (max-width: 640px) {
    header { padding: 8px 10px; }
    main { padding: 8px; }
    button, select { padding: 5px 9px; font-size: 12px; }
    #btnReset { margin-left: 0; }
    .hide-sm { display: none; }
  }
</style>
</head>

<header>

转义字符：\*不是斜体\*、\`不是代码\`、\\ 是反斜杠本身。

## 九、数学公式

行内公式：质能方程 $E = mc^2$，高斯积分 $\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}$。

块级公式：

$$
\frac{d}{dx}\left(\int_{0}^{x} f(t)\,dt\right) = f(x)
$$

矩阵与行列式：

$$
\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc
$$

多行对齐：

$$
\begin{aligned}
\nabla \cdot \mathbf{E} &= \frac{\rho}{\varepsilon_0} \\
\nabla \cdot \mathbf{B} &= 0
\end{aligned}
$$

      for (; j < lines.length; j++) {
        var m2 = /^[ \t]{0,3}(`{3,}|~{3,})[ \t]*$/.exec(lines[j]);
        if (m2 && m2[1].charAt(0) === ch && m2[1].length >= len) { closed = true; break; }
      }
      var end = closed ? j : lines.length - 1;   /* 未闭合的围栏按 CommonMark：吃到文末 */
      chunks.push(lines.slice(i, end + 1).join("\n"));
      out.push("%%CH_" + (chunks.length - 1) + "%%");
      i = end + 1;
    }
    return out.join("\n").replace(/(^|[^\\`])(`+)(?!`)([\s\S]*?[^`])\2(?!`)/g, function (m, pre, ticks, body) {
      chunks.push(ticks + body + ticks);
      return pre + "%%CH_" + (chunks.length - 1) + "%%";
    });
  }
  function restoreCode(text) {
    return text.replace(/%%CH_(\d+)%%/g, function (_, i) {
      return chunks[+i] === undefined ? "" : chunks[+i];
    });
  }

  function preprocess(md) {
    formulas = []; notes = []; chunks = [];
    var text = protectCode(md);
    /* 脚注定义（含缩进续行） */
    text = text.replace(/^\[\^([^\]\n]+)\]:[ \t]?([^\n]*)((?:\n(?: {2,}|\t)[^\n]*)*)/gm, function (_, id, first, rest) {
      /* 定义体里可能含行内代码占位符，抽走时就要还原，否则会漏进脚注列表 */
      notes.push({ id: id.trim(), body: restoreCode(first + rest.replace(/\n(?: {2,}|\t)/g, "\n")) });
      return "";
    });
    /* 块级公式 */
    text = text.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, function (m) {
      formulas.push(m);
      return "\n\n%%MATH_" + (formulas.length - 1) + "%%\n\n";
    });
    /* 行内公式：首尾带空格或纯数字的当普通文本（货币误判防护） */
    text = text.replace(/\$([^\n$]+?)\$|\\\(([^\n]+?)\\\)/g, function (m, a, b) {
      if (a !== undefined && (/^\s|\s$/.test(a) || /^[\d,.\s]+$/.test(a))) return m;
      formulas.push(m);
      return "%%MATH_" + (formulas.length - 1) + "%%";
    });
    /* 脚注引用 */
    text = text.replace(/\[\^([^\]\n]+)\]/g, function (m, id) {
      var key = id.trim(), idx = -1;
      for (var i = 0; i < notes.length; i++) if (notes[i].id === key) { idx = i; break; }
      if (idx < 0) return m;
      return '<sup class="footnote-ref" data-fn="' + idx + '">[' + (idx + 1) + "]</sup>";
    });
    return restoreCode(text);
  }

  /* ===== 4. 渲染 ===== */
  function render() {
    var md = src.value;
    $("stat").textContent = md.length + " 字符 · " + (md ? md.split("\n").length : 0) + " 行";
    if (!md.trim()) {
      preview.innerHTML = '<div class="empty">左侧输入 Markdown，这里会实时显示渲染效果。点右上角「载入示例」可看全套语法。</div>';
      return;
    }
    var text = preprocess(md);

    var renderer = new marked.Renderer();
    renderer.code = function (code, lang) {
      var l = typeof lang === "string" ? lang.split(/\s+/)[0].toLowerCase() : "";
      return "<pre><code" + (l ? ' class="lang-' + esc(l) + '"' : "") + ">" + highlight(code, l) + "</code></pre>";
    };
    renderer.table = function (header, body) {
      return '<div class="table-wrap"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
    };

    var html = marked.parse(text, { gfm: true, breaks: false, renderer: renderer });
    html = sanitize(html);
    /* 块级公式：整段只有一个占位符时换成 div，别把 display 公式塞进 <p> */
    html = html.replace(/<p>\s*%%MATH_(\d+)%%\s*<\/p>/g, function (_, i) {
      var f = formulas[+i];
      return f === undefined ? "" : '<div class="math-block">' + esc(f) + "</div>";
    });
    html = html.replace(/%%MATH_(\d+)%%/g, function (_, i) {
      var f = formulas[+i];
      return f === undefined ? "" : esc(f);
    });
    preview.innerHTML = html;

    /* marked 不给任务列表加 class（v12 只输出裸 input），这里补上 */
    Array.prototype.forEach.call(preview.querySelectorAll('li input[type="checkbox"]'), function (inp) {
      var li = inp.closest ? inp.closest("li") : null;
      if (li) li.classList.add("task-list-item");
    });

    /* 脚注：编号 + tooltip */
    Array.prototype.forEach.call(preview.querySelectorAll("sup.footnote-ref"), function (el) {
      var i = +el.getAttribute("data-fn");
      el.textContent = "[" + (i + 1) + "]";
      el.title = notes[i] ? notes[i].body.replace(/[*_`#>]/g, "").replace(/\s+/g, " ").trim() : "";
    });
    /* 脚注列表（正文支持行内 Markdown，解析后再清洗一次） */
    if (notes.length) {
      var wrap = document.createElement("div");
      wrap.className = "footnotes";
      var title = document.createElement("div");
      title.className = "footnotes-title";
      title.textContent = "脚注";
      wrap.appendChild(title);
      var ol = document.createElement("ol");
      notes.forEach(function (note) {
        var li = document.createElement("li");
        var h = marked.parseInline ? marked.parseInline(note.body, { gfm: true }) : esc(note.body);
        li.innerHTML = sanitize(h);
        ol.appendChild(li);
      });
      wrap.appendChild(ol);
      preview.appendChild(wrap);
    }

    /* KaTeX 自动渲染（最后一步，覆盖正文与脚注里的公式） */
    if (window.renderMathInElement) {
      window.renderMathInElement(preview, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false,
        strict: false
      });
    }
  }

  /* ===== 5. 交互 ===== */
  var timer = 0, saveTimer = 0;
  function saveDoc() {
    try { localStorage.setItem(DOCKEY, src.value); } catch (e) {}
  }
  src.addEventListener("input", function () {
    clearTimeout(timer); timer = setTimeout(render, 120);
    clearTimeout(saveTimer); saveTimer = setTimeout(saveDoc, 800);
  });
  src.addEventListener("keydown", function (e) {
    if (e.key !== "Tab") return;
    e.preventDefault();
    var s = this.selectionStart, t = this.selectionEnd;
    this.value = this.value.slice(0, s) + "  " + this.value.slice(t);
    this.selectionStart = this.selectionEnd = s + 2;
    render();
  });

  function setTheme(t) {
    preview.classList.toggle("blog", t === "blog");
    preview.classList.toggle("gfm", t !== "blog");
    $("themeBlog").setAttribute("aria-pressed", String(t === "blog"));
    $("themeGfm").setAttribute("aria-pressed", String(t !== "blog"));
    $("themeInfo").textContent = t === "blog" ? "博客风格" : "通用 GFM";
    try { localStorage.setItem(THEMEKEY, t); } catch (e) {}
  }
  $("themeBlog").onclick = function () { setTheme("blog"); };
  $("themeGfm").onclick = function () { setTheme("gfm"); };

  /* 窄屏模拟：只看渲染效果，不做真机适配 */
  function setWidth(w) {
    var on = w > 0;
    preview.classList.toggle("sim", on);
    if (on) preview.style.setProperty("--simw", w + "px");
    $("vwInfo").textContent = on ? w + "px" : "自适应";
    try { localStorage.setItem("tools:mdpreview:width:v1", String(w)); } catch (e) {}
  }
  $("vwSel").onchange = function () { setWidth(+this.value); };

  function loadDemo() {
    src.value = $("demoDoc").textContent.replace(/^\n+/, "");
    render(); saveDoc();
    src.scrollTop = 0; preview.scrollTop = 0;
  }
  $("btnReset").onclick = loadDemo;

  /* 初始化：主题 / 宽度 / 内容都记忆上次状态 */
  try {
    if (localStorage.getItem(THEMEKEY) === "gfm") setTheme("gfm");
    var w = +(localStorage.getItem("tools:mdpreview:width:v1") || 0);
    if (w > 0) { $("vwSel").value = String(w); setWidth(w); }
  } catch (e) {}
  var savedDoc = null;
  try { savedDoc = localStorage.getItem(DOCKEY); } catch (e) {}
  if (savedDoc && savedDoc.trim()) { src.value = savedDoc; render(); }
  else { loadDemo(); }
})();
</script>
</body>
</html>
