<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客户端信息查看</title>
<meta name="theme-color" content="#f6f7f9" />
<!-- jQuery 已本地化到 vendor/jquery-3.7.1.min.js（本地优先）。
     历史教训：原来用的是 lf9-cdn-tos.bytecdntp.com 上的 jQuery 3.1.1，该地址已 404
     （整页静默失效：$ 未定义 → ready 回调抛错 → 什么都不显示）。
     现在本地缺失时才回退 CDN：fastly.jsdelivr.net 优先，bootcdn 兜底 ——
     两个方向都保住，任一环节挂掉都不会再白屏。 -->
<script src="vendor/jquery-3.7.1.min.js"></script>
<script>window.jQuery || document.write('<script src="https://fastly.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"><\/script>');</script>
<script>window.jQuery || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"><\/script>');</script>
<style>
  :root {
    /* ===== 与「工具首页 / JSON 格式化 / 日期时间 / 字节与网速」共用的一套配色（浅色 · 靛蓝）===== */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    /* 数值强调色，与 JSON 工具的语法高亮同一批 */
    --num: #b25e09;
    --ok: #0d7a52;
    --err: #d1242f;

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 6px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none;
  }
  .brand { font-weight: 700; letter-spacing: .5px; margin-right: 4px; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border-2); flex: none; }
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .push { margin-left: auto; }

  /* ===== 控件 ===== */
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; outline: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
    min-width: 0;
  }
  /* ★ 按钮绝不折行、也不许被压窄（窄屏下 flex 会把中文逐字竖排成一条） */
  button { white-space: nowrap; flex-shrink: 0; }
  button:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.mini {
    padding: 3px 9px; font-size: 11px; line-height: 1.5;
    background: var(--panel-2); color: var(--text-2); border-color: var(--border);
  }
  button.mini:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ===== 主体 ===== */
  main {
    flex: 1; min-height: 0; overflow: auto;
    padding: 14px; display: grid; gap: 12px; align-content: start;
    width: 100%; max-width: 1120px; margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  main::-webkit-scrollbar { width: 10px; height: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  main::-webkit-scrollbar-track { background: transparent; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; min-width: 0;
  }
  .card > h2 {
    margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .card > h2 .hint { font-size: 11px; font-weight: 400; color: var(--text-3); }
  .card > h2 .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  textarea {
    display: block; width: 100%; resize: vertical;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font: 12px/1.65 var(--mono);
    outline: 0; cursor: text;
    transition: border-color .15s, box-shadow .15s;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea::-webkit-scrollbar { width: 10px; height: 10px; }
  textarea::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel-2); }
  textarea::-webkit-scrollbar-track { background: transparent; }

  /* 时间戳：本页唯一会跳动的值，给一点强调 */
  #time {
    color: var(--accent); font-weight: 700; font-size: 15px;
    letter-spacing: .5px; font-variant-numeric: tabular-nums;
  }

  /* ===== UA 解析结果 ===== */
  .tip { font-size: 11.5px; color: var(--text-3); line-height: 1.7; }
  .uasum { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .uasum .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-2); white-space: nowrap;
  }
  .uasum .chip b { color: var(--accent); font-weight: 600; }
  .kv-list { display: grid; gap: 5px; }
  .kv { display: flex; align-items: baseline; gap: 8px; }
  .kv .k { width: 68px; flex: none; color: var(--text-3); font-size: 11.5px; }
  .kv .v { flex: 1; min-width: 0; word-break: break-all; }
  .kv .v.mono { font-family: var(--mono); color: var(--num); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(6px);
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
    box-shadow: 0 12px 30px -14px rgba(79,107,237,.7);
    padding: 7px 16px; border-radius: 20px; opacity: 0; font-size: 13px;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .hide-sm { display: none; }
    header { gap: 8px; }
    .stat { font-size: 11px; }
    main { padding: 10px; gap: 10px; }
    .card { padding: 12px 12px; }
    /* 触屏下输入控件字号提到 16px：低于 16px 时 iOS 聚焦会把整页放大。
       #time 有 id 级规则（15px），特异性高于裸 textarea，必须一并列出。 */
    #time, textarea { font-size: 16px; }
  }

  /* 隐私说明：任何宽度都可见。窄屏放不下时 flex 会把它整体挪到下一行并换行显示，
     绝不 hide、绝不裁切（不用 hide-sm，那会在手机上把说明藏掉）。 */
  .stat.privacy-stat { display: inline-block; white-space: normal; flex: 0 1 auto; min-width: 0; }
</style>
</head>
<body>

<header>
  <div class="brand">Client<span>Info</span></div>
  <span class="sep"></span>
  <span class="stat" id="env">—</span>
  <button class="mini push" id="btnCopyAll" title="把时间戳 / UA / meta 三段一起复制">复制全部</button>
  <span class="sep hide-sm"></span>
  <span class="stat privacy-stat">信息仅在本机展示，不会上传</span>
</header>

<main>

  <section class="card">
    <h2>
      时间戳
      <span class="hint">毫秒，每秒刷新</span>
      <span class="right"><button class="mini" data-copy="time">复制</button></span>
    </h2>
    <textarea id="time" rows="1" readonly spellcheck="false"></textarea>
  </section>

  <section class="card">
    <h2>
      User-Agent
      <span class="hint">可直接粘贴别的 UA 来解析</span>
      <span class="right">
        <button class="mini" id="btnUaLocal" title="重新读入本机浏览器的 UA">读本机</button>
        <button class="mini" data-copy="ua">复制</button>
      </span>
    </h2>
    <textarea id="ua" rows="3" spellcheck="false" placeholder="粘贴任意 User-Agent…"></textarea>
  </section>

  <section class="card">
    <h2>
      UA 解析
      <span class="hint">随上面的 UA 实时变化</span>
    </h2>
    <div class="uasum" id="uaSum"></div>
    <div class="kv-list" id="uaKv"></div>
    <div class="tip" style="margin-top:9px">
      按常见特征串匹配（壳浏览器优先于 Chrome，脚本/爬虫最先判定）。
      <b>UA 是可伪装的字符串</b>，平台与版本判断仅供参考，不能当安全依据。
    </div>
  </section>

  <section class="card">
    <h2>
      页面 meta
      <span class="hint">当前页面全部 &lt;meta&gt; 标签</span>
      <span class="right"><button class="mini" data-copy="meta">复制</button></span>
    </h2>
    <textarea id="meta" rows="8" readonly spellcheck="false"></textarea>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  /* 两个 CDN 都没拿到时别让页面静默空白 —— 这个页面上一轮就是因为
     CDN 悄悄 404 而整页失效的（$ 未定义 → ready 回调抛错 → 什么都不显示）。
     至少把原因写出来，别让人对着空白猜。 */
  if (!window.jQuery) {
    document.body.innerHTML =
      '<p style="font:14px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;'
      + 'padding:16px;color:#c0392b">jQuery 加载失败（两个 CDN 都不可达）。'
      + '请检查网络后刷新重试。</p>';
    return;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  /* ============================================================
     UA 解析
     -- 纯特征串匹配，规则顺序即优先级：
        ① 脚本/爬虫最先判（它们的 UA 常伪装成 Mozilla/Chrome）
        ② 壳浏览器排在 Chrome 之前（微信/QQ/UC 的 UA 里都含 Chrome/…）
     ============================================================ */
  function parseUA(raw) {
    var s = String(raw == null ? "" : raw).trim();
    var out = { browser: "未知", ver: "", engine: "未知", os: "未知", device: "桌面", cpu: "", note: "" };
    if (!s) { out.note = "（空）"; return out; }

    var g = function (re) { var m = s.match(re); return m ? (m[1] || "") : ""; };

    /* ① 脚本 / 爬虫 */
    var BOT = /(Googlebot|bingbot|Baiduspider|YisouSpider|bytespider|Sogou web spider|360Spider|SemrushBot|AhrefsBot|facebookexternalhit|Twitterbot|curl|Wget|python-requests|python-urllib|Go-http-client|okhttp|libwww-perl|node-fetch|axios|HeadlessChrome|Java\/)/i;
    var bot = s.match(BOT);
    if (bot) { out.device = "爬虫 / 脚本"; out.note = bot[1]; }

    /* ② 浏览器 */
    var B = [
      ["微信内置", /MicroMessenger\/([\d.]+)/i],
      ["QQ 浏览器", /M?QQBrowser\/([\d.]+)/i],
      ["UC 浏览器", /UCBrowser\/([\d.]+)/i],
      ["夸克", /Quark\/([\d.]+)/i],
      ["360 浏览器", /(?:QihooBrowser|360SE|360EE)[\/ ]?([\d.]*)/i],
      ["搜狗浏览器", /(?:MetaSr|SogouMobileBrowser|SogouExplorer)[\/ ]?([\d.]*)/i],
      ["百度浏览器", /(?:BIDUBrowser|baidubrowser)[\/ ]?([\d.]*)/i],
      ["Edge", /Edg(?:e|A|iOS)?\/([\d.]+)/i],
      ["Opera", /(?:OPR|Opera)[\/ ]([\d.]+)/i],
      ["三星浏览器", /SamsungBrowser\/([\d.]+)/i],
      ["Firefox", /Firefox\/([\d.]+)/i],
      ["Chrome", /(?:Chrome|CriOS)\/([\d.]+)/i],
      ["Safari", /Version\/([\d.]+)[^)]*Safari/i],
      ["IE", /(?:MSIE\s([\d.]+)|rv:([\d.]+)\) like Gecko)/i]
    ];
    for (var i = 0; i < B.length; i++) {
      var m = s.match(B[i][1]);
      if (m) { out.browser = B[i][0]; out.ver = m[1] || m[2] || ""; break; }
    }

    /* ③ 渲染内核 */
    if (/Trident/i.test(s)) out.engine = "Trident";
    else if (/Presto/i.test(s)) out.engine = "Presto";
    else if (/Gecko\/|Firefox\//i.test(s)) out.engine = "Gecko";
    else if (/AppleWebKit/i.test(s)) out.engine = /Chrome\/|Chromium\/|Edg|OPR/i.test(s) ? "Blink" : "WebKit";

    /* ④ 操作系统 */
    var win = s.match(/Windows NT ([\d.]+)/);
    if (win) {
      var WV = { "10.0": "10 / 11", "6.3": "8.1", "6.2": "8", "6.1": "7", "6.0": "Vista", "5.1": "XP", "5.0": "2000" };
      out.os = "Windows " + (WV[win[1]] || win[1]);
    } else if (/HarmonyOS|OpenHarmony/i.test(s)) {
      out.os = "HarmonyOS" + (g(/HarmonyOS[\/ ]([\d.]+)/i) ? " " + g(/HarmonyOS[\/ ]([\d.]+)/i) : "");
    } else if (/Android/i.test(s)) {
      out.os = "Android" + (g(/Android[\/ ]([\d.]+)/i) ? " " + g(/Android[\/ ]([\d.]+)/i) : "");
    } else if (/iPhone|iPad|iPod/i.test(s)) {
      out.os = (/iPad/i.test(s) ? "iPadOS " : "iOS ") + g(/OS (\d+[_\d]*)/i).replace(/_/g, ".");
      out.os = out.os.trim();
    } else if (/CrOS/i.test(s)) {
      out.os = "ChromeOS";
    } else if (/Mac OS X/i.test(s)) {
      out.os = "macOS " + g(/Mac OS X (\d+[_.\d]*)/i).replace(/_/g, ".");
    } else if (/Linux/i.test(s)) {
      out.os = "Linux";
    }

    /* ⑤ 设备形态（爬虫已定，不再覆盖） */
    if (!bot) {
      if (/iPad|Tablet|PlayBook|Silk/i.test(s) || (/Android/i.test(s) && !/Mobile/i.test(s))) out.device = "平板";
      else if (/Mobi|iPhone|iPod|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(s)) out.device = "手机";
      else out.device = "桌面";
    }

    /* ⑥ CPU 架构（只作参考：Apple Silicon 上的 Safari 仍报 Intel Mac OS X） */
    if (/arm64|aarch64/i.test(s)) out.cpu = "arm64";
    else if (/WOW64|Win64|x64|amd64|x86_64/i.test(s)) out.cpu = "x64";
    else if (/i686|i386|i86/i.test(s)) out.cpu = "x86";
    else if (/Intel Mac OS X/i.test(s)) out.cpu = "Intel（Mac 上不可靠）";

    return out;
  }

  /* ★ 一律用 .text() 写入，不拼 HTML —— UA 是外部可控字符串。 */
  function renderUA() {
    var u = parseUA($("#ua").val());
    var chips = [
      ["浏览器", u.browser + (u.ver ? " " + u.ver : "")],
      ["内核", u.engine],
      ["系统", u.os],
      ["形态", u.device]
    ];
    if (u.cpu) chips.push(["架构", u.cpu]);

    var sum = $("#uaSum").empty();
    chips.forEach(function (c) {
      sum.append($("<span>").addClass("chip")
        .append($("<b>").text(c[0] + " "))
        .append(document.createTextNode(c[1])));
    });

    var rows = [
      ["浏览器", u.browser, 0],
      ["版本", u.ver || "—", 1],
      ["渲染内核", u.engine, 0],
      ["操作系统", u.os, 0],
      ["设备形态", u.device, 0],
      ["CPU 架构", u.cpu || "—", 0],
      ["特征串", u.note || "—", 1]
    ];
    var kv = $("#uaKv").empty();
    rows.forEach(function (r) {
      kv.append($("<div>").addClass("kv")
        .append($("<span>").addClass("k").text(r[0]))
        .append($("<span>").addClass("v" + (r[2] ? " mono" : "")).text(r[1])));
    });
  }

  /* 顶栏那句环境信息：视口 / 像素比 / 时区 —— 调 UA 时最常一起看的三样 */
  function envText() {
    var o = -new Date().getTimezoneOffset();
    var sign = o < 0 ? "-" : "+";
    o = Math.abs(o);
    return window.innerWidth + "×" + window.innerHeight
      + " · DPR " + (window.devicePixelRatio || 1)
      + " · UTC" + sign + pad2(Math.floor(o / 60)) + ":" + pad2(o % 60);
  }

  // UA 和 meta 是不变量，只在加载时写一次；
  // 之前每秒全量重写会清掉用户正在选择的文本，导致无法复制（本页核心用途）
  function start() {
    $("#time").val(new Date().getTime());
    $("#ua").val(window.navigator.userAgent);
    $("#meta").val("");
    $("meta").each(function () {
      $("#meta").val($("#meta").val() + $(this).prop("outerHTML") + "\n");
    });
    $("#env").text(envText());
    renderUA();
  }

  // 只有时间戳是变量，每秒单独刷新
  function tick() { $("#time").val(new Date().getTime()); }

  var toastTmr = 0;
  function toast(msg) {
    var $t = $("#toast");
    $t.text(msg).addClass("show");
    clearTimeout(toastTmr);
    toastTmr = setTimeout(function () { $t.removeClass("show"); }, 1600);
  }

  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done(); else toast("复制失败，请手动选择后复制");
  }

  function copyText(text, label) {
    var done = function () { toast(label + " 已复制"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  $(function () {
    start();
    setInterval(tick, 1000);

    // 顶栏那句环境信息随窗口变化重算
    $(window).on("resize", function () { $("#env").text(envText()); });

    // 每张卡片右上角的「复制」
    $("[data-copy]").on("click", function () {
      var id = $(this).data("copy");
      var label = { time: "时间戳", ua: "User-Agent", meta: "meta" }[id] || id;
      copyText($("#" + id).val(), label);
    });

    // UA 改动即时重解析（支持粘贴任意 UA）；「读本机」重新灌入当前浏览器 UA
    $("#ua").on("input", renderUA);
    $("#btnUaLocal").on("click", function () {
      $("#ua").val(window.navigator.userAgent);
      renderUA();
      toast("已读入本机 UA");
    });

    // 一次性把三段都带走，格式对齐「标签: 值」
    $("#btnCopyAll").on("click", function () {
      var all = "time: " + $("#time").val() + "\n"
              + "ua: " + $("#ua").val() + "\n"
              + "meta:\n" + $("#meta").val();
      copyText(all, "全部信息");
    });
  });
})();
</script>

</body>
</html>
