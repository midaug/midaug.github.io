<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JSON 格式化工具</title>
<meta name="theme-color" content="#f6f7f9" />
<style>
  :root {
    /* ===== 与「工具首页」共用的一套配色（浅色 · 靛蓝）===== */
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --border: rgba(15,23,42,.09);
    --border-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #5b6675;
    --text-3: #94a0b0;
    --accent: #4f6bed;
    --accent-2: #7c8aff;
    --accent-soft: rgba(79,107,237,.11);
    --hover: rgba(15,23,42,.042);
    --surface-1: rgba(15,23,42,.05);
    --surface-2: rgba(15,23,42,.08);
    --scrollbar: rgba(15,23,42,.16);
    --scrollbar-hover: rgba(15,23,42,.3);
    --guide: rgba(15,23,42,.14);

    /* ===== 语法高亮（浅色）===== */
    --key: #2f52c9;
    --str: #0d7a52;
    --num: #b25e09;
    --bool: #7a3fd4;
    --null: #94a0b0;
    --promoted: #9a3fbf;
    --err: #d1242f;
    --ancestor: #e5484d;   /* 悬停时祖先链的层级提示色 */

    /* 行高：一屏能放多少行的唯一旋钮。JS 的 ROW_H 会在启动时从它读一次，
       所以改这一个值就够，不需要同步改脚本。
       18px 的取舍：13px 等宽字体墨迹高约 12.3px，上下各留约 3px、相邻行墨迹
       间隙 4px（VS Code 默认约 5~6px），比 24px 每屏多约 34% 内容；
       再往下 16px 间隙只剩 2px，中文字形会贴行，且行内按钮会溢出。 */
    --row: 18px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--text); margin-right: 4px; }
  .brand span { color: var(--accent); }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
    transition: background .15s, border-color .15s, color .15s;
    /* 按钮文字绝不折行、也不许被压窄：顶栏是 flex 容器，窄屏下不设这两条时
       flex 会把按钮挤到比文字还窄，中文被逐字竖排成一根条
       （手机 390px 实测「压缩显示」被压成 34×84）。空间不够请让它换行，不要压扁。 */
    white-space: nowrap; flex-shrink: 0;
  }
  button:hover, select:hover { border-color: var(--accent); background: var(--hover); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 2px 10px -2px rgba(79,107,237,.45);
  }
  button.primary:hover { background: var(--accent); border-color: transparent; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .sep { width: 1px; height: 22px; background: var(--border-2); }
  /* 顶栏可选控件：不换行，空间不足时整体隐藏 */
  .stat { color: var(--text-2); font-size: 12px; white-space: nowrap; flex: none; }
  .stat input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; vertical-align: -1px; margin-right: 2px; }

  /* 性能统计：贴在结果区标题栏行尾，单行，空间不足时省略号截断 */
  .stat.perf {
    margin-left: auto; padding-left: 12px;
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }

  /* 窄屏时顶栏改为换行：原 hide-md/hide-sm 断点藏控件的方案已废弃
     （text-diff 分册教训 —— ≤900px 连「自动换行」开关都消失，功能凭空蒸发） */

  /* ===== 主体 ===== */
  main { flex: 1; display: flex; min-height: 0; }
  /* 左右 3 : 7 */
  .pane { flex: 3 1 0%; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .pane.right { flex: 7 1 0%; }
  .pane.left  { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-2);
    flex: none; overflow: hidden;
  }
  .pane-head b, .pane-head #outInfo { flex: none; white-space: nowrap; }
  .pane-head b { color: var(--text); font-weight: 600; }

  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: 10px 12px;
    background: var(--panel); color: var(--text); font: inherit; tab-size: 4; white-space: pre;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
  }
  textarea::placeholder { color: var(--text-3); }
  textarea::-webkit-scrollbar { width: 10px; height: 10px; }
  textarea::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel); }
  textarea::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea.wrap { white-space: pre-wrap; word-break: break-all; }

  /* ===== 虚拟列表 ===== */
  /* 只做布局/尺寸隔离，不用 contain: paint：
     结果区本来就有 overflow: auto 负责裁剪，再加 paint 隔离会让整棵子树
     被单独缓存光栅化，个别引擎在「只改文字颜色」时容易漏掉重绘
     （表现为某一行的高亮色残留）。 */
  #viewport { flex: 1; overflow: auto; position: relative; contain: layout size;
    scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
  #viewport::-webkit-scrollbar { width: 10px; height: 10px; }
  #viewport::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; border: 3px solid var(--panel); }
  #viewport::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  #viewport::-webkit-scrollbar-track { background: transparent; }
  #viewport::-webkit-scrollbar-corner { background: transparent; }

  /* 构建进度条：分片渲染大树时给出可见反馈 */
  #buildBar {
    height: 2px; flex: none; background: var(--surface-1); overflow: hidden;
    opacity: 0; transition: opacity .2s;
  }
  #buildBar.on { opacity: 1; }
  #buildBar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .1s linear;
  }
  /* 无法预估总量时（如增量展开深层子树）用不定进度动画 */
  #buildBar.indet i { width: 32%; transition: none; animation: barSlide 1s linear infinite; }
  @keyframes barSlide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  #sizer { position: relative; width: 100%; }
  /* 行本身用 max-content 撑开，#sizer 的宽度由 JS 按最宽行设置，从而产生横向滚动。
     这里刻意不加 will-change: transform —— 滚动时每帧都会重渲染可见行，
     整层本来就要重绘，提升成合成层拿不到收益，反而多一条「缓存光栅化」路径。 */
  #rows { position: absolute; top: 0; left: 0; width: max-content; min-width: 100%; }
  /* 行盒的 line-height 必须跟着 --row 走：否则文字按 body 的 13px/1.5 = 19.5px
     撑高，wrap 模式下 .row 是 height:auto + min-height:var(--row)，
     实际行高会被内容顶到 19.5px，--row 调小也压不下去。 */
  .row {
    height: var(--row); line-height: var(--row);
    display: flex; align-items: center; white-space: pre;
    padding-right: 12px; cursor: default;
    width: max-content; min-width: 100%; background: var(--panel);
  }
  /* 结果区文字可以像普通网页一样框选复制（行号 .ln、折叠箭头 .tw、
     注释 .hint、按钮 .acts 都不参与选中），复制出来就是干净的 JSON。 */
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--accent-soft); }
  /* 行内容容器：拆成「前缀（缩进 / 折叠箭头 / 键名）」与「值」两块。
     值单独成块，折行时续行自然悬挂对齐到值的起始列，缩进层级不会丢。
     两块都用 inline-block 而不是 flex item —— flex 布局下浏览器自带的复制
     会把每个 flex item 当成独立一行，在中间插入换行（`"key"\n: \n"value"`）；
     inline-block 属于同一行内流，复制出来就是连续的文本。 */
  .body { display: block; flex: none; }
  .pre  { display: inline-block; vertical-align: top; }
  .val  { display: inline-block; vertical-align: top; }
  /* 行号列固定在最左；缩进区绘制虚线层级引导线。
     pointer-events: none 是必需的：Chrome 不允许从 user-select:none 的元素上
     起选区，若行号列吞掉 mousedown，用户在左侧 52px 灰带里按下拖动会完全
     选不中任何东西。让它穿透到 .row，选区就自然从正文起点开始；
     行号本身仍因 user-select:none 而不进入复制内容。 */
  .ln {
    width: 52px; flex: none; text-align: right; padding-right: 14px; color: var(--text-3);
    user-select: none; pointer-events: none;
    position: sticky; left: 0; background: inherit; z-index: 1;
  }
  /* 缩进用固定步长控制视觉宽度（比真实空格紧凑），同时 .ind 里放着真实的
     缩进字符（空格 / Tab）——font-size:0 让它不占宽度也看不见，但框选复制时
     会跟着带走，于是复制出来的文本缩进层级和原文完全一致。 */
  .ind {
    display: inline-block; vertical-align: top; font-size: 0;
    background-image: linear-gradient(90deg, var(--guide) 1px, transparent 1px);
    background-size: 20px 4px;
    background-repeat: repeat-x;
    background-position: 10px 0;
  }
  .tw { display: inline-block; vertical-align: top; width: 15px; text-align: center;
    color: var(--text-3); cursor: pointer;
    user-select: none; font-size: 11px; }
  .tw:hover { color: var(--accent); }

  /* ===== 结果区自动换行模式 =====
     长字符串不再把行撑宽（去掉横向滚动条），而是在值所在的列内折行；
     行高随之不再固定，由 JS 实测每行高度 + 累积偏移来驱动虚拟滚动。 */
  #viewport.wrap { overflow-x: hidden; }
  #viewport.wrap #rows { width: 100%; }
  #viewport.wrap .row {
    width: 100%; min-width: 100%; height: auto; min-height: var(--row);
    align-items: flex-start; position: relative;
  }
  #viewport.wrap .ln { line-height: var(--row); }
  #viewport.wrap .body { flex: 1 1 auto; min-width: 0; }
  /* 前缀：最多占 60% 宽度，自身过宽时在列内折行，保证值列始终有位置 */
  #viewport.wrap .pre {
    line-height: var(--row);
    max-width: 60%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  /* 值块：占满键名之后的剩余宽度并在自己列内折行，续行自然悬挂对齐到值的起始列。
     max-width 必须显式扣掉前缀宽度（--pre-w 由 JS 按实测的前缀宽度写进每个行元素）：
     .val 是 inline-block，shrink-to-fit 的「可用宽度」是整个 .body 的宽度，并不
     知道同一行左边已经被 .pre 占掉多少；不给上限时它会按整个 .body 取宽，再排到
     前缀后面就撑出行外 —— 表现就是折行模式仍然冒出横向滚动条。 */
  #viewport.wrap .val {
    line-height: var(--row);
    max-width: calc(100% - var(--pre-w, 0px));
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  /* 绝对定位的 .acts 会被拉伸成整行高，若再叠加 top 偏移，按钮底边就会越过行底
     （--row:20 时溢出 1.19px）。显式给成 top:0 + height:var(--row) + flex 居中，
     按钮正好落在行内，与行高解耦。 */
  #viewport.wrap .acts {
    position: absolute; right: 12px; top: 0; height: var(--row); margin-left: 0;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .k { color: var(--key); }
  /* 冒号后面直接跟一个真实空格（复制出来是 ": "，符合 JSON 惯例），
     因此这里不再需要额外右边距 */
  .p { color: var(--text-3); }
  .s { color: var(--str); }
  .n { color: var(--num); }
  .num { color: var(--num); }
  .b { color: var(--bool); }
  .nl { color: var(--null); font-style: italic; }
  .c { color: var(--text-2); }
  .cm { color: var(--text-3); }

  /* 折叠提示：// 4 items。line-height 收成 1，避免它把折行模式下的行盒撑高 1px */
  .hint { color: var(--text-3); font-size: 11px; line-height: 1; margin-left: 10px; font-style: italic;
    user-select: none; }
  .hint.none { display: none; }

  /* 由 JSON 字符串提升上来的节点 */
  .v.promoted { color: var(--promoted); }

  /* ===== 层级提示 =====
     鼠标悬停任意一行时，把它所在的整条祖先链染色：
     祖先容器的「键名 + 折叠箭头 + 开括号 / 闭括号」一起变红，
     首尾括号成对变色，一眼看清当前字段挂在哪条路径下。
     根节点的括号不参与（否则整屏泛红反而失去指示意义）。
     下面这条规则只是兜底：实际颜色由 setAnc() 直接写到 .k / .tw / .v
     自身的行内样式上，重绘路径最短，不依赖父节点类名去失效整棵子树。 */
  .row.anc .k,
  .row.anc .tw,
  .row.anc .v { color: var(--ancestor); }

  /* 行内操作按钮：hover 时显示，横向滚动时吸附在右侧 */
  .acts { margin-left: auto; visibility: hidden; flex: none; user-select: none;
    position: sticky; right: 14px; background: inherit; }
  .row:hover .acts, .row.sel .acts { visibility: visible; }
  .acts button {
    /* line-height 收成 1.2：按钮高 = 11×1.2 + 2(padding) + 2(border) = 17.2px，
       刚好塞得进 18px 的行；沿用 body 的 1.5 会变成 20.5px 而溢出 */
    font-size: 11px; line-height: 1.2; padding: 1px 8px; margin-left: 6px;
    background: var(--panel-2); border-color: var(--border-2); color: var(--text-2);
  }
  .acts button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .acts button:disabled { opacity: .35; cursor: not-allowed; }
  .acts.off { visibility: hidden !important; }

  /* ===== 状态 / 提示 ===== */
  #empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); text-align: center; pointer-events: none; line-height: 1.9;
  }
  #status {
    padding: 5px 12px; border-top: 1px solid var(--border); background: var(--panel-2);
    color: var(--text-2); font-size: 12px; display: flex; align-items: center; gap: 10px; min-height: 28px;
  }
  #path { color: var(--str); word-break: break-all; }
  #status .err { color: var(--err); }
  .toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
    box-shadow: 0 12px 30px -14px rgba(79,107,237,.7);
    padding: 7px 16px; border-radius: 20px; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 手机适配（≤640px）=====
     两处硬伤（2026-10-14 实测 390px）：
       ① 顶栏控件多，按钮被 flex 压窄后中文逐字竖排（「压缩显示」→ 34×84 竖条）；
       ② 主体左右分栏 3:7 不折叠，输入区只剩 ~150px，占位文字逐字换行，整页不可用。
     这里只做「能用」的最小改动：按钮已全局不折行（见上），顶栏靠换行消化，
     主体改上下堆叠、各占一半高度。
     ★ 刻意不隐藏任何控件 —— 分册约定 hide-* 断点藏控件已废弃（text-diff 的教训）。 */
  @media (max-width: 640px) {
    header { padding: 8px 10px; gap: 6px 8px; }
    header .brand { font-size: 14px; }
    button, select { padding: 5px 9px; font-size: 12px; }
    .stat { font-size: 12px; }

    /* 左右栏 → 上下堆叠，各占一半高度 */
    main { flex-direction: column; }
    .pane, .pane.right { flex: 1 1 0%; }
    .pane.left { border-right: 0; border-bottom: 1px solid var(--border); }
    textarea, #viewport { min-height: 0; }

    /* 触屏：输入框字号提到 16px，否则 iOS 聚焦时会把整页放大 */
    textarea, select { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">JSON<span>Formatter</span></div>
    <button class="primary" id="btnFormat">格式化</button>
    <button id="btnSample">示例</button>
    <button id="btnClear">清空</button>
    <button id="btnUpload">导入文件</button>
    <input type="file" id="file" accept=".json,.txt,application/json" hidden />
    <span class="sep"></span>
    <button id="btnExpand">全部展开</button>
    <button id="btnCollapse">全部折叠</button>
    <button id="btnCopyAll">复制全部</button>
    <button id="btnCopyPath">复制路径</button>
    <span class="sep"></span>
    <label class="stat optional">缩进
      <select id="indent">
        <option value="2">2 空格</option>
        <option value="4" selected>4 空格</option>
        <option value="3">3 空格</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <label class="stat optional"><input type="checkbox" id="sortKeys" /> 排序键</label>
    <label class="stat optional" title="把内容本身是 JSON 的字符串字段也解析成嵌套结构"><input type="checkbox" id="nested" /> 嵌套解析</label>
    <label class="stat optional"><input type="checkbox" id="wrap" checked /> 自动换行</label>
  </header>

  <main>
    <section class="pane left">
      <div class="pane-head">
        <b>输入</b>
        <span id="inInfo">粘贴 JSON 文本，或导入文件</span>
        <button style="margin-left:auto" id="btnCompact">压缩显示</button>
      </div>
      <textarea id="input" spellcheck="false" class="wrap"
        placeholder='在这里粘贴 JSON，例如：{"name":"pelican","legs":[1,2,3]}'></textarea>
    </section>

    <section class="pane right">
      <div class="pane-head">
        <b>结果</b>
        <span id="outInfo">—</span>
        <span class="stat perf" id="stat">就绪</span>
      </div>
      <div id="buildBar"><i></i></div>
      <div id="viewport">
        <div id="empty">解析结果会显示在这里<br />点击任意字段可查看 / 复制 JSONPath</div>
        <div id="sizer"><div id="rows"></div></div>
      </div>
    </section>
  </main>

  <div id="status">
    <span id="statusText">等待输入…</span>
    <span id="path"></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const input = $("input"), viewport = $("viewport"), sizer = $("sizer"), rows = $("rows");
  const statusText = $("statusText"), pathBox = $("path"), stat = $("stat");
  /* ROW_H 是「未实测行的估算高度」，必须与 CSS 的 --row 一致，否则虚拟滚动的
     总高度会算错。这里只给一个兜底值，启动时会从 --row 真读一次（见文件末尾），
     这样调行高只需要改 CSS 一个地方。 */
  let ROW_H = 18;
  const OVERSCAN = 14;
  const CHUNK_MS = 7;
  const INDENT_STEP = 20;
  /* 行数不超过这个值时，整篇都渲染进 DOM（不用虚拟滚动）：这样浏览器自带的
     「框选复制」和「⌘F 网页搜索」能覆盖全文，行为跟普通网页完全一致。
     超过这个值才退回虚拟滚动，避免超大文档把 DOM 撑爆。 */
  const FULL_LIMIT = 4000;
  const GUTTER = 64;      // 行号列 52 + 行右侧留白 12，用于推算折行可用宽度
  const CHAR_W = 7.8;     // 13px 等宽字体的近似字符宽度，仅用于未实测行的高度估算
  const ID_RE = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

  /* ============================================================
     数据模型
     - 句柄（handle）惰性创建并缓存在父节点 _kids 上，身份稳定
     - 展开状态：显式设置优先，否则回落到全局默认 allOpen
     - 路径惰性计算：只算被点开的那一个
     ============================================================ */
  let data = null, root = null;
  let flat = [];        // 可见行：句柄数组（容器会出现两次：头 + 尾）
  let role = [];        // 与 flat 对齐：0=值行 1=容器头行 2=容器尾行
  let stack = null, building = false;
  let selected = null;
  let allOpen = true, overrides = 0, anchor = null, maxRowWidth = 0;
  let nestedMs = 0, nestedCount = 0;

  /* 结果区换行模式：行高不再固定，改用「每行实测高度 + 累积偏移」驱动虚拟滚动 */
  let wrapMode = true, lastAvail = 0;
  /* 当前是否「整篇渲染」（行数 ≤ FULL_LIMIT），由 render() 维护；滚动时据此决定要不要重渲染 */
  let fullMode = false;
  /* 真实缩进字符（随「缩进」下拉变化），写进 .ind 供框选复制带走 */
  let indentText = "    ";
  /* 层级提示：当前悬停的节点，以及它的祖先链集合（不含根节点） */
  let hoverNode = null, hoverAnc = null;
  /* 祖先链提示色：从 CSS 变量取，和 --ancestor 保持单一来源 */
  let ancColor = "";
  function ancHint() {
    if (!ancColor) {
      ancColor = getComputedStyle(document.documentElement)
        .getPropertyValue("--ancestor").trim() || "#e5484d";
    }
    return ancColor;
  }
  /* 给一行打 / 去「祖先链」标记。
     除了在 .row 上挂 anc 类（CSS 里有一份同样的规则兜底），还把颜色直接
     写到承载文字的三个 span 自身的行内样式上：改父节点的类名要靠引擎的
     「样式失效集合」遍历子树才能确定该重画哪些后代，而改元素自身样式只
     失效它自己 —— 重绘路径更短，也就不会出现「键名已恢复成蓝色、括号
     还留着上一次的红色」这类残留。 */
  function setAnc(el, on) {
    if (el._ancOn === on) return;      // 状态没变就不写，避免滚动时反复改样式
    el._ancOn = on;
    el.classList.toggle("anc", on);
    const c = on ? ancHint() : "";
    el._k.style.color = c;
    el._tw.style.color = c;
    el._v.style.color = c;
  }
  let heights = [];       // 与 flat 对齐：每行高度（已渲染过为实测值，否则为估算值）
  let offs = [0];         // 累积偏移，长度 = heights.length + 1；offs[i] = 第 i 行的顶部坐标
  let totalH = 0;         // 所有行高之和，即 sizer 的高度

  const countCache = new WeakMap();
  const isObj = v => v !== null && typeof v === "object";

  function childCount(v) {
    if (!isObj(v)) return 0;
    let c = countCache.get(v);
    if (c !== undefined) return c;
    c = Array.isArray(v) ? v.length : Object.keys(v).length;
    countCache.set(v, c);
    return c;
  }

  // 遍历直接子值（数组用索引，对象用自有可枚举键，避免 for...in 带入继承属性）
  function eachChild(v, fn) {
    if (Array.isArray(v)) { for (let i = 0; i < v.length; i++) fn(v[i]); }
    else { const ks = Object.keys(v); for (let i = 0; i < ks.length; i++) fn(v[ks[i]]); }
  }

  function totalNodes(v) {
    if (!isObj(v)) return 1;
    let total = 1;
    const st = [v];
    while (st.length) {
      const x = st.pop();
      total += childCount(x);
      eachChild(x, c => { if (isObj(c)) st.push(c); });
    }
    return total;
  }

  // 全部展开时的总行数 = 值数量 + 非空容器数量（每个容器多一行右括号）
  function totalLines(v) {
    if (!isObj(v)) return 1;
    let lines = 1, containers = 0;
    const st = [v];
    while (st.length) {
      const x = st.pop();
      const c = childCount(x);
      lines += c;
      if (c > 0) containers++;
      eachChild(x, y => { if (isObj(y)) st.push(y); });
    }
    return lines + containers;
  }

  // 行数/节点数只依赖 data，构建完成后缓存，避免每次滚动都全量遍历
  let metricsValid = false, metricLines = 0, metricNodes = 0;
  function refreshMetrics() {
    if (metricsValid) return;
    metricLines = totalLines(data);
    metricNodes = totalNodes(data);
    metricsValid = true;
  }

  function makeRoot(v) {
    return { raw: v, key: null, parent: null, idx: -1, isIdx: false, depth: 0,
             _kids: null, _keys: null, _count: 0, open: true, user: null, _p: undefined };
  }

  function childHandle(h, i) {
    const arr = h._kids;
    let c = arr[i];
    if (c) return c;
    const isArr = Array.isArray(h.raw);
    const key = isArr ? i : h._keys[i];
    c = { raw: h.raw[key], key, parent: h, idx: i, isIdx: isArr, depth: h.depth + 1,
          _kids: null, _keys: null, _count: 0, open: false, user: null, _p: undefined };
    arr[i] = c;
    return c;
  }

  function ensureKeys(h) {
    if (h._kids) return;
    const isArr = Array.isArray(h.raw);
    const ks = isArr ? null : Object.keys(h.raw);
    h._keys = ks;
    h._count = isArr ? h.raw.length : ks.length;
    h._kids = new Array(h._count);
  }

  function effOpen(h) { return h.user !== null ? h.user : allOpen; }

  /* ============================================================
     嵌套解析：把「内容本身是 JSON」的字符串字段也展开成结构
     - 用 WeakMap 记住每个被提升的对象原本的字符串，复制时可还原
     - 迭代遍历，避免深嵌套爆栈
     ============================================================ */
  const originStr = new WeakMap();   // 被提升的对象 -> 原始字符串

  const looksJson = s => {
    const t = s.trim();
    return t.length > 1 && (t[0] === "{" || t[0] === "[");
  };

  function promote(value, depth, budget) {
    if (!isObj(value)) return 0;
    let hit = 0;
    const st = [{ v: value, d: depth }];
    while (st.length) {
      const cur = st.pop();
      const v = cur.v;
      if (Array.isArray(v)) {
        for (let i = 0; i < v.length; i++) {
          const x = v[i];
          if (typeof x === "string" && looksJson(x) && budget.n > 0) {
            let p;
            try { p = JSON.parse(x); } catch (e) { p = undefined; }
            if (isObj(p)) {
              originStr.set(p, x);
              v[i] = p;
              budget.n--;
              hit++;
              if (cur.d < 20) st.push({ v: p, d: cur.d + 1 });
              continue;
            }
          } else if (isObj(x)) {
            if (cur.d < 20) st.push({ v: x, d: cur.d + 1 });
          }
        }
      } else {
        for (const k of Object.keys(v)) {
          const x = v[k];
          if (typeof x === "string" && looksJson(x) && budget.n > 0) {
            let p;
            try { p = JSON.parse(x); } catch (e) { p = undefined; }
            if (isObj(p)) {
              originStr.set(p, x);
              // __proto__ 用 defineProperty 写，避免触发原型 setter
              if (k === "__proto__") Object.defineProperty(v, k, { value: p, enumerable: true, writable: true, configurable: true });
              else v[k] = p;
              budget.n--;
              hit++;
              if (cur.d < 20) st.push({ v: p, d: cur.d + 1 });
              continue;
            }
          } else if (isObj(x)) {
            if (cur.d < 20) st.push({ v: x, d: cur.d + 1 });
          }
        }
      }
    }
    return hit;
  }

  function pathOf(h) {
    if (h._p !== undefined) return h._p;
    const chain = [];
    let n = h;
    while (n && n._p === undefined) { chain.push(n); n = n.parent; }
    let base = n ? n._p : "$";
    for (let i = chain.length - 1; i >= 0; i--) {
      const c = chain[i];
      if (!c.parent) { base = "$"; continue; }
      base = c.isIdx ? `${base}[${c.key}]`
        : ID_RE.test(c.key) ? `${base}.${c.key}`
        : `${base}[${JSON.stringify(c.key)}]`;
    }
    h._p = base;
    return base;
  }

  /* ============================================================
     分片构建 JSON 文本视图（每帧最多 7ms）
     ============================================================ */
  function push(n, r) { flat.push(n); role.push(r); }

  let buildGen = 0;   // 构建链世代号：构建中途重入 startBuild 时，旧 rAF 链到期自动失效

  function startBuild(keepScroll) {
    buildGen++;                            // 作废还在路上的旧 pump 链
    const gen = buildGen;
    indentText = indentStr();              // 缩进设置可能刚被改过，重新取一次

    anchor = (keepScroll && flat.length)
      ? flat[Math.min(rowAt(viewport.scrollTop), flat.length - 1)]
      : null;

    flat = []; role = [];
    maxRowWidth = 0;
    heights = []; offs = [0]; totalH = 0;    // 行内容已变，实测高度全部作废
    building = false;
    stack = null;

    if (root) {
      root.open = effOpen(root);
      if (root.open && childCount(root.raw)) {
        ensureKeys(root);
        push(root, 1);                       // 根的 "{" 行
        stack = [{ h: root, i: 0 }];
        building = true;
      } else {
        push(root, 0);                       // 空根直接显示成 {}
      }
    }
    if (overrides) barTarget = 0;
    else if (allOpen) { refreshMetrics(); barTarget = metricLines; }
    else barTarget = 1;
    setBar(building ? 0 : 1);

    render();
    if (building) pump(gen);
    else restoreAnchor();
  }

  function pump(gen) {
    if (gen !== buildGen) return;             // 本链已被新构建作废，不得驱动新链
    if (!stack) return;                       // 构建已被新操作取消
    const t0 = performance.now();
    while (stack.length && performance.now() - t0 < CHUNK_MS) {
      const fr = stack[stack.length - 1];
      const h = fr.h;
      if (fr.i >= h._count || !h.open) {
        if (h.open) push(h, 2);               // 右括号行
        stack.pop();
        continue;
      }
      const c = childHandle(h, fr.i);
      fr.i++;
      c.open = effOpen(c);
      if (isObj(c.raw) && c.open && childCount(c.raw)) {
        ensureKeys(c);
        push(c, 1);
        stack.push({ h: c, i: 0 });
      } else {
        push(c, 0);
      }
    }
    const done = stack.length === 0;
    building = !done;
    if (done) setBar(1); else setBar(barTarget ? flat.length / barTarget : 0);
    render();
    if (done) restoreAnchor();
    else requestAnimationFrame(() => pump(gen));
  }

  function restoreAnchor() {
    if (!anchor) { viewport.scrollTop = 0; return; }
    let n = anchor, idx = -1;
    while (n) { idx = flat.indexOf(n); if (idx >= 0) break; n = n.parent; }
    viewport.scrollTop = idx < 0 ? 0 : offs[idx];
    anchor = null;
  }

  /* 构建进度条 */
  const buildBar = $("buildBar"), barFill = buildBar.firstElementChild;
  let barTarget = 0;
  function setBar(p) {
    const pending = p < 1;
    buildBar.classList.toggle("on", pending);
    buildBar.classList.toggle("indet", pending && !barTarget);
    barFill.style.width = (pending && !barTarget) ? "" : Math.min(100, Math.round(p * 100)) + "%";
  }

  function eachCreated(fn) {
    const st = [root];
    while (st.length) {
      const h = st.pop();
      const kids = h._kids;
      fn(h);
      if (kids) for (let i = 0; i < kids.length; i++) { const c = kids[i]; if (c) st.push(c); }
    }
  }

  /* ============================================================
     可变行高
     - 折行模式下每行高度由内容决定，heights[i] 优先用实测值（渲染后读 offsetHeight），
       没渲染过的行先用估算值，滚动到附近时再被实测值替换
     - offs[i] 是第 i 行的顶部坐标（前缀和），用二分查找把 scrollTop 映射到行号
     ============================================================ */
  const wrapAvail = () => Math.max(60, viewport.clientWidth - GUTTER);

  // 粗略估算一行渲染出来有多少字符，只用于没渲染过的行的高度预估
  function estChars(n, r) {
    let c = 0;
    if (r !== 2 && n !== root && !n.isIdx) c += String(n.key).length + 4;  // "key":
    const v = n.raw;
    if (r !== 0) c += 1;                                     // 容器头 / 尾行的括号
    else if (v === null) c += 4;
    else if (typeof v === "string") c += v.length + 2;
    else if (isObj(v)) c += 2 + (childCount(v) ? 12 : 0);    // {} / [] 以及 // N items
    else c += String(v).length;
    return c;
  }

  function estimateH(i) {
    if (!wrapMode) return ROW_H;
    const n = flat[i];
    if (!n) return ROW_H;
    const px = n.depth * INDENT_STEP + 15 + estChars(n, role[i]) * CHAR_W;
    const lines = Math.ceil(px / wrapAvail());
    return (lines > 1 ? lines : 1) * ROW_H;
  }

  // 从 from 起重新累加偏移；from 之前的行高没有变化，可以直接续算
  function rebuildOffsets(from) {
    const n = heights.length;
    let acc = from > 0 ? offs[from] : 0;
    for (let i = from; i < n; i++) { offs[i] = acc; acc += heights[i]; }
    offs[n] = acc;
    totalH = acc;
  }

  // flat 长度变化时同步 heights / offs；新增的行先填估算高度
  function ensureHeights() {
    const n = flat.length;
    if (heights.length === n) return;
    if (n < heights.length) {
      heights.length = n;
      offs.length = n + 1;
      rebuildOffsets(0);
      return;
    }
    const from = heights.length;
    for (let i = from; i < n; i++) heights.push(estimateH(i));
    offs.length = n + 1;
    rebuildOffsets(from);
  }

  // 行宽或换行模式变化后，所有实测高度失效，整体退回估算
  function invalidateHeights() {
    heights = [];
    offs = [0];
    totalH = 0;
    lastAvail = wrapAvail();
    ensureHeights();
  }

  // 二分查找覆盖纵坐标 y 的那一行
  function rowAt(y) {
    const n = flat.length;
    if (!n) return 0;
    let lo = 0, hi = n - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (offs[mid + 1] <= y) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  // 切换结果区换行模式，尽量保持当前顶部行不动
  function setWrap(on) {
    if (on === wrapMode) return;
    const keep = flat.length ? rowAt(viewport.scrollTop) : 0;
    wrapMode = on;
    viewport.classList.toggle("wrap", on);
    invalidateHeights();
    viewport.scrollTop = offs[Math.min(keep, flat.length)] || 0;
    render();
  }

  /* ============================================================
     虚拟滚动渲染
     ============================================================ */
  const pool = [];
  function getRow(i) {
    if (pool[i]) return pool[i];
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML = '<span class="ln"></span>'
                + '<span class="body">'
                + '<span class="pre"><span class="ind"></span><span class="tw"></span>'
                + '<span class="k"></span><span class="p"></span></span>'
                + '<span class="val"><span class="v"></span><span class="cm"></span>'
                + '<span class="hint"></span></span>'
                + '</span>'
                + '<span class="acts">'
                + '<button data-a="copy">复制</button><button data-a="path">路径</button>'
                + '<button data-a="dl">下载</button><button data-a="del">删除</button></span>';
    d._ln = d.children[0]; d._body = d.children[1]; d._acts = d.children[2];
    const bx = d._body, pre = bx.children[0], val = bx.children[1];
    d._pre = pre;
    d._ind = pre.children[0]; d._tw = pre.children[1];
    d._k = pre.children[2];   d._p = pre.children[3];
    d._v = val.children[0];   d._cm = val.children[1]; d._hint = val.children[2];
    d._tw.onclick = e => { e.stopPropagation(); if (d._n) toggle(d._n); };
    d._acts.onclick = e => {
      const b = e.target.closest("button");
      if (!b || !d._n) return;
      e.stopPropagation();
      const a = b.dataset.a;
      if (a === "copy") copyValue(d._n);
      else if (a === "path") copyPath(d._n);
      else if (a === "dl") download(d._n);
      else deleteNode(d._n);
    };
    // 点击选中该行；但拖选文字结束时浏览器也会补一个 click，
    // 这时已经有选区了，就不该顺带把整行选中
    d.onclick = () => {
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      if (d._n) select(d._n);
    };
    // 双击文本是浏览器「选中一个词」的行为，此时不要顺带折叠容器；
    // 双击缩进 / 空白区域才折叠（折叠也可以直接点 ▾ 箭头）
    d.ondblclick = e => {
      if (!d._n || !isObj(d._n.raw)) return;
      if (e.target.closest && e.target.closest(".k, .p, .v, .cm, .hint")) return;
      toggle(d._n);
    };
    pool[i] = d;
    rows.appendChild(d);
    return d;
  }

  function render() {
    const total = flat.length;
    $("empty").style.display = total ? "none" : "flex";

    ensureHeights();

    const vh = viewport.clientHeight || 1;
    const y = viewport.scrollTop;
    // 行数不多时把整篇都渲染进 DOM：这样浏览器自带的「框选复制」和「⌘F 网页搜索」
    // 能覆盖全文，和普通网页一致。构建过程中（building）始终走虚拟滚动，
    // 避免每构建一批行就把整篇重画一遍。
    fullMode = !building && total > 0 && total <= FULL_LIMIT;
    const first = fullMode ? 0 : (total ? Math.max(0, rowAt(y) - OVERSCAN) : 0);
    const last = fullMode ? total : (total ? Math.min(total, rowAt(y + vh) + 1 + OVERSCAN) : 0);
    const need = Math.max(0, last - first);

    for (let i = 0; i < need; i++) getRow(i);
    // display 值没变就不再写：fullMode（4000 行）退回虚拟滚动后，
    // 每次滚动循环 4000 次写 style 是纯浪费
    for (let i = need; i < pool.length; i++) {
      const el = pool[i];
      if (el._shown !== false) { el.style.display = "none"; el._shown = false; }
    }
    for (let i = 0; i < need; i++) {
      const el = pool[i];
      if (el._shown !== true) { el.style.display = ""; el._shown = true; }
    }

    // 先把这一屏全部写进 DOM，再统一读回尺寸：避免每行触发一次强制布局
    for (let i = 0; i < need; i++) {
      const idx = first + i;
      paint(pool[i], flat[idx], role[idx], idx + 1);
    }

    // 折行模式下值块要扣掉前缀占的宽度（见 CSS 里 #viewport.wrap .val 的说明）。
    // 前缀宽度只取决于它自己的内容、与值块无关，所以可以「先全量读、再全量写」，
    // 避免读写交错导致每行一次强制布局。
    // 变量要写在 .body 上：自定义属性只沿树向下继承，.val 与 .pre 是兄弟，
    // 写在 .pre 上 .val 读不到。
    if (wrapMode) {
      for (let i = 0; i < need; i++) pool[i]._preW = pool[i]._pre.offsetWidth;
      for (let i = 0; i < need; i++) {
        const el = pool[i];
        if (el._preWApplied !== el._preW) {
          el._preWApplied = el._preW;
          el._body.style.setProperty("--pre-w", el._preW + "px");
        }
      }
    }

    let maxW = 0, changedFrom = -1;
    for (let i = 0; i < need; i++) {
      const idx = first + i, el = pool[i];
      const h = el.offsetHeight || ROW_H;                 // 折行模式下这里会大于 ROW_H
      if (heights[idx] !== h) {
        heights[idx] = h;
        if (changedFrom < 0 || idx < changedFrom) changedFrom = idx;
      }
      if (!wrapMode) { const w = el.offsetWidth; if (w > maxW) maxW = w; }
    }
    // 高度变化只影响该行及其之后的行，从这里往后重算累积偏移即可
    if (changedFrom >= 0) rebuildOffsets(changedFrom);

    rows.style.transform = `translateY(${Math.round(offs[first] || 0)}px)`;
    sizer.style.height = Math.round(totalH) + "px";
    if (wrapMode) {
      sizer.style.width = "";                             // 交给 CSS 的 width:100%，不产生横向滚动
    } else {
      maxRowWidth = Math.max(maxRowWidth, maxW);
      sizer.style.width = Math.max(viewport.clientWidth, maxRowWidth + 24) + "px";
    }

    if (!total) $("outInfo").textContent = "—";
    else if (building) $("outInfo").textContent = `${total.toLocaleString()} 行 · 构建中…`;
    else {
      refreshMetrics();
      $("outInfo").textContent =
        `${total.toLocaleString()} 行 / ${metricLines.toLocaleString()} 行 · ${metricNodes.toLocaleString()} 节点`
        + (fullMode ? "" : " · 虚拟滚动");
      $("outInfo").title = fullMode
        ? "全文已渲染：可以框选复制，浏览器搜索（⌘F）能命中全部内容"
        : `行数超过 ${FULL_LIMIT.toLocaleString()}，已启用虚拟滚动：DOM 里只有可见区域，`
          + "浏览器搜索（⌘F）只能命中已渲染的可见行";
    }
  }

  // 键和值都走 textContent 赋值，没有 HTML 注入风险，无需 HTML 转义

  // 只有「值行」和「右括号行」带逗号；开括号行后面不能有逗号
  // 空容器不显示 // N items 提示
  function isEmpty(n) { return childCount(n.raw) === 0; }

  function commaOf(n, r) {
    if (r === 1) return "";
    const p = n.parent;
    if (!p) return "";
    return n.idx >= childCount(p.raw) - 1 ? "" : ",";
  }

  function paint(el, n, r, lineNo) {
    el._n = n;
    el.classList.toggle("sel", n === selected);
    // 祖先链提示：容器的头行与尾行一起标（首尾括号成对变色），根节点不在 hoverAnc 里
    setAnc(el, !!hoverAnc && hoverAnc.has(n));
    el._ln.textContent = lineNo;

    const isC = isObj(n.raw);
    const isTail = r === 2;

    // 缩进：视觉宽度按固定步长（比真实空格紧凑），容器的右括号行与其头部行自然对齐。
    // 同时把真实缩进字符放进 .ind —— CSS 里是 font-size:0（不占宽度、看不见），
    // 但框选复制时会跟着带走，复制出来的文本缩进层级就和原文一致。
    el._ind.style.width = (n.depth * INDENT_STEP) + "px";
    el._ind.textContent = n.depth ? indentText.repeat(n.depth) : "";

    el._tw.textContent = (!isTail && isC && !isEmpty(n)) ? (n.open ? "▾" : "▸") : "";

    // 键名：数组元素没有键；容器尾行只显示右括号，不重复键名
    if (n === root || n.isIdx || isTail) {
      el._k.textContent = ""; el._p.textContent = "";
    } else {
      el._k.textContent = JSON.stringify(String(n.key));
      el._p.textContent = ": ";              // 冒号 + 真实空格，复制出来就是 ": "
    }
    el._p.style.display = (n === root || n.isIdx || isTail) ? "none" : "inline";

    // 值 / 括号：行类型决定显示什么
    //   role 2 = 右括号行，role 1 = 开括号行，role 0 = 值行（标量或折叠/空的容器）
    const v = el._v;
    if (r === 2) {
      v.className = "v c";
      v.textContent = Array.isArray(n.raw) ? "]" : "}";
      v.title = "";
    } else if (r === 1) {
      const org = originStr.get(n.raw);
      v.className = "v c" + (org !== undefined ? " promoted" : "");
      v.textContent = Array.isArray(n.raw) ? "[" : "{";
      v.title = org !== undefined ? "原本是一个 JSON 字符串，已解析为嵌套结构" : "";
    } else if (isC) {
      // 折叠 / 空容器：{} 或 []，并在后面标注元素个数
      const c2 = childCount(n.raw);
      const org = originStr.get(n.raw);
      v.className = "v c" + (org !== undefined ? " promoted" : "");
      v.textContent = Array.isArray(n.raw) ? "[]" : "{}";
      v.title = org !== undefined
        ? "原本是一个 JSON 字符串，已解析为嵌套结构"
        : (c2 ? c2 + " 项（点击 ▸ 展开）" : "");
    } else if (n.raw === null) {
      v.className = "v nl"; v.textContent = "null"; v.title = "";
    } else if (typeof n.raw === "string") {
      v.className = "v s";
      v.textContent = JSON.stringify(n.raw);   // 用 JSON 转义，不能用 HTML 转义
      v.title = "";
    } else if (typeof n.raw === "number") {
      v.className = "v num"; v.textContent = String(n.raw); v.title = "";
    } else {
      v.className = "v b"; v.textContent = String(n.raw); v.title = "";
    }
    el._cm.textContent = commaOf(n, r);

    // 折叠提示：// N items；被提升的节点额外标注「原为字符串」
    const org = isC ? originStr.get(n.raw) : undefined;
    let hint = "";
    if (r === 0 && isC && !isEmpty(n)) hint = "// " + childCount(n.raw).toLocaleString() + " items";
    // 「原为 JSON 字符串」只标在容器头/值行，尾括号行不重复标注
    if (org !== undefined && r !== 2) hint = (hint ? hint + "  " : "") + "// 原为 JSON 字符串";
    el._hint.textContent = hint;
    el._hint.className = hint ? "hint" : "hint none";

    el._acts.classList.toggle("off", isTail);       // 右括号行不提供操作
    el._acts.children[3].disabled = n === root;     // 根节点不可删除
  }

  /* ============================================================
     层级提示：悬停任意字段，把它所在的整条祖先链染色
     - 只在「悬停的那一行」变化时重算，再逐行 toggle 类名
       （可见行只有几十个，开销可忽略）
     - 滚动后新渲染出来的行由 paint() 依据 hoverAnc 自动补上标记
     ============================================================ */
  function applyAnc() {
    for (let i = 0; i < pool.length; i++) {
      const el = pool[i];
      setAnc(el, !!hoverAnc && hoverAnc.has(el._n));
    }
  }

  function setHoverNode(node) {
    if (node === hoverNode) return;
    hoverNode = node;
    hoverAnc = null;
    if (node && node !== root) {
      const s = new Set();
      for (let p = node.parent; p && p !== root; p = p.parent) s.add(p);
      if (s.size) hoverAnc = s;
    }
    applyAnc();
  }

  // 记住鼠标位置：行是复用的，滚动 / 重排后必须按坐标重新定位，
  // 否则高亮会停留在旧行上（虚拟列表特有的坑）
  let hoverPt = null;
  function setHoverFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    const row = el && el.closest ? el.closest(".row") : null;
    setHoverNode(row ? row._n : null);
  }

  rows.addEventListener("mousemove", e => {
    hoverPt = { x: e.clientX, y: e.clientY };
    const row = e.target.closest ? e.target.closest(".row") : null;
    setHoverNode(row ? row._n : null);
  });
  rows.addEventListener("mouseleave", () => { hoverPt = null; setHoverNode(null); });

  let scrollRaf = 0;
  viewport.addEventListener("scroll", () => {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = 0;
      // 整篇渲染时 DOM 里已经是全部行，滚动无需重渲染（也避免每帧重画几千行）
      if (!fullMode) render();
      // 滚动后鼠标下的行已经变了，按坐标重新定位悬停行
      if (hoverPt) setHoverFromPoint(hoverPt.x, hoverPt.y);
    });
  }, { passive: true });
  let resizeRaf = 0;
  window.addEventListener("resize", () => {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = 0;
      // 行宽变了，折行行数随之变化，之前的实测高度不再成立
      if (wrapMode && wrapAvail() !== lastAvail) invalidateHeights();
      render();
    });
  });

  function select(n) {
    const prev = selected;
    selected = n;
    pathBox.textContent = pathOf(n);
    statusText.textContent = isObj(n.raw)
      ? (Array.isArray(n.raw) ? "array" : "object") + " · " + childCount(n.raw) + " 项"
      : (n.raw === null ? "null" : typeof n.raw);
    statusText.className = "";
    // fullMode 下整篇已在 DOM，选中态只需更新受影响行的类名，
    // 不必为了一个高亮全量重绘 4000 行并重读尺寸
    if (fullMode) {
      for (const el of pool) {
        if (el._n === prev || el._n === n) el.classList.toggle("sel", el._n === n);
      }
    } else render();
  }

  function toggle(n) {
    if (!isObj(n.raw) || childCount(n.raw) === 0) return;   // 空容器无需展开/折叠
    n.user = !n.open;
    overrides++;
    startBuild(true);
  }

  /* ============================================================
     复制 / 下载 / 删除
     ============================================================ */
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1400);
  }

  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
    });
  }

  function copyValue(n) {
    const org = isObj(n.raw) ? originStr.get(n.raw) : undefined;
    let text;
    try {
      text = org !== undefined ? org
        : isObj(n.raw) ? stringify(n.raw, $("sortKeys").checked, true)
        : JSON.stringify(n.raw);
    } catch (e) { return toast("复制失败：" + e.message); }
    writeClipboard(text).then(() => toast(org !== undefined ? "已复制原始字符串" : "已复制节点值"))
      .catch(() => toast("复制失败"));
  }
  function copyPath(n) {
    writeClipboard(pathOf(n)).then(() => toast("已复制路径 " + pathOf(n))).catch(() => toast("复制失败"));
  }
  function download(n) {
    let text;
    try { text = isObj(n.raw) ? stringify(n.raw, false, true) : JSON.stringify(n.raw); }
    catch (e) { return toast("下载失败：" + e.message); }
    const blob = new Blob([text], { type: "application/json" });
    const a = document.createElement("a");
    const name = (n === root || n.isIdx) ? "json" : String(n.key).replace(/[^\w.-]/g, "_");
    a.href = URL.createObjectURL(blob);
    a.download = name + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("已下载 " + a.download);
  }
  function isDescendantOf(node, anc) {
    for (let x = node; x; x = x.parent) if (x === anc) return true;
    return false;
  }

  function deleteNode(n) {
    const p = n.parent;
    if (!p) return toast("根节点不可删除");
    const name = n.isIdx ? `[${n.idx}]` : n.key;
    if (!confirm(`确定删除 ${pathOf(n)} ？`)) return;
    if (Array.isArray(p.raw)) p.raw.splice(n.idx, 1);
    else delete p.raw[n.key];
    countCache.delete(p.raw);          // 数量已变，失效缓存
    p._keys = null; p._kids = null; p._count = 0;
    metricsValid = false;              // 节点数已变
    // p 的所有子句柄已失效，若选中项在其下则清除选中态，避免高亮/路径残留
    if (selected && selected !== p && isDescendantOf(selected, p)) {
      selected = null;
      pathBox.textContent = "";
    }
    overrides++;
    startBuild(true);
    toast("已删除 " + name);
  }

  /* ============================================================
     解析 / 序列化
     ============================================================ */
  function indentStr() {
    const v = $("indent").value;
    return v === "tab" ? "\t" : " ".repeat(+v);
  }

  // keepOriginal=true 时，把「嵌套解析」提升出来的对象还原成它原本的字符串
  function stringify(value, sortKeys, keepOriginal) {
    return JSON.stringify(value, function (k, v) {
      if (keepOriginal && originStr.has(v)) return originStr.get(v);
      if (sortKeys && v && typeof v === "object" && !Array.isArray(v)) {
        const o = {};
        for (const key of Object.keys(v).sort()) {
          // __proto__ 用 defineProperty 写，避免触发原型 setter 导致丢键/污染
          if (key === "__proto__") {
            Object.defineProperty(o, key, { value: v[key], enumerable: true, writable: true, configurable: true });
          } else {
            o[key] = v[key];
          }
        }
        return o;
      }
      return v;
    }, indentStr());
  }

  function bytes(str) {
    let n = 0;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xD800 && c <= 0xDBFF) {
        const d = str.charCodeAt(i + 1);
        if (d >= 0xDC00 && d <= 0xDFFF) { n += 4; i++; }  // 合法代理对
        else n += 3;                                      // 孤立高代理项
      } else n += 3;
    }
    return n;
  }
  const fmtBytes = n => n < 1024 ? n + " B"
    : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB"
    : n < 1073741824 ? (n / 1048576).toFixed(2) + " MB"
    : (n / 1073741824).toFixed(2) + " GB";
  const fmtMs = ms => (ms < 10 ? ms.toFixed(1) : Math.round(ms)) + "ms";

  function setStatus(msg, isErr) { statusText.textContent = msg; statusText.className = isErr ? "err" : ""; }

  function resetView(msg) {
    data = null; root = null; selected = null;
    metricsValid = false;
    startBuild(false);
    pathBox.textContent = "";
    setStatus(msg);
    stat.textContent = stat.title = "就绪";
    $("inInfo").textContent = "粘贴 JSON 文本，或导入文件";
  }

  function parseAndRender() {
    const txt = input.value;
    if (!txt.trim()) return resetView("等待输入…");

    const t0 = performance.now();
    let parsed;
    try { parsed = JSON.parse(txt); }
    catch (e) {
      data = null; root = null; metricsValid = false; startBuild(false);
      setStatus("解析失败：" + e.message, true);
      stat.textContent = stat.title = "解析失败";
      return;
    }
    const tParse = performance.now() - t0;

    data = parsed;
    metricsValid = false;
    // 嵌套解析：把内嵌 JSON 字符串提升为真实结构
    let promoted = 0;
    if ($("nested").checked) {
      const tN = performance.now();
      promoted = promote(data, 0, { n: 20000 });
      nestedMs = performance.now() - tN;
      nestedCount = promoted;
    } else { nestedMs = 0; nestedCount = 0; }

    root = makeRoot(data);
    allOpen = true;
    overrides = 0;
    startBuild(false);
    const tBuild = performance.now() - t0 - tParse;

    select(root);
    const size = bytes(txt);
    $("inInfo").textContent = `${fmtBytes(size)} · ${txt.length.toLocaleString()} 字符`;
    // 节点数已在 outInfo 里显示，这里只留耗时，避免重复
    stat.textContent = `解析 ${fmtMs(tParse)} · 建树 ${fmtMs(tBuild)}`
      + (nestedCount ? ` · 嵌套 ${nestedCount.toLocaleString()} 处 ${fmtMs(nestedMs)}` : "");
    stat.title = stat.textContent;      // 被省略号截断时可悬停看全量
    setStatus(building ? "解析成功，正在渲染…"
      : nestedCount ? `解析成功 · 已展开 ${nestedCount.toLocaleString()} 处内嵌 JSON`
      : "解析成功");
  }

  /* ============ 按钮 ============ */
  $("btnFormat").onclick = () => {
    const txt = input.value;
    if (!txt.trim()) return toast("输入为空");
    const t0 = performance.now();
    let parsed, out;
    try { parsed = JSON.parse(txt); }
    catch (e) { setStatus("解析失败：" + e.message, true); return toast("解析失败"); }
    try { out = stringify(parsed, $("sortKeys").checked); }
    catch (e) { setStatus("序列化失败：" + e.message, true); return toast("序列化失败"); }
    input.value = out;
    parseAndRender();
    setStatus(`格式化完成 · ${fmtMs(performance.now() - t0)} · 输出 ${fmtBytes(bytes(out))}`);
  };

  $("btnCompact").onclick = () => {
    const txt = input.value;
    if (!txt.trim()) return toast("输入为空");
    let out;
    try { out = JSON.stringify(JSON.parse(txt)); }
    catch (e) { setStatus("解析失败：" + e.message, true); return toast("解析失败"); }
    input.value = out;
    parseAndRender();                 // 同步刷新结果面板，避免与输入框不一致
    setStatus(`已压缩显示 · 输出 ${fmtBytes(bytes(out))}`);
  };

  $("btnSample").onclick = () => { input.value = stringify(sample(), false); parseAndRender(); };
  $("btnClear").onclick = () => { input.value = ""; resetView("等待输入…"); };

  $("btnUpload").onclick = () => $("file").click();
  $("file").onchange = e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast("文件过大（> 20MB），已取消");
    const fr = new FileReader();
    fr.onload = () => { input.value = String(fr.result); parseAndRender(); toast("已导入 " + f.name); };
    fr.onerror = () => toast("读取文件失败");
    fr.readAsText(f);
  };

  $("btnExpand").onclick = () => {
    if (!root) return;
    allOpen = true; overrides = 0;
    eachCreated(h => { h.user = null; });
    startBuild(true);
  };

  $("btnCollapse").onclick = () => {
    if (!root) return;
    allOpen = false; overrides = 0;
    eachCreated(h => {
      h.user = null;
      if (h !== root) { h._kids = null; h._keys = null; h._count = 0; }
    });
    startBuild(true);
  };

  $("btnCopyAll").onclick = () => {
    if (!root) return;
    let text;
    try { text = stringify(root.raw, $("sortKeys").checked, true); }
    catch (e) { return toast("复制失败：" + e.message); }
    writeClipboard(text).then(() => toast("已复制全部内容")).catch(() => toast("复制失败"));
  };
  $("btnCopyPath").onclick = () => { if (selected) copyPath(selected); };

  $("wrap").onchange = e => {
    input.classList.toggle("wrap", e.target.checked);
    setWrap(e.target.checked);          // 结果区同步换行 / 恢复横向滚动
  };
  $("indent").onchange = () => { if (input.value.trim()) $("btnFormat").click(); };
  $("sortKeys").onchange = () => { if (input.value.trim()) $("btnFormat").click(); };
  $("nested").onchange = () => { if (input.value.trim()) parseAndRender(); };

  let idle;
  function scheduleParse() {
    clearTimeout(idle);
    setStatus("输入中…");
    idle = setTimeout(parseAndRender, 400);
  }
  input.addEventListener("input", scheduleParse);
  input.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("btnFormat").click(); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      indentSelection(e.shiftKey);
      scheduleParse();          // 程序化赋值不触发 input 事件，需手动触发刷新
    }
  });

  // Tab 缩进 / Shift+Tab 反缩进：有选区时按行处理，无选区时在光标处插入/删除一级缩进
  function indentSelection(outdent) {
    const val = input.value, pad = indentStr();
    const s = input.selectionStart, t = input.selectionEnd;

    if (s === t) {
      if (!outdent) {
        input.value = val.slice(0, s) + pad + val.slice(s);
        input.selectionStart = input.selectionEnd = s + pad.length;
      } else {
        // 反缩进当前行行首的缩进，与光标在行内的位置无关
        const lineStart = val.lastIndexOf("\n", s - 1) + 1;
        const m = val.slice(lineStart).match(/^[ \t]+/);
        if (!m) return;
        const cut = Math.min(m[0].length, pad.length);
        input.value = val.slice(0, lineStart) + val.slice(lineStart + cut);
        input.selectionStart = input.selectionEnd = Math.max(lineStart, s - cut);
      }
      return;
    }

    const start = val.lastIndexOf("\n", s - 1) + 1;
    let end = val.indexOf("\n", t);
    if (end === -1) end = val.length;
    if (t > s && val[t - 1] === "\n") end = t - 1;   // 选区止于行首时不改动该行

    const out = val.slice(start, end).split("\n").map(ln => {
      if (!outdent) return pad + ln;
      if (ln.startsWith(pad)) return ln.slice(pad.length);
      const m = ln.match(/^[ \t]+/);
      return m ? ln.slice(Math.min(m[0].length, pad.length)) : ln;
    }).join("\n");

    input.value = val.slice(0, start) + out + val.slice(end);
    input.selectionStart = start;
    input.selectionEnd = start + out.length;
  }

  function sample() {
    return {
      name: "pelican", age: 3, cute: true, nickname: null,
      tags: ["bird", "骑", "单车", "bike"],
      stats: { speed: 12.5, stamina: 88, height: 1.4 },
      friends: [{ name: "toucan", score: 91 }, { name: "flamingo", score: 76 }],
      config: { theme: "dark", nested: { deep: { deeper: 42 } } },
      // 下面两个字段的值本身就是 JSON 字符串，勾选「嵌套解析」后会展开成结构
      payload: '{"event":"deploy","ok":true,"retries":2}',
      trace: '[{"span":"db","ms":12},{"span":"cache","ms":3}]'
    };
  }

  // 行高只有 --row 一个来源：读一次让估算高度与 CSS 对齐（改 --row 不用动 JS）
  {
    const cssRow = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row"));
    if (cssRow > 0) ROW_H = cssRow;
  }

  // 初始换行状态与顶栏复选框保持一致
  wrapMode = $("wrap").checked;
  viewport.classList.toggle("wrap", wrapMode);
  lastAvail = wrapAvail();

  parseAndRender();
})();
</script>
