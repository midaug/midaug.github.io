<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具箱 · Tools</title>
<meta name="description" content="一些自用的小工具集合：JSON 格式化、儿童生长发育评价、日历、SSQ 数据整理、运维脚本等。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" href="/favicon.ico">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;
  --panel:#ffffff;
  --panel-2:#f2f4f7;
  --border:rgba(15,23,42,.09);
  --border-2:rgba(15,23,42,.15);
  --text:#0f172a;
  --text-2:#5b6675;
  --text-3:#94a0b0;
  --accent:#4f6bed;
  --accent-2:#7c8aff;
  --accent-soft:rgba(79,107,237,.11);
  --hover:rgba(15,23,42,.042);
  --surface-1:rgba(15,23,42,.05);
  --surface-2:rgba(15,23,42,.08);
  --scrollbar:rgba(15,23,42,.16);
  --scrollbar-hover:rgba(15,23,42,.3);
  --glow-1:rgba(79,107,237,.10);
  --glow-2:rgba(124,138,255,.06);
  --mark-fg:#ffffff;
  --mark-shadow:0 2px 10px -2px rgba(79,107,237,.45);
  --panel-inset:rgba(255,255,255,.9);
  --panel-shadow:0 24px 56px -30px rgba(15,23,42,.32), 0 3px 10px -6px rgba(15,23,42,.12);
  --kbd-shadow:rgba(15,23,42,.07);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 340px at 50% -120px, var(--glow-1), transparent 68%),
    radial-gradient(520px 260px at 92% 8%, var(--glow-2), transparent 70%);
}
a{color:inherit;text-decoration:none}

/* ============ 整页骨架（与其余 19 个工具页同一套）============
   窗口自己从不滚动：body 是定高 flex 列，顶栏 flex:none，只有 main 内部滚。
   顶栏因此落在**滚动容器外面** —— 滚到顶/底的惯性回弹（macOS 橡皮筋）平移的是
   滚动内容，带不动它，顶栏一像素都不会动。
   ⚠️ 别改回 position:sticky：sticky 元素本身属于滚动内容，回弹时会被一起平移，
   观感就是「划到顶点和底端的时候 header 动一下」（用户因此让照工具页重做）。 */
.shell{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}
/* 内容列：顶栏与滚动正文共用同一条 760px 轴（box-sizing:border-box，故实宽 716px） */
.in{max-width:760px;margin:0 auto;padding:0 22px}

/* ---------- 正文区：全站唯一会滚的容器 ---------- */
/* 滚动条样式与其余工具页逐字一致（10px、3px 实色描边做出「细轨」效果）。 */
main{
  flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent;
}
main::-webkit-scrollbar{width:10px;height:10px}
main::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:10px;border:3px solid var(--bg)}
main::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}
main::-webkit-scrollbar-track{background:transparent}
main>.in{padding-bottom:80px}

/* ---------- 顶栏（不滚：搜索框永远看得见）---------- */
/* 品牌行 + 搜索框放在滚动容器外面的一行里，滚列表时停在窗口顶部。
   顶栏底色用 --bg 实色：滚动中的行要完全被盖住，不能透出来。
   position:relative + z-index 是为了让下面那条渐隐条盖住面板里的行
   （`.row` 是 position:relative，不这样会被行压住）。 */
.bar{
  position:relative;z-index:5;flex:none;
  padding:18px 0 12px;
  background:var(--bg);
}
/* 吸顶时在下沿补一条渐隐：滚动中的内容淡出，而不是被硬切一刀。
   判据是「正文区是否已经滚动」，渐隐条常驻 DOM、只切 opacity：
   一滚就淡入，不会出现硬切的一帧；滚回顶部时保持透明，免得糊住面板上缘。 */
.bar::after{
  content:"";position:absolute;left:0;right:0;top:100%;height:18px;
  pointer-events:none;
  background:linear-gradient(var(--bg), transparent);
  opacity:0;transition:opacity .18s ease;
}
.bar.stuck::after{opacity:1}
.bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}
.brand{display:flex;align-items:center;gap:9px}
.mark{
  width:24px;height:24px;border-radius:7px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--mark-fg);
  box-shadow:var(--mark-shadow);
}
.mark svg{width:13px;height:13px}
.brand h1{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.bar .meta{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ---------- 搜索框 ---------- */
.cmd{
  display:flex;align-items:center;gap:11px;padding:0 15px;height:52px;
  background:var(--panel);
  border:1px solid var(--border-2);border-radius:14px;
  box-shadow:0 1px 0 var(--panel-inset) inset, var(--panel-shadow);
}
.cmd .ico{flex:none;color:var(--text-3);transition:color .15s}
.cmd:focus-within .ico{color:var(--accent)}
.cmd:focus-within{border-color:var(--accent)}
#q{
  flex:1;min-width:0;height:100%;
  border:0;outline:0;background:transparent;
  color:var(--text);font-size:14.5px;font-family:inherit;
}
#q::placeholder{color:var(--text-3)}
#q::-webkit-search-cancel-button{display:none}
kbd{
  font-family:var(--font);font-size:11px;font-weight:500;line-height:1;
  padding:4px 6px;border-radius:5px;
  color:var(--text-3);background:var(--surface-1);
  border:1px solid var(--border);box-shadow:0 1px 0 var(--kbd-shadow);
}
.cmd kbd{cursor:pointer}
.cmd kbd:hover{color:var(--text-2);background:var(--surface-2)}

/* ---------- 列表面板 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border-2);
  border-radius:14px;
  box-shadow:0 1px 0 var(--panel-inset) inset, var(--panel-shadow);
}

/* ---------- 列表 ---------- */
/* 列表本身不滚、也没有固定高度：整页高度随内容展开，一律用浏览器窗口的滚动条。
   定高会让一屏看不全工具，且要额外维护「底部渐隐」这类内部滚动的提示，已去掉。 */
.list{
  padding:7px 7px 9px;
}

.group-head{display:flex;align-items:center;gap:10px;padding:13px 11px 6px}
.group-head .gname{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.04em;white-space:nowrap}
.group-head .gname svg{width:11px;height:11px;flex:none;color:var(--accent)}
.group-head .line{flex:1;height:1px;background:var(--border)}
.group-head .gcount{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.group:first-child .group-head{padding-top:7px}

.row{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 26px;
  align-items:center;
  gap:2px;
  height:41px;
  padding:0 5px 0 9px;
  border-radius:9px;
  transition:background .12s ease;
}
/* 主区是链接，靠 ::after 铺满整行做点击热区；
   星标按钮用 z-index 浮在热区之上，两者互不干扰。 */
.row-hit{
  display:grid;
  grid-template-columns:26px minmax(0,1fr) auto 14px;
  align-items:center;
  gap:11px;
  min-width:0;
  height:100%;
}
.row-hit::after{content:"";position:absolute;inset:0;border-radius:9px}
/* 置顶星标：平时隐形，悬停 / 键盘选中 / 已置顶时浮现 */
.row-pin{
  position:relative;z-index:1;
  width:26px;height:26px;flex:none;
  display:grid;place-items:center;
  padding:0;border:0;border-radius:7px;
  background:transparent;color:var(--text-3);
  cursor:pointer;opacity:0;
  transition:opacity .14s,color .14s,background .14s;
}
.row-pin svg{width:14px;height:14px}
.row:hover .row-pin,.row:focus-within .row-pin,.row.is-active .row-pin{opacity:1}
.row-pin.on{opacity:1;color:var(--accent)}
.row-pin:hover{background:var(--surface-1);color:var(--accent)}
.row-pin:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:1px}
/* 触屏没有 hover，星标得常驻才点得到 */
@media (hover:none){ .row-pin:not(.on){opacity:.4} }
.row::before{
  content:"";position:absolute;left:0;top:50%;
  width:2px;height:17px;border-radius:2px;background:var(--accent);
  transform:translateY(-50%) scaleY(0);
  transition:transform .16s cubic-bezier(.2,.8,.3,1);
}
.row:hover,.row.is-active{background:var(--hover)}
.row:hover::before,.row.is-active::before{transform:translateY(-50%) scaleY(1)}

.row-ico{
  width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;
  background:var(--surface-1);
  color:var(--text-2);
  transition:background .14s,color .14s;
}
.row-ico svg{width:14px;height:14px}
.row:hover .row-ico,.row.is-active .row-ico{background:var(--accent-soft);color:var(--accent)}

.row-main{display:flex;align-items:baseline;gap:10px;min-width:0}
.row-name{font-size:13.5px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;flex:none}
.row-desc{
  font-size:12.5px;color:var(--text-3);
  min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row:hover .row-desc,.row.is-active .row-desc{color:var(--text-2)}

.row-path{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  white-space:nowrap;
  transition:color .14s;
}
.row:hover .row-path,.row.is-active .row-path{color:var(--text-2)}

.row-arrow{color:var(--accent);opacity:0;transform:translateX(-3px);transition:opacity .14s,transform .14s;display:grid;place-items:center}
.row:hover .row-arrow,.row.is-active .row-arrow{opacity:1;transform:translateX(0)}

/* ---------- 空态 ---------- */
.empty{display:none;padding:56px 20px 62px;text-align:center}
.empty .ei{color:var(--text-3);margin-bottom:12px}
.empty .et{font-size:13.5px;color:var(--text-2)}
.empty .es{font-size:12px;color:var(--text-3);margin-top:5px}

/* ---------- 底栏 ---------- */
.hints{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:14px;padding:0 6px;
  font-size:12px;color:var(--text-3);
}
.hints .keys{display:flex;gap:14px;flex-wrap:wrap}
.hints .keys span{display:flex;align-items:center;gap:5px}
.hints .keys kbd{font-size:10px;padding:2px 5px}
.hints .sep{color:var(--border-2)}

@media (max-width:600px){
  .in{padding:0 14px}
  main>.in{padding-bottom:60px}
  .row{grid-template-columns:minmax(0,1fr) 28px;height:44px;padding:0 3px 0 8px}
  .row-hit{grid-template-columns:26px minmax(0,1fr) 14px;gap:10px}
  .row-desc{display:none}
  .row-path{display:none}
  .panel,.cmd{border-radius:12px}
  .bar{padding:12px 0 10px}
  .bar-top{margin-bottom:10px}
}
/* 触屏下搜索框字号提到 16px：低于 16px 时 iOS 聚焦会把整页放大，
   而搜索框固定在顶栏、被放大会很显眼（全站约定，见 MEMORY.md 窄屏第 3 条）。
   按 `pointer:coarse` 判而不只看宽度 —— 平板竖屏宽度够但同样是触屏。 */
@media (pointer:coarse),(max-width:600px){
  #q{font-size:16px}
}
</style>

        <div>未挂菜单 · 仅凭链接访问</div>
      </div>

    </div>
  </main>

</div>

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

/* ---------- 置顶（存本机浏览器） ---------- */
var PIN_KEY = 'tools:pin:v1';
var PIN_GROUP = '__pinned__';
var STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.7 2.6 5.3 5.8.84-4.2 4.09 1 5.77L12 16.97 6.8 19.7l1-5.77-4.2-4.09 5.8-.84z"/></svg>';
var STAR_ON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3.7 2.6 5.3 5.8.84-4.2 4.09 1 5.77L12 16.97 6.8 19.7l1-5.77-4.2-4.09 5.8-.84z"/></svg>';

/* ★ 第一次打开（本机还没有任何置顶记录）时预置的「常用」5 个，顺序即展示顺序。
   只在「本机没有记录」时生效；用户动过一次星标后本机就有记录了，之后一律以本机为准。
   校验口径和读盘一致（工具被删/改名后不留死链），所以这里写的是 path 不是 name。 */
var DEFAULT_PINS = ['datetime/', 'pwdgen/', 'text-diff/', 'json-formatter/', 'media-test/'];

/* 读盘要做校验：工具被改名/删除后，旧记录不能留在列表里造成死链 */
function loadPins(){
  var raw = null;
  try{ raw = localStorage.getItem(PIN_KEY); }catch(e){}
  /* raw === null = 本机从来没有记录（换浏览器 / 清过站点数据 / 从没点过星标）→ 首次，用预置。
     注意「用户把置顶全部取消」存的是 '[]'，不是 null，所以要照旧尊重本机记录，不能回退到预置。 */
  var firstRun = (raw === null);
  var src;
  if(firstRun){
    src = DEFAULT_PINS;
  }else{
    try{ src = JSON.parse(raw); }catch(e){ src = []; }
  }
  if(!Array.isArray(src)) src = [];
  var valid = {}, seen = {};
  TOOLS.forEach(function(t){ valid[t.path] = 1; });
  return src.filter(function(p){
    if(typeof p !== 'string' || !valid[p] || seen[p]) return false;
    seen[p] = 1; return true;
  });
}

/* 隐私模式下 setItem 会抛异常，静默降级，不影响使用 */
function savePins(){
  try{ localStorage.setItem(PIN_KEY, JSON.stringify(pins)); }catch(e){}
}

var pins = loadPins();

function byPath(p){ for(var i=0;i<TOOLS.length;i++){ if(TOOLS[i].path===p) return TOOLS[i]; } return null; }

function pinBtnHTML(t, on){
  return '<button class="row-pin'+(on?' on':'')+'" type="button" data-path="'+esc(t.path)+'"'+
    ' aria-pressed="'+(on?'true':'false')+'"'+
    ' title="'+(on?'取消置顶':'置顶到常用')+'"'+
    ' aria-label="'+(on?'取消置顶 ':'置顶 ')+esc(t.name)+'">'+
    (on?STAR_ON:STAR)+'</button>';
}

function rowHTML(t, on){
  var hay = (t.name+' '+t.desc+' '+t.tags.join(' ')+' '+t.group).toLowerCase();
  return '<div class="row" data-hay="'+esc(hay)+'">'+
    '<a class="row-hit" href="'+esc(t.path)+'">'+
      '<span class="row-ico">'+(ICONS[t.icon]||ICONS.doc)+'</span>'+
      '<span class="row-main">'+
        '<span class="row-name">'+esc(t.name)+'</span>'+
        '<span class="row-desc">'+esc(t.desc)+'</span>'+
      '</span>'+
      '<span class="row-path">/tools/'+esc(t.path)+'</span>'+
      '<span class="row-arrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/></svg></span>'+
    '</a>'+
    pinBtnHTML(t, on)+
  '</div>';
}

function sectionHTML(labelHTML, key, gcount, rows){
  return '<section class="group" data-group="'+esc(key)+'">'+
    '<div class="group-head"><span class="gname">'+labelHTML+'</span>'+
    '<span class="line"></span><span class="gcount">'+gcount+'</span></div>'+
    rows+
  '</section>';
}

function render(){
  var html = '';
  var pinned = pins.map(byPath).filter(Boolean);

  /* 置顶的工具从原分组移出，不在两处重复出现（避免键盘导航重复命中） */
  if(pinned.length){
    html += sectionHTML(STAR_ON + '置顶', PIN_GROUP, pinned.length,
      pinned.map(function(t){ return rowHTML(t, true); }).join(''));
  }

  var buckets = {};
  TOOLS.forEach(function(t){
    if(pins.indexOf(t.path) > -1) return;
    (buckets[t.group] = buckets[t.group] || []).push(t);
  });
  var order = GROUPS.filter(function(g){ return buckets[g]; })
    .concat(Object.keys(buckets).filter(function(g){ return GROUPS.indexOf(g) < 0; }));

  html += order.map(function(g){
    return sectionHTML(esc(g), g, buckets[g].length,
      buckets[g].map(function(t){ return rowHTML(t, false); }).join(''));
  }).join('');

  document.getElementById('list').innerHTML = html;
  document.getElementById('count').textContent = TOOLS.length;
}

/* ---------- 搜索 + 键盘导航 ---------- */
var q = document.getElementById('q');
var listEl = document.getElementById('list');
var emptyEl = document.getElementById('empty');
var barEl = document.querySelector('.bar');
var mainEl = document.getElementById('main');
var active = 0;

/* 正文区一旦滚动就给顶栏挂 .stuck（下沿渐隐条淡入）。
   判据取 main.scrollTop 而不是顶栏位置 —— 顶栏现在压根不参与滚动，位置恒定。 */
function syncBar(){
  barEl.classList.toggle('stuck', mainEl.scrollTop > 0);
}

function visibleRows(){
  return Array.prototype.filter.call(listEl.querySelectorAll('.row'), function(el){
    return el.style.display !== 'none';
  });
}

/* 把选中行限进视野：滚的是 main（它是全站唯一会滚的容器），不是窗口。
   上边界取顶栏实际底边（行滚上去会藏在顶栏后面），下边界取 main 的底边。
   （曾经改过 mainEl.scrollTop —— 那时 main 还不是滚动容器，改了没有任何效果。） */
function keepInView(el, isFirst){
  /* 第一行的正上方就是搜索框，回到第一行时顺势滚到顶，把整个面板顶部露出 */
  if(isFirst){ mainEl.scrollTop = 0; return; }
  var r = el.getBoundingClientRect();
  var top = barEl.getBoundingClientRect().bottom + 8;
  var bottom = mainEl.getBoundingClientRect().bottom - 12;
  if(r.top < top) mainEl.scrollBy(0, r.top - top);
  else if(r.bottom > bottom) mainEl.scrollBy(0, r.bottom - bottom);
}

/* noScroll：鼠标划过时只换高亮、不挪页面 —— 悬停本身说明那一行已经看得见，
   顺手挪 12px 反而会让指针下的内容动，观感很差。 */
function setActive(i, noScroll){
  var rows = visibleRows();
  if(!rows.length){ active = -1; return; }
  if(i < 0) i = rows.length - 1;
  if(i >= rows.length) i = 0;
  active = i;
  rows.forEach(function(el, k){ el.classList.toggle('is-active', k === i); });
  if(!noScroll) keepInView(rows[i], i === 0);
}

function filter(){
  var kw = q.value.trim().toLowerCase();
  var shown = 0;
  Array.prototype.forEach.call(listEl.querySelectorAll('.group'), function(sec){
    var n = 0;
    Array.prototype.forEach.call(sec.querySelectorAll('.row'), function(el){
      var hit = !kw || el.getAttribute('data-hay').indexOf(kw) > -1;
      el.style.display = hit ? '' : 'none';
      if(hit) n++;
    });
    sec.style.display = n ? '' : 'none';
    sec.querySelector('.gcount').textContent = n;
    shown += n;
  });
  emptyEl.style.display = shown ? 'none' : 'block';
  listEl.style.display = shown ? '' : 'none';
  setActive(0);
}

function togglePin(path){
  var i = pins.indexOf(path);
  if(i > -1) pins.splice(i, 1); else pins.unshift(path);   /* 最新置顶排最前，点了立刻在顶上看到 */
  savePins();

  /* 重建 DOM 会让内容高度变化、把 main 的滚动位置带偏，先存后还，
     这样在列表底部点星标时视野不会跳。 */
  var keepScroll = mainEl.scrollTop;
  render();
  filter();
  mainEl.scrollTop = keepScroll;

  /* DOM 重建会丢焦点，把它还给同一个星标，键盘用户不至于迷路 */
  var btn = null;
  Array.prototype.forEach.call(listEl.querySelectorAll('.row-pin'), function(b){
    if(!btn && b.getAttribute('data-path') === path) btn = b;
  });
  if(btn && btn.offsetParent) btn.focus({ preventScroll:true });
}

q.addEventListener('input', filter);
q.addEventListener('keydown', function(e){
  if(e.key === 'ArrowDown'){ e.preventDefault(); setActive(active + 1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); setActive(active - 1); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    var rows = visibleRows();
    var hit = rows[active] && rows[active].querySelector('.row-hit');
    if(hit) hit.click();
  } else if(e.key === 'Escape'){
    e.preventDefault();
    q.value = ''; filter();
  }
});

/* 星标点击：事件委托，重渲染后不用重新绑定 */
listEl.addEventListener('click', function(e){
  var pin = e.target && e.target.closest ? e.target.closest('.row-pin') : null;
  if(!pin) return;
  e.preventDefault();
  e.stopPropagation();
  togglePin(pin.getAttribute('data-path'));
});

document.addEventListener('keydown', function(e){
  var mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); q.focus(); q.select(); return; }
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
});

listEl.addEventListener('mousemove', function(e){
  var row = e.target.closest ? e.target.closest('.row') : null;
  if(!row || row.style.display === 'none') return;
  var rows = visibleRows();
  var i = rows.indexOf(row);
  if(i > -1 && i !== active) setActive(i, true);
});

document.getElementById('kbd-hint').addEventListener('click', function(){ q.focus(); });
/* 滚的是 main，所以监听它也挂在 main 上（窗口自己不会滚，监听 window 收不到） */
mainEl.addEventListener('scroll', syncBar, { passive:true });
window.addEventListener('resize', syncBar);

/* 快捷键标签按平台显示 */
if(!/Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent)){
  document.getElementById('kbd-hint').textContent = 'Ctrl K';
}

render();
filter();
syncBar();
</script>
</body>
</html>
