<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具箱 · Tools</title>
<meta name="description" content="一些自用的小工具集合：JSON 格式化、儿童生长发育评价、日历、SSQ 数据整理、运维脚本等。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" href="/favicon.ico">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;
  --panel:#ffffff;
  --panel-2:#f2f4f7;
  --border:rgba(15,23,42,.09);
  --border-2:rgba(15,23,42,.15);
  --text:#0f172a;
  --text-2:#5b6675;
  --text-3:#94a0b0;
  --accent:#4f6bed;
  --accent-2:#7c8aff;
  --accent-soft:rgba(79,107,237,.11);
  --hover:rgba(15,23,42,.042);
  --surface-1:rgba(15,23,42,.05);
  --surface-2:rgba(15,23,42,.08);
  --scrollbar:rgba(15,23,42,.16);
  --scrollbar-hover:rgba(15,23,42,.3);
  --glow-1:rgba(79,107,237,.10);
  --glow-2:rgba(124,138,255,.06);
  --mark-fg:#ffffff;
  --mark-shadow:0 2px 10px -2px rgba(79,107,237,.45);
  --panel-inset:rgba(255,255,255,.9);
  --panel-shadow:0 24px 56px -30px rgba(15,23,42,.32), 0 3px 10px -6px rgba(15,23,42,.12);
  --kbd-shadow:rgba(15,23,42,.07);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 340px at 50% -120px, var(--glow-1), transparent 68%),
    radial-gradient(520px 260px at 92% 8%, var(--glow-2), transparent 70%);
}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:64px 22px 80px}

/* ---------- 顶部 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.brand{display:flex;align-items:center;gap:9px}
.mark{
  width:24px;height:24px;border-radius:7px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--mark-fg);
  box-shadow:var(--mark-shadow);
}
.mark svg{width:13px;height:13px}
.brand h1{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.top .meta{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ---------- 命令面板 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border-2);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 0 var(--panel-inset) inset, var(--panel-shadow);
}
.cmd{display:flex;align-items:center;gap:11px;padding:0 15px;height:52px;border-bottom:1px solid var(--border)}
.cmd .ico{flex:none;color:var(--text-3);transition:color .15s}
.cmd:focus-within .ico{color:var(--accent)}
#q{
  flex:1;min-width:0;height:100%;
  border:0;outline:0;background:transparent;
  color:var(--text);font-size:14.5px;font-family:inherit;
}
#q::placeholder{color:var(--text-3)}
#q::-webkit-search-cancel-button{display:none}
kbd{
  font-family:var(--font);font-size:11px;font-weight:500;line-height:1;
  padding:4px 6px;border-radius:5px;
  color:var(--text-3);background:var(--surface-1);
  border:1px solid var(--border);box-shadow:0 1px 0 var(--kbd-shadow);
}
.cmd kbd{cursor:pointer}
.cmd kbd:hover{color:var(--text-2);background:var(--surface-2)}

/* ---------- 列表 ---------- */
.list-wrap{position:relative}
.list{
  max-height:min(58vh,520px);
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:7px 7px 9px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.14) transparent;
}
.list::-webkit-scrollbar{width:9px}
.list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:9px;border:3px solid var(--panel)}
.list::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}
.list::-webkit-scrollbar-track{background:transparent}
.fade{
  position:absolute;left:0;right:0;bottom:0;height:40px;
  pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(to top, var(--panel) 18%, transparent);
}
.fade.on{opacity:1}

.group-head{display:flex;align-items:center;gap:10px;padding:13px 11px 6px}
.group-head .gname{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.04em;white-space:nowrap}
.group-head .line{flex:1;height:1px;background:var(--border)}
.group-head .gcount{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.group:first-child .group-head{padding-top:7px}

.row{
  position:relative;
  display:grid;
  grid-template-columns:26px minmax(0,1fr) auto 14px;
  align-items:center;
  gap:11px;
  height:41px;
  padding:0 9px;
  border-radius:9px;
  transition:background .12s ease;
}
.row::before{
  content:"";position:absolute;left:0;top:50%;
  width:2px;height:17px;border-radius:2px;background:var(--accent);
  transform:translateY(-50%) scaleY(0);
  transition:transform .16s cubic-bezier(.2,.8,.3,1);
}
.row:hover,.row.is-active{background:var(--hover)}
.row:hover::before,.row.is-active::before{transform:translateY(-50%) scaleY(1)}

.row-ico{
  width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;
  background:var(--surface-1);
  color:var(--text-2);
  transition:background .14s,color .14s;
}
.row-ico svg{width:14px;height:14px}
.row:hover .row-ico,.row.is-active .row-ico{background:var(--accent-soft);color:var(--accent)}

.row-main{display:flex;align-items:baseline;gap:10px;min-width:0}
.row-name{font-size:13.5px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;flex:none}
.row-desc{
  font-size:12.5px;color:var(--text-3);
  min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row:hover .row-desc,.row.is-active .row-desc{color:var(--text-2)}

.row-path{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  white-space:nowrap;
  transition:color .14s;
}
.row:hover .row-path,.row.is-active .row-path{color:var(--text-2)}

.row-arrow{color:var(--accent);opacity:0;transform:translateX(-3px);transition:opacity .14s,transform .14s;display:grid;place-items:center}
.row:hover .row-arrow,.row.is-active .row-arrow{opacity:1;transform:translateX(0)}

/* ---------- 空态 ---------- */
.empty{display:none;padding:56px 20px 62px;text-align:center}
.empty .ei{color:var(--text-3);margin-bottom:12px}
.empty .et{font-size:13.5px;color:var(--text-2)}
.empty .es{font-size:12px;color:var(--text-3);margin-top:5px}

/* ---------- 底栏 ---------- */
.hints{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:14px;padding:0 6px;
  font-size:12px;color:var(--text-3);
}
.hints .keys{display:flex;gap:14px;flex-wrap:wrap}
.hints .keys span{display:flex;align-items:center;gap:5px}
.hints .keys kbd{font-size:10px;padding:2px 5px}
.hints .sep{color:var(--border-2)}

@media (max-width:600px){
  .shell{padding:38px 14px 60px}
  .row{grid-template-columns:26px minmax(0,1fr) 14px;gap:10px;height:44px}
  .row-desc{display:none}
  .row-path{display:none}
  .list{max-height:none}
  .panel{border-radius:12px}
}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </span>
      <h1>工具箱</h1>
    </div>
    <div class="meta"><span id="count">0</span> 个工具</div>
  </div>

  <div class="panel">
    <div class="cmd">
      <span class="ico">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <input id="q" type="search" placeholder="搜索工具…" autocomplete="off" spellcheck="false" autofocus>
      <kbd id="kbd-hint">⌘K</kbd>
    </div>

    <div class="list-wrap">
      <div class="list" id="list"></div>
      <div class="fade" id="fade"></div>
    </div>

    <div class="empty" id="empty">
      <div class="ei">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div class="et">没有找到匹配的工具</div>
      <div class="es">换个关键词，或按 esc 清空</div>
    </div>
  </div>

  <div class="hints">
    <div class="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>esc</kbd> 清空</span>
    </div>
    <div>未挂菜单 · 仅凭链接访问</div>
  </div>

</div>

<script>
var ICONS = {
  json:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-1"/></svg>',
  monitor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2.2"/><path d="M8 20.5h8M12 17v3.5"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v10.5"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.4"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>',
  child:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 4.6-7 9-7 9z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20V10.5"/><path d="M10 20V4.5"/><path d="M15.5 20v-6.5"/><path d="M21 20H3"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.4 2.1"/></svg>',
  transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.6v13"/><path d="m3.6 12.6 3.9 3.9 3.9-3.9"/><path d="M16.5 20.4v-13"/><path d="m12.6 11.4 3.9-3.9 3.9 3.9"/></svg>',
  av:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0"/><path d="M12 17.8v3.4"/><path d="M8.6 21.2h6.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  diff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.4"/><circle cx="18" cy="17.5" r="2.4"/><path d="M6 8.9v4.6a3 3 0 0 0 3 3h6.6"/><path d="M18 15.1v-4.6a3 3 0 0 0-3-3H8.4"/></svg>'
};

var GROUPS = ['开发工具','运维调试','生活工具'];

/* 新增工具：在这里加一条即可 */
var TOOLS = [
  { group:'开发工具', name:'JSON 格式化', path:'json-formatter/', icon:'json',
    desc:'JSON 美化、压缩与校验，支持一键折叠展开、错误定位。', tags:['JSON','格式化'] },
  { group:'开发工具', name:'文本对比', path:'text-diff/', icon:'diff',
    desc:'两段文本逐行对比，并排 / 统一双视图、行内按词高亮、折叠相同行、导出统一 diff，全部本地运行。', tags:['文本对比','diff','差异'] },
  { group:'开发工具', name:'日期时间工具', path:'datetime/', icon:'clock',
    desc:'实时时间戳（10/13 位）、日期与时间戳互转、两个日期相差、日期前后推算。', tags:['时间戳','日期计算'] },
  { group:'开发工具', name:'字节与网速计算', path:'byte-calc/', icon:'transfer',
    desc:'字节单位换算（1000/1024 双基准）、文件大小与速度算耗时、带宽换算实际速率、码率算体积。', tags:['字节','带宽','网速','换算'] },
  { group:'运维调试', name:'麦克风 · 音响 · 摄像头', path:'media-test/', icon:'av',
    desc:'麦克风实时电平与录音回放、HRTF 环绕声试听与左右声道检测、摄像头预览与拍照，全部本地运行。', tags:['麦克风','音响','摄像头','环绕声'] },
  { group:'运维调试', name:'客户端信息查看', path:'client-info/', icon:'monitor',
    desc:'实时显示当前时间戳、浏览器 User-Agent 与页面 meta 信息。', tags:['UA','调试'] },
  { group:'运维调试', name:'xping.sh 下载', path:'xping/', icon:'download',
    desc:'脚本下载入口，自动探测多个镜像源并选择可用线路。', tags:['Shell','脚本'] },
  { group:'生活工具', name:'日历', path:'calendar/', icon:'calendar',
    desc:'带农历、节气的日历视图，适合日常查日期与节气。', tags:['日历','农历'] },
  { group:'生活工具', name:'儿童生长发育评价', path:'child-growth/', icon:'child',
    desc:'面向 7 岁以下儿童，输入身高体重快速看结论。', tags:['儿童','健康'] },
  { group:'生活工具', name:'奕彩 SSQ', path:'ssq/', icon:'chart',
    desc:'双色球数据整理与统计，支持上传图片自动识别号码。', tags:['双色球','数据'] }
];

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

function rowHTML(t){
  var hay = (t.name+' '+t.desc+' '+t.tags.join(' ')+' '+t.group).toLowerCase();
  return '<a class="row" href="'+esc(t.path)+'" data-hay="'+esc(hay)+'">'+
    '<span class="row-ico">'+(ICONS[t.icon]||ICONS.doc)+'</span>'+
    '<span class="row-main">'+
      '<span class="row-name">'+esc(t.name)+'</span>'+
      '<span class="row-desc">'+esc(t.desc)+'</span>'+
    '</span>'+
    '<span class="row-path">/tools/'+esc(t.path)+'</span>'+
    '<span class="row-arrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/></svg></span>'+
  '</a>';
}

function render(){
  var buckets = {};
  TOOLS.forEach(function(t){ (buckets[t.group]=buckets[t.group]||[]).push(t); });
  var order = GROUPS.filter(function(g){ return buckets[g]; })
    .concat(Object.keys(buckets).filter(function(g){ return GROUPS.indexOf(g)<0; }));

  document.getElementById('list').innerHTML = order.map(function(g){
    return '<section class="group" data-group="'+esc(g)+'">'+
      '<div class="group-head"><span class="gname">'+esc(g)+'</span><span class="line"></span>'+
      '<span class="gcount">'+buckets[g].length+'</span></div>'+
      buckets[g].map(rowHTML).join('')+
    '</section>';
  }).join('');

  document.getElementById('count').textContent = TOOLS.length;
}

/* ---------- 搜索 + 键盘导航 ---------- */
var q = document.getElementById('q');
var listEl = document.getElementById('list');
var emptyEl = document.getElementById('empty');
var fadeEl = document.getElementById('fade');
var active = 0;

function updateFade(){
  var scrollable = listEl.scrollHeight - listEl.clientHeight > 4;
  var atBottom = listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 4;
  fadeEl.classList.toggle('on', scrollable && !atBottom && listEl.style.display !== 'none');
}

function visibleRows(){
  return Array.prototype.filter.call(listEl.querySelectorAll('.row'), function(el){
    return el.style.display !== 'none';
  });
}

function setActive(i){
  var rows = visibleRows();
  if(!rows.length){ active = -1; return; }
  if(i < 0) i = rows.length - 1;
  if(i >= rows.length) i = 0;
  active = i;
  rows.forEach(function(el, k){ el.classList.toggle('is-active', k === i); });
  var el = rows[i];
  var lr = listEl.getBoundingClientRect(), r = el.getBoundingClientRect();
  if(r.top < lr.top) listEl.scrollTop -= (lr.top - r.top) + 6;
  else if(r.bottom > lr.bottom) listEl.scrollTop += (r.bottom - lr.bottom) + 6;
}

function filter(){
  var kw = q.value.trim().toLowerCase();
  var shown = 0;
  Array.prototype.forEach.call(listEl.querySelectorAll('.group'), function(sec){
    var n = 0;
    Array.prototype.forEach.call(sec.querySelectorAll('.row'), function(el){
      var hit = !kw || el.getAttribute('data-hay').indexOf(kw) > -1;
      el.style.display = hit ? '' : 'none';
      if(hit) n++;
    });
    sec.style.display = n ? '' : 'none';
    sec.querySelector('.gcount').textContent = n;
    shown += n;
  });
  emptyEl.style.display = shown ? 'none' : 'block';
  listEl.style.display = shown ? '' : 'none';
  setActive(0);
  updateFade();
}

q.addEventListener('input', filter);
q.addEventListener('keydown', function(e){
  if(e.key === 'ArrowDown'){ e.preventDefault(); setActive(active + 1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); setActive(active - 1); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    var rows = visibleRows();
    if(rows[active]) rows[active].click();
  } else if(e.key === 'Escape'){
    e.preventDefault();
    q.value = ''; filter();
  }
});

document.addEventListener('keydown', function(e){
  var mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); q.focus(); q.select(); return; }
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
});

listEl.addEventListener('mousemove', function(e){
  var row = e.target.closest ? e.target.closest('.row') : null;
  if(!row || row.style.display === 'none') return;
  var rows = visibleRows();
  var i = rows.indexOf(row);
  if(i > -1 && i !== active) setActive(i);
});

document.getElementById('kbd-hint').addEventListener('click', function(){ q.focus(); });
listEl.addEventListener('scroll', updateFade, { passive:true });
window.addEventListener('resize', updateFade);

/* 快捷键标签按平台显示 */
if(!/Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent)){
  document.getElementById('kbd-hint').textContent = 'Ctrl K';
}

render();
filter();
</script>
</body>
</html>
